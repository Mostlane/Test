<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=20"></script>
  <script src="auth.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Purchase Orders — Mostlane Portal</title>
  <style>
    html, body { margin:0; height:100%; background:#eef1f4; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; }
    #poMsg { padding:48px 22px; text-align:center; color:#5b6b78; font-size:15px; }
    #poMsg h2 { color:#003366; font-size:18px; margin:0 0 8px; }
    #poMsg a { color:#0066cc; }
  </style>
</head>
<body>
  <!-- PO launcher. Every PO entry point in the portal (field-app PO tab, the menu
       tile, the sidebar) points here. It routes by role to the IN-PORTAL PO pages:
       office/admin (Purchase Orders or Full Access) -> po-office.html, field
       engineers -> po-raise.html. (Was: redirected to the standalone mostlane-po
       worker via /po-config. To revert, restore the previous version of this file.) -->
  <div id="poMsg">Opening Purchase Orders…</div>

  <script>
    (function () {
      var API = window.MOSTLANE_API;
      var token = localStorage.getItem("mostlaneToken");
      if (!token) { location.replace("login.html"); return; }
      var msg = document.getElementById("poMsg");

      fetch(API + "/auth/me", { headers: { "Authorization": "Bearer " + token } })
        .then(function (r) { return r.json(); })
        .then(function (me) {
          var user = (me && me.user) || {};
          var perms = {};
          try { perms = JSON.parse(sessionStorage.getItem("mostlanePermissions") || localStorage.getItem("mostlanePermissions") || "{}") || {}; } catch (e) {}
          var yes = function (v) { return String(v || "").toLowerCase() === "yes"; };
          // Under "View As", the IMPERSONATED user's perms + staff type live in
          // storage — use those so an admin previewing a field engineer sees the
          // engineer's PO page, not the office board.
          var viewAs = !!localStorage.getItem("mostlaneViewAsReal");
          var full   = viewAs ? yes(perms.FullAccess)      : (user.FullAccess === "Yes"      || yes(perms.FullAccess));
          var poPerm = viewAs ? yes(perms.PurchaseOrders)  : (user.PurchaseOrders === "Yes"  || yes(perms.PurchaseOrders));
          var st = String(
            localStorage.getItem("mostlaneStaffType") || sessionStorage.getItem("mostlaneStaffType") ||
            (viewAs ? "" : (user.StaffType || ""))
          ).toLowerCase();
          // Robust field-user test (mirrors portal-config's mlFieldUser): not an
          // admin, and either staffType=field or an SLA/Story-only engineer — so a
          // blank staff type still routes engineers to the raise page.
          function isField() {
            if (full || yes(perms.SLAAdmin)) return false;
            if (st === "office") return false;
            if (st === "field") return true;
            return yes(perms.SLA) || yes(perms.StoryMode);
          }
          // FIELD ENGINEERS always get the restricted raise page — never the
          // office board (they raise POs from the job to keep costing linked).
          if (isField()) { location.replace("po-raise.html"); return; }
          if (full || poPerm) { location.replace("po-office.html"); return; }
          msg.innerHTML = "<h2>No PO access</h2>Ask the office to enable Purchase Orders for your account.";
        })
        .catch(function () {
          msg.innerHTML = "<h2>Couldn't open Purchase Orders</h2>Check your connection and try again, or <a href='main.html'>go back to the menu</a>.";
        });
    })();
  </script>
</body>
</html>

# Mostlane Portal — single consolidated Worker (deployed via Cloudflare Workers
# Builds, connected to the Mostlane/Test repo, root directory = worker/).
#
# Bindings + non-secret vars live here so every deploy is COMPLETE and nothing
# can silently go missing. SECRETS are never in git — they're set once in the
# Cloudflare dashboard (Settings → Variables and Secrets) and persist across
# deploys. See the secret list at the bottom.

name = "mostlane-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Keep the van-check reminder cron (hourly; self-gates to Mon 07:00 + the
# pre-deadline chase). Declaring it here restores it automatically on deploy.
[triggers]
# Every 5 minutes so timed job releases + the 5pm-day-before nudge are punctual.
# The heavier hourly work (van-check reminders, SiteLog reconcile) is gated to the
# top of the hour inside scheduled() so its cadence is unchanged.
crons = ["*/5 * * * *"]

# ── D1 databases ────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "mostlane"
database_id = "e483b3b5-2cfd-4742-ae51-427c31598c87"

# PO system's own D1 — powers PO-site suggestions on the engineer timesheet.
[[d1_databases]]
binding = "PO_DB"
database_name = "mostlane-po"
database_id = "bcaf5f51-3085-4cdf-a993-42278893c313"

# SiteLog's own D1 — the SiteLog backend now runs INSIDE this worker
# (src/routes/sitelog-api.js). Binding it here means the portal reads SiteLog
# labour/costing directly (no api.site-log.co.uk round-trip) and, once the
# api.site-log.co.uk custom domain is moved onto this worker, the scanner runs
# here too. The standalone SiteLog worker stays as a fallback until cut over.
[[d1_databases]]
binding = "SITELOG_DB"
database_name = "sitelog"
database_id = "1e891155-dd61-4e0e-90fe-ad5f4895f2c8"

# ── R2 buckets ──────────────────────────────────────────────────────
[[r2_buckets]]
binding = "JOB_FILES"
bucket_name = "mostlane-job-files"

[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "mostlane-asset-images"

# SiteLog's document library (site RAMS / inductions / drawings shown to visitors
# on arrival). Binding it lets the portal manage those documents in-process via
# the ported SiteLog backend (src/routes/sitelog-api.js /site-documents/*).
[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "sitelog-documents"

# ── Non-secret configuration ────────────────────────────────────────
[vars]
ALLOWED_ORIGINS = "*"
SESSION_TTL_HOURS = "2160"                       # 90-day logins
APP_BASE_URL = "https://mostlane-portal.com"
EMAIL_FROM = "Mostlane <no-reply@mostlane-portal.com>"
R2_PUBLIC_BASE = "https://pub-0a9aac7bfc6749bbbdbf9660503968e6.r2.dev"
VAPID_PUBLIC = "BM9Vxq5c-jVzT_ScDk0BDhfJUw6o8g_LHLKK0t4MjTbga_ByxzejZkVQNU0DVBBVF3a-Yb5Ac94bRfFFPnN7BgY"
PUSH_CONTACT = "mailto:no-reply@mostlane-portal.com"

# ── SECRETS — set in the dashboard, NEVER here ──────────────────────
#   MASTER_PASSWORD        (your break-glass password)
#   RESEND_API_KEY         (from resend.com)
#   PORTAL_BRIDGE_SECRET   (shared with the SiteLog worker)
#   SITELOG_ADMIN_SECRET   (your SiteLog admin PIN)
#   HS_PLAN_TOKEN          (shared with the mostlane-hs worker as APP_TOKEN)
#   VAPID_PRIVATE          (pairs with VAPID_PUBLIC above)
#   JOBS_INBOUND_TOKEN     (shared with the Zapier job-intake zap)
#   TUYA_ACCESS_ID         (yard gate — Tuya IoT project Access ID; MUST be a
#                           SECRET, not a Text var, or a git deploy wipes it)
#   TUYA_ACCESS_SECRET     (yard gate — Tuya IoT project Access Secret)

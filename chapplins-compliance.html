<html lang="en">
<head>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <!-- Leaflet for the location pin map (same CDN pattern as sites-register.html). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #1f2937;
      background-color: #eef1f4;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Portal-style header bar (matches the rest of the portal). */
    header.page { background:linear-gradient(180deg,#1A4F8F,#003468); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
    header.page h1 { font-size:18px; margin:0; flex:1; color:#fff; text-align:left; }
    header.page .hdrlogo { height:44px; width:auto; max-width:64px; object-fit:contain; background:#fff; border-radius:6px; padding:2px 4px; flex:none; }
    .flabel { font-size:12px; font-weight:700; color:#5b6b7c; text-transform:uppercase; letter-spacing:.05em; align-self:center; margin-right:2px; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:  no-repeat center/180%;
      z-index: -1;
    }
    .container {
      background-color: rgba(255,255,255,0.6);
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      max-width: 95%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h1 { text-align: center; color: #0071CE; margin-top: 0; }
    .logo { display: block; margin: 10px auto 20px auto; max-height: 60px; }

    .backbar, .summary-bubbles, .filter-bubbles, .search-container, .utilbar {
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:flex-start; margin-bottom:10px;
    }
    .summary-bubbles, .filter-bubbles { justify-content:center; margin-bottom: 14px; }

    .backlink, .bubble, .btn {
      display:inline-flex; align-items:center; gap:6px;
      background:#0071CE; color:#fff; text-decoration:none;
      padding:7px 13px; border-radius:20px; font-weight:600; font-size:13.5px; border:0; cursor:pointer;
    }
    .btn { background:#1A4F8F; }
    .bubble:hover, .btn:hover, .backlink:hover { opacity:.9; }
    .bubble.active { background:#28a745; }

    .search-input { padding:8px; width:300px; border-radius:20px; border:1px solid #ccc; }
    .closed-badge { display:inline-block; margin-left:6px; background:#e5e7eb; color:#4b5563; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:700; vertical-align:middle; }
    tr.closed-row { background:#f7f8fa; color:#6b7280; }
    tr.closed-row td.site { color:#4b5563; }

    .table-wrapper { overflow-x:auto; overflow-y:auto; max-height:70vh; width:100%; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #d5dde5; padding:3px 8px; text-align:center; font-size:14px; line-height:1.25; vertical-align:middle; }
    th { background:#1A4F8F; color:#fff; position:sticky; top:0; z-index:5; padding:6px 8px; }
    /* Compact document buttons so the Docs column doesn't force tall rows. */
    td .doc-btn{ padding:1px 6px; line-height:1.3; }
    /* Keep the 📎 + 🗂 buttons on ONE line so a store with documents isn't a
       taller (two-line) row than an empty one. */
    td.docs-cell{ white-space:nowrap; }
    /* The dominant cause of tall desktop rows was long site names wrapping to a
       second line. Keep the name on one line (left-aligned so it reads naturally);
       the table already scrolls sideways if a column gets wide. */
    td.site{ white-space:nowrap; text-align:left; }
    /* Click a site name to highlight the whole row (easier to read across). The
       overlay sits on top of any status tint so both stay visible. */
    tbody td.site{ cursor:pointer; }
    tr.row-sel td{ box-shadow: inset 0 0 0 9999px rgba(37,99,235,.16); }
    tr.row-sel td.site{ font-weight:700; }
    /* A location button that isn't set yet shows a faint ❓; the key is always
       a plain 🔑 (the ❓ read as something being wrong with the site). */
    .doc-btn.loc, .doc-btn.key{ font-size:14px; }
    /* Status colours — the Status light AND each due-date cell tint green/amber/red
       based on that compliance's own warning settings. */
    td.st-green{ background:#e3f6e8; }
    td.st-amber{ background:#fff1c9; }
    td.st-red{ background:#ffd9d9; }
    tr:hover td.st-green{ background:#d6f1dd; }
    tr:hover td.st-amber{ background:#ffe9ad; }
    tr:hover td.st-red{ background:#ffc7c7; }
    /* Settings modal grid */
    table.setg{ border-collapse:collapse; width:100%; }
    table.setg th, table.setg td{ border:1px solid #e2e8f0; padding:6px 8px; font-size:13px; text-align:center; }
    table.setg th{ position:static; top:auto; background:#eef3f9; color:#1f2937; z-index:auto; }
    table.setg td:first-child, table.setg th:first-child{ position:static; left:auto; text-align:left; background:#eef3f9; }
    table.setg input{ width:78px; padding:5px; border:1px solid #ccc; border-radius:6px; text-align:center; font-size:14px; }
    tr:nth-child(even){ background:#f4f7fb; }
    tr:nth-child(odd){ background:#fff; }
    /* Keep the Store Code column visible while scrolling the wide table sideways. */
    th:first-child, td:first-child { position:sticky; left:0; z-index:4; }
    th:first-child { z-index:6; }
    td:first-child { background:#eef3f9; font-weight:700; }
    .sp-btn{
      display:inline-block; padding:6px 10px; border-radius:6px; background:#0071CE; color:#fff;
      text-decoration:none; font-weight:bold; border:0; cursor:pointer;
    }
    .cert-link{ text-decoration:none; margin-left:3px; cursor:pointer; font-size:13px; vertical-align:middle; }
    .cert-link:hover{ opacity:.7; }
    /* Keep a due date and its 📄 cert icon on ONE line so a cell with a document
       is the same height as one without (no wrap → no taller rows). */
    td.dc{ white-space:nowrap; }
    /* Document rows inside the Documents modal. */
    .doc-row{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #eef2f7; flex-wrap:wrap; }
    .doc-row:last-child{ border-bottom:0; }
    .doc-row .nm{ flex:1 1 160px; min-width:0; word-break:break-word; }
    .doc-row .mini{ border:1px solid #cbd5e1; background:#fff; border-radius:6px; padding:2px 8px; cursor:pointer; font-size:12px; color:#1f2937; }
    .doc-row .mini:hover{ background:#f1f5f9; }
    .doc-row .mini.del{ color:#b42318; border-color:#f3c6c0; }
    .doc-row .pin{ display:inline-flex; align-items:center; gap:4px; font-size:12px; color:#475569; white-space:nowrap; }
    .doc-sec{ margin-bottom:12px; }
    .doc-sec > b{ display:block; margin-bottom:2px; }
    .doc-row .nm{ cursor:pointer; color:#0071CE; text-decoration:underline; }
    /* Documents modal — a header bar per compliance type, drag docs between them. */
    .doc-type{ border:1px solid #dbe3ec; border-radius:10px; margin:10px 0; overflow:hidden; }
    .doc-type > .hbar{ background:linear-gradient(180deg,#1A4F8F,#003468); color:#fff; padding:7px 11px; font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:8px; }

    .doc-empty{ color:#94a3b8; font-size:12px; padding:5px 2px; }

    /* Left/right navigation through a site's certificates, layered ABOVE the

    #certNav{ display:none; }
    #certNav .cvArrow{ position:fixed; top:50%; transform:translateY(-50%); z-index:100002;

    #certNav .cvNext{ right:12px; }

      background:rgba(15,23,42,.82); color:#fff; padding:6px 14px; border-radius:20px; font-size:13px;

    .doc-btn{ border:1px solid #cbd5e1; background:#fff; border-radius:6px; padding:2px 7px; cursor:pointer; font-size:13px; }

    tr.drop-hot{ outline:2px dashed #0071CE; outline-offset:-2px; background:#eaf4ff !important; }

    .modal .typegrid{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 12px; }

    .drop-note{ font-size:12px; color:#64748b; margin:4px 0 0; }

    .info { font-size:12px; color:#374151; display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:6px 0 10px; }

    .modal {

    .loading { text-align:center; padding:20px; font-size:16px; color:#0071CE; }

  <!-- XLSX for export -->

  <script>
/* =========================
   Chapplins compliance chart — shares the scheme-aware /compliance
   backend with the Southern Co-op page (scheme=chapplins).
   ========================= */
const SCHEME = 'chapplins';

/* Editing is permission-based (Compliance or Full Access). */
function canEditCompliance(){
  try {
    var p = JSON.parse(sessionStorage.getItem("mostlanePermissions") || localStorage.getItem("mostlanePermissions") || "{}");
    return p.FullAccess === "Yes" || p.Compliance === "Yes";
  } catch (e) { return false; }
}

/* Escape user-supplied text (document labels/names) before putting it in HTML. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== Page settings (per-type frequency + amber/red warning windows) ===== */
let complianceSettings = { types: {
  fiveYear:{years:5,amberDays:90,redDays:30},
  gas:{years:1,amberDays:30,redDays:7},
  epc:{years:10,amberDays:90,redDays:30},
  alarms:{years:1,amberDays:30,redDays:7},
  fire:{years:1,amberDays:30,redDays:7},
  legionella:{years:2,amberDays:60,redDays:14}
} };
const STATUS_TYPES = ['fiveYear','gas','epc','alarms','fire','legionella'];
/* All six Chapplins types are simple due-dated checks (none recur monthly). */
function typeSettings(type){
  const t = (complianceSettings.types||{})[type] || {};
  return {
    years: t.years!=null ? t.years : 1,
    amberDays: t.amberDays!=null ? t.amberDays : 90,
    redDays: t.redDays!=null ? t.redDays : 30
  };
}
/* Status of ONE compliance type for a store: '' (no due date), 'green', 'amber'
   or 'red', from that type's own warning windows. Red = due within redDays (or
   overdue); amber = due within amberDays; green = further off. */
function typeStatus(e, type){
  const d = parseDate(e[type]);
  if (!d) return '';
  const cfg = typeSettings(type);
  const daysLeft = (d - new Date()) / 86400000;
  if (daysLeft <= cfg.redDays) return 'red';
  if (daysLeft <= cfg.amberDays) return 'amber';
  return 'green';
}
/* Worst status across a store's tracked compliances (drives the Status light). */
function worstStatus(e){
  let worst = 'green';
  for (const t of STATUS_TYPES){
    const s = typeStatus(e, t);
    if (s === 'red') return 'red';
    if (s === 'amber') worst = 'amber';
  }
  return worst;
}

/* ===== State ===== */
let allData = [];       // full set (normalised)
let currentData = [];   // filtered / searched view
let selectedCode = null; // store code of the highlighted row (survives re-renders)
let editMode = false;
let activeStoreType = 'ALL';
const activeCategories = new Set();
let viewMode = 'active';   // 'active' = live chart, 'closed' = archived (Closed Sites)
/* Rows for the current view: live chart shows active stores, Closed Sites shows
   archived (active===0) ones. */
function baseData(){ return allData.filter(e => viewMode === 'closed' ? e.active === 0 : e.active !== 0); }

/* Compliance certificate index (store code → { type: 1 }) — populated from the
   portal's own /compliance store (SharePoint certs migrated into R2). Drives the
   📄 links on each date cell. Column key → canonical compliance type. */
let complianceIndex = {};
let storeFiles = {};   // code -> { type: [ {url,current,date,filename}, … ] } (lazy-loaded)
const CERT_TYPE = { fiveYear:'fiveYear', gas:'gas', epc:'epc', alarms:'alarms', fire:'fire', legionella:'legionella' };
const TYPE_LABEL = { fiveYear:'EICR', gas:'Gas Safety', epc:'EPC', alarms:'Smoke/CO Alarms', fire:'Fire / Emergency Lighting', legionella:'Legionella', asbestos:'Asbestos Register', other:'Other' };
const ALL_TYPES = ['fiveYear','gas','epc','alarms','fire','legionella','asbestos','other'];
function mlToken(){ try { return localStorage.getItem('mostlaneToken') || ''; } catch(e){ return ''; } }
/* All /compliance/* calls are scoped to this scheme (Chapplins). */
function withScheme(path){
  if (!/^\/compliance\//.test(path)) return path;
  return path + (path.includes('?') ? '&' : '?') + 'scheme=' + SCHEME;
}
function authFetch(path, opts){
  opts = opts || {};
  const h = Object.assign({}, opts.headers || {});
  const t = mlToken(); if (t) h['Authorization'] = 'Bearer ' + t;
  return fetch((window.MOSTLANE_API || '') + withScheme(path), Object.assign({}, opts, { headers:h }));
}
async function loadComplianceIndex(){
  try {
    const r = await authFetch('/compliance/index');
    if (!r.ok) return;
    const j = await r.json();
    complianceIndex = (j && j.map) ? j.map : {};
    // re-render so cells pick up their 📄 links (data may already be shown)
    if (allData.length) applyFilters();
  } catch(e){ /* certs are non-critical — table still works without them */ }
}
/* ── In-app certificate viewer with ◀ ▶ navigation across a site's documents ──
   Renders each PDF/image inside docviewer.js (robust, mobile zoom/scroll) and
   layers our own arrows + keyboard nav on top so you can flick through every
   certificate on file for the store. */
const CertViewer = (function(){
  let items = [], idx = 0, nav = null, hooked = false;
  function ensureUI(){
    if (nav) return;
    nav = document.createElement('div'); nav.id = 'certNav';
    nav.innerHTML = '<button class="cvArrow cvPrev" title="Previous (←)" aria-label="Previous">‹</button>'
                  + '<button class="cvArrow cvNext" title="Next (→)" aria-label="Next">›</button>'
                  + '<div class="cvCount"></div>';
    document.body.appendChild(nav);
    nav.querySelector('.cvPrev').onclick = ()=>go(idx-1);
    nav.querySelector('.cvNext').onclick = ()=>go(idx+1);
  }
  function hookClose(){
    if (hooked) return;
    const btn = document.getElementById('mldvClose');
    if (btn){ btn.addEventListener('click', hide); hooked = true; }
  }
  function go(i){
    if (!items.length || typeof MLDocViewer === 'undefined') return;
    idx = (i + items.length) % items.length;            // wrap around
    const it = items[idx];
    MLDocViewer.open({ url: it.url, name: it.name, downloadUrl: it.url });
    hookClose();
    update();
  }
  function update(){
    ensureUI();
    const multi = items.length > 1;
    nav.querySelector('.cvPrev').style.display = multi ? '' : 'none';
    nav.querySelector('.cvNext').style.display = multi ? '' : 'none';
    const c = nav.querySelector('.cvCount');
    c.style.display = multi ? '' : 'none';
    c.textContent = (idx+1) + ' / ' + items.length + (items[idx] && items[idx].name ? ' · ' + items[idx].name : '');
  }
  function openList(list, startIdx){
    items = (list || []).filter(x=>x && x.url);
    if (!items.length) return alert('No certificate on file for this one yet.');
    ensureUI(); nav.style.display = 'block';
    go(Math.max(0, Math.min(startIdx||0, items.length-1)));
  }
  function hide(){ if (nav) nav.style.display = 'none'; items = []; }
  document.addEventListener('keydown', (e)=>{
    if (!nav || nav.style.display === 'none') return;
    if (e.key === 'ArrowLeft'){ e.preventDefault(); go(idx-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); go(idx+1); }
    else if (e.key === 'Escape'){ hide(); }   // docviewer closes itself on Esc too
  });
  return { openList, hide };
})();

/* Build the ordered document list for a store (from /compliance/files): standard
   types in chart order, each with its current doc(s) first then previous ones,
   named "TYPE — filename" (custom "Other" docs keep their own name). */
async function siteDocList(code){
  const r = await authFetch('/compliance/files?code=' + encodeURIComponent(code));
  const j = await r.json(); const files = (j && j.files) || {};
  const STD = ['fiveYear','gas','epc','alarms','fire','legionella'];
  const order = [...STD.filter(t=>files[t] && files[t].length),
                 ...Object.keys(files).filter(t=>!STD.includes(t) && files[t] && files[t].length)];
  const list = [];
  order.forEach(t=>{
    const arr = [...files[t]].sort((a,b)=> (b.current?1:0)-(a.current?1:0));  // current first
    arr.forEach(f=>{
      const base = f.label || f.filename || 'file';
      list.push({ id:f.id, url:f.url, type:t, current:!!f.current,
        name: (t==='other') ? base : ((TYPE_LABEL[t]||t) + ' — ' + base) });
    });
  });
  return list;
}

/* 📄 on a date cell → open that type's current cert, then arrow through the site. */
async function openCert(code, type){
  try{
    const list = await siteDocList(code);
    if (!list.length) return alert('No certificate on file for this one yet.');
    let start = list.findIndex(d=> d.type===type && d.current);
    if (start < 0) start = list.findIndex(d=> d.type===type);
    if (start < 0) start = 0;
    CertViewer.openList(list, start);
  }catch(e){ alert('Could not open the certificate.'); }
}

/* A document link in the Documents modal → open that exact file, arrow through the rest. */
async function openCertById(code, id){
  try{
    const list = await siteDocList(code);
    const start = Math.max(0, list.findIndex(d=> d.id===id));
    CertViewer.openList(list, start);
  }catch(e){ alert('Could not open the document.'); }
}
function pad4(v){ return String(v==null?'':v).replace(/\D/g,'').padStart(4,'0'); }

/* Types this store tracks (has a due date) first, then the rest — so the picker
   defaults to "what compliances we have for that site". */
function typesForStore(code){
  const rec = allData.find(r=>pad4(r.storeCode)===pad4(code)) || {};
  const has = ['fiveYear','gas','epc','alarms','fire','legionella'].filter(t=> rec[t]);
  return [...has, ...ALL_TYPES.filter(t=>!has.includes(t))];
}

/* ── Auto-detect the compliance type + completed date from an uploaded PDF ────
   Reads the PDF in-browser (PDF.js — nothing leaves the device until Upload),
   detects the type from the certificate title and the completed date as the
   latest date that isn't in the future (skips PAT retest / EICR next-inspection
   dates, and takes the final day of a multi-day EICR). PAT / EM / 5 Year only. */
const PDFJS_SRC = "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/";
let _pdfjsP = null;
function ensurePdfjs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsP) return _pdfjsP;
  _pdfjsP = new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src=PDFJS_SRC+'pdf.min.js';
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_SRC+'pdf.worker.min.js'; resolve(window.pdfjsLib);}catch(e){reject(e);} };
    s.onerror=()=>reject(new Error('pdfjs load failed'));
    document.head.appendChild(s);
  });
  return _pdfjsP;
}
async function extractPdfText(file, maxPages){
  const lib = await ensurePdfjs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const n = Math.min(maxPages||4, pdf.numPages);
  let out='';
  for (let i=1;i<=n;i++){ const page=await pdf.getPage(i); const tc=await page.getTextContent(); out+=' '+tc.items.map(it=>it.str).join(' '); }
  try{ pdf.destroy(); }catch(e){}
  return out;
}
function detectComplianceType(text){
  // Collapse all whitespace (newlines from PDF layout) so titles that wrap across
  // lines — e.g. "…CONDITION\nREPORT" — still match.
  const t=String(text||'').toLowerCase().replace(/\s+/g,' ');
  if(/electrical installation condition report/.test(t) || /\beicr\b/.test(t)) return 'fiveYear';
  if(/landlord.*gas safety|gas safety record|gas safety certificate/.test(t)) return 'gas';
  if(/energy performance certificate|\bepc\b/.test(t)) return 'epc';
  if(/smoke alarm|carbon monoxide alarm|\bco alarm\b/.test(t)) return 'alarms';
  if(/emergency lighting|fire risk assessment|fire alarm/.test(t)) return 'fire';
  if(/legionella|water risk assessment|water hygiene/.test(t)) return 'legionella';
  return '';
}
function detectCompletedDate(text){
  const re=/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/g;
  const grace = Date.now() + 2*86400000;   // today (+2d) — anything later is a future retest/next-due
  let best=null, m;
  while((m=re.exec(String(text||'')))){
    let d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=2000;
    if(mo<1||mo>12||d<1||d>31) continue;
    const ts=Date.UTC(y,mo-1,d); if(isNaN(ts)||ts>grace) continue;
    if(!best||ts>best.ts) best={ts, iso:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  }
  return best?best.iso:'';
}
async function detectComplianceMeta(file){
  const text = await extractPdfText(file, 4);
  return { type: detectComplianceType(text), dateISO: detectCompletedDate(text) };
}

/* Drop / choose a file → pick the compliance type + optional date → upload. */
function openUploadModal(code, file){
  if(!canEditCompliance()) return alert("You don't have permission to add compliance documents.");
  const rec = allData.find(r=>pad4(r.storeCode)===pad4(code)) || {};
  const order = typesForStore(code);
  let sel = order[0] || 'fiveYear';
  const modal=document.createElement('div'); modal.className='modal'; modal.style.display='block';
  modal.innerHTML=`<div class="modal-content">
    <h2>Add document</h2>
    <p style="margin:.2em 0 .6em"><b>${code}</b> — ${rec.siteName||''}</p>
    <label>Compliance type</label>
    <div class="typegrid" id="ug"></div>
    <label id="unl">Document name (optional)</label>
    <input type="text" id="uname" placeholder="e.g. O&amp;M for PV — leave blank to use the file name">
    <div class="row">
      <div><label>File</label><input type="file" id="uf"></div>
      <div><label>Certificate date (optional)</label><input type="date" id="ud"></div>
    </div>
    <div id="udet" class="drop-note" style="min-height:1.1em;color:#0071CE;font-weight:600;margin:2px 0 0"></div>

      <label>…or upload a whole folder of PDFs</label>
      <input type="file" id="ufolder" webkitdirectory directory multiple>
      <p class="drop-note" style="margin:4px 0 0">Every PDF inside the folder <b>and its sub-folders</b> is added as its own named document (named from its file/sub-folder path). Desktop only.</p>
    </div>
    <p class="drop-note">The newest document becomes the current one; older ones are kept as previous versions (never deleted). A dated certificate updates the next-due date automatically. Pick <b>Other</b> to store an extra named document (e.g. O&amp;M files) that isn't a due-dated compliance type.</p>
    <div class="actions">

  const nameLbl=modal.querySelector('#unl');
  const folderRow=modal.querySelector('#ufolderRow');
  const folderable = ()=> (sel==='other' || sel==='asbestos');   // types that take a whole folder of PDFs
  const syncNameLbl=()=>{
    nameLbl.textContent = (sel==='other') ? 'Document name (optional for a single file)' : 'Document name (optional)';
    folderRow.style.display = folderable() ? '' : 'none';
  };
  let userPickedType = false;
  const selectType=(t)=>{ if(!t) return; sel=t; grid.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); syncNameLbl(); };
  order.forEach(t=>{ const b=document.createElement('button'); b.type='button'; b.textContent=TYPE_LABEL[t]||t; b.dataset.t=t; if(t===sel)b.classList.add('on'); b.onclick=()=>{ userPickedType=true; selectType(t); }; grid.appendChild(b); });
  syncNameLbl();
  const fileInput=modal.querySelector('#uf');

  // Read a chosen PDF, pre-select its type + fill the completed date (user still
  // reviews and presses Upload). Won't override a type the user picked by hand.
  async function autofillFromFile(f){
    const det=modal.querySelector('#udet');
    const isPdf = f && (/\.pdf$/i.test(f.name) || f.type==='application/pdf');
    if(!isPdf){ if(det) det.textContent=''; return; }
    if(det) det.textContent='🔍 Reading certificate…';
    try{
      const meta=await detectComplianceMeta(f);
      if(meta.type && !userPickedType) selectType(meta.type);
      if(meta.dateISO) modal.querySelector('#ud').value=meta.dateISO;
      if(meta.type || meta.dateISO){
        const parts=[];
        if(meta.type) parts.push(TYPE_LABEL[meta.type]||meta.type);
        if(meta.dateISO) parts.push(meta.dateISO.split('-').reverse().join('/'));
        det.textContent='✓ Auto-detected: '+parts.join(' · ')+' — check it, then Upload.';
      } else { det.textContent='Couldn’t auto-detect — please set the type and date.'; }
    }catch(e){ if(det) det.textContent='Couldn’t read this PDF — set the type and date manually.'; }
  }
  fileInput.addEventListener('change', ()=>{ const f=fileInput.files&&fileInput.files[0]; if(f) autofillFromFile(f); });

  if(file){ try{ const dt=new DataTransfer(); dt.items.add(file); fileInput.files=dt.files; }catch(e){} autofillFromFile(file); }
  modal.querySelector('#uc').onclick=()=>modal.remove();
  const folderInput=modal.querySelector('#ufolder');
  modal.querySelector('#udo').onclick=async()=>{
    const name=(modal.querySelector('#uname').value||'').trim();
    const btn=modal.querySelector('#udo');

    // ── Folder upload (Other / Asbestos): every PDF in the folder + sub-folders ─
    const pdfs = (folderable() && folderInput && folderInput.files)
      ? [...folderInput.files].filter(f=>/\.pdf$/i.test(f.name)) : [];
    if(folderable() && pdfs.length){
      btn.disabled=true;
      let done=0, failed=0;
      for(const f of pdfs){
        // Name each doc from its path inside the chosen folder (drop the root
        // folder, drop .pdf), so sub-folder structure is preserved in the name.
        const rel=(f.webkitRelativePath||f.name).split('/').filter(Boolean);
        if(rel.length>1) rel.shift();
        let lbl=rel.join(' / ').replace(/\.pdf$/i,'') || f.name.replace(/\.pdf$/i,'');
        if(name) lbl=name+' — '+lbl;
        const form=new FormData();
        form.append('file',f); form.append('code',code); form.append('type',sel);
        form.append('label',lbl.slice(0,160)); form.append('filename',f.name);
        try{ const r=await authFetch('/compliance/file',{method:'POST',body:form}); const out=await r.json().catch(()=>({})); (r.ok&&out.ok)?done++:failed++; }
        catch(e){ failed++; }
        btn.textContent=`Uploading… ${done+failed}/${pdfs.length}`;
      }
      modal.remove();
      alert(`Uploaded ${done} PDF${done===1?'':'s'} from the folder${failed?` (${failed} failed)`:''}.`);
      loadFromPortal();
      return;
    }

    // ── Single-file upload ────────────────────────────────────────────────────
    const f=fileInput.files&&fileInput.files[0];
    if(!f){
      if(folderable() && folderInput && folderInput.files && folderInput.files.length)
        return alert('No PDF files were found in that folder.');
      return alert('Choose a file (or, for Other / Asbestos, a folder of PDFs).');
    }
    btn.disabled=true; btn.textContent='Uploading…';
    const form=new FormData();
    form.append('file',f); form.append('code',code); form.append('type',sel);
    const d=modal.querySelector('#ud').value; if(d) form.append('date',d);
    if(name) form.append('label',name);
    // Only a real due-dated compliance advances a due date on upload — Asbestos
    // Register and Other are just filed documents.
    if(['fiveYear','gas','epc','alarms','fire','legionella'].includes(sel)) form.append('bump','1');
    form.append('filename',f.name);
    try{
      const r=await authFetch('/compliance/file',{method:'POST',body:form});
      const out=await r.json().catch(()=>({}));
      if(!r.ok||!out.ok){ btn.disabled=false; btn.textContent='Upload'; return alert('Upload failed: '+(out.error||r.status)); }
      modal.remove();
      loadFromPortal();
    }catch(e){ btn.disabled=false; btn.textContent='Upload'; alert('Upload failed.'); }
  };
}

/* View + manage every document for a store. Standard compliance types group by
   their label; named "Other" documents (e.g. O&M for PV) each become their own
   named section. Admins can rename, delete, and pin/link documents in place. */
async function openVersionsModal(code){
  const rec = allData.find(r=>pad4(r.storeCode)===pad4(code)) || {};
  const canEdit = canEditCompliance();
  const HEAD = { fiveYear:'EICR', gas:'Gas Safety', epc:'EPC', alarms:'Smoke/CO Alarms', fire:'Fire / Emergency Lighting', legionella:'Legionella', asbestos:'Asbestos Register', other:'Other' };
  const ORDER = ['fiveYear','gas','epc','alarms','fire','legionella'];
  const TRACKABLE = ['fiveYear','gas','epc','alarms','fire','legionella'];
  const modal=document.createElement('div'); modal.className='modal'; modal.style.display='block';
  modal.innerHTML=`<div class="modal-content">
    <h2>Documents</h2>
    <p style="margin:.2em 0 .4em"><b>${code}</b> — ${esc(rec.siteName||'')}</p>
    ${canEdit?`<p class="drop-note" style="margin:0 0 8px">Drag a document — or a 📁 sub-folder — onto another heading to file it there. Tick <b>keep</b> to link two current docs of a type.</p>`:''}
    <div id="vlist">Loading…</div>
    <div class="actions"><button class="btn" id="vadd">＋ Add document</button><button class="btn" style="background:#ccc;color:#000;" id="vc">Close</button></div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#vc').onclick=()=>modal.remove();
  modal.querySelector('#vadd').onclick=()=>{ modal.remove(); openUploadModal(code); };
  const host=modal.querySelector('#vlist');

  // A doc's display name can carry a sub-folder path ("subA / report") from a
  // folder upload — split it so the folder becomes a small sub-header.
  const subParse=(name)=>{ const s=String(name||''); const i=s.lastIndexOf(' / '); return i>=0 ? {sub:s.slice(0,i).trim(), leaf:s.slice(i+3).trim()} : {sub:'', leaf:s}; };

  // These types are collections of distinct documents (not versioned) — no
  // current/previous badge or "keep" link.
  const noVer = (type)=> ['other','asbestos'].includes(type);

  function rowHtml(f, type){
    const raw=f.label||f.filename||'file';
    const {leaf}=subParse(raw);
    const nv=noVer(type);
    const badge=nv?'':(f.current?'<span class="ver-current">● current</span>':'<span class="ver-old">previous</span>');
    const date=f.date?`<span class="ver-old" style="font-size:12px;white-space:nowrap">${esc(String(f.date).slice(0,10))}</span>`:'';
    const keep=(canEdit&&!nv)?`<label class="pin" title="Keep as a current document. Tick two or more of a type to link them."><input type="checkbox" class="cbpin" ${f.pinned?'checked':''}> keep</label>`:'';
    const edit=canEdit?`${keep}<button class="mini rn" type="button">Rename</button><button class="mini del" type="button">Delete</button>`:'';
    return `<div class="doc-row" ${canEdit?'draggable="true"':''} data-id="${f.id}" data-type="${type}" data-label="${esc(raw)}">${badge}<a class="nm" draggable="false" href="${f.url}" target="_blank">${esc(leaf)}</a>${date}${edit}</div>`;
  }
  function typeHtml(type, items){
    items = items||[];
    let body='';
    if(!items.length){
      body+=`<div class="doc-empty">No documents${canEdit?' — drag one here to file it under '+esc(HEAD[type]||type):''}.</div>`;
    } else {
      // Everything else: optional sub-folders (from folder uploads) as sub-headers.
      const direct=[], subs={}, subOrder=[];
      items.forEach(f=>{ const {sub}=subParse(f.label||f.filename||''); if(sub){ if(!subs[sub]){subs[sub]=[];subOrder.push(sub);} subs[sub].push(f);} else direct.push(f); });
      body+=direct.map(f=>rowHtml(f,type)).join('');
      subOrder.forEach(sname=>{
        const ids=subs[sname].map(f=>f.id);
        body+=`<div class="doc-sub" ${canEdit?'draggable="true"':''} data-ids='${esc(JSON.stringify(ids))}'>📁 ${esc(sname)}</div>`+subs[sname].map(f=>rowHtml(f,type)).join('');
      });
    }
    return `<div class="doc-type" data-type="${type}"><div class="hbar">${esc(HEAD[type]||type)} <span class="cnt">(${items.length})</span></div><div class="body">${body}</div></div>`;
  }
  async function refresh(){
    let files={};
    try{ const r=await authFetch('/compliance/files?code='+encodeURIComponent(code)); const j=await r.json(); files=j.files||{}; }
    catch(e){ host.innerHTML='<p>Could not load.</p>'; return; }
    const hasDocs=Object.keys(files).filter(t=>files[t]&&files[t].length);
    const tracks=TRACKABLE.filter(t=>rec[t]);
    // only the applicable headings for this site: types it tracks or has docs for,
    // plus Other (always, as the catch-all + drop target).
    const applicable=[];
    ORDER.forEach(t=>{ if(hasDocs.includes(t)||tracks.includes(t)) applicable.push(t); });
    applicable.push('asbestos');   // Asbestos Register — always a section per site
    applicable.push('other');
    hasDocs.forEach(t=>{ if(!applicable.includes(t)) applicable.push(t); });
    host.innerHTML = applicable.map(t=>typeHtml(t, files[t])).join('');
  }

  // click: open / rename / delete / keep
  host.addEventListener('click', async (ev)=>{
    const row=ev.target.closest('.doc-row'); if(!row) return;
    const id=+row.dataset.id;
    if(ev.target.classList.contains('nm')){ ev.preventDefault(); openCertById(code, id); return; }
    if(ev.target.classList.contains('rn')){
      const {sub,leaf}=subParse(row.dataset.label||'');
      const name=prompt('Rename this document:', leaf); if(name==null) return;
      const label=(sub?sub+' / ':'')+name.trim();   // keep it in its sub-folder
      await authFetch('/compliance/file-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,label})});
      refresh();
    } else if(ev.target.classList.contains('del')){
      if(!confirm('Delete this document permanently? This cannot be undone.')) return;
      await authFetch('/compliance/file-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
      await refresh(); loadFromPortal();
    }
  });
  host.addEventListener('change', async (ev)=>{
    if(!ev.target.classList.contains('cbpin')) return;
    const id=+ev.target.closest('.doc-row').dataset.id;
    await authFetch('/compliance/file-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pinned:ev.target.checked?1:0})});
    refresh();
  });

  // drag a document (or a whole 📁 sub-folder) onto another heading to re-file it
  let dragIds=null;
  host.addEventListener('dragstart',(ev)=>{
    const sub=ev.target.closest('.doc-sub'); const row=ev.target.closest('.doc-row');
    if(sub){ try{dragIds=JSON.parse(sub.dataset.ids||'[]');}catch(e){dragIds=null;} sub.classList.add('dragging'); }
    else if(row){ dragIds=[+row.dataset.id]; row.classList.add('dragging'); }
    else { dragIds=null; return; }
    if(ev.dataTransfer){ ev.dataTransfer.effectAllowed='move'; try{ev.dataTransfer.setData('text/plain','move');}catch(e){} }
  });
  host.addEventListener('dragend',()=>{ host.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging')); host.querySelectorAll('.doc-type.drop-hot').forEach(z=>z.classList.remove('drop-hot')); });
  host.addEventListener('dragover',(ev)=>{ if(!dragIds) return; const zone=ev.target.closest('.doc-type'); if(!zone) return; ev.preventDefault(); host.querySelectorAll('.doc-type.drop-hot').forEach(z=>{ if(z!==zone) z.classList.remove('drop-hot'); }); zone.classList.add('drop-hot'); });
  host.addEventListener('drop',async(ev)=>{
    const zone=ev.target.closest('.doc-type'); if(!zone||!dragIds) return;
    ev.preventDefault(); zone.classList.remove('drop-hot');
    const targetType=zone.dataset.type; const ids=dragIds; dragIds=null;
    try{ await Promise.all(ids.map(id=>authFetch('/compliance/file-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,type:targetType})}))); }catch(e){}
    await refresh(); loadFromPortal();
  });

  refresh();
}
/* Normalise any stored due date to UK day-first DD/MM/YYYY for display. Handles
   ISO (YYYY-MM-DD, as the auto-advance stores it) and DD/MM/YY(YY) or DD-MM-YY
   from the migrated data — so every cell reads the same way round. Unknown text
   is left untouched. (Slashes + 4-digit year so it round-trips through the edit
   save + the overdue calc, both of which parse DD/MM/YYYY.) */
function fmtDue(s){
  // Strip any stray cert emoji that a bad edit may have baked into the stored
  // value, so a due date can never render an extra 📄 (see dateCell — the "has a
  // document" 📄 is added there, exactly once per type).
  s = String(s == null ? '' : s).replace(/📄/g, '').trim();
  if (!s) return '';
  let d, m, y, mm;
  if ((mm = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(s))) { y=+mm[1]; m=+mm[2]; d=+mm[3]; }        // ISO YYYY-MM-DD
  else if ((mm = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(s))) { d=+mm[1]; m=+mm[2]; y=+mm[3]; if (y<100) y+=2000; } // DD/MM/YY(YY)
  else return s;
  if (!(m>=1 && m<=12 && d>=1 && d<=31)) return s;
  const p = n => String(n).padStart(2,'0');
  return `${p(d)}/${p(m)}/${y}`;
}
/* HTML for a date cell, with a 📄 link appended when a cert is on file. */
function dateCell(code, colKey, val){
  const t = CERT_TYPE[colKey];
  const has = t && complianceIndex[pad4(code)] && complianceIndex[pad4(code)][t];
  const link = has ? ` <a class="cert-link" href="#" data-code="${code}" data-type="${t}" title="Open certificate">📄</a>` : '';
  return `${fmtDue(val)}${link}`;
}

/* ===== Helpers ===== */
function bust(url){
  const u = new URL(url);
  u.searchParams.set('v', Date.now() + Math.random());
  return u.toString();
}

async function fetchNoCacheJSON(url) {
  try {
    const res = await fetch(bust(url), {
      cache: 'no-store',
      mode: 'cors'
    });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    console.error('fetchNoCacheJSON error:', e);
    return null;
  }
}

function pad4(v){ return String(v ?? "").replace(/\D/g,"").padStart(4,"0"); }
function pick(o, keys){ for (const k of keys){ if(o && o[k]!=null && String(o[k]).trim()!=="") return o[k]; } return ""; }

function normaliseRecord(raw, label){
  const rawCode = pick(raw, ["branchCode","Branch Code","BranchCode","Store Code","StoreCode","Branch","Code","ID"]);
  const storeCode = pad4(rawCode || "");
  const siteName  = pick(raw, ["Store Name","storeName","Site Name","siteName","Name"]);
  const postcode  = pick(raw, ["Postcode","postcode","Post Code","ZIP"]);
  const fiveYear  = pick(raw, ["5_Year","5 Year","5year","FiveYear"]);
  const pat       = pick(raw, ["PAT","Pat"]);
  const em        = pick(raw, ["EM","Emergency Lighting","EmergencyLighting"]);
  const pv        = pick(raw, ["PV","Photovoltaic"]);
  const ev        = pick(raw, ["EV","EVCP","EV_Charge"]);
  const pump      = pick(raw, ["PUMP","Pump"]);
  const sharePoint= pick(raw, ["SharePoint","SharePointURL","sharePointURL","sharePoint","SP"]);

  return {
    storeCode,
    siteName,
    postcode,
    storeType: label,
    fiveYear, pat, em, pv, ev, pump,
    sharePoint
  };
}

function parseDate(d) {
  if (!d) return null;
  const s = String(d).trim().replace(/^\*/, '');
  if (!s) return null;
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)) {
    const [dd, mm, yy] = s.split('/');
    const y = yy.length === 2 ? (2000 + Number(yy)) : Number(yy);
    return new Date(y, Number(mm)-1, Number(dd));
  }
  const dt = new Date(s);
  return isNaN(dt) ? null : dt;
}

function statusEmoji(s){ return s==='red' ? '🔴' : s==='amber' ? '🟡' : '🟢'; }
function getStatus(e){ return statusEmoji(worstStatus(e)); }

/* ============ Rendering ============ */

  d.forEach(e=>{
    if (!e.storeCode || !e.siteName) return;
    const tr = document.createElement('tr');

    const nFiles = Object.values(complianceIndex[pad4(e.storeCode)] || {}).reduce((a,b)=>a+(+b||0),0);
    const docsCell = `<button class="doc-btn up" data-code="${e.storeCode}" title="Upload / drop a document">📎</button>`
      + (nFiles ? ` <button class="doc-btn view" data-code="${e.storeCode}" title="View documents">🗂 ${nFiles}</button>` : '');
    const m = e.meta || {};
    const pinSet = (m.lat!=null && m.lng!=null) || m.w3w;
    const keySet = (m.access && m.access.trim()) || (m.contact && m.contact.trim()) || (m.keys && m.keys.trim());
    const locCell = `<button class="doc-btn loc" data-code="${e.storeCode}" title="${pinSet?'Location set — view/edit':'Set location'}">${pinSet?'📍':'📍❓'}</button>`;
    const keyCell = `<button class="doc-btn key" data-code="${e.storeCode}" title="${keySet?'Access info — view/edit':'Add access info'}">🔑</button>`;
    const ws = worstStatus(e);
    const dtd = (type) => { const s = typeStatus(e, type); return `<td class="dc${s ? ' st-'+s : ''}">${dateCell(e.storeCode, type, e[type])}</td>`; };
    if(e.active===0) tr.classList.add('closed-row');
    tr.innerHTML = `
      <td>${e.storeCode}</td><td class="site">${e.siteName}${(e.active===0 && viewMode!=='closed')?' <span class=\"closed-badge\">🗄 Closed</span>':''}</td><td>${esc(e.storeType||'')}</td>
      <td class="${ws?'st-'+ws:''}">${statusEmoji(ws)}</td>
      ${dtd('fiveYear')}${dtd('gas')}${dtd('epc')}${dtd('alarms')}${dtd('fire')}${dtd('legionella')}
      <td>${locCell}</td><td>${keyCell}</td>
      <td class="docs-cell">${docsCell}</td>
    `;
    frag.appendChild(tr);
  });

  tb.appendChild(frag);
  document.getElementById('loadedCount').textContent = d.length;
  if (editMode) enableEditing(true);

  // document). Drops silently if the selected row filtered out of view.
  if (selectedCode){
    const sel = tb.querySelector(`tr[data-code="${window.CSS && CSS.escape ? CSS.escape(selectedCode) : selectedCode}"]`);
    if (sel) sel.classList.add('row-sel'); else selectedCode = null;
  }
}

/* apply filters + re-render */
function applyFilters(){
  const q = document.getElementById('searchBar').value.toLowerCase().trim();
  // When SEARCHING, span active AND archived so nothing is hidden by the view.
  let data = q ? allData.slice() : baseData();
  if (activeStoreType !== 'ALL') data = data.filter(e=>e.storeType === activeStoreType);
  if (activeCategories.size > 0) {
    data = data.filter(e=>{
      for (const cat of activeCategories) {
        const val = e[cat]; if (!val || String(val).trim()==="") return false;
      }
      return true;
    });
  }
  if (q) {
    data = data.filter(e =>
      (e.storeCode || '').toLowerCase().includes(q) ||
      (e.siteName || '').toLowerCase().includes(q) ||
      (e.postcode || '').toLowerCase().includes(q)
    );
  }
  renderTable(data);
  updateFilterSummary();
}

function updateFilterSummary(){
  const el = document.getElementById('filterSummary');
  const cats = activeCategories.size ? Array.from(activeCategories).join(', ') : 'None';
  el.textContent = `Compliance: ${cats} | Showing ${currentData.length} of ${baseData().length}`;
  el.classList.add('visible');
  updateClosedCount();
}

/* ============ Progressive Live Loads ============ */
const SOURCES = [
  { path: 'retail',      label: 'Retail' },
  { path: 'els',         label: 'ELS' },
  { path: 'els_private', label: 'ELS Private' },
  { path: 'cobra',       label: 'Cobra' },
  { path: 'wenzels',     label: "Wenzel's" }
];

async function fetchOneSource(s) {
  const j = await fetchNoCacheJSON(CLOUDFLARE_GET(s.path));
  if (!j) return [];

  let arr = [];

  // Case 1: array of objects [{...}, {...}]
  if (Array.isArray(j) && j.length > 0 && !j.some(v => typeof v !== 'object')) {
    // Handle nested object arrays like [ { "9701": {...}, "9704": {...} } ]
    if (Object.keys(j[0] || {}).some(k => typeof j[0][k] === "object")) {
      arr = Object.values(j[0]);
    } else {
      arr = j;
    }
  }
  // Case 2: plain object {"9701": {...}}
  else if (j && typeof j === "object" && !Array.isArray(j)) {
    arr = Object.values(j);
  }
  // Case 3: wrapped under "data" key
  else if (j && Array.isArray(j.data)) {
    arr = j.data;
  }

  return arr
    .map(r => normaliseRecord(r, s.label))
   .filter(r => r.storeCode && (r.storeName ?? r.siteName ?? "").trim() !== "");
}
async function fetchAllProgressive(){
  allData = [];
  renderTable([]);
  const tb = document.getElementById('tableBody');
  tb.innerHTML = '<tr><td colspan="13" class="loading">Loading data…</td></tr>';

  for (const s of SOURCES){
    const chunk = await fetchOneSource(s).catch(err => {
      console.error('fetchOneSource error for', s.path, err);
      return [];
    });
    if (chunk.length){
      allData = allData.concat(chunk);
      applyFilters();
    }
  }
  if (!allData.length) {
    tb.innerHTML = '<tr><td colspan="13" class="error">No data returned.</td></tr>';
  }
}

/* ============ Portal-native load (single source: /compliance/stores) ========
   The chart now reads from the portal. Each row's name/postcode come from the
   canonical `sites` home; category + due dates from the compliance overlay; and
   `files` says which types already have a document (drives the 📄 links). */
async function loadFromPortal(){
  const tb = document.getElementById('tableBody');
  // Preserve where the user is looking. Uploading/deleting a document (and the
  // Reload button) re-runs this; without capturing the scroll the rebuilt table
  // would snap back to the top.
  const wrap = document.querySelector('.table-wrapper');
  const keepScroll = wrap ? wrap.scrollTop : 0;
  const keepWin = window.scrollY;
  const firstLoad = !allData.length;
  // Only show the "Loading…" placeholder on the very first load — on a refresh we
  // keep the current rows visible (no flash, no jump) until the new ones arrive.
  if (firstLoad) tb.innerHTML = '<tr><td colspan="13" class="loading">Loading…</td></tr>';
  let stores = [];
  try{
    const r = await authFetch('/compliance/stores');
    const j = await r.json();
    stores = j.stores || [];
  }catch(e){
    console.error('loadFromPortal', e);
    // On a background refresh, keep what's on screen rather than blanking it.
    if (firstLoad) tb.innerHTML = '<tr><td colspan="13" class="error">Could not load compliance data.</td></tr>';
    return;
  }
  complianceIndex = {};
  storeFiles = {};
  allData = stores.map(s => {
    const code = pad4(s.code);
    complianceIndex[code] = s.files || {};
    const d = s.due || {};
    return {
      storeCode: code,
      siteName: s.name || '',
      postcode: s.postcode || '',
      storeType: s.category || '',
      siteNumber: s.siteNumber || '',
      hasSite: !!s.hasSite,
      active: s.active == null ? 1 : s.active,
      meta: s.meta || {},
      fiveYear: d.fiveYear || '', gas: d.gas || '', epc: d.epc || '',
      alarms: d.alarms || '', fire: d.fire || '', legionella: d.legionella || '',
      sharePoint: ''
    };
  });
  if (!allData.length){
    tb.innerHTML = '<tr><td colspan="13" class="loading">No sites yet — press ✏️ Edit then ＋ Add Site to add one.</td></tr>';
    return;
  }
  applyFilters();
  // Restore the scroll position now that the table has its full height back.
  if (wrap) wrap.scrollTop = keepScroll;
  if (keepWin) window.scrollTo(0, keepWin);
}

/* One-time migration: read the old mostlane-pos store list BROWSER-SIDE (it's
   still CORS-reachable here) and post it into the portal. Missing sites are
   created so the chart and Sites share one home. After this, mostlane-pos is
   retired — the chart reads only from the portal. */
async function migrateFromOld(){
  if (!canEditCompliance()) return;
  if (!confirm("Import all stores + due dates from the OLD system into the portal?\n\nMissing stores will be added to Sites so everything shares one home. Safe to run more than once.")) return;
  const btn = document.getElementById('migrateBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Importing…'; }
  let all = [];
  for (const s of SOURCES){
    const chunk = await fetchOneSource(s).catch(()=>[]);
    all = all.concat(chunk);
  }
  const stores = all.filter(r => r.storeCode).map(r => ({
    code: r.storeCode, name: r.siteName, postcode: r.postcode, category: r.storeType,
    due: { fiveYear: r.fiveYear, pat: r.pat, em: r.em, pv: r.pv, ev: r.ev, pump: r.pump }
  }));
  let imported = 0, matched = 0, sitesCreated = 0;
  for (let i = 0; i < stores.length; i += 200){
    const batch = stores.slice(i, i + 200);
    try{
      const r = await authFetch('/compliance/stores/import', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stores: batch, createSites: true })
      });
      const j = await r.json();
      imported += j.imported || 0; matched += j.matched || 0; sitesCreated += j.sitesCreated || 0;
    }catch(e){ console.error('import batch', e); }
    if (btn) btn.textContent = `Importing… ${Math.min(i+200, stores.length)}/${stores.length}`;
  }
  if (btn){ btn.disabled = false; btn.textContent = '⤵ Import from old system'; }
  alert(`Imported ${imported} stores.\nMatched ${matched} existing sites, created ${sitesCreated} new ones.`);
  loadFromPortal();
}

/* ============ Edit / Save / Add / Delete ============ */
function enableEditing(state){
  document.body.classList.toggle('cmp-edit', !!state);
  const editableCols = ["EICR","Gas Safety","EPC","Smoke/CO Alarms","Fire / Emergency Lighting","Legionella"];
  document.querySelectorAll("table tbody tr").forEach(row=>{
    [...row.children].forEach((td,i)=>{
      const header = document.querySelectorAll("thead th")[i].textContent.trim();
      if (state && editableCols.includes(header)) {
        // Remove the 📄 cert link before editing so its emoji can't be captured
        // into the due-date text on save (that was baking "📄" into the value).
        td.querySelectorAll('.cert-link').forEach(a => a.remove());
        td.contentEditable = true;
        td.style.background = "#fff6d1";
        td.addEventListener("input", ()=> row.dataset.changed = "true", { once:true });
      } else {
        td.contentEditable = false;
        td.style.background = "";
      }
    });
    if (!state) row.removeAttribute("data-changed");
  });
}

/* Save the edited due dates to the portal (compliance_stores overlay on the
   canonical site) — replaces the old mostlane-pos KV write. */
async function saveEditInstant(row){
  const code = row.children[0].textContent.trim();
  const headers = [...document.querySelectorAll("thead th")].map(th => th.textContent.trim());
  const record = {};
  [...row.children].forEach((td,i)=> record[headers[i]] = td.textContent.trim());
  // Keep only date characters (digits / . - /) so no stray emoji or text can be
  // saved into a due date. An empty cell stays empty (clears that due date).
  const cleanDate = v => String(v || "").replace(/[^\d\/.\-]/g, "").trim();
  const due = {
    fiveYear:   cleanDate(record["EICR"]),
    gas:        cleanDate(record["Gas Safety"]),
    epc:        cleanDate(record["EPC"]),
    alarms:     cleanDate(record["Smoke/CO Alarms"]),
    fire:       cleanDate(record["Fire / Emergency Lighting"]),
    legionella: cleanDate(record["Legionella"])
  };

  row.style.opacity = "0.6";
  row.style.background = "#eaf6ff";
  try {
    const res = await authFetch("/compliance/store", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, due })
    });
    const out = await res.json().catch(()=>({}));
    if (res.ok && out.ok === true) {
      row.style.background = "#d7ffd9";
      const banner = document.getElementById('saveBanner');
      if (banner) banner.style.display = 'block';
    } else {
      row.style.background = "#ffecec";
      console.warn("Save not OK:", out);
    }
  } catch (e) {
    console.error("Save error:", e);
    row.style.background = "#ffecec";
  } finally {
    row.style.opacity = "1";
  }
}

/* Add from Sites — pick an EXISTING portal site and link it into the
   Chapplins chart. Chapplins stores use their own 0001-style code, so the picked
   site's number is stored explicitly (site_number) — that's the bridge to the
   site's Site Documents. Config-driven; mirrors eicr-portal.html's copy. */
const AFS_CFG = {
  clients: { fbc:"FBC", general:"General" },
  codeIsSiteNumber: false, askType: true, defaultType: "Other",
  emptyMsg: "No eligible FBC sites to add — every one is already on the chart."
};
function afsKey(num){ return AFS_CFG.codeIsSiteNumber ? pad4(num) : String(num||'').trim(); }
function openAddFromSitesModal(){
  if (!canEditCompliance()) return alert("You don't have permission to add compliance sites.");
  const cfg = AFS_CFG;
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="modal-content">
      <h2>Add from Sites</h2>
      <p style="margin:.2em 0 .6em;color:#556;font-size:14px;">Pick a site you already have in the portal. It's linked to that site, so its certificates show under the site's <b>Site Documents</b> automatically.</p>
      ${cfg.askType ? '<label style="font-size:13px;color:#556;">Type for new sites (optional)</label><input id="afsType" type="text" placeholder="e.g. Office / Depot / Toilets" autocomplete="off" style="margin-bottom:8px;" />' : ''}
      <input id="afsSearch" type="text" placeholder="Search name or number…" autocomplete="off" />
      <div id="afsList" style="max-height:46vh;overflow:auto;margin-top:8px;border:1px solid #e3e8ee;border-radius:10px;">
        <div style="padding:14px;color:#889;">Loading your sites…</div>
      </div>
      <div class="actions">
        <button class="btn" style="background:#ccc;color:#000;" id="afs_cancel">Close</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.style.display = 'block';
  modal.querySelector('#afs_cancel').onclick = ()=> modal.remove();
  modal.onclick = (e)=>{ if (e.target === modal) modal.remove(); };

  const listEl = modal.querySelector('#afsList');
  const searchEl = modal.querySelector('#afsSearch');
  const typeEl = modal.querySelector('#afsType');
  let sites = [];

  const existing = new Set((allData || []).map(e =>
    afsKey(cfg.codeIsSiteNumber ? e.storeCode : (e.siteNumber || ''))
  ));

  function render(){
    const q = (searchEl.value || '').trim().toLowerCase();
    const rows = sites.filter(s =>
      !q || (s.siteName||'').toLowerCase().includes(q) || (s.siteNumber||'').toLowerCase().includes(q)
    );
    if (!rows.length){ listEl.innerHTML = '<div style="padding:14px;color:#889;">'+(sites.length?'No matches.':cfg.emptyMsg)+'</div>'; return; }
    listEl.innerHTML = rows.map(s => {
      const num = String(s.siteNumber||'').trim();
      const label = cfg.clients[(s.client||'').toLowerCase()] || '';
      return `<button type="button" class="afs-row" data-num="${num}"
        style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #eef1f4;background:#fff;cursor:pointer;">
        <b style="min-width:52px;color:#0a66c2;">${num}</b>
        <span style="flex:1;">${(s.siteName||'(no name)')}</span>
        <span style="color:#889;font-size:12px;">${s.postcode||''}${label?' · '+label:''}</span>
      </button>`;
    }).join('');
    listEl.querySelectorAll('.afs-row').forEach(b => b.onclick = ()=> addOne(b.dataset.num, b));
  }

  async function addOne(num, btn){
    const s = sites.find(x => String(x.siteNumber||'').trim() === num);
    if (!s) return;
    btn.disabled = true; btn.style.opacity = '.6';
    try{
      let code = num;
      if (!cfg.codeIsSiteNumber){
        const nc = await (await authFetch('/compliance/next-code')).json().catch(()=>({}));
        code = nc && nc.code ? nc.code : '';
        if (!code){ alert('Could not allocate a code.'); btn.disabled=false; btn.style.opacity='1'; return; }
      }
      const category = cfg.codeIsSiteNumber
        ? (cfg.clients[(s.client||'').toLowerCase()] || cfg.defaultType)
        : ((typeEl && typeEl.value.trim()) || cfg.defaultType);
      const res = await authFetch('/compliance/store', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ code, name: s.siteName || '', postcode: s.postcode || '', category, siteNumber: num })
      });
      const out = await res.json().catch(()=>({}));
      if (res.ok && out.ok){
        existing.add(afsKey(num));
        sites = sites.filter(x => String(x.siteNumber||'').trim() !== num);
        render();
        await loadFromPortal();
      } else {
        alert((out && out.error) || 'Could not add that site.');
        btn.disabled = false; btn.style.opacity = '1';
      }
    }catch(e){
      console.error(e); alert('Could not add that site.');
      btn.disabled = false; btn.style.opacity = '1';
    }
  }

  searchEl.oninput = render;
  authFetch('/get-sites?category=all')
    .then(r => r.json())
    .then(arr => {
      sites = (Array.isArray(arr) ? arr : [])
        .filter(s => cfg.clients[(s.client||'').toLowerCase()] && String(s.siteNumber||'').trim() && !existing.has(afsKey(s.siteNumber)))
        .sort((a,b) => String(a.siteNumber).localeCompare(String(b.siteNumber), undefined, { numeric:true }));
      render();
      searchEl.focus();
    })
    .catch(e => { console.error(e); listEl.innerHTML = '<div style="padding:14px;color:#c00;">Could not load your sites.</div>'; });
}

function filterOverdue(){
  const now = new Date();
  const filtered = baseData().filter(e => {
    return [e.fiveYear,e.gas,e.epc,e.alarms,e.fire,e.legionella]
      .map(parseDate).filter(Boolean).some(d => d < now);
  });
  renderTable(filtered);
  updateFilterSummary();
}
function filterDueWithin(days){
  const now = new Date();
  const end = new Date(now.getTime() + days*86400000);
  const filtered = baseData().filter(e => {
    return [e.fiveYear,e.gas,e.epc,e.alarms,e.fire,e.legionella]
      .map(parseDate).filter(Boolean).some(d => d >= now && d <= end);
  });
  renderTable(filtered);
  updateFilterSummary();
}

/* ============ 📍 Fill missing pins from the postcode ============ */
/* Every site here carries a postcode but hardly any had a pin, and dropping
   ninety-odd by hand is not realistic. This looks up the ones with NO pin via
   postcodes.io — the same lookup the scheduler and the sites register use — and
   saves each through the normal /compliance/store-meta route, so the linked
   portal site and its SiteLog geofence move with it exactly as if the pin had
   been placed by hand. A pin that is already set is never touched; a postcode
   centroid is a starting point, so drag any of them afterwards to refine. */
function normPc(v){ return String(v||'').replace(/\*+$/,'').toUpperCase().replace(/\s+/g,' ').trim(); }
function needsPin(r){ const m = r.meta || {}; return m.lat == null || m.lng == null; }
/* window.alert is a portal-wide toast, which can't carry a list — so the
   outcome (and anything skipped) goes in a normal modal you can read. */
function pinReport(title, html){
  const modal=document.createElement('div'); modal.className='modal'; modal.style.display='block';
  modal.innerHTML=`<div class="modal-content" style="max-width:560px">
    <h2>${esc(title)}</h2>${html}
    <div class="actions"><button class="btn" id="pr_close">Close</button></div></div>`;
  document.body.appendChild(modal);
  modal.querySelector('#pr_close').onclick=()=>modal.remove();
}
function pinList(rows, extra){
  return '<ul style="margin:6px 0 0 18px;padding:0;font-size:13px;color:#334155">'
    + rows.slice(0,12).map(r=>`<li>${esc(r.siteName||r.storeCode)}${extra?' — '+esc(extra(r)):''}</li>`).join('')
    + (rows.length>12?`<li>…and ${rows.length-12} more</li>`:'') + '</ul>';
}

async function fillMissingPins(){
  const btn = document.getElementById('fillPinsBtn');
  const todo  = allData.filter(r => needsPin(r) && normPc(r.postcode));
  const noPc  = allData.filter(r => needsPin(r) && !normPc(r.postcode));
  if(!todo.length){
    pinReport('📍 Nothing to look up', noPc.length
      ? `<p>Every site with a postcode already has a pin.</p><p><b>${noPc.length} site(s) have no postcode yet</b> — add one and run this again:</p>${pinList(noPc)}`
      : '<p>Every site already has a location pin.</p>');
    return;
  }
  const msg = `Look up ${todo.length} site(s) by postcode and drop a pin on each?\n\n`
    + 'Pins already set are left alone. A postcode puts the pin on the street rather than the exact door, so drag any of them afterwards to fine-tune.';
  const ok = window.MLUI ? await MLUI.confirm(msg, { title:'📍 Fill missing pins', okLabel:'Look them up' }) : confirm(msg);
  if(!ok) return;

  const label = btn ? btn.textContent : '';
  const say = t => { if(btn) btn.textContent = t; };
  if(btn) btn.disabled = true;

  // 1. One bulk lookup per 100 postcodes (postcodes.io's limit).
  say('📍 Looking up postcodes…');
  const wanted = [...new Set(todo.map(r => normPc(r.postcode)))];
  const found = {};
  const badPc = [];
  for(let i = 0; i < wanted.length; i += 100){
    const batch = wanted.slice(i, i + 100);
    try{
      const res = await fetch('https://api.postcodes.io/postcodes', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ postcodes: batch })
      });
      const data = await res.json();
      (data.result || []).forEach(r => {
        const q = normPc(r.query);
        if(r.result && isFinite(r.result.latitude)) found[q] = [r.result.latitude, r.result.longitude];
        else badPc.push(q);
      });
    }catch(e){
      if(btn){ btn.disabled = false; btn.textContent = label; }
      pinReport('📍 Lookup unavailable', '<p>Could not reach the postcode lookup. Check your connection and try again.</p>');
      return;
    }
  }

  // 2. Save each pin through the normal route, a few at a time.
  const queue = todo.filter(r => found[normPc(r.postcode)]);
  let done = 0, failed = 0;
  async function lane(){
    while(queue.length){
      const rec = queue.shift();
      const [lat, lng] = found[normPc(rec.postcode)];
      try{
        const r = await authFetch('/compliance/store-meta', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ code: rec.storeCode, lat, lng })
        });
        const j = await r.json();
        if(r.ok && j.ok){ rec.meta = j.meta; done++; } else failed++;
      }catch(e){ failed++; }
      say(`📍 ${done + failed}/${todo.length}…`);
    }
  }
  await Promise.all([lane(), lane(), lane(), lane()]);

  if(btn){ btn.disabled = false; btn.textContent = label; }
  applyFilters();

  // Say plainly what did NOT get a pin, so a missing one is never a mystery.
  const unresolved = todo.filter(r => !found[normPc(r.postcode)]);
  let out = `<p><b>${done} pin(s) set.</b> Open 📍 on any row to drag it to the exact door.</p>`;
  if(failed) out += `<p style="color:#b45309">${failed} could not be saved — run it again.</p>`;
  if(unresolved.length) out += `<p><b>${unresolved.length} postcode(s) not recognised</b> — check the postcode on these:</p>`
    + pinList(unresolved, r => normPc(r.postcode));
  if(noPc.length) out += `<p><b>${noPc.length} site(s) have no postcode at all:</b></p>` + pinList(noPc);
  pinReport('📍 Pins updated', out);
}

/* Load a site's tenant contacts (current + previous) into an element. Chapplins
   compliance code == the portal site number, so /chapplins/site resolves it. */
async function loadTenantInto(el, code){
  if(!el) return;
  try{
    const r = await authFetch('/chapplins/site?number=' + encodeURIComponent(code));
    if(!r.ok){ el.textContent = 'No tenant on record.'; return; }
    const j = await r.json();
    const tens = (j && j.tenants) || [];
    if(!tens.length){ el.textContent = 'No tenant on record.'; return; }
    const one = t => {
      const contact = [
        t.phone ? `<a href="tel:${esc(String(t.phone).replace(/\s/g,''))}">${esc(t.phone)}</a>` : '',
        t.email ? `<a href="mailto:${esc(String(t.email).split(';')[0])}">${esc(String(t.email).split(';')[0])}</a>` : '',
        t.homeTel ? esc(t.homeTel) : ''
      ].filter(Boolean).join(' · ');
      const tag = t.current
        ? '<span style="background:#2e7d32;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;">CURRENT</span>'
        : '<span style="background:#e7edf3;color:#5b6b7d;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;">previous</span>';
      return `<div style="margin-top:5px;color:#0f172a">${tag} <b>${esc(t.name||t.ref||'—')}</b>${t.ref?` <span style="color:#94a3b8;font-size:12px">[${esc(t.ref)}]</span>`:''}`
             + (contact?`<div style="font-size:13px;margin-top:1px">${contact}</div>`:'') + `</div>`;
    };
    const cur = tens.filter(t=>t.current), prev = tens.filter(t=>!t.current);
    el.innerHTML = (cur.length?cur.map(one).join(''):'<div style="color:#94a3b8">No current tenant.</div>')
      + (prev.length?`<details style="margin-top:5px"><summary style="cursor:pointer;color:#64748b;font-size:13px">${prev.length} previous tenant${prev.length>1?'s':''}</summary>${prev.map(one).join('')}</details>`:'');
  }catch{ el.textContent = 'No tenant on record.'; }
}

/* ============ 🔑 Access instructions + site contact (view → edit) ============ */
function openAccessModal(code){
  const rec = allData.find(r=>pad4(r.storeCode)===pad4(code)) || {};
  const canEdit = canEditCompliance();
  const modal=document.createElement('div'); modal.className='modal'; modal.style.display='block';
  modal.innerHTML=`<div class="modal-content"></div>`;
  document.body.appendChild(modal);
  const host=modal.querySelector('.modal-content');
  const nl = s => esc(s).replace(/\n/g,'<br>');

  function view(){
    const m = rec.meta || {};
    const acc = (m.access||'').trim();
    const block = (label,val,ph) => `<div style="margin:8px 0"><div style="font-weight:700;color:#334155">${label}</div>`
      + (val ? `<div style="white-space:pre-wrap;margin-top:2px">${nl(val)}</div>` : `<div style="color:#94a3b8;margin-top:2px">${ph}</div>`) + `</div>`;
    host.innerHTML = `
      <h2>🔑 Access — ${esc(rec.siteName||code)}</h2>
      ${block('Access instructions', acc, 'Not set yet')}
      <div style="margin:8px 0"><div style="font-weight:700;color:#334155">👤 Tenant</div><div id="ak_tenant" style="margin-top:2px;color:#94a3b8">Loading…</div></div>
      <div class="actions">
        ${canEdit?'<button class="btn" id="ak_edit">✏️ Edit</button>':''}
        <button class="btn" style="background:#ccc;color:#000;" id="ak_close">Close</button>
      </div>`;
    host.querySelector('#ak_close').onclick=()=>modal.remove();
    const eb=host.querySelector('#ak_edit'); if(eb) eb.onclick=edit;
    loadTenantInto(host.querySelector('#ak_tenant'), code);
  }
  function edit(){
    const m = rec.meta || {};
    host.innerHTML = `
      <h2>🔑 Access — ${esc(rec.siteName||code)}</h2>
      <label>Access instructions</label>
      <textarea id="ak_access" rows="5" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box" placeholder="e.g. By appointment — Mon-Fri 8am-5pm">${esc(m.access||'')}</textarea>
      <div class="actions">
        <button class="btn" id="ak_save">Save</button>
        <button class="btn" style="background:#ccc;color:#000;" id="ak_cancel">Cancel</button>
      </div>`;
    host.querySelector('#ak_cancel').onclick=view;
    const sb=host.querySelector('#ak_save');
    sb.onclick=async()=>{
      sb.disabled=true; sb.textContent='Saving…';
      const body={ code, access:host.querySelector('#ak_access').value };
      try{ const r=await authFetch('/compliance/store-meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const j=await r.json(); if(r.ok&&j.ok){ rec.meta=j.meta; applyFilters(); view(); }
        else { sb.disabled=false; sb.textContent='Save'; alert('Could not save.'); }
      }catch(e){ sb.disabled=false; sb.textContent='Save'; alert('Could not save.'); }
    };
  }
  view();
}

/* ============ Wiring UI ============ */
document.addEventListener('DOMContentLoaded', () => {
  // Buttons
  document.getElementById('reloadBtn').onclick = loadFromPortal;
  const settingsBtn = document.getElementById('settingsBtn');
  if (canEditCompliance()) { settingsBtn.style.display = ''; settingsBtn.onclick = openSettingsModal; }
  const fillPinsBtn = document.getElementById('fillPinsBtn');
  if (fillPinsBtn && canEditCompliance()) { fillPinsBtn.style.display = ''; fillPinsBtn.onclick = fillMissingPins; }
  document.getElementById('overdueBtn').onclick = ()=> {
    document.querySelectorAll('.summary-bubbles .bubble').forEach(b=>b.classList.remove('active'));
    document.getElementById('overdueBtn').classList.add('active');
    filterOverdue();
  };
  document.querySelectorAll('.summary-bubbles .bubble[data-days]').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.summary-bubbles .bubble').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      filterDueWithin(Number(b.dataset.days));
    };
  });
  document.getElementById('searchModalBtn').onclick = openSearchModal;
  document.getElementById('clearBtn').onclick = ()=>{
    document.querySelectorAll('.summary-bubbles .bubble').forEach(b=>b.classList.remove('active'));
    clearFilters();
  };
  document.getElementById('exportBtn').onclick = exportExcel;
  document.getElementById('summaryBtn').onclick = openSummaryModal;

  // Compliance filters
  document.querySelectorAll('#complianceFilters .bubble').forEach(b=>{
    b.onclick = ()=>{
      const cat = b.dataset.cat;
      if (activeCategories.has(cat)) { activeCategories.delete(cat); b.classList.remove('active'); }
      else { activeCategories.add(cat); b.classList.add('active'); }
      applyFilters();
    };
  });

  // Search bar (debounced)
  const searchBar = document.getElementById('searchBar');
  let t;
  searchBar.addEventListener('input', ()=>{
    clearTimeout(t);
    t = setTimeout(applyFilters, 120);
  });

  // Edit flow
  const editBtn = document.getElementById('editBtn');
  const saveBtn = document.getElementById('saveBtn');
  const addBtn  = document.getElementById('addSiteBtn');
  const addFromBtn = document.getElementById('addFromSitesBtn');
  const delBtn  = document.getElementById('deleteSiteBtn');

  // Only Compliance / Full-Access users can edit; everyone else just views.
  if (!canEditCompliance()) editBtn.style.display = "none";

  editBtn.onclick = ()=>{
    if (!canEditCompliance()) return;
    editMode = true;
    enableEditing(true);
    editBtn.style.display = "none";
    saveBtn.style.display = "inline-flex";
    addBtn.style.display  = "inline-flex";
    addFromBtn.style.display = "inline-flex";
    delBtn.style.display  = "inline-flex";
  };

  saveBtn.onclick = async ()=>{
    const changed = [...document.querySelectorAll("tbody tr[data-changed='true']")];
    if (!changed.length) return alert("No changes detected.");
    alert("✅ Changes queued — sending now.");
    for (const r of changed) { await saveEditInstant(r); }
    enableEditing(false);
    editMode = false;
    editBtn.style.display = "inline-flex";
    saveBtn.style.display = "none";
    addBtn.style.display  = "none";
    addFromBtn.style.display = "none";
    delBtn.style.display  = "none";
    // do NOT auto reload so the green banner persists
  };

  addBtn.onclick = openAddSiteModal;
  addFromBtn.onclick = openAddFromSitesModal;
  delBtn.onclick = openDeleteSiteModal;

  const tb = document.getElementById('tableBody');
  // 📄 certificate links + 📎 upload / 🗂 view (event-delegated, survives re-render)
  tb.addEventListener('click', (ev)=>{
    const cert = ev.target.closest('.cert-link');
    if (cert && !editMode){ ev.preventDefault(); openCert(cert.dataset.code, cert.dataset.type); return; }
    const up = ev.target.closest('.doc-btn.up');
    if (up){ ev.preventDefault(); pickAndUpload(up.dataset.code); return; }
    const view = ev.target.closest('.doc-btn.view');
    if (view){ ev.preventDefault(); openVersionsModal(view.dataset.code); return; }
    const loc = ev.target.closest('.doc-btn.loc');
    if (loc){ ev.preventDefault(); openLocationModal(loc.dataset.code); return; }
    const key = ev.target.closest('.doc-btn.key');
    if (key){ ev.preventDefault(); openAccessModal(key.dataset.code); return; }
    // Site-name click: highlight the row (single-select).
    const site = ev.target.closest('td.site');
    if (site){
      const tr = site.closest('tr'); if (!tr) return;
      const already = tr.classList.contains('row-sel');
      document.querySelectorAll('tr.row-sel').forEach(r=>r.classList.remove('row-sel'));
      if (!already){ tr.classList.add('row-sel'); selectedCode = tr.dataset.code; }
      else selectedCode = null;
      return;
    }
  });

  // Clicking anywhere off the selected row (whitespace, another row, a button)
  // clears the highlight. A site-name click is handled above (moves selection),
  // and clicking within the already-selected row keeps it.
  document.addEventListener('click', (ev)=>{
    if (ev.target.closest('td.site')) return;       // row-select handles this
    if (ev.target.closest('tr.row-sel')) return;    // click inside the selected row → keep it
    if (ev.target.closest('.modal')) return;        // clicks inside a dialog (e.g. the upload modal) don't clear it
    document.querySelectorAll('tr.row-sel').forEach(r=>r.classList.remove('row-sel'));
    selectedCode = null;
  });

  // Drag a file onto any store row → upload against that site.
  tb.addEventListener('dragover', (ev)=>{ const tr=ev.target.closest('tr[data-code]'); if(tr && ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')){ ev.preventDefault(); tr.classList.add('drop-hot'); } });
  tb.addEventListener('dragleave', (ev)=>{ const tr=ev.target.closest('tr[data-code]'); if(tr && !tr.contains(ev.relatedTarget)) tr.classList.remove('drop-hot'); });
  tb.addEventListener('drop', (ev)=>{ const tr=ev.target.closest('tr[data-code]'); if(!tr) return; ev.preventDefault(); tr.classList.remove('drop-hot'); const f=ev.dataTransfer.files && ev.dataTransfer.files[0]; if(f) openUploadModal(tr.dataset.code, f); });

  // initial load (portal is the single source now) — settings first so the
  // status colours are right on the first paint.
  loadSettings().then(loadFromPortal);
});

/* Hidden file input helper for the 📎 button (mobile-friendly). */
function pickAndUpload(code){
  const inp=document.createElement('input'); inp.type='file'; inp.style.display='none';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) openUploadModal(code, f); inp.remove(); };
  document.body.appendChild(inp); inp.click();
}
  </script>
</body>

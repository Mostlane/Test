<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=25"></script>
  <meta charset="UTF-8">
  <title>Mostlane • My Jobs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="auth.js"></script>
  <script src="/pwa.js?v=2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
    :root{
      --bg:#e9eef4;--card:#fff;--ink:#12233a;--muted:#5c6b82;--line:#e2e8f1;
      --panel:#0f1f38;--panel-ink:#eaf1fb;--panel-sub:#9fb2cd;
      --accent:#2f6fed;--urgent:#e0344b;--ok:#17b26a;--amber:#f79009;--purple:#7a5af8;--teal:#0fb6b0;
      --chip:#eef2f8;--radius:16px;--shadow:0 10px 30px rgba(16,32,58,.10);
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    @media (prefers-color-scheme:dark){:root{--bg:#070d17;--card:#111f34;--ink:#e9f0fb;--muted:#93a6c1;--line:#20314b;--panel:#0b1729;--chip:#17263e;}}
    *{box-sizing:border-box}
    html,body{margin:0}
    html{background:var(--bg);}
    body{background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;max-width:520px;margin:0 auto;padding:0 16px 92px;min-height:100vh}
    a{color:var(--accent)}
    .shell{padding:0}
    /* Desktop (with the sidebar): a proper desktop column, CENTRED in the space
       to the right of the sidebar (the calc cancels the 248px sidebar inset so it
       reads as centred, not pushed right), the mobile tabbar dropped, and the
       cards made faintly translucent so the embossed background shows through.
       Scoped ENTIRELY to min-width:1000px + pnav-on → mobile/PWA UNAFFECTED. */
    @media (min-width:1000px){
      html{ background:transparent !important; }   /* let the fixed emboss layer show through the column too (this page sets html bg) */
      body.pnav-on{ max-width:calc(248px + 1000px); margin:0 auto; padding-bottom:28px; background:transparent !important; }
      html.pnav-collapsed body.pnav-on{ max-width:calc(64px + 1000px); }
      body.pnav-on .tabbar{ display:none !important; }
      /* The whole page is wrapped in ONE .card — keep it see-through so it isn't a
         solid white slab; only the inner job cards are (translucent) white. */
      body.pnav-on .card{ background:transparent !important; border:0 !important; box-shadow:none !important; }
      body.pnav-on .job-card{
        background:color-mix(in srgb, var(--card) 86%, transparent) !important;
        backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
      }
    }
    header.main-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 2px 4px;background:transparent;border:0;position:static}
    .head-left{display:flex;align-items:center;gap:10px;min-width:0}
    /* Header back button — a top-left escape that the bottom tab bar (blocked by
       the purple View-As banner) can't always provide. .ml-back is hidden here,
       so this uses its own class. */
    .eng-back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;flex:none;
      font:650 14px/1 'Segoe UI',system-ui,sans-serif;padding:9px 13px;border-radius:999px;
      background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(16,32,58,.06)}
    .eng-back:active{transform:translateY(1px)}
    header h1{margin:0;font-size:25px;letter-spacing:-.02em;color:var(--ink)}
    header .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
    .btn{border-radius:12px;padding:0 14px;min-height:42px;font-size:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);font-weight:650;white-space:nowrap;font-family:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.primary:active{transform:translateY(1px)}
    .btn.danger{background:color-mix(in srgb,var(--urgent) 12%,var(--card));border-color:color-mix(in srgb,var(--urgent) 40%,var(--line));color:var(--urgent)}
    .icon-btn{width:44px;height:44px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
    .ml-back{display:none !important}
    .content{padding:0}
    .nav-row{display:flex;gap:10px;margin:12px 0 8px}
    .nav-row .btn{flex:1;min-height:44px}
    .older-btn{width:100%;min-height:44px;margin-bottom:14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--muted) 40%,var(--line));background:transparent;color:var(--muted);font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;touch-action:manipulation}
    .hint{text-align:center;font-size:11px;color:var(--muted);margin:4px 0 12px}
    .day-group{margin-top:4px}
    #dayMapSeg{display:flex;gap:6px;padding:8px 12px;background:#f9fafb;border-bottom:1px solid #e5e7eb}
    .mapseg{flex:1;background:#fff;border:1px solid #cbd5e1;border-radius:20px;padding:8px 0;font-size:13px;font-weight:600;color:#334155;cursor:pointer}
    .mapseg.on{background:#003b82;border-color:#003b82;color:#fff}
    #dayNav{display:none;align-items:center;justify-content:center;gap:14px;padding:8px 12px;background:#f9fafb;border-bottom:1px solid #e5e7eb}
    #dayNav button{width:40px;height:40px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;color:#003b82;font-size:22px;font-weight:700;line-height:1;cursor:pointer}
    #dayNav button:active{transform:translateY(1px)}
    #dayNavLabel{font-weight:700;color:#003b82;font-size:15px;min-width:170px;text-align:center}
    .day-banner{display:flex;align-items:baseline;gap:8px;padding:8px 2px;margin:16px 0 8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
    .day-banner .d-count{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
    .day-banner.today{color:var(--accent)}
    .day-banner.today::after{content:"TODAY";font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--accent);padding:2px 8px;border-radius:999px;align-self:center}
    .job-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 0 rgba(16,32,58,.03);padding:15px 16px;margin-bottom:12px;overflow:hidden}
    .job-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--strip,var(--line))}
    .job-card.strip-ok{--strip:var(--ok)}.job-card.strip-warn{--strip:var(--amber)}.job-card.strip-bad{--strip:var(--urgent)}.job-card.strip-done{--strip:#b9c2d0}.job-card.strip-none{--strip:var(--line)}
    /* Closed/complete jobs are history — clearly ghosted (greyed, view-only) so
       today's live work stands out; still readable if you go back through past days. */
    .job-card.is-done{background:color-mix(in srgb,var(--muted) 8%,var(--card));opacity:.6}
    .job-card.job-flash{animation:mlJobFlash 1s ease-in-out 0s 4;scroll-margin-top:80px}
    @keyframes mlJobFlash{0%,100%{box-shadow:0 1px 0 rgba(16,32,58,.03)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}}
    @media (prefers-reduced-motion:reduce){.job-card.job-flash{animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}}
    .job-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .job-top .grow{flex:1}
    .ref{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);padding:3px 9px;border-radius:8px;display:inline-block}
    .priority-badge{display:none}
    .job-site{font-size:18px;font-weight:750;letter-spacing:-.02em;line-height:1.22;color:var(--ink)}
    .job-addr{font-size:13px;color:var(--muted);margin-top:3px}
    .job-desc{font-size:14px;color:var(--muted);margin-top:9px}
    .job-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
    .status-pill{border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;background:var(--chip);color:var(--muted)}
    .status-open{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
    .status-overdue{background:color-mix(in srgb,var(--urgent) 13%,transparent);color:var(--urgent)}
    .urgent-pill{background:color-mix(in srgb,var(--urgent) 13%,transparent);color:var(--urgent)}
    .status-complete{background:var(--chip);color:var(--muted)}
    .em-chip{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;background:#eaf1fb;color:#003468;border:1px solid #c9dcf3;font-variant-numeric:tabular-nums}
    .em-chip.em-done{background:#e9f8ef;color:#0a7d33;border-color:#b7e3c6}
    .sla-badge{display:none !important}
    .job-actions{display:flex;gap:10px;margin-top:13px}
    .act{min-height:50px;border-radius:13px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;touch-action:manipulation}
    .act.dir{flex:0 0 auto;padding:0 16px;font-size:20px;color:var(--muted)}
    .act.open{flex:1;background:var(--accent);border-color:var(--accent);color:#fff}
    .act.open.is-done{background:var(--chip);border-color:var(--line);color:var(--muted);font-weight:650}
    .act.open:active{transform:translateY(1px)}
    .small{font-size:11px}.muted{color:var(--muted)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(6,12,22,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}
    .modal-card{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 44px rgba(0,0,0,.28);padding:18px}
    .modal-title{margin:0 0 6px;font-size:17px;color:var(--ink)}
    .modal-sub{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
    .modal-actions{display:flex;gap:8px;flex-wrap:wrap}
    .modal-actions .btn{flex:1 1 140px}
    #blockedBanner{border-radius:14px}
    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
    .tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:650;padding:6px 0}
    .tabbar a .ic{display:block;font-size:20px;line-height:1.1}.tabbar a.on{color:var(--accent)}
  </style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SLA_API = "https://mostlane-sla.jamie-def.workers.dev";

let countdownTimerId = null;
const dayJobsCache = {};   // dateStr -> jobs[] (feeds the map)

/* Google Maps directions from wherever the engineer currently is.
   Postcode/address first — sat-navs handle postcodes best. */
function dirUrl(job){
  const pc = String(job.postcode || "").replace(/\*+$/,"").trim();
  const dest = [job.address, pc].filter(Boolean).join(", ")
    || ((job.lat != null && job.lon != null && (job.lat || job.lon)) ? `${job.lat},${job.lon}` : "");
  if(!dest) return "";
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest) + "&travelmode=driving";
}

/* Postcode → map pin (postcodes.io, cached on the device). */
const GEO_KEY = "mlPostcodeGeo_v1";
let geoCache = {};
let geoMiss = {};   // failed THIS page load only — deliberately never persisted
try{
  const raw = JSON.parse(localStorage.getItem(GEO_KEY)) || {};
  // Successes only, and drop any nulls an older build left behind.
  Object.keys(raw).forEach(k => { if(Array.isArray(raw[k])) geoCache[k] = raw[k]; });
}catch{ geoCache = {}; }
const PC_RE = /\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b/i;
function jobPostcode(job){
  let pc = String(job.postcode || "").replace(/\*+$/,"").trim();
  if(!pc){
    const m = PC_RE.exec(job.address || "");   // fish it out of the address text
    if(m) pc = m[0];
  }
  return pc.toUpperCase().replace(/\s+/g," ");
}
async function geocodePostcodes(pcs){
  const todo = [...new Set(pcs.filter(pc => pc && !Array.isArray(geoCache[pc]) && !geoMiss[pc]))];
  for(let i = 0; i < todo.length; i += 100){
    const batch = todo.slice(i, i + 100);
    try{
      const res = await fetch("https://api.postcodes.io/postcodes", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ postcodes: batch })
      });
      const data = await res.json();
      (data.result || []).forEach(r => {
        // Only cache SUCCESSES. Caching a miss as null meant a postcode that
        // failed once — a bad batch, a rate-limit — never got looked up again
        // on that device, and its pin stayed missing for good.
        const q = (r.query || "").toUpperCase();
        if (r.result && isFinite(r.result.latitude)) geoCache[q] = [r.result.latitude, r.result.longitude];
        else geoMiss[q] = 1;
      });
    }catch(e){}
  }
  try{ localStorage.setItem(GEO_KEY, JSON.stringify(geoCache)); }catch{}
}
function jobCoords(job){
  const pc = jobPostcode(job);
  if(pc && Array.isArray(geoCache[pc])) return geoCache[pc];
  const lat = Number(job.lat), lon = Number(job.lon);
  if(isFinite(lat) && isFinite(lon) && (lat || lon)) return [lat, lon];
  return null;
}

let anchorDate = new Date();
let loadedDates = new Set();
let loadedRanges = new Set();
let loading = false;

const $ = id => document.getElementById(id);

function getEngineer(){
  return sessionStorage.getItem("mostlaneUser") ||
         sessionStorage.getItem("mostlaneUsername") ||
         sessionStorage.getItem("username") || "";
}

function parseDate(v){
  if(!v) return null;
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

function computeSlaCountdown(targetISO){
  if(!targetISO){
    return {text:"—", cls:"sla-badge sla-none", status:"none"};
  }
  const now = new Date();
  const target = parseDate(targetISO);
  if(!target){
    return {text:"—", cls:"sla-badge sla-none", status:"none"};
  }

  let diff = target - now;
  const overdue = diff < 0;
  if(overdue) diff = -diff;

  const secs = Math.floor(diff/1000);
  const days = Math.floor(secs/86400);
  const hours = Math.floor((secs%86400)/3600);
  const mins = Math.floor((secs%3600)/60);

  let label = overdue ? "+" : "";
  if(days>0){
    label += `${days}d ${String(hours).padStart(2,"0")}h`;
  } else {
    label += `${String(hours).padStart(2,"0")}:${String(mins).padStart(2,"0")}`;
  }

  const hoursLeft = (target - now) / 3600000;
  let cls = "sla-badge sla-green";
  let status = "ok";

  if(overdue || hoursLeft <= 0){
    cls = "sla-badge sla-red";
    status = "overdue";
  } else if(hoursLeft <= 1){
    cls = "sla-badge sla-red";
    status = "overdueSoon";
  } else if(hoursLeft <= 4){
    cls = "sla-badge sla-amber";
    status = "warn";
  }

  return {
    text: (overdue ? "Overdue " : "Due in ") + label,
    cls,
    status
  };
}

// A finished job — complete/closed/invoiced. Used to grey out + recede the card.
function isDoneStatus(status){
  const s = (status || "").toLowerCase();
  return s.includes("complete") || s.includes("closed") || s.includes("invoiced");
}
// Engineer status pill — plain status only, NO SLA overdue colouring.
function statusClass(status){
  if(isDoneStatus(status)) return "status-pill status-complete";
  return "status-pill status-open";
}
// Clean "Job name" = "{Job number} - {Site name}" ("26819 - Poole, Ringwood Road").
// The number is the ticket that prefixes the id (or leads the reference); the
// site is the clean siteName (else the ref minus its number, else site code).
function mlJobName(job){
  if(!job) return "";
  const id = String(job.id || "");
  const ref = String(job.helpdeskRef || "").trim();
  let m = id.match(/^([A-Za-z]?\d+(?:\/\d+)?)-/);
  let num = m ? m[1] : ((ref.match(/^([A-Za-z]?\d+(?:\/\d+)?)\b/) || [])[1] || "");
  const stripNum = s => String(s || "").replace(/^\s*[A-Za-z]?\d+(?:\/\d+)?\s*[-–,]\s*/, "").trim();
  let site = String(job.siteName || "").trim();
  if(!site){
    const refSite = (ref && ref.length <= 70 && /\s/.test(ref) && !/[.!?]/.test(ref)) ? stripNum(ref) : "";
    site = refSite || String(job.siteCode || "").trim();
  }
  site = stripNum(site) || site;
  if(num && site) return num + " - " + site;
  return site || num || (ref && ref.length <= 40 ? ref : "") || "";
}
// Priority "Priority 2" / "P2" / 2 → p2 class + P2 label (defaults P4).
function prioClass(p){ const m = String(p == null ? "" : p).match(/([1-4])/); return m ? "p"+m[1] : "p4"; }
function prioLabel(p){ const m = String(p == null ? "" : p).match(/([1-4])/); return m ? "P"+m[1] : "P4"; }

  if(urgent) return "strip-bad";

// EM 3-hour drain-down timer chip for the job list. Shows time remaining while
// the engineer's emergency-light discharge test runs, or "lights due" when done.
function emTimerRemain(job){
  var t = job && job.emTimer;
  if(!(t && t.startedAt)) return null;
  var end = Date.parse(t.startedAt) + ((Number(t.durationMinutes)||180) * 60000);
  return end - Date.now();
}
function fmtHM(ms){
  var s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h + ":" + String(m).padStart(2,"0");
}
function emTimerChip(job){
  var rem = emTimerRemain(job);
  if(rem === null) return "";
  var end = Date.parse(job.emTimer.startedAt) + ((Number(job.emTimer.durationMinutes)||180) * 60000);
  var done = rem <= 0;
  return `<span class="em-chip${done?" em-done":""}" data-emend="${end}">${done ? "✅ lights due" : "⏱ " + fmtHM(rem)}</span>`;
}
// Live-updates every EM chip currently in the DOM once a second (cards re-render

function tickEmChips(){
  var chips = document.querySelectorAll(".em-chip[data-emend]");

    var el = chips[i], rem = Number(el.dataset.emend) - Date.now();

}

function isoDate(d){
  // LOCAL calendar date — NOT toISOString(), which is UTC. The week is built from
  // local-midnight dates (startOfWeek), and in BST (UTC+1) toISOString() shifts
  // each of those back a day, so the week read Sun–Sat and today vanished. Format
  // the local Y-M-D directly so the week is a true Mon–Sun including today.
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function startOfWeek(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay() || 7;
  if(day !== 1) date.setDate(date.getDate() - (day - 1));
  return date;
}
function endOfWeek(d){
  const s = startOfWeek(d);
  const e = new Date(s);
  e.setDate(e.getDate() + 6);
  e.setHours(0,0,0,0);
  return e;
}
function addDays(d, n){
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function endOfToday(){
  const d = new Date();
  d.setHours(23,59,59,999);
  return d;
}
function renderDay(dateStr, jobs, mode){
  const container = $("jobsTimeline");

  const group = document.createElement("div");
  group.className = "day-group";

  const banner = document.createElement("div");
  const isToday = dateStr === isoDate(new Date());
  banner.className = "day-banner" + (isToday ? " today" : "");
  const label = new Date(dateStr).toLocaleDateString("en-GB", {
    weekday:"short", day:"2-digit", month:"short"
  });
  banner.innerHTML = `<span>${escH(label)}</span>` +
    (jobs.length ? `<span class="d-count">${jobs.length} job${jobs.length===1?"":"s"}</span>` : "");

  group.appendChild(banner);

  if(!jobs.length){
    const empty = document.createElement("div");
    empty.className = "muted small";
    empty.style.padding = "2px 4px 6px";
    empty.textContent = "No jobs";
    group.appendChild(empty);
  }

  for(const job of jobs){
    const target = job.targetAt || job.sla?.targetAt;
    const slaInfo = computeSlaCountdown(target);

    const card = document.createElement("div");
    card.className = "job-card " + stripClass(job.status, isUrgentJob(job)) + (isDoneStatus(job.status) ? " is-done" : "");
    card.dataset.jobId = job.id;
    card.innerHTML = jobCardInner(job, slaInfo, target);
    group.appendChild(card);
  }

  if(mode === "prepend"){

  }else{
    container.appendChild(group);
  }
}

async function loadWeek(direction){
  if(loading) return;
  loading = true;

  try{
const base = new Date(anchorDate);
base.setDate(base.getDate() + (direction * 7));

const maxAllowedWeek = endOfWeek(addDays(anchorDate, 7));

if (direction > 0 && startOfWeek(base) > maxAllowedWeek) {
  $("statusBar").textContent = "Cannot load further future weeks.";
  return;
}

/* ===== END GUARD ===== */
    const from = startOfWeek(base);
    const to = endOfWeek(base);

    const rangeKey = `${isoDate(from)}:${isoDate(to)}`;
    if(loadedRanges.has(rangeKey)){
      $("statusBar").textContent = "Week already loaded.";
      return;
    }

    $("statusBar").textContent = "Loading week…";

    const days = [];
    for(let i=0;i<7;i++) days.push(addDays(from, i));

    if(direction < 0){
      days.reverse();
      for(const d of days) await loadDay(d, "append");
    }else{
      for(const d of days) await loadDay(d, "prepend");
    }

    loadedRanges.add(rangeKey);
    anchorDate = base;
    $("statusBar").textContent = "Ready";
  }finally{
    loading = false;
  }
}

async function loadLastNDays(n){
  if(loading) return;
  loading = true;

  try{
    $("statusBar").textContent = `Loading last ${n} days…`;
    const today = new Date();
    today.setHours(0,0,0,0);

    for(let i=0;i<n;i++){
      const d = addDays(today, -i);
      await loadDay(d, "append");
    }

    $("statusBar").textContent = "Ready";
  }finally{
    loading = false;
  }
}

let dayCursor = null;       // the single day shown in "Day" mode (scrollable)
// Modes: day (one day, scroll ‹ ›) | 7 | 30 | year | all (every job I hold,
// including ones assigned to me with no date yet — those have no date to fall
// inside any window, so "All" is the only view that can ever show them).
function mapRange(mode){
  const now = new Date(); now.setHours(0,0,0,0);
  // Windows span BOTH directions around today. They were briefly forward-only,
  // which emptied the map: work here is booked a day or two ahead, so "next 7
  // days" held 4 jobs where "last 7 days" held 50 — engineers reported their
  // jobs had vanished. Either side of today keeps upcoming work for planning
  // AND the recent jobs they actually look for.
  if(mode === "7")    return [addDays(now, -7), addDays(now, 7)];
  if(mode === "30")   return [addDays(now, -30), addDays(now, 30)];
  if(mode === "year") return [new Date(now.getFullYear(), 0, 1), new Date(now.getFullYear(), 11, 31)];
  if(mode === "all")  return [new Date(1970, 0, 1), new Date(2999, 11, 31)];
  const c = dayCursor || now;
  return [c, c];           // day
}
function mapLabel(mode){
  if(mode === "all")  return "in total";
  if(mode === "7")    return "within 7 days of today";
  if(mode === "30")   return "within 30 days of today";
  if(mode === "year") return "this year";
  const c = dayCursor || new Date();
  return "on " + c.toLocaleDateString("en-GB", { weekday:"short", day:"2-digit", month:"short" });
}

async function openDayMap(){
  $("dayMapOverlay").style.display = "flex";
  if(typeof L === "undefined"){
    $("dayMapNote").textContent = "⚠️ Map couldn't load — check your connection and try again.";
    return;
  }
  if(!dayMap){
    dayMap = L.map("dayMap");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:20, subdomains:"abcd", attribution:"© OpenStreetMap contributors" }).addTo(dayMap);
    dayMapLayer = L.layerGroup().addTo(dayMap);
  }
  // Fetch ALL my jobs once (no date filter), then pin whichever range is selected.
  if(!allMineJobs){
    $("dayMapNote").textContent = "Loading your jobs…";
    try{
      const res = await fetch(`${SLA_API}/jobs/for-engineer?engineer=${encodeURIComponent(getEngineer())}`, { cache:"no-store" });
      allMineJobs = await res.json();
      if(!Array.isArray(allMineJobs)) allMineJobs = [];
    }catch{ allMineJobs = []; }
  }
  populateMapStatuses();
  dayCursor = new Date(); dayCursor.setHours(0,0,0,0);   // Day starts on today
  mapMode = "day";          // always default to the day's jobs on open
  renderMapForRange(mapMode);
}

async function renderMapForRange(mode){
  mapMode = mode;
  [].forEach.call(document.querySelectorAll("#dayMapSeg .mapseg"), b => b.classList.toggle("on", b.dataset.r === mode));
  // Day mode gets the ‹ date › scroller; the ranges don't.
  const nav = $("dayNav"); if(nav) nav.style.display = (mode === "day") ? "flex" : "none";
  if(mode === "day" && $("dayNavLabel")) $("dayNavLabel").textContent = (dayCursor || new Date()).toLocaleDateString("en-GB", { weekday:"short", day:"2-digit", month:"short", year:"numeric" });
  if(!dayMap){ $("dayMapNote").textContent = "⚠️ Map couldn't load — check your connection and try again."; return; }
  const [from, to] = mapRange(mode);
  const fromISO = isoDate(from), toISO = isoDate(to);
  let undatedHidden = 0;
  const list = (allMineJobs || []).filter(j => {
    if(mapStatusFilter !== "all" && (j.status || "") !== mapStatusFilter) return false;
    // Assigned but not booked in yet: there is no date to compare, so a job like
    // this can never fall inside a window — it only ever appears under "All".
    if(!j.scheduledAt){
      if(mode === "all") return true;
      undatedHidden++;
      return false;
    }
    const d = isoDate(new Date(j.scheduledAt));   // local date, matches the range bounds
    return d >= fromISO && d <= toISO;
  });
  const label = mapLabel(mode) + (mapStatusFilter !== "all" ? ` · ${mapStatusFilter}` : "");
  $("dayMapNote").textContent = "Placing jobs by postcode…";
  await geocodePostcodes(list.map(jobPostcode));
  setTimeout(() => {
    dayMap.invalidateSize();
    dayMapLayer.clearLayers();
    const pts = [];
    let noLoc = 0;
    list.forEach(job => {
      const pt = jobCoords(job);
      if(!pt){ noLoc++; return; }
      const [lat, lon] = pt;
      const colour = DAY_STATUS_COLOUR[job.status] || "#2563eb";
      const undated = !job.scheduledAt;
      const m = L.circleMarker([lat, lon], Object.assign(
        { radius:9, color:"#fff", weight:2, fillColor:colour, fillOpacity:0.95 },
        undated ? { color:"#111827", weight:2, dashArray:"3 3", fillOpacity:0.55 } : {}));
      m.bindPopup(`
        <div style="font-size:13px;min-width:180px;">
          <b style="color:#003b82;">${escH(job.helpdeskRef || job.id)}</b>
          <span style="display:inline-block;border-radius:999px;padding:1px 8px;color:#fff;font-size:11px;font-weight:600;background:${colour};margin-left:4px;">${escH(job.status||"")}</span><br>
          ${(window.MLUI&&MLUI.richStrip)?MLUI.richStrip(job.description||""):escH(job.description||"")}<br>
          <span style="color:#6b7280;">${escH(job.siteName||job.address||"")}</span><br>
          ${job.scheduledAt ? "🗓 " + new Date(job.scheduledAt).toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short"}) + " " + new Date(job.scheduledAt).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) + "<br>" : '<span style="color:#b45309;font-weight:600;">📌 Not booked in yet</span><br>'}
          <a href="engineer-job.html?jobId=${encodeURIComponent(job.id)}&back=engineer-jobs.html" style="color:#1d4ed8;font-weight:600;">Open job →</a>
          ${dirUrl(job) ? ` · <a href="${dirUrl(job)}" target="_blank" rel="noopener" style="color:#1d4ed8;">Directions</a>` : ""}
        </div>`);
      m.addTo(dayMapLayer);
      pts.push([lat, lon]);
    });
    // Say out loud what ISN'T pinned, so a missing job is never a mystery.
    const missing = (noLoc ? ` · ${noLoc} with no usable postcode` : "")
      + (undatedHidden ? ` · ${undatedHidden} not booked in (tap All)` : "");
    if(pts.length){
      dayMap.fitBounds(pts, { padding:[36,36], maxZoom:13 });
      $("dayMapNote").textContent = `${pts.length} job(s) ${label}` + missing + ". Tap a pin to open the job.";
    }else{
      dayMap.setView([51.27,-0.75], 9);
      $("dayMapNote").textContent = (list.length ? `Jobs ${label} have no usable postcodes.` : `No jobs ${label}.`) + missing;
    }
  }, 60);
}

/* ===== Assigned but not yet booked in (no date/time set) ===== */
/* The day timeline can only show jobs that HAVE a date — without this, a job
   assigned with no schedule time was invisible to its engineer. */
async function loadUnscheduled(){
  try{
    const res = await fetch(`${SLA_API}/jobs/for-engineer?engineer=${encodeURIComponent(getEngineer())}`, { cache:"no-store" });
    const list = await res.json();
    const open = (Array.isArray(list) ? list : []).filter(j =>
      !j.scheduledAt && !["Complete","Closed Jobs","Invoiced"].includes(j.status || ""));
    const box = $("unschedBox");
    if(!open.length){ box.style.display = "none"; box.innerHTML = ""; return; }
    box.style.display = "block";
    // Collapsible: these have no date so they'd otherwise clutter the day view —
    // start collapsed, tap the banner to reveal. State remembered per device.
    const startOpen = localStorage.getItem("mlUnschedOpen") === "1";
    box.innerHTML = `<div class="day-banner unsched-toggle" id="unschedToggle" role="button" tabindex="0" style="cursor:pointer;">
        <span class="unsched-caret" style="display:inline-block;transition:transform .15s;transform:rotate(${startOpen?90:0}deg);">▸</span>
        <span>📌 Assigned — not booked in</span>
        <span class="d-count">${open.length} job${open.length===1?"":"s"}</span></div>
      <div id="unschedItems" style="display:${startOpen?"block":"none"};"></div>`;
    const items = $("unschedItems");
    for(const job of open){
      const target = job.targetAt || job.sla?.targetAt;
      const slaInfo = computeSlaCountdown(target);
      const card = document.createElement("div");
      card.className = "job-card " + stripClass(job.status, isUrgentJob(job)) + (isDoneStatus(job.status) ? " is-done" : "");
      card.dataset.jobId = job.id;
      card.innerHTML = jobCardInner(job, slaInfo, target);
      items.appendChild(card);
    }
    const tgl = $("unschedToggle"), caret = tgl.querySelector(".unsched-caret");
    const toggle = () => {
      const nowOpen = items.style.display === "none";
      items.style.display = nowOpen ? "block" : "none";
      caret.style.transform = "rotate(" + (nowOpen ? 90 : 0) + "deg)";
      try{ localStorage.setItem("mlUnschedOpen", nowOpen ? "1" : "0"); }catch(e){}
    };
    tgl.addEventListener("click", toggle);
    tgl.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    startCountdownLoop();
  }catch(e){}
}

/* ===== Parked-without-info banner ===== */
function jobIsBlocking(j){
  if(j.status === "On Hold") return !(j.hold && j.hold.reason && j.hold.needs);
  if(j.status === "Quote")   return !(j.quote && j.quote.description && j.quote.reason && j.quote.materials);
  return false;
}
async function checkBlocked(){
  try{
    const res = await fetch(`${SLA_API}/jobs/for-engineer?engineer=${encodeURIComponent(getEngineer())}`, { cache:"no-store" });
    const list = await res.json();
    const blocking = (Array.isArray(list) ? list : []).find(jobIsBlocking);
    const banner = $("blockedBanner");
    if(blocking){
      const ref = escH(blocking.helpdeskRef || blocking.id);
      banner.innerHTML = `⚠️ <b>Job ${ref}</b> is <b>${escH(blocking.status)}</b> but is missing the required details. ` +
        `You can't start another job until it's completed. ` +
        `<a href="engineer-job.html?jobId=${encodeURIComponent(blocking.id)}&back=engineer-jobs.html" style="color:#b91c1c;font-weight:700;">Complete it now →</a>`;
      banner.style.display = "block";
    }else{
      banner.style.display = "none";
    }
  }catch{}
}

// A push notification links here as ?job=<id>. Once that job's card has been
// rendered (day loads + the unscheduled box are async), scroll it into view and
// pulse it so it's easy to spot. Polls briefly because the cards stream in.
function focusJobFromUrl(){
  let jid = null;
  try { jid = new URLSearchParams(location.search).get("job"); } catch (e) {}
  if(!jid) return;
  let tries = 0;
  const attempt = () => {
    const card = Array.from(document.querySelectorAll(".job-card"))
      .find(c => c.dataset.jobId === jid);
    if(card){
      card.scrollIntoView({ behavior:"smooth", block:"center" });
      card.classList.remove("job-flash");   // restart the animation if re-run
      void card.offsetWidth;
      card.classList.add("job-flash");
      setTimeout(() => card.classList.remove("job-flash"), 4500);
      return;
    }
    if(tries++ < 30) setTimeout(attempt, 300);   // ~9s of retries as jobs stream in
  };
  attempt();
}

function init(){
  const engineer = getEngineer();
  $("userLabel").textContent = engineer ? `Logged in as ${engineer}` : "Engineer";

  $("dayMapBtn").addEventListener("click", openDayMap);
  $("dayMapClose").addEventListener("click", () => { $("dayMapOverlay").style.display = "none"; });
  [].forEach.call(document.querySelectorAll("#dayMapSeg .mapseg"), b =>
    b.addEventListener("click", () => renderMapForRange(b.dataset.r)));
  if($("dayMapStatus")) $("dayMapStatus").addEventListener("change", (e) => {
    mapStatusFilter = e.target.value || "all";
    renderMapForRange(mapMode);
  });
  // ‹ › scroll through individual days (Day mode only).
  const stepDay = (n) => { dayCursor = addDays(dayCursor || new Date(), n); dayCursor.setHours(0,0,0,0); renderMapForRange("day"); };
  if($("dayPrev")) $("dayPrev").addEventListener("click", () => stepDay(-1));
  if($("dayNext")) $("dayNext").addEventListener("click", () => stepDay(1));
  // Admin-only shortcuts to the SLA management areas — hidden for engineers
  // (SLA-only). The target pages also gate, so this is just clean navigation.
  if(hasSLAAdmin()){
    $("adminDashBtn").style.display = "inline-flex";
    $("adminSchedBtn").style.display = "inline-flex";
  }
  checkBlocked();
  loadUnscheduled();

  buildVcItems();
  $("vcSubmit").addEventListener("click", submitVehicleCheck);

  // Story Mode: the guided day lives on my-day.html — this page is job history.
  if(isStoryMode()){
    $("dayBar").style.display = "block";
    $("dayBar").innerHTML =
      `<a href="my-day.html" style="display:block;text-decoration:none;padding:14px;border-radius:12px;background:linear-gradient(90deg,#003b82,#1e66ff);color:#fff;text-align:center;font-weight:700;">
         ⚡ Open My Day — start &amp; work your day here →
       </a>`;
  } else {
    // Every other engineer gets the live day bar (start / end my day) here too —
    // this page is the working jobs list, so the End-day control lives at the top.
    loadShift().then(() => { renderDayBar(); applyDayGate(); }).catch(()=>{});
  }

  const prevBtn = $("prevWeekBtn");
  const nextBtn = $("nextWeekBtn");

  // Tap = week navigation (guaranteed to fire)
  prevBtn.addEventListener("click", () => loadWeek(-1));
  nextBtn.addEventListener("click", () => loadWeek(+1));

  // Visible "older jobs" button opens the range modal (30/60/90).
  const olderBtn = $("olderBtn");
  if(olderBtn) olderBtn.addEventListener("click", openModal);
  // Hold (3s) on the week buttons still opens it too (kept for muscle memory).
  addLongPress(prevBtn, openModal);
  addLongPress(nextBtn, openModal);

  // Modal actions
  $("load30Btn").addEventListener("click", async () => { closeModal(); await loadLastNDays(30); });
  $("load60Btn").addEventListener("click", async () => { closeModal(); await loadLastNDays(60); });
  $("load90Btn").addEventListener("click", async () => { closeModal(); await loadLastNDays(90); });
  $("closeModalBtn").addEventListener("click", closeModal);

  $("rangeModal").addEventListener("click", (e) => {
    if(e.target && e.target.id === "rangeModal") closeModal();
  });

  // Initial load: current week (newest first so today is near the top)
  (async () => {
    $("statusBar").textContent = "Loading this week…";
    anchorDate = new Date();

    const from = startOfWeek(anchorDate);
    const to = endOfWeek(anchorDate);
    const rangeKey = `${isoDate(from)}:${isoDate(to)}`;

    const days = [];
    for(let i=0;i<7;i++) days.push(addDays(from, i));
    days.reverse();

    loading = true;
    try{
      for(const d of days) await loadDay(d, "append");
      loadedRanges.add(rangeKey);
      $("statusBar").textContent = "Ready";
      // Open the list ON today — previous days scroll DOWN (history), upcoming
      // days scroll up. Closed past jobs are greyed + read-only. The day bar and
      // the "not booked in" box render async ABOVE the list, so re-run the scroll a
      // few times until the layout settles, and stop as soon as today is at the top.
      (function landOnToday(){
        var n = 0;
        function go(){
          var tb = document.querySelector(".day-banner.today");
          if(tb && tb.scrollIntoView) tb.scrollIntoView({ block:"start" });
          if(n++ < 6) setTimeout(go, n < 3 ? 150 : 350);   // re-correct as async top content renders
        }
        requestAnimationFrame(go);
      })();
    }finally{
      loading = false;
    }
  })();

  // If we arrived from a "new job" push (?job=…), find that card and pulse it.
  focusJobFromUrl();
}

window.addEventListener("DOMContentLoaded", init);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Where's Everyone</title>
  <script src="/portal-config.js?v=27"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <style>
    :root { --brand:#003468; --ok:#0a7d33; --bad:#b00020; --line:#e2e8f0; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f4;color:#1f2937;}
    header.page{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;}
    header.page h1{font-size:18px;margin:0;flex:1;}
    .wrap{max-width:920px;margin:14px auto 90px;padding:0 12px;}
    .muted{color:#6b7a90;font-size:13px;}
    .updated{font-size:12px;color:#e6edf6;}
    .sec-h{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:15px;font-weight:800;color:#334;}
    .sec-h .n{background:#dfe6ee;color:#334;border-radius:999px;font-size:12.5px;padding:1px 9px;font-weight:700;}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;}
    @media(min-width:620px){ .grid{grid-template-columns:1fr 1fr;} }
    .ecard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(6,24,54,.06);padding:12px 14px;border-left:5px solid #cbd5e1;}
    .ecard.on_job{border-left-color:var(--ok);}
    .ecard.should_be{border-left-color:#1c68d6;}
    .ecard.idle{border-left-color:#cbd5e1;}
    .ecard.off{border-left-color:#b08900;}
    .ecard .nm{font-size:16px;font-weight:800;color:var(--brand);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .ecard .nm:hover{text-decoration:underline;}
    .ecard .jl{margin-top:7px;font-size:14px;}
    .ecard .jl .site{font-weight:600;}
    .ecard .sub{font-size:12.5px;color:#6b7a90;margin-top:2px;}
    .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;}
    .lead{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#8595a8;}
    /* Modal */
    .modal{display:none;position:fixed;inset:0;z-index:6000;background:rgba(8,20,40,.55);padding:16px;overflow:auto;}
    .sheet{max-width:520px;margin:32px auto;background:#fff;border-radius:16px;padding:16px;}
    .sheet h2{margin:0;font-size:18px;flex:1;}
    .sheet .row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
    .drow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #eef2f6;cursor:pointer;}
    .drow:first-child{border-top:none;}
    .drow .tm{font-weight:800;font-size:13.5px;color:var(--brand);width:52px;flex:none;text-align:right;}
    .drow .m{flex:1;min-width:0;}
    .drow .m .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .drow .m .s{font-size:12px;color:#6b7a90;}
    .btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
    .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="/sla-scheduler.html" style="text-decoration:none;">‹ Back</a>
    <h1>📍 Where's everyone</h1>
    <span class="updated" id="updated"></span>
    <button class="btn ghost" id="refresh" style="background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);">↻</button>
  </header>

  <div class="wrap" id="wrap"><p class="muted" style="padding:18px 4px;">Loading…</p></div>

  <!-- Planned-day modal -->
  <div class="modal" id="dayModal">
    <div class="sheet">
      <div class="row"><h2 id="dmName">Engineer</h2><button class="btn ghost" id="dmClose">Close</button></div>
      <p class="muted" id="dmSub" style="margin:0 0 8px;"></p>
      <div id="dmBody"></div>
    </div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    const authFetch = (p, o={}) => { o.headers = Object.assign({ "Authorization":"Bearer "+localStorage.getItem("mostlaneToken") }, o.headers||{}); return fetch((p.startsWith("http")?p:API+p), o); };
    const hhmm = t => { try { const d=new Date(t); return isNaN(d)?"":d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}); } catch { return ""; } };

    // Status → colour (matches the board's palette).
    const SC = { "In Progress":"#0a7d33", "Travelling":"#1c68d6", "Scheduled":"#5a6b80", "Pending":"#8595a8", "On Hold":"#b08900", "Quote":"#7a5b00", "Order":"#7a5b00", "Complete":"#0a7d33" };
    const scol = s => SC[s] || "#5a6b80";
    const pill = s => '<span class="pill" style="background:'+scol(s)+'">'+esc(s||"—")+'</span>';

    let DATA = null;

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r=>r.json());
        if (!me.ok || !(me.user.FullAccess==="Yes"||me.user.SLAAdmin==="Yes"||me.user.SLA==="Yes")) { alert("This page needs SLA, SLA Admin or Full Access."); location.href="/main.html"; return; }
      } catch { location.href="/main.html"; return; }
      g("refresh").onclick = load;
      g("dmClose").onclick = () => { g("dayModal").style.display="none"; };
      g("dayModal").onclick = e => { if (e.target === g("dayModal")) g("dayModal").style.display="none"; };
      load();
      setInterval(load, 45000);   // live refresh
    })();

    async function load() {
      let d = null;
      try { d = await authFetch("/sla/live").then(r=>r.json()); } catch {}
      if (!d || !d.ok) { g("wrap").innerHTML = '<p class="muted" style="padding:18px 4px;color:#b00020">Couldn\'t load the live board.</p>'; return; }
      DATA = d;
      g("updated").textContent = "Updated " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      render();
    }

    function jobLine(j, lead) {
      if (!j) return "";
      const t = j.scheduledAt ? hhmm(j.scheduledAt) : "";
      const tag = j.isProject ? ' <span class="muted">· 📁 project</span>' : (j.isFallback ? ' <span class="muted">· 🛟 standby</span>' : "");
      let sub = "";
      if (j.status === "In Progress" || j.status === "Travelling") sub = (j.since ? "since " + hhmm(j.since) : "") + (t ? " · booked " + t : "");
      else if (t) sub = "booked " + t;
      return '<div class="jl">'+(lead?'<div class="lead">'+lead+'</div>':'')
        + '<div><span class="site">'+esc(j.site||j.siteCode||"—")+'</span>'+tag+' &nbsp;'+pill(j.status)+'</div>'
        + (sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>';
    }

    function ecard(e) {
      let body = "";
      if (e.category === "on_job") body = jobLine(e.current, "On job now");
      else if (e.category === "should_be") body = jobLine(e.next, "Should be on");
      else if (e.category === "off") body = '<div class="jl muted">🌴 On leave today</div>';
      else body = '<div class="jl muted">No job scheduled today</div>';
      const more = e.count > 1 ? '<div class="sub" style="margin-top:5px">'+e.count+' jobs today · tap the name for the full day</div>' : "";
      return '<div class="ecard '+e.category+'">'
        + '<div class="nm" data-u="'+esc(e.username)+'">'+esc(e.name)+' <span style="font-size:12px;color:#8595a8">›</span></div>'
        + body + more + '</div>';
    }

    function render() {
      const engs = DATA.engineers || [];
      const groups = { on_job: [], should_be: [], idle: [], off: [] };
      engs.forEach(e => (groups[e.category] || groups.idle).push(e));
      let h = "";
      h += section("🔧 On Job", "Travelling or in progress right now", groups.on_job);
      h += section("📋 Should Be", "Their next / assigned job for today", groups.should_be);
      const rest = groups.idle.concat(groups.off);
      if (rest.length) h += section("🕔 No job / off", "Nothing on right now", rest);
      if (!engs.length) h = '<p class="muted" style="padding:18px 4px;">No field engineers found.</p>';
      g("wrap").innerHTML = h;
      [].forEach.call(document.querySelectorAll(".nm"), el => el.onclick = () => openDay(el.dataset.u));
    }

    function section(title, sub, list) {
      if (!list.length) return "";
      let h = '<div class="sec-h">'+title+' <span class="n">'+list.length+'</span></div>';
      h += '<div class="grid">' + list.map(ecard).join("") + '</div>';
      return h;
    }

    function openDay(username) {
      const e = (DATA.engineers || []).find(x => x.username === username);
      if (!e) return;
      g("dmName").textContent = e.name;
      const dt = DATA.date ? new Date(DATA.date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}) : "Today";
      g("dmSub").textContent = e.onLeave ? (dt + " · 🌴 on leave") : (dt + " · " + (e.planned.length||0) + " job" + ((e.planned.length===1)?"":"s"));
      let h = "";
      if (!e.planned.length) h = '<p class="muted" style="padding:8px 4px;">'+(e.onLeave?"On leave today.":"No jobs scheduled today.")+'</p>';
      else e.planned.forEach(j => {
        const tag = j.isProject ? ' · 📁 project' : (j.isFallback ? ' · 🛟 standby' : '');
        let extra = "";
        if (j.status==="In Progress"||j.status==="Travelling") extra = j.since ? "since "+hhmm(j.since) : "";
        h += '<div class="drow" data-job="'+esc(j.jobId)+'">'
          + '<div class="tm">'+(j.scheduledAt?hhmm(j.scheduledAt):"—")+'</div>'
          + '<div class="m"><div class="t">'+esc(j.site||j.siteCode||"—")+'</div>'
          + '<div class="s">'+(j.ref?esc(j.ref)+tag:esc(tag))+(extra?' · '+esc(extra):'')+'</div></div>'
          + pill(j.status)+'</div>';
      });
      g("dmBody").innerHTML = h;
      [].forEach.call(g("dmBody").querySelectorAll(".drow"), el => el.onclick = () => { location.href = "job-view.html?jobId=" + encodeURIComponent(el.dataset.job); });
      g("dayModal").style.display = "block";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Costing</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
  :root{ --bg:#f4f6f9; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b; --brand:#2563eb; --amber:#b45309; --amberbg:#fef3c7; --red:#dc2626; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;}
  header.page{background:#0f172a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header.page h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:160px;}
  a.ml-back{color:#fff;text-decoration:none;font-size:15px;}
  .wrap{max-width:1040px;margin:0 auto;padding:16px;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;font:600 13px "Segoe UI",system-ui;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;}
  .btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  header.page .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}
  .tabs{display:flex;gap:8px;margin:0 0 12px;}
  .range{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .siteRow{cursor:pointer;}
  .siteHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .siteHead .nm{font-weight:700;font-size:15px;flex:1;min-width:0;}
  .siteHead .cost{font-weight:700;}
  .bar{height:8px;border-radius:6px;background:#eef2f7;overflow:hidden;display:flex;margin-top:8px;}
  .bar i{display:block;height:100%;}
  .bar .tr{background:#93c5fd;} .bar .on{background:#2563eb;} .bar .vi{background:#a5b4fc;}
  .sub{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:none;font-size:13px;}
  .sub .li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--muted);}
  .sub .li b{color:var(--ink);font-weight:650;}
  .chip{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;}
  .chip.arch{background:var(--amberbg);color:var(--amber);}
  .chip.unm{background:#fee2e2;color:var(--red);}
  .chip.t{background:#e0e7ff;color:#3730a3;font-weight:600;}
  .msg{font-size:13px;color:var(--muted);}
  .ex{border-left:4px solid var(--line);padding:8px 12px;margin:8px 0;background:var(--card);border-radius:0 10px 10px 0;font-size:13px;}
  .ex b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
  .ex.archived-site,.ex.unallocated{border-color:#f59e0b;} .ex.archived-site b,.ex.unallocated b{color:var(--amber);}
  .ex.site-mismatch,.ex.claimed-over-captured{border-color:var(--red);} .ex.site-mismatch b,.ex.claimed-over-captured b{color:var(--red);}
  .ex.auto-closed,.ex.unmatched-site,.ex.captured-over-claimed{border-color:#64748b;} .ex.auto-closed b,.ex.unmatched-site b,.ex.captured-over-claimed b{color:var(--muted);}
  .ex .meta{color:var(--muted);font-size:12px;margin-top:2px;}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" data-role="home" href="sites-register.html">‹ Back</a>
    <h1>📊 Job Costing</h1>
    <a class="btn" href="sites-register.html">🗂️ Site register</a>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="btn on" id="tabCost">Costing</button>
      <button class="btn" id="tabEx">Exceptions <span id="exCount"></span></button>
    </div>
    <div class="range" id="range">
      <button class="btn" data-d="7">7 days</button>
      <button class="btn on" data-d="28">28 days</button>
      <button class="btn" data-d="91">3 months</button>
    </div>

    <div id="costView"><div class="msg">Loading…</div></div>
    <div id="exView" style="display:none"><div class="msg">Loading…</div></div>
  </div>

<script>
(function(){
  "use strict";
  var API=(window.MOSTLANE_API||"").replace(/\/$/,"");
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function aFetch(p){var h=new Headers();var t=localStorage.getItem("mostlaneToken");if(t)h.set("Authorization","Bearer "+t);return fetch(API+p,{headers:h,cache:"no-store"});}
  function hm(m){return Math.floor(m/60)+"h "+(m%60)+"m";}
  function money(n){return "£"+(Math.round(n*100)/100).toFixed(2);}

  var days=28;
  function rangeQS(){
    var to=new Date(), from=new Date(Date.now()-(days-1)*86400000);
    var f=function(d){return d.toISOString().slice(0,10);};
    return "from="+f(from)+"&to="+f(to);
  }

  async function loadCost(){
    $("costView").innerHTML='<div class="msg">Loading…</div>';
    try{
      var d=await (await aFetch("/costing/summary?"+rangeQS())).json();
      if(!d.ok) throw new Error(d.error||"costing error");
      if(!d.sites.length){ $("costView").innerHTML='<div class="msg">No captured time in this period yet. Time appears here as engineers travel / work jobs, scan into sites, and fill timesheets.</div>'; return; }
      $("costView").innerHTML=d.sites.map(function(s,i){
        var tot=s.totalMins||1;
        var chips=(s.archived?'<span class="chip arch">ARCHIVED</span>':'')+(s.unmatched?'<span class="chip unm">NOT IN REGISTER</span>':'');
        var engs=s.engineers.map(function(e){return '<div class="li"><span>👷 '+esc(e.user)+'</span><span><b>'+hm(e.mins)+'</b>'+(e.cost!=null?' · '+money(e.cost):'')+'</span></div>';}).join("");
        var jobs=(s.jobs||[]).slice(0,10).map(function(j){return '<div class="li"><span>🔧 '+esc(j.ref)+'</span><b>'+hm(j.mins)+'</b></div>';}).join("");
        return '<div class="card siteRow" data-i="'+i+'">'+
          '<div class="siteHead"><span class="nm">'+esc(s.site)+'</span>'+chips+
            '<span class="chip t">'+hm(s.totalMins)+'</span>'+
            '<span class="cost">'+(s.cost?money(s.cost):'')+(s.costPartial?' <small style="color:var(--muted);font-weight:400">(partial — some rates missing/day-rate)</small>':'')+'</span></div>'+
          '<div class="bar">'+
            '<i class="tr" style="width:'+(s.travelMins/tot*100)+'%" title="Travel '+hm(s.travelMins)+'"></i>'+
            '<i class="on" style="width:'+(s.onsiteMins/tot*100)+'%" title="On site '+hm(s.onsiteMins)+'"></i>'+
            '<i class="vi" style="width:'+(s.visitMins/tot*100)+'%" title="Scanned visits '+hm(s.visitMins)+'"></i></div>'+
          '<div class="sub"><div class="li"><span>🚐 Travel</span><b>'+hm(s.travelMins)+'</b></div>'+
            '<div class="li"><span>🛠 On site</span><b>'+hm(s.onsiteMins)+'</b></div>'+
            (s.visitMins?'<div class="li"><span>📲 Scanned visits</span><b>'+hm(s.visitMins)+'</b></div>':'')+
            engs+jobs+'</div></div>';
      }).join("");
    }catch(e){ $("costView").innerHTML='<div class="msg">Couldn\'t load costing — '+esc(e.message)+'</div>'; }
  }

  async function loadEx(){
    $("exView").innerHTML='<div class="msg">Loading…</div>';
    try{
      var d=await (await aFetch("/exceptions?"+rangeQS())).json();
      if(!d.ok) throw new Error(d.error||"exceptions error");
      $("exCount").textContent=d.exceptions.length?("("+d.exceptions.length+")"):"";
      if(!d.exceptions.length){ $("exView").innerHTML='<div class="msg">Nothing needs your eye — everything tallied itself. ✅</div>'; return; }
      var LBL={"auto-closed":"Never finished — auto-closed","site-mismatch":"Scan / job site mismatch",
        "archived-site":"Activity on an archived site","unmatched-site":"Site not in register",
        "unallocated":"Unallocated working time","claimed-over-captured":"Claimed more than captured",
        "captured-over-claimed":"Captured more than claimed"};
      $("exView").innerHTML=d.exceptions.map(function(x){
        return '<div class="ex '+esc(x.type)+'"><b>'+esc(LBL[x.type]||x.type)+'</b>'+esc(x.detail)+
          '<div class="meta">'+esc(x.user)+' · '+esc(x.date)+'</div></div>';
      }).join("");
    }catch(e){ $("exView").innerHTML='<div class="msg">Couldn\'t load exceptions — '+esc(e.message)+'</div>'; }
  }

  document.addEventListener("click",function(e){
    var row=e.target.closest(".siteRow");
    if(row){ var s=row.querySelector(".sub"); s.style.display=s.style.display==="block"?"none":"block"; }
  });
  $("tabCost").onclick=function(){ this.classList.add("on");$("tabEx").classList.remove("on");$("costView").style.display="";$("exView").style.display="none"; };
  $("tabEx").onclick=function(){ this.classList.add("on");$("tabCost").classList.remove("on");$("exView").style.display="";$("costView").style.display="none"; };
  $("range").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    [].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});
    days=+b.dataset.d; loadCost(); loadEx();
  });
  loadCost(); loadEx();
})();
</script>
</body>
</html>

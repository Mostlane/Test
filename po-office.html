html, body { width: 100%; max-width: 100%; margin: 0; padding: 0; }
body {

}

.wrap { max-width: 1100px; margin: 0 auto; padding: 16px 14px 60px; }
.wrap-narrow { max-width: 560px; margin: 0 auto; padding: 16px 14px 60px; }
h1 { font-size: 22px; font-weight: 600; color: #003366; margin: 0 0 16px; }

.card {

textarea { min-height: 90px; resize: vertical; }
.field { margin-bottom: 14px; }
button, .btn {

  background: linear-gradient(180deg, #1A4F8F 0%, #003468 100%);

button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(0,30,80,0.28), inset 0 1px 2px rgba(255,255,255,0.20); }
button:active, .btn:active { transform: translateY(0); }
button.ghost, .btn.ghost {

}

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: #5a6677; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 8px; border-bottom: 2px solid #003366; }
td { padding: 12px 8px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
tr:hover td { background: #f8fafd; }
.badge { display: inline-block; padding: 3px 9px; font-size: 12px; font-weight: 600; border-radius: 20px; }
.badge.review { background: #fff4d6; color: #8a6100; }
.badge.ok { background: #d6f5dd; color: #1e6c33; }
.badge.engineer { background: #d6e4f5; color: #1A4F8F; }
.badge.office { background: #ececf0; color: #555; }
.badge.danger-badge { background: #fdeeec; color: #962d22; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
@media (min-width: 700px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
.stat { background: #fff; border: 1px solid #e3e7ee; padding: 14px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,30,80,0.04); }
.stat .v { font-size: 26px; font-weight: 700; color: #003366; line-height: 1.1; }

.att { background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
.att:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,30,80,0.12); border-color: #c9d2dd; }

.att .l { font-size: 11px; color: #5a6677; margin-top: 5px; font-weight: 600; }
.att.zero { opacity: 0.5; }
.att.zero:hover { opacity: 0.8; }
.alert { padding: 14px; border-radius: 10px; margin-bottom: 14px; border-left: 4px solid #003366; background: #f0f5fc; font-size: 14px; color: #1a1a1a; }
.alert.warn { border-color: #c0392b; background: #fdeeec; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.table-scroll { overflow-x: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f0f5fc; border: 1px solid #d6e4f5; border-radius: 20px; font-size: 13px; color: #003366; }
.chip button { padding: 0; width: 18px; height: 18px; line-height: 1; background: transparent; box-shadow: none; color: #5a6677; font-size: 14px; border-radius: 50%; }
.chip button:hover { background: #d6e4f5; transform: none; box-shadow: none; }
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 20, 40, 0.5); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
.modal-backdrop.show { display: flex; }
.modal { background: #fff; border-radius: 14px; padding: 20px; max-width: 500px; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,30,80,0.25); }
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 140px 1fr 50px; gap: 10px; align-items: center; font-size: 13px; }
@media (max-width: 500px) { .bar-row { grid-template-columns: 100px 1fr 40px; font-size: 12px; } }
.bar-row .name { color: #003366; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bar { background: #e3e7ee; height: 22px; border-radius: 6px; position: relative; overflow: hidden; }
.bar-row .bar .fill { height: 100%; background: linear-gradient(90deg, #1A4F8F, #003468); border-radius: 6px; transition: width 0.4s ease; }
.bar-row .count { font-weight: 600; color: #003366; text-align: right; }
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.empty { text-align: center; padding: 40px 20px; color: #5a6677; font-size: 14px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: #f0f5fc; padding: 2px 6px; border-radius: 4px; color: #003366; }
.ac-dropdown {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: #fff; border: 1px solid #c9d2dd; border-top: none;

.ac-item { padding: 10px 14px; cursor: pointer; font-size: 15px; color: #1a1a1a; border-bottom: 1px solid #f0f5fc; }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.active { background: #f0f5fc; color: #003366; }

  .po-nav a{color:#fff;text-decoration:none;font-size:13px;font-weight:500;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.12)}
  .po-nav a:hover{background:rgba(255,255,255,0.25)}
  .toolwrap{position:relative;display:inline-flex}

  @media (max-width:520px){.toolmenu{left:0;right:auto}}
  #poGate{max-width:560px;margin:40px auto;padding:0 16px}</style>
</head>
<body>
  <header class="page" style="background:linear-gradient(180deg,#1A4F8F,#003468);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px">
    <a class="ml-back" href="main.html" title="Back" style="color:#fff">‹ Back</a>
    <h1 style="font-size:17px;margin:0;flex:1;color:#fff">🧾 Purchase Orders</h1>
    <div class="toolwrap">
      <button id="toolsBtn" type="button" aria-haspopup="true" aria-expanded="false">🛠 Tools ▾</button>
      <div class="toolmenu" id="toolsMenu" hidden>
        <a href="po-jobs.html">Job Costs</a>
        <a href="po-summary.html">Summary</a>

        <select id="filter-category"><option value="">Materials + Subcontractor</option><option value="materials">📦 Materials only</option><option value="subcontractor">👷 Subcontractor only</option></select>

<script>
const API = window.MOSTLANE_API;
function authFetch(path, opts){ opts=opts||{}; opts.headers=Object.assign({"Authorization":"Bearer "+localStorage.getItem("mostlaneToken")}, opts.headers||{}); return fetch(API+path, opts); }
// Client-side CSV of the currently-shown POs (no server round-trip, no un-authed tab).
function downloadCSV(pos){ var H=["PO","Issued","Source","Category","Trade","Issued By","Engineer","Site","Incident","Vehicle","Supplier","Description","Status","Cost ex VAT","VAT %","Cost inc VAT"];
  function q(v){return "\""+String(v==null?"":v).replace(/\"/g,"\"\"")+"\"";}
  var lines=[H.join(",")];
  pos.forEach(function(p){ var r=p.vat_rate!=null?p.vat_rate:20; var inc=p.cost_ex_vat!=null?(p.cost_ex_vat*(1+r/100)).toFixed(2):"";
    lines.push([p.po_number,fmtDateTime(p.issued_at),p.source,p.cost_category||"materials",p.trade||"",p.office_user_name||"",p.engineer_name||"",p.site||"",p.incident_no||"",p.vehicle_reg||"",p.supplier||"",p.description||"",p.status||"open",p.cost_ex_vat!=null?p.cost_ex_vat:"",p.cost_ex_vat!=null?r:"",inc].map(q).join(",")); });
  var blob=new Blob([lines.join("\n")],{type:"text/csv"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mostlane-po-"+new Date().toISOString().slice(0,10)+".csv"; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000); }
// Client-side print-friendly report of the currently-shown POs.
function printReport(pos){ var money=function(n){return "\u00a3"+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");};
  var totalEx=0,totalInc=0,un=0; pos.forEach(function(p){ if(p.cost_ex_vat!=null){var r=p.vat_rate!=null?p.vat_rate:20; totalEx+=p.cost_ex_vat; totalInc+=p.cost_ex_vat*(1+r/100);} else un++; });
  var rows=pos.map(function(p){var r=p.vat_rate!=null?p.vat_rate:20; return "<tr><td>"+escapeHtml(p.po_number)+"</td><td>"+escapeHtml(fmtDate(p.issued_at))+"</td><td>"+escapeHtml(p.engineer_name||p.office_user_name||"")+"</td><td>"+escapeHtml(p.site||p.incident_no||"")+"</td><td>"+escapeHtml(p.supplier||"")+"</td><td>"+escapeHtml(p.description||"")+"</td><td style=text-align:right>"+(p.cost_ex_vat!=null?money(p.cost_ex_vat):"\u2014")+"</td><td>"+escapeHtml(p.status||"open")+"</td></tr>";}).join("");
  var w=window.open("","_blank"); if(!w){alert("Allow pop-ups to print the report");return;}
  w.document.write("<!doctype html><meta charset=utf-8><title>PO Report</title><style>body{font-family:Segoe UI,sans-serif;margin:24px;color:#1a1a1a}h1{color:#003366}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #e3e7ee;padding:5px 6px;text-align:left}th{border-bottom:2px solid #003366;font-size:10px;text-transform:uppercase;color:#5a6677}</style>"+
    "<h1>Purchase Order Report</h1><p>"+pos.length+" PO(s) \u00b7 Net "+money(totalEx)+" \u00b7 Gross "+money(totalInc)+(un?" \u00b7 "+un+" awaiting cost":"")+" \u00b7 "+new Date().toLocaleString("en-GB")+"</p>"+
    "<table><thead><tr><th>PO</th><th>Date</th><th>Raised By</th><th>Site/Incident</th><th>Supplier</th><th>Description</th><th>Net</th><th>Status</th></tr></thead><tbody>"+rows+"</tbody></table>");
  w.document.close(); setTimeout(function(){w.print();},300); }
// Gate: must hold PurchaseOrders or FullAccess. Then reveal the app + boot the office view.
async function boot(){ try{ var me=await authFetch("/auth/me").then(function(r){return r.json();}); var u=me&&me.user||{};if(localStorage.getItem("mostlaneViewAsReal")){try{u=JSON.parse(sessionStorage.getItem("mostlanePermissions")||localStorage.getItem("mostlanePermissions")||"{}")||u;}catch(e){}} if(!(u.FullAccess==="Yes"||(u.PurchaseOrders==="Yes"&&u.StaffType!=="field"))){ document.getElementById("poGate").innerHTML="This page needs the Purchase Orders permission."; return; } }catch(e){ location.href="login.html"; return; } document.getElementById("poGate").style.display="none"; document.getElementById("poApp").style.display="block"; init(); }
let allPOs = [], allEngineers = [], allSuppliers = [], allSites = [], allSubcontractors = [], allTrades = [];
let currentStatus = '';
let currentJobId = '';   // set from ?job_id= deep-link; filters to one job's POs
async function init() {
  const [engineers, suppliers, sites, officeUsers, subs, trades] = await Promise.all([
    authFetch('/po/api/engineers').then(r => r.json()),
    authFetch('/po/api/suppliers').then(r => r.json()),
    authFetch('/po/api/sites').then(r => r.json()),
    authFetch('/po/api/office-users').then(r => r.json()),
    authFetch('/po/api/subcontractors').then(r => r.json()).catch(() => []),
    authFetch('/po/api/trades').then(r => r.json()).catch(() => [])
  ]);
  allEngineers = engineers; allSuppliers = suppliers; allSites = sites; allSubcontractors = subs; allTrades = trades;
  document.getElementById('filter-engineer').innerHTML = '<option value="">All engineers</option>' + engineers.filter(e => e.active).map(e => '<option value="' + escapeHtml(e.slug) + '">' + escapeHtml(e.name) + '</option>').join('');
  document.getElementById('filter-supplier').innerHTML = '<option value="">All suppliers</option>' + suppliers.map(s => '<option value="' + escapeAttr(s.name) + '">' + escapeHtml(s.name) + '</option>').join('');

// Arriving from the portal's "Raise PO for this job" (#mlpo=<base64 JSON>)
// is a raise-a-PO intent, not a "show me the log" one — so open the New PO
// modal pre-filled with the job instead of leaving the user on the dashboard.
// Anything malformed is ignored and the page behaves exactly as normal.
function decodeJobPayload() {
  const m = location.hash.match(/mlpo=([^&]+)/);
  if (!m) return null;
  try {
    let raw = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (raw.length % 4) raw += '=';
    const bin = atob(raw);
    let json;
    try {
      json = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
    } catch (e) {
      json = decodeURIComponent(escape(bin));
    }
    return JSON.parse(json);
  } catch (e) { return null; }
}
async function openNewPOFromJob() {
  const d = decodeJobPayload();
  if (!d) return;
  await openNewPO();
  const siteField = document.getElementById('m-site');
  const incField = document.getElementById('m-incident');
  let filled = false;
  if (d.site && siteField && !siteField.value) { siteField.value = d.site; filled = true; }
  if (d.jobRef && incField && !incField.value) { incField.value = d.jobRef; filled = true; }
  // Carry the job link through so the portal can cost this PO against the job
  const jobIdField = document.getElementById('m-job-id');
  const jobRefField = document.getElementById('m-job-ref');
  if (d.jobId && jobIdField) { jobIdField.value = d.jobId; filled = true; }
  if (d.jobRef && jobRefField) { jobRefField.value = d.jobRef; }
  if (!filled) return;
  const body = document.getElementById('modal-body');
  if (!body) return;
  const note = document.createElement('div');
  note.style.cssText = 'margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#d6f5dd;color:#1e6c33;font-size:13px;font-weight:600';
  note.textContent = '✓ Pre-filled from job ' + (d.jobRef || d.site || '');
  body.insertBefore(note, body.firstChild);
}

    if (res.error) { alert(res.error); return; }

      const pCost = Number(invPending.cost) || 0;
      let attach = null;
      try { attach = await invAttachToNewPo(res.po_number); } catch (e) { attach = { error: e.message }; }
      if (invPending.kind === 'sweep' && invPending.it) invPending.it._done = true;

        ? 'PO ' + res.po_number + ' raised, but attaching the invoice failed: ' + attach.error
        : 'PO ' + res.po_number + ' raised and invoice attached · £' + pCost.toFixed(2));

function filterEditSites() {
  const input = document.getElementById('e-site');
  const dd = document.getElementById('e-site-dropdown');
  const status = document.getElementById('e-site-status');
  if (!input || !dd) return;
  const q = input.value.trim().toLowerCase();
  // Update status indicator
  if (q && status) {
    const matchExact = allSites.some(s => s.name.toLowerCase() === q);
    if (matchExact) {
      status.innerHTML = '<span style="color:#1e6c33">✓ In sites list</span>';
    } else {
      const v = input.value.trim();
      status.innerHTML = '<span style="color:#b58a00">⚠️ Not in sites list</span> <button class="ghost small" style="padding:3px 8px;font-size:11px;margin-left:6px" onclick="addCurrentSiteToList()">+ Add to list</button>';
    }
  } else if (status) {
    status.innerHTML = '';
  }
  if (!q) { dd.style.display = 'none'; return; }
  const matches = allSites.filter(s => s.name.toLowerCase().includes(q)).slice(0, 8);
  if (!matches.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = matches.map(s => '<div class="ac-item" onmousedown="pickEditSite('+escapeHtml(JSON.stringify(String(s.name)))+')">'+highlightText(s.name, q)+'</div>').join('');
  dd.style.display = 'block';
}
function pickEditSite(name) { document.getElementById('e-site').value = name; hideEditSites(); filterEditSites(); }
function hideEditSites() { const dd = document.getElementById('e-site-dropdown'); if (dd) dd.style.display = 'none'; }
async function addCurrentSiteToList() {
  const name = document.getElementById('e-site').value.trim();
  if (!name) return;
  if (!confirm('Add "' + name + '" to the master sites list?')) return;
  await authFetch('/po/api/sites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  allSites = await authFetch('/po/api/sites').then(r => r.json());

function syncCost(changed) {
  const ex = parseFloat(document.getElementById('e-cost-ex').value);
  const rate = parseFloat(document.getElementById('e-vat-rate').value);
  const inc = parseFloat(document.getElementById('e-cost-inc').value);
  if (changed === 'ex' && !isNaN(ex) && !isNaN(rate)) {
    document.getElementById('e-cost-inc').value = (ex * (1 + rate / 100)).toFixed(2);
  } else if (changed === 'inc' && !isNaN(inc) && !isNaN(rate)) {
    document.getElementById('e-cost-ex').value = (inc / (1 + rate / 100)).toFixed(2);
  } else if (changed === 'rate' && !isNaN(ex) && !isNaN(rate)) {
    document.getElementById('e-cost-inc').value = (ex * (1 + rate / 100)).toFixed(2);
  }
}
async function saveEdit(poNumber) {
  const engSlug = document.getElementById('e-engineer').value;
  const eng = allEngineers.find(e => e.slug === engSlug);
  const costExStr = document.getElementById('e-cost-ex').value.trim();
  const costEx = costExStr === '' ? null : parseFloat(costExStr);
  const vatRateStr = document.getElementById('e-vat-rate').value.trim();
  const vatRate = vatRateStr === '' ? 20 : parseFloat(vatRateStr);
  let newStatus = document.getElementById('e-status').value;
  const p = allPOs.find(x => x.po_number === poNumber);
  const oldStatus = p.status || 'open';
  // Auto-promote open -> priced when cost is first entered (unless explicitly flagged/credit_due/complete)
  if (oldStatus === 'open' && costEx != null && newStatus === 'open') {
    newStatus = 'priced';
  }
  const flagReason = document.getElementById('e-flag-reason') ? document.getElementById('e-flag-reason').value.trim() : '';
  const creditNote = document.getElementById('e-credit-note') ? document.getElementById('e-credit-note').value.trim() : '';
  if (newStatus === 'flagged' && !flagReason) { alert('Flag reason is required when status is Flagged'); return; }
  if (newStatus === 'credit_due' && !creditNote) { alert('Credit note is required when status is Credit Due'); return; }
  await authFetch('/po/api/pos/' + poNumber, { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      engineer_slug: engSlug || null,
      engineer_name: eng ? eng.name : null,
      site: document.getElementById('e-site').value.trim(),
      incident_no: document.getElementById('e-incident').value.trim(),
      supplier: document.getElementById('e-supplier').value.trim(),
      trade: document.getElementById('e-trade') ? document.getElementById('e-trade').value.trim() : (p.trade || null),
      description: document.getElementById('e-description').value.trim(),
      cost_ex_vat: costEx,
      vat_rate: vatRate,
      status: newStatus,
      flag_reason: newStatus === 'flagged' ? flagReason : null,
      credit_note: newStatus === 'credit_due' ? creditNote : null,
      edited_by_slug: null,
      edited_by_name: null
    }) });
  closeModal(); loadPOs(); loadDashboard();
}
async function markReviewed(n) { await authFetch('/po/api/pos/' + n, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ needs_review: 0, edited_by_slug: null, edited_by_name: null }) }); closeModal(); loadPOs(); loadDashboard(); }
async function hardDeletePO(n, fromModal) {

async function invParse(file) {
  if (file.size > 15 * 1024 * 1024) { alert('That PDF is too big (max 15 MB)'); return; }
  invFile = file; invFields = null;
  const res = document.getElementById('inv-result');
  res.innerHTML = '<div class="muted" style="text-align:center;padding:16px">Reading “' + escapeHtml(file.name) + '”…</div>';
  let data;
  try {
    const fd = new FormData(); fd.append('file', file, file.name);
    data = await authFetch('/po/api/invoice/parse', { method: 'POST', body: fd }).then(r => r.json());
  } catch (e) { res.innerHTML = '<div class="alert warn">Couldn’t read that file: ' + escapeHtml(e.message) + '</div>'; return; }
  if (!data || data.error) { res.innerHTML = '<div class="alert warn">' + escapeHtml((data && data.error) || 'Could not read the invoice') + '</div>'; return; }
  invFields = data.fields || {};
  window.invLastParse = data;
  invRenderProposal(data);

    const r = await authFetch('/po/api/invoice/sweep-view?mailbox=' + encodeURIComponent(it.mailbox) + '&message_id=' + encodeURIComponent(it.messageId) + '&attachment_id=' + encodeURIComponent(it.attachmentId));
    if (!r.ok) { alert('Could not open the PDF'); return; }
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    window.open(u, '_blank');
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  } catch (e) { alert('Could not open: ' + e.message); }
}
// ── Build the pending-invoice source (sweep row or dropped file) ──────────────
function invPendingFromSrc(src) {
  if (src.kind === 'sweep') {
    const it = invSweepItems[src.i]; const f = it.fields || {};
    return { kind: 'sweep', it, fields: f, cost: invNetOf(f), rate: invRateOf(f), filename: it.filename,
      supplier: (it.po && it.po.supplier) || f.supplier || '', category: invCatOf(it), subName: it.subName || null, job: null };
  }
  const f = invFields || {};
  return { kind: 'manual', file: invFile, fields: f, cost: invNetOf(f), rate: invRateOf(f),
    filename: invFile ? invFile.name : 'invoice.pdf', supplier: f.supplier || '',
    category: (window.invLastParse && window.invLastParse.category) || 'other',
    subName: (window.invLastParse && window.invLastParse.subName) || null, job: null };
}
async function ensureEngineers() {
  if (!allEngineers || !allEngineers.length) {
    try { allEngineers = await authFetch('/po/api/engineers').then(r => r.json()); } catch (e) {}
  }
  return allEngineers || [];
}

function invFindJob(i) { openFindJob({ kind: 'sweep', i }); }
function invFindJobManual() { if (!invFile) { alert('Drop the invoice again'); return; } openFindJob({ kind: 'manual' }); }

}
function openFindJob(src) {

      '<div class="row-between"><h2 style="margin:0;color:#003366">🔎 Find the job for this PO</h2><button class="ghost small" onclick="closeFindJob()">✕</button></div>' +

    '<input id="findJobQ" type="text" placeholder="Search job number, incident, site or description…" oninput="findJobSearch()" autocomplete="off" style="width:100%">' +
    '<div id="findJobResults" style="margin-top:10px"><div class="muted" style="font-size:12px">Type at least 2 characters to search the live jobs.</div></div>' +
    '<div style="margin-top:12px;border-top:1px solid #eef1f5;padding-top:10px"><a href="sla-main.html" target="_blank" rel="noopener" style="color:#003366;font-weight:600;text-decoration:none">Open the full SLA board ↗</a> <span class="muted" style="font-size:12px">— browse it, then search the job number here.</span></div>';
  bk.classList.add('show');
  setTimeout(() => { const q = document.getElementById('findJobQ'); if (q) q.focus(); }, 60);
}
function closeFindJob() { const bk = document.getElementById('findJobBackdrop'); if (bk) bk.classList.remove('show'); }
function findJobSearch() {
  const q = (document.getElementById('findJobQ') || {}).value || '';

  if (q.trim().length < 2) { if (box) box.innerHTML = '<div class="muted" style="font-size:12px">Type at least 2 characters to search the live jobs.</div>'; return; }

function jobStatusPill(s) {
  const t = String(s || '').toLowerCase();
  let bg = '#eef1f5', fg = '#5a6677';
  if (/complete|closed|invoiced|done/.test(t)) { bg = '#e6f5ea'; fg = '#1e6c33'; }
  else if (/progress|travel/.test(t)) { bg = '#fff4e0'; fg = '#b58a00'; }
  else if (/hold|quote|order/.test(t)) { bg = '#f1e9fa'; fg = '#7a4ca0'; }
  return '<span style="display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;background:' + bg + ';color:' + fg + '">' + escapeHtml(s || 'Pending') + '</span>';
}
function renderFindJobResults() {

      '<div class="muted" style="font-size:12px;margin-top:3px">' + escapeHtml(j.site || '') + (j.scheduledAt ? ' · ' + escapeHtml(fmtDate(j.scheduledAt)) : '') + (engs ? ' · ' + escapeHtml(engs) : '') + '</div>' +
      (j.description ? '<div class="muted" style="font-size:12px;margin-top:3px">' + escapeHtml(j.description) + '</div>' : '') +
      '<div style="margin-top:8px"><button class="small" onclick="pickFindJob(' + i + ')">➕ Raise PO for this job</button></div>' +
    '</div>';
  }).join('');
}
function pickFindJob(i) {
  const j = findJobResults[i]; if (!j || !findJobSrc) return;
  invPending = invPendingFromSrc(findJobSrc);
  invPending.job = { job_id: j.job_id, ref: j.ref, site: j.site };

}
// ── Flag & log: a materials invoice with NO PO from a normal supplier ─────────
let flagSrc = null;
function openFlagLog(i) { openFlagModal({ kind: 'sweep', i }); }
function openFlagLogManual() { if (!invFile) { alert('Drop the invoice again'); return; } openFlagModal({ kind: 'manual' }); }
async function openFlagModal(src) {

    bk.innerHTML = '<div class="modal" style="max-width:480px;border:3px solid #c0392b"><div class="row-between"><h2 style="margin:0;color:#c0392b">⚠ Flag — no PO raised</h2><button class="ghost small" onclick="closeFlagModal()">✕</button></div><div id="flagBody" style="margin-top:10px"></div></div>';
    document.body.appendChild(bk);
    bk.addEventListener('mousedown', e => { if (e.target === bk) closeFlagModal(); });
  }
  const engOpts = (allEngineers || []).filter(e => Number(e.active) === 1).map(e => '<option value="' + escapeAttr(e.slug) + '">' + escapeHtml(e.name) + '</option>').join('');
  document.getElementById('flagBody').innerHTML =
    '<p class="muted" style="margin:0 0 10px;font-size:13px">A materials invoice came in with no PO. Pin it on the engineer who bought it and keep it as a log (a copy of the invoice is saved), so you can see who isn’t raising POs.</p>' +
    '<div class="card" style="padding:10px;margin-bottom:10px;font-size:13px"><strong>' + escapeHtml(p.supplier || p.filename || '') + '</strong> · ' + invMoney(p.cost) + ' net' + (p.fields && p.fields.invoiceDate ? ' · ' + escapeHtml(p.fields.invoiceDate) : '') + '</div>' +
    '<div class="field"><label>Engineer who should have raised the PO</label><select id="flag-eng"><option value="">— pick an engineer —</option>' + engOpts + '</select></div>' +
    '<div class="field"><label>Note (optional)</label><textarea id="flag-note" placeholder="e.g. bought materials at CEF for the Fareham job"></textarea></div>' +
    '<div class="row-between" style="margin-top:6px"><button class="ghost small" onclick="closeFlagModal()">Cancel</button><button onclick="submitFlag(this)">⚠ Save to log</button></div>';
  bk.classList.add('show');

function closeFlagModal() { const bk = document.getElementById('flagBackdrop'); if (bk) bk.classList.remove('show'); }
async function submitFlag(btn) {
  if (!flagSrc) return;
  const engSel = document.getElementById('flag-eng');
  const engSlug = engSel ? engSel.value : '';
  const eng = (allEngineers || []).find(e => e.slug === engSlug);
  const note = (document.getElementById('flag-note') || {}).value || '';
  const p = invPendingFromSrc(flagSrc), f = p.fields || {};
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  let res;
  try {
    if (flagSrc.kind === 'sweep') {
      const it = p.it;
      const body = { supplier: p.supplier, invoice_no: f.invoiceNumber || '', invoice_date: f.invoiceDate || '',
        net: f.net, vat: f.vat, gross: f.gross, filename: it.filename,
        engineer_slug: engSlug || '', engineer_name: eng ? eng.name : '', note, source: 'sweep',
        mailbox: it.mailbox, message_id: it.messageId, attachment_id: it.attachmentId };
      res = await authFetch('/po/api/invoice/flag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
    } else {
      const fd = new FormData();
      if (p.file) fd.append('file', p.file, p.file.name);
      fd.append('supplier', p.supplier || ''); fd.append('invoice_no', f.invoiceNumber || ''); fd.append('invoice_date', f.invoiceDate || '');
      if (f.net != null) fd.append('net', String(f.net)); if (f.vat != null) fd.append('vat', String(f.vat)); if (f.gross != null) fd.append('gross', String(f.gross));
      fd.append('engineer_slug', engSlug || ''); fd.append('engineer_name', eng ? eng.name : ''); fd.append('note', note); fd.append('source', 'manual'); fd.append('filename', p.filename || 'invoice.pdf');
      res = await authFetch('/po/api/invoice/flag', { method: 'POST', body: fd }).then(r => r.json());
    }
  } catch (e) { alert('Error: ' + e.message); if (btn) { btn.disabled = false; btn.textContent = '⚠ Save to log'; } return; }
  if (!res || res.error) { alert((res && res.error) || 'Could not save the flag'); if (btn) { btn.disabled = false; btn.textContent = '⚠ Save to log'; } return; }
  if (flagSrc.kind === 'sweep' && invSweepItems[flagSrc.i]) { invSweepItems[flagSrc.i]._done = true; invRenderResults(); }
  closeFlagModal();
  alert('Flagged and logged' + (eng ? ' against ' + eng.name : '') + '. A copy of the invoice was saved.');
}
// ── The flagged-invoices log (who isn't raising POs) ──────────────────────────
let flagLogRows = [];
async function openFlagLogList() {
  await ensureEngineers();
  let bk = document.getElementById('flagLogBackdrop');
  if (!bk) {
    bk = document.createElement('div'); bk.id = 'flagLogBackdrop'; bk.className = 'modal-backdrop'; bk.style.zIndex = '205';
    bk.innerHTML = '<div class="modal" style="max-width:680px"><div class="row-between"><h2 style="margin:0;color:#003366">📋 Flagged invoices — no PO raised</h2><button class="ghost small" onclick="closeFlagLog()">✕</button></div><div id="flagLogControls" style="margin-top:10px"></div><div id="flagLogBody" style="margin-top:10px"></div></div>';
    document.body.appendChild(bk);
    bk.addEventListener('mousedown', e => { if (e.target === bk) closeFlagLog(); });
  }
  const engOpts = (allEngineers || []).filter(e => Number(e.active) === 1).map(e => '<option value="' + escapeAttr(e.slug) + '">' + escapeHtml(e.name) + '</option>').join('');
  document.getElementById('flagLogControls').innerHTML =
    '<p class="muted" style="margin:0 0 8px;font-size:13px">Every materials invoice that arrived with no PO from a normal supplier. Filter by engineer to see who keeps missing the PO step.</p>' +
    '<div class="row" style="gap:8px;flex-wrap:wrap">' +
      '<select id="flagLogEng" onchange="flagLogLoad()" style="max-width:220px"><option value="">All engineers</option>' + engOpts + '</select>' +
      '<select id="flagLogStatus" onchange="flagLogLoad()" style="max-width:160px"><option value="open">Open</option><option value="">All</option><option value="resolved">Resolved</option></select>' +
      '<button class="ghost small" onclick="flagLogLoad()">↻ Refresh</button>' +
    '</div>';
  bk.classList.add('show');
  flagLogLoad();
}
function closeFlagLog() { const bk = document.getElementById('flagLogBackdrop'); if (bk) bk.classList.remove('show'); }
async function flagLogLoad() {
  const body = document.getElementById('flagLogBody'); if (body) body.innerHTML = '<div class="muted" style="padding:12px">Loading…</div>';
  const eng = (document.getElementById('flagLogEng') || {}).value || '';
  const status = (document.getElementById('flagLogStatus') || {}).value;
  const p = new URLSearchParams();
  if (eng) p.set('engineer', eng);
  if (status != null && status !== '') p.set('status', status);
  try { flagLogRows = await authFetch('/po/api/invoice/flags?' + p).then(r => r.json()); } catch (e) { flagLogRows = []; }
  if (!Array.isArray(flagLogRows)) flagLogRows = [];
  renderFlagLog();
}
function renderFlagLog() {
  const body = document.getElementById('flagLogBody'); if (!body) return;
  if (!flagLogRows.length) { body.innerHTML = '<div class="empty" style="padding:14px">No flagged invoices — everyone’s raising their POs. 🎉</div>'; return; }
  // Per-engineer tally so "who isn't raising POs" is obvious at a glance.
  const tally = {};
  flagLogRows.forEach(r => { const k = r.engineer_name || 'Unassigned'; tally[k] = (tally[k] || 0) + 1; });
  const tallyHtml = '<div style="margin-bottom:10px;font-size:12px">' + Object.keys(tally).sort((a, b) => tally[b] - tally[a]).map(k => '<span style="display:inline-block;background:#fdecea;color:#c0392b;border-radius:999px;padding:3px 10px;font-weight:600;margin:0 6px 6px 0">' + escapeHtml(k) + ' · ' + tally[k] + '</span>').join('') + '</div>';
  const rows = flagLogRows.map(r => {
    const resolved = (r.status || 'open') === 'resolved';
    return '<div class="card" style="padding:11px;margin-bottom:8px;' + (resolved ? 'opacity:.6' : '') + '">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">' +
        '<div><strong style="color:#003366">' + escapeHtml(r.supplier || '—') + '</strong> <span class="muted" style="font-size:12px">· ' + escapeHtml(r.invoice_no || '') + (r.invoice_date ? ' · ' + escapeHtml(r.invoice_date) : '') + '</span></div>' +
        '<div style="font-weight:700;color:#003366;white-space:nowrap">' + invMoney(r.net != null ? r.net : r.gross) + '</div></div>' +
      '<div class="muted" style="font-size:12px;margin-top:3px">' +
        '👷 ' + escapeHtml(r.engineer_name || '— not assigned —') +
        (r.job_ref ? ' · 🎫 ' + escapeHtml(r.job_ref) : '') + (r.po_number ? ' · PO ' + escapeHtml(r.po_number) : '') +
        ' · logged ' + escapeHtml(fmtDate(r.created_at)) + (r.created_by ? ' by ' + escapeHtml(r.created_by) : '') + '</div>' +
      (r.note ? '<div class="muted" style="font-size:12px;margin-top:3px">📝 ' + escapeHtml(r.note) + '</div>' : '') +
      '<div class="row" style="margin-top:8px;flex-wrap:wrap">' +
        (r.invoiceUrl ? '<a class="ghost small" href="' + escapeAttr(r.invoiceUrl) + '" target="_blank" rel="noopener" style="text-decoration:none">👁 View invoice</a>' : '') +
        '<button class="ghost small" onclick="flagLogReassign(' + Number(r.id) + ')">👤 Change engineer</button>' +
        (resolved
          ? '<button class="ghost small" onclick="flagLogSetStatus(' + Number(r.id) + ',\'open\')">↩ Reopen</button>'
          : '<button class="ghost small" onclick="flagLogSetStatus(' + Number(r.id) + ',\'resolved\')">✓ Mark resolved</button>') +
        '<button class="danger small" onclick="flagLogDelete(' + Number(r.id) + ')">🗑</button>' +
      '</div></div>';
  }).join('');
  body.innerHTML = tallyHtml + rows;
}
async function flagLogSetStatus(id, status) {

  flagLogLoad();
}
async function flagLogReassign(id) {
  await ensureEngineers();
  const names = (allEngineers || []).filter(e => Number(e.active) === 1);
  const list = names.map((e, i) => (i + 1) + '. ' + e.name).join('\n');
  const pick = prompt('Assign this flagged invoice to which engineer?\n\n' + list + '\n\nType the number:');
  const idx = Number(pick) - 1;
  if (!(idx >= 0 && idx < names.length)) return;
  const e = names[idx];
  try { await authFetch('/po/api/invoice/flag-update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, engineer_slug: e.slug, engineer_name: e.name }) }); } catch (err) {}
  flagLogLoad();
}
async function flagLogDelete(id) {
  const ok = window.MLUI ? await MLUI.confirm('Delete this flagged-invoice log entry?', { danger: true }) : confirm('Delete this flagged-invoice log entry?');
  if (!ok) return;
  try { await authFetch('/po/api/invoice/flag-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }); } catch (e) {}
  flagLogLoad();
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function fmtDate(v) {
  if (!v) return '';
  const s = String(v);
  if (s.length === 10 && s.charAt(4) === '-') return s.slice(8,10) + '-' + s.slice(5,7) + '-' + s.slice(2,4);
  const d = new Date(v);
  if (isNaN(d)) return s;
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + String(d.getFullYear()).slice(2);
}
function fmtDateTime(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const p = n => (n < 10 ? '0' : '') + n;
  return fmtDate(d) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
let modalMouseDownTarget = null;
document.getElementById('modal').addEventListener('mousedown', (e) => { modalMouseDownTarget = e.target; });
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal' && modalMouseDownTarget === e.target) closeModal(); });
(function(){
  var btn = document.getElementById('toolsBtn');
  var menu = document.getElementById('toolsMenu');
  if (!btn || !menu) return;
  function open(){ menu.hidden = false; btn.setAttribute('aria-expanded','true'); }
  function close(){ menu.hidden = true; btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); if (menu.hidden) open(); else close(); });
  menu.addEventListener('click', function(){ close(); });
  document.addEventListener('click', function(e){ if (!menu.hidden && !menu.contains(e.target) && e.target !== btn) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !menu.hidden) close(); });
})();
boot();

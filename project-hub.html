<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Project</title>
  <script src="/portal-config.js?v=15"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <script src="docviewer.js?v=6"></script>
  <style>
    :root { --brand:#003366; --ok:#0a7d33; --bad:#b00020; --line:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#eef1f4; color:#1f2937; }
    header.page { background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    header.page h1 { font-size:18px; margin:0; flex:1 1 auto; }
    .wrap { max-width:900px; margin:14px auto 80px; padding:0 12px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px rgba(6,24,54,.06); padding:16px; margin-bottom:14px; }
    .card h2 { margin:0 0 10px; font-size:16px; }
    .btn { background:var(--brand); color:#fff; border:none; border-radius:9px; padding:9px 13px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; }
    .btn.grey { background:#5b6b7b; } .btn.green { background:var(--ok); } .btn.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); } .btn.small { padding:6px 10px; font-size:13px; }
    .btn:disabled { opacity:.5; }
    .muted { color:#6b7a90; } .hide { display:none !important; }
    input[type=text],input[type=number],select,textarea { width:100%; padding:9px; border:1px solid #ccd5dd; border-radius:9px; font-size:14.5px; font-family:inherit; }
    textarea { min-height:70px; }
    .kv { font-size:13.5px; margin:4px 0; } .kv b { color:#334155; }
    .badge { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
    .b-live { background:#e6f6ec; color:var(--ok); } .b-complete { background:#e0e7ff; color:#3730a3; } .b-archived { background:#f1f5f9; color:#64748b; }
    .todo { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid #f0f3f7; }
    .todo:first-child { border-top:none; }
    .todo .tick { width:26px; height:26px; border-radius:50%; border:2px solid #cbd5e1; flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }
    .todo .tick.done { background:var(--ok); border-color:var(--ok); color:#fff; }
    .todo .lbl { flex:1; font-weight:600; font-size:14.5px; }
    .todo .lbl small { display:block; font-weight:400; color:#8a97a6; font-size:12px; }
    .todo .act { display:flex; gap:6px; flex-wrap:wrap; }
    .pill { display:inline-flex; align-items:center; gap:6px; background:#eef4ff; color:var(--brand); border:1px solid #cdddf5; border-radius:999px; padding:5px 10px; font-size:12.5px; font-weight:600; margin:2px 4px 2px 0; }
    .money { display:flex; gap:12px; flex-wrap:wrap; }
    .stat { flex:1 1 120px; background:#f8fafc; border:1px solid var(--line); border-radius:11px; padding:10px 12px; }
    .stat .n { font-size:19px; font-weight:800; color:#0f172a; } .stat .l { font-size:11.5px; color:#6b7a90; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
    .frow { display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid #f0f3f7; font-size:13.5px; }
    .doclist div { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid #f0f3f7; font-size:13.5px; }
    .doclist div:first-child { border-top:none; }
    .doclist .nm { flex:1; }
    .msg { font-size:13px; margin:8px 0 0; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
    .editrow { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:14px; }
    .editrow input[type=checkbox] { width:19px; height:19px; }
    .drop { border:2px dashed #b9c6d6; border-radius:12px; padding:16px; text-align:center; color:#6b7a90; cursor:pointer; font-size:13.5px; }
    .drop.over { background:#eef4ff; border-color:var(--brand); }
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="/projects-live.html" style="text-decoration:none;">‹ Back</a>
    <h1 id="hTitle">Project</h1>
    <select id="statusSel" class="hide" style="width:auto;padding:7px 10px;color:#1f2937;"></select>
  </header>
  <div class="wrap" id="wrap"><p class="muted" style="padding:20px;">Loading…</p></div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    const money = n => "£" + Math.round(Number(n) || 0).toLocaleString();
    function authFetch(path, opts = {}) {
      opts.headers = Object.assign({ "Authorization": "Bearer " + localStorage.getItem("mostlaneToken") }, opts.headers || {});
      return fetch((path.startsWith("http") ? path : API + path), opts);
    }
    const PID = new URLSearchParams(location.search).get("id") || "";
    let P = null, CAN = false, RAMS_DOCS = [];

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r => r.json());
        if (!me.ok || !(me.user.FullAccess === "Yes" || me.user.Projects === "Yes" || me.user.ProjectsAdmin === "Yes")) { alert("This page needs Projects access."); location.href = "/main.html"; return; }
      } catch (e) { location.href = "/main.html"; return; }
      await loadProject();
    })();

    async function loadProject() {
      let d;
      try { d = await authFetch("/project/get?id=" + encodeURIComponent(PID)).then(r => r.json()); }
      catch { g("wrap").innerHTML = "<p class='muted' style='padding:20px'>Couldn't load — try again.</p>"; return; }
      if (!d || !d.ok) { g("wrap").innerHTML = "<p class='muted' style='padding:20px'>" + esc((d && d.error) || "Project not found.") + "</p>"; return; }
      P = d.project; CAN = d.canManage;
      g("hTitle").textContent = P.name;
      // Status selector (admins)
      if (CAN) {
        const sel = g("statusSel"); sel.classList.remove("hide");
        sel.innerHTML = ["live", "complete", "archived"].map(s => `<option value="${s}" ${P.status === s ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("");
        sel.onchange = async () => { await authFetch("/project/update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, status: sel.value }) }); };
      }
      render();
    }

    function render() {
      g("wrap").innerHTML = summaryCard() + todoCard() + `<div id="costingCard"></div>` + docsCard() + sitelogCard() + (CAN ? requiredCard() : "");
      wire();
      if (CAN) loadCosting();
      loadDocs();
      loadRamsRefs();
    }

    function summaryCard() {
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <div class="kv"><b>Project number:</b> ${esc(P.number)}</div>
            <div class="kv"><b>Site:</b> own project-site ${esc(P.number)}${P.fromExisting ? " · from " + esc(P.fromExisting.name) : ""}</div>
            ${P.postcode ? `<div class="kv"><b>Location:</b> ${esc(P.postcode)}${P.lat != null ? " · " + P.lat + ", " + P.lon : ""}</div>` : ""}
            ${P.mileageRoundTrip != null ? `<div class="kv"><b>Mileage:</b> ${P.mileageRoundTrip} mi round trip from HQ</div>` : ""}
          </div>
          <span class="badge b-${esc(P.status || "live")}">${esc((P.status || "live").toUpperCase())}</span>
        </div>
      </div>`;
    }

    const BUILD = {
      programme: { open: "Open programme", build: "Build programme" },
      rams: { open: "Open", build: "Build risk assessment" },
      cpp: { open: "Open CPP", build: "Open CPP builder" },
      valuations: { open: "View valuations", build: "Set contract value" },
      projectDocs: { open: "Manage documents", build: "Add documents" },
    };
    function todoCard() {
      const items = P.todo || [];
      if (!items.length) return `<div class="card"><h2>✅ To-do</h2><p class="muted">No documents required. ${CAN ? "Add some below." : ""}</p></div>`;
      const done = items.filter(i => i.done).length;
      return `<div class="card"><h2>✅ To-do — ${done}/${items.length} done</h2>
        ${items.map(it => `<div class="todo">
          <span class="tick ${it.done ? "done" : ""}" ${CAN ? `data-tick="${it.key}"` : ""} title="${it.auto ? "Done automatically" : "Tap to mark done"}">${it.done ? "✓" : ""}</span>
          <span class="lbl">${esc(it.label)}${it.key === "rams" ? `<small id="ramsRefLine"></small>` : ""}</span>
          <span class="act" data-actfor="${it.key}"></span>
        </div>`).join("")}
      </div>`;
    }

    function actionsFor(key) {
      const L = P.links || {};
      if (key === "programme") return L.programmeId
        ? `<a class="btn small" href="/programme-edit.html?id=${encodeURIComponent(L.programmeId)}">${BUILD.programme.open}</a>`
        : (CAN ? `<button class="btn small" data-build="programme">${BUILD.programme.build}</button>` : "");
      if (key === "rams") return CAN ? `<button class="btn small" data-build="rams">${BUILD.rams.build}</button>` : "";
      if (key === "cpp") return CAN
        ? `<button class="btn small" data-build="cpp">${L.cppRef ? BUILD.cpp.open : BUILD.cpp.build}</button>` : "";
      if (key === "valuations") return `<a class="btn small ghost" href="/job-costing.html">${BUILD.valuations.open}</a>` + (CAN ? ` <button class="btn small" data-build="valuations">${P.contractValue ? "Update value" : BUILD.valuations.build}</button>` : "");
      if (key === "projectDocs") return `<a class="btn small ghost" href="#docsCard" onclick="document.getElementById('docsCardEl').scrollIntoView({behavior:'smooth'});return false;">${CAN ? BUILD.projectDocs.build : "View documents"}</a>`;
      return "";
    }

    function docsCard() {
      return `<div class="card" id="docsCardEl"><h2>📁 Project Documents</h2>
        ${CAN ? `<div class="drop" id="dropZone">Drop a file here, or tap to choose. <br><span class="muted">Engineers with Projects access can view these (unless you hide them).</span></div>
          <div style="margin:8px 0;"><input type="text" id="docSection" placeholder="Section (e.g. Drawings) — optional" style="max-width:280px;display:inline-block;width:auto;"></div>` : ""}
        <div class="doclist" id="docList"><p class="muted">Loading…</p></div>
        <p class="msg" id="docMsg"></p>
      </div>`;
    }

    function sitelogCard() {
      const sl = P.sitelog || {};
      if (!CAN) return `<div class="card"><h2>📲 SiteLog</h2>
        ${sl.rules ? `<div class="kv"><b>Arrival message:</b><br>${esc(sl.rules).replace(/\n/g, "<br>")}</div>` : `<p class="muted">No arrival message set.</p>`}
        ${(sl.companies || []).length ? `<div class="kv"><b>Companies on site:</b> ${sl.companies.map(esc).join(", ")}</div>` : ""}</div>`;
      return `<div class="card"><h2>📲 SiteLog</h2>
        <label class="muted" style="font-size:12px;font-weight:600;">Arrival message — everyone</label>
        <textarea id="slRules">${esc(sl.rules || "")}</textarea>
        <label class="muted" style="font-size:12px;font-weight:600;margin-top:8px;display:block;">Visitors-only extra</label>
        <textarea id="slVisitor">${esc(sl.visitorRules || "")}</textarea>
        <label class="muted" style="font-size:12px;font-weight:600;margin-top:8px;display:block;">Companies on site</label>
        <div id="coList" style="margin:4px 0;">${(sl.companies || []).map((c, i) => `<span class="pill">${esc(c)} <button data-corm="${i}" style="background:none;border:none;color:var(--brand);cursor:pointer;">✕</button></span>`).join("")}</div>
        <div style="display:flex;gap:8px;"><input type="text" id="coInput" placeholder="Add a company…" style="flex:1;"><button class="btn ghost small" id="coAdd" type="button">＋</button></div>
        <div style="margin-top:10px;"><button class="btn small" id="slSave">Save SiteLog settings</button> <span class="msg" id="slMsg" style="display:inline;"></span></div>
      </div>`;
    }

    function requiredCard() {
      const r = P.required || {};
      const DT = [["programme","Programme of works"],["rams","Risk Assessment (RAMS)"],["cpp","Construction Phase Plan"],["valuations","Valuations"],["projectDocs","Project Documents"]];
      return `<div class="card"><h2>⚙ Required documents</h2>
        <p class="muted" style="font-size:12.5px;margin:0 0 8px;">Change your mind later — tick or untick what this project needs.</p>
        ${DT.map(([k, l]) => `<label class="editrow"><input type="checkbox" data-req="${k}" ${r[k] ? "checked" : ""}> ${esc(l)}</label>`).join("")}
        <div style="margin-top:8px;"><button class="btn small" id="reqSave">Save</button> <span class="msg" id="reqMsg" style="display:inline;"></span></div>
      </div>`;
    }

    // ── Wiring ────────────────────────────────────────────────────────────────
    let COMPANIES = (P && P.sitelog && P.sitelog.companies || []).slice();
    function wire() {
      COMPANIES = (P.sitelog && P.sitelog.companies || []).slice();
      // fill action slots
      document.querySelectorAll("[data-actfor]").forEach(el => { el.innerHTML = actionsFor(el.dataset.actfor); });
      // manual todo ticks
      document.querySelectorAll("[data-tick]").forEach(el => el.onclick = () => toggleTodo(el.dataset.tick, !el.classList.contains("done")));
      // build buttons
      document.querySelectorAll("[data-build]").forEach(el => el.onclick = () => build(el.dataset.build));
      // sitelog
      if (CAN) {
        g("coAdd").onclick = () => { const v = g("coInput").value.trim(); if (v && !COMPANIES.some(c => c.toLowerCase() === v.toLowerCase())) { COMPANIES.push(v); g("coInput").value = ""; renderCo(); } };
        g("coInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); g("coAdd").click(); } });
        g("coList").addEventListener("click", e => { const b = e.target.closest("[data-corm]"); if (b) { COMPANIES.splice(+b.dataset.corm, 1); renderCo(); } });
        g("slSave").onclick = saveSitelog;
        g("reqSave").onclick = saveRequired;
        wireDrop();
      }
    }
    function renderCo() { g("coList").innerHTML = COMPANIES.map((c, i) => `<span class="pill">${esc(c)} <button data-corm="${i}" style="background:none;border:none;color:var(--brand);cursor:pointer;">✕</button></span>`).join(""); }

    async function toggleTodo(key, done) {
      const r = await authFetch("/project/todo", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, key, done }) }).then(r => r.json());
      if (r.ok) { P.todo = r.todo; render(); }
    }

    async function build(kind) {
      if (kind === "programme") {
        const data = { title: P.name, client: "projects", site: P.name, projectId: PID, contractors: [], tasks: [] };
        const r = await authFetch("/prog/save", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ title: P.name, client: "projects", site: P.name, data }) }).then(r => r.json());
        if (r.ok && r.id) { await authFetch("/project/link", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, kind: "programme", value: r.id }) }); location.href = "/programme-edit.html?id=" + encodeURIComponent(r.id); }
        return;
      }
      if (kind === "rams") { location.href = "/hs-docs.html?newRams=1&site=" + encodeURIComponent(P.name) + "&project=" + encodeURIComponent(PID); return; }
      if (kind === "cpp") {
        // Mark the CPP as started (links it), then open the builder pre-filled.
        await authFetch("/project/link", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, kind: "cpp", value: P.number }) });
        try {
          const c = await authFetch("/hs-plan-config").then(r => r.json());
          if (c && c.ok && c.token) location.href = "hs-plan/#worker=" + encodeURIComponent(c.worker) + "&token=" + encodeURIComponent(c.token) + "&projectName=" + encodeURIComponent(P.name) + "&projectNo=" + encodeURIComponent(P.number);
          else alert("The Construction Phase Plan tool isn't configured for your account.");
        } catch { alert("Couldn't open the Construction Phase Plan tool."); }
        return;
      }
      if (kind === "valuations") {
        const cur = P.contractValue || "";
        const v = prompt("Contract value for this project (£):", cur);
        if (v === null) return;
        const num = Number(String(v).replace(/[^0-9.]/g, ""));
        const r = await authFetch("/project/update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, contractValue: num || null, required: { valuations: true } }) }).then(r => r.json());
        if (r.ok) { P = r.project; render(); }
        return;
      }
    }

    async function saveSitelog() {
      g("slMsg").textContent = "Saving…"; g("slMsg").className = "msg";
      const r = await authFetch("/project/update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, sitelog: { rules: g("slRules").value, visitorRules: g("slVisitor").value, companies: COMPANIES } }) }).then(r => r.json());
      if (r.ok) { P = r.project; g("slMsg").textContent = "Saved ✓ (SiteLog message updated)"; g("slMsg").className = "msg ok"; }
      else { g("slMsg").textContent = (r.error || "Couldn't save"); g("slMsg").className = "msg err"; }
    }
    async function saveRequired() {
      const req = {}; document.querySelectorAll("[data-req]").forEach(c => req[c.dataset.req] = c.checked);
      g("reqMsg").textContent = "Saving…"; g("reqMsg").className = "msg";
      const r = await authFetch("/project/update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, required: req }) }).then(r => r.json());
      if (r.ok) { P = r.project; g("reqMsg").textContent = "Saved ✓"; g("reqMsg").className = "msg ok"; render(); }
      else { g("reqMsg").textContent = (r.error || "Couldn't save"); g("reqMsg").className = "msg err"; }
    }

    // ── RAMS linked refs ──────────────────────────────────────────────────────
    async function loadRamsRefs() {
      const ids = (P.links && P.links.ramsIds) || [];
      const line = g("ramsRefLine"); if (!line) return;
      if (!ids.length) { line.textContent = ""; return; }
      try {
        const d = await authFetch("/hs/docs?type=rams").then(r => r.json());
        const byId = {}; (d.docs || []).forEach(x => byId[x.id] = x);
        line.innerHTML = ids.map(id => byId[id] ? `<a class="pill" href="/hs-docs.html?open=${encodeURIComponent(id)}" style="text-decoration:none;">${esc(byId[id].ref || "RAMS")}</a>` : "").join(" ");
      } catch {}
    }

    // ── Documents ─────────────────────────────────────────────────────────────
    async function loadDocs() {
      let d;
      try { d = await authFetch("/project/docs?id=" + encodeURIComponent(PID)).then(r => r.json()); } catch { return; }
      const list = g("docList"); if (!list) return;
      const files = (d && d.files) || [];
      if (!files.length) { list.innerHTML = `<p class="muted">No documents yet.</p>`; return; }
      list.innerHTML = files.map(f => `<div>
        <span class="nm">📄 <a href="#" data-open="${esc(f.url)}" data-name="${esc(f.title)}" style="text-decoration:none;">${esc(f.title)}</a>${f.hidden ? ' <span class="muted">(hidden)</span>' : ""}<br><span class="muted" style="font-size:12px;">${esc(f.section || "")} · ${esc(f.uploadedBy || "")}</span></span>
        ${CAN ? `<button class="btn grey small" data-hide="${f.id}" data-h="${f.hidden ? 1 : 0}">${f.hidden ? "Show" : "Hide"}</button><button class="btn red small" data-del="${f.id}" style="background:#b00020;">✕</button>` : ""}
      </div>`).join("");
      list.querySelectorAll("[data-open]").forEach(a => a.onclick = e => { e.preventDefault(); if (window.MLDocViewer) MLDocViewer.open(a.dataset.open, a.dataset.name); else window.open(a.dataset.open, "_blank"); });
      if (CAN) {
        list.querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => { await authFetch("/project/doc-update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fileId: b.dataset.hide, hidden: b.dataset.h !== "1" }) }); loadDocs(); });
        list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("Delete this document?")) return; await authFetch("/project/doc-delete", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fileId: b.dataset.del }) }); loadDocs(); loadProject(); });
      }
    }
    function wireDrop() {
      const dz = g("dropZone"); if (!dz) return;
      const pick = () => { const inp = document.createElement("input"); inp.type = "file"; inp.onchange = () => inp.files[0] && upload(inp.files[0]); inp.click(); };
      dz.onclick = pick;
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
      dz.ondragleave = () => dz.classList.remove("over");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
    }
    async function upload(file) {
      const fd = new FormData(); fd.append("file", file); fd.append("id", PID);
      fd.append("title", file.name); fd.append("section", g("docSection") ? g("docSection").value.trim() || "Documents" : "Documents");
      g("docMsg").textContent = "Uploading…"; g("docMsg").className = "msg";
      try {
        const r = await authFetch("/project/doc", { method:"POST", body: fd }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || "Upload failed");
        g("docMsg").textContent = "Uploaded ✓"; g("docMsg").className = "msg ok";
        loadDocs(); loadProject();
      } catch (e) { g("docMsg").textContent = e.message; g("docMsg").className = "msg err"; }
    }

    // ── Job costing ───────────────────────────────────────────────────────────
    async function loadCosting() {
      const card = g("costingCard"); if (!card) return;
      let d;
      try { d = await authFetch("/costing/summary?site=" + encodeURIComponent(P.name) + "&from=2000-01-01").then(r => r.json()); }
      catch { return; }
      if (!d || !d.ok) return;   // no costing permission — silently omit
      const key = P.costingKey;
      const s = (d.sites || []).find(x => x.key === key) || (d.sites || []).find(x => (x.site || "").toLowerCase() === (P.name || "").toLowerCase());
      const fin = s && s.fin;
      const labour = s ? s.laborCost : 0, po = s ? s.poTotal : 0, grand = s ? s.grandTotal : 0;
      let finHtml = "";
      if (fin) {
        finHtml = `<h2 style="margin-top:14px;">📈 Valuations</h2>
          <div class="money">
            <div class="stat"><div class="n">${money(fin.value)}</div><div class="l">Contract value</div></div>
            <div class="stat"><div class="n">${money(fin.valued)}</div><div class="l">Valued to date</div></div>
            <div class="stat"><div class="n" style="color:${fin.position >= 0 ? "var(--ok)" : "var(--bad)"}">${money(fin.position)}</div><div class="l">Position (valued − cost)</div></div>
            <div class="stat"><div class="n">${money(fin.retentionHeld)}</div><div class="l">Retention held</div></div>
          </div>
          ${fin.suggestedNext ? `<p class="muted" style="font-size:12.5px;margin-top:6px;">💡 Suggested next valuation: <b>${money(fin.suggestedNext)}</b></p>` : ""}
          <p style="margin-top:6px;"><a class="btn ghost small" href="/job-costing.html">Manage valuations →</a></p>`;
      } else if (P.required && P.required.valuations) {
        finHtml = `<p class="muted" style="margin-top:10px;">No contract value set yet — use “Set contract value” in the to-do above to start tracking valuations.</p>`;
      }
      card.innerHTML = `<div class="card"><h2>💷 Job costing</h2>
        <div class="money">
          <div class="stat"><div class="n">${money(grand)}</div><div class="l">Total cost</div></div>
          <div class="stat"><div class="n">${money(labour)}</div><div class="l">Labour</div></div>
          <div class="stat"><div class="n">${money(po)}</div><div class="l">Materials / PO</div></div>
        </div>
        ${s && s.engineers && s.engineers.length ? `<div style="margin-top:10px;"><b style="font-size:13px;">People</b>${s.engineers.map(e => `<div class="frow"><span>${esc(e.name || e.user || "")}</span><span>${money(e.cost || 0)}</span></div>`).join("")}</div>` : ""}
        ${s && s.suppliers && s.suppliers.length ? `<div style="margin-top:10px;"><b style="font-size:13px;">Suppliers</b>${s.suppliers.map(su => `<div class="frow"><span>${esc(su.name || su.supplier || "")}</span><span>${money(su.total || su.cost || 0)}</span></div>`).join("")}</div>` : ""}
        ${!s ? `<p class="muted" style="margin-top:8px;">No costs recorded against this project yet.</p>` : ""}
        ${finHtml}
      </div>`;
    }
  </script>
</body>
</html>

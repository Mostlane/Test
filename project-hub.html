<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Project</title>
  <script src="/portal-config.js?v=20"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <script src="docviewer.js?v=6"></script>
  <style>
    :root { --brand:#003366; --ok:#0a7d33; --bad:#b00020; --line:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#eef1f4; color:#1f2937; }
    header.page { background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    header.page h1 { font-size:18px; margin:0; flex:1 1 auto; }
    .wrap { max-width:900px; margin:14px auto 80px; padding:0 12px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px rgba(6,24,54,.06); padding:16px; margin-bottom:14px; }
    .card h2 { margin:0 0 10px; font-size:16px; }
    .btn { background:var(--brand); color:#fff; border:none; border-radius:9px; padding:9px 13px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; }
    .btn.grey { background:#5b6b7b; } .btn.green { background:var(--ok); } .btn.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); } .btn.small { padding:6px 10px; font-size:13px; }
    .btn:disabled { opacity:.5; }
    .muted { color:#6b7a90; } .hide { display:none !important; }
    input[type=text],input[type=number],select,textarea { width:100%; padding:9px; border:1px solid #ccd5dd; border-radius:9px; font-size:14.5px; font-family:inherit; }
    textarea { min-height:70px; }
    .kv { font-size:13.5px; margin:4px 0; } .kv b { color:#334155; }
    .badge { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
    .b-live { background:#e6f6ec; color:var(--ok); } .b-complete { background:#e0e7ff; color:#3730a3; } .b-archived { background:#f1f5f9; color:#64748b; }
    .todo { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid #f0f3f7; }
    .todo:first-child { border-top:none; }
    .todo .tick { width:26px; height:26px; border-radius:50%; border:2px solid #cbd5e1; flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }
    .todo .tick.done { background:var(--ok); border-color:var(--ok); color:#fff; }
    .todo .lbl { flex:1; font-weight:600; font-size:14.5px; }
    .todo .lbl small { display:block; font-weight:400; color:#8a97a6; font-size:12px; }
    .todo .act { display:flex; gap:6px; flex-wrap:wrap; }
    .pill { display:inline-flex; align-items:center; gap:6px; background:#eef4ff; color:var(--brand); border:1px solid #cdddf5; border-radius:999px; padding:5px 10px; font-size:12.5px; font-weight:600; margin:2px 4px 2px 0; }
    .money { display:flex; gap:12px; flex-wrap:wrap; }
    .stat { flex:1 1 120px; background:#f8fafc; border:1px solid var(--line); border-radius:11px; padding:10px 12px; }
    .stat .n { font-size:19px; font-weight:800; color:#0f172a; } .stat .l { font-size:11.5px; color:#6b7a90; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
    .frow { display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid #f0f3f7; font-size:13.5px; }
    .doclist div { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid #f0f3f7; font-size:13.5px; }
    .doclist div:first-child { border-top:none; }
    .doclist .nm { flex:1; }
    .msg { font-size:13px; margin:8px 0 0; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
    .editrow { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:14px; }
    .editrow input[type=checkbox] { width:19px; height:19px; }
    .drop { border:2px dashed #b9c6d6; border-radius:12px; padding:16px; text-align:center; color:#6b7a90; cursor:pointer; font-size:13.5px; }
    .drop.over { background:#eef4ff; border-color:var(--brand); }
    /* Collapsible cards — each section is a <details class="card"> with a
       <summary> heading. State persisted per-project in localStorage. */
    details.card { padding:0; overflow:hidden; }
    details.card > summary { list-style:none; cursor:pointer; padding:14px 40px 14px 16px; font-size:16px; font-weight:600; position:relative; user-select:none; }
    details.card > summary::-webkit-details-marker { display:none; }
    details.card > summary::after { content:"▾"; position:absolute; right:16px; top:14px; color:#6b7a90; font-size:13px; transition:transform .15s; }
    details.card:not([open]) > summary::after { transform:rotate(-90deg); }
    details.card > summary h2 { display:inline; font-size:inherit; font-weight:inherit; margin:0; }
    details.card > .card-body { padding:0 16px 16px; }
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="/projects-live.html" style="text-decoration:none;">‹ Back</a>
    <h1 id="hTitle">Project</h1>
    <select id="statusSel" class="hide" style="width:auto;padding:7px 10px;color:#1f2937;"></select>
    <button id="archiveBtn" class="hide" style="width:auto;padding:7px 12px;border:1px solid #c9d2dd;border-radius:10px;background:#fff;color:#003366;font-weight:700;cursor:pointer;white-space:nowrap;"></button>
  </header>
  <div class="wrap" id="wrap"><p class="muted" style="padding:20px;">Loading…</p></div>

  <!-- Generic "attach a required document" picker: build / link existing / upload -->
  <div id="docPick" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;padding:16px;overflow:auto;">
    <div style="max-width:580px;margin:5vh auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3);">
      <div style="padding:14px 16px;border-bottom:1px solid #e6ecf3;display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <h2 style="margin:0;font-size:18px;" id="docPickTitle">Attach document</h2>
        <button class="btn grey small" id="docPickX">Close</button>
      </div>
      <div style="padding:14px 16px;">
        <div id="docBuildRow" style="display:none;margin-bottom:14px;">
          <p class="muted" style="margin:0 0 6px;">Create a new one in the portal:</p>
          <button class="btn small" id="docBuildBtn">Build</button>
        </div>
        <div id="docPortalWrap" style="display:none;">
          <hr style="border:none;border-top:1px solid #e6ecf3;margin:4px 0 10px;">
          <p class="muted" style="margin:0 0 6px;" id="docPortalLbl">…or link an existing one from the portal:</p>
          <input type="text" id="docPortalSearch" placeholder="Search…" style="width:100%;padding:8px 11px;border:1px solid #cdd7e2;border-radius:9px;font-size:14px;font-family:inherit;box-sizing:border-box;">
          <div id="docPortalList" style="margin-top:8px;max-height:34vh;overflow:auto;"><p class="muted">Loading…</p></div>
        </div>
        <hr style="border:none;border-top:1px solid #e6ecf3;margin:14px 0 8px;">
        <p class="muted" style="margin:0 0 6px;">…or attach a file (uploads to this project; engineers see it in Site Documents):</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <input type="file" id="docFileInput" accept=".pdf,application/pdf,.doc,.docx,.xls,.xlsx,image/*" style="font-size:13px;">
          <button class="btn small" id="docUpBtn">Upload &amp; attach</button>
        </div>
        <div id="docFileList" style="margin-top:10px;max-height:28vh;overflow:auto;"></div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid #e6ecf3;display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <span class="msg" id="docPickMsg"></span>
        <span><button class="btn ghost small" id="docPickCancel">Cancel</button> <button class="btn small" id="docPickSave">Save</button></span>
      </div>
    </div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    const money = n => "£" + Math.round(Number(n) || 0).toLocaleString();
    function authFetch(path, opts = {}) {
      opts.headers = Object.assign({ "Authorization": "Bearer " + localStorage.getItem("mostlaneToken") }, opts.headers || {});
      return fetch((path.startsWith("http") ? path : API + path), opts);
    }
    const PID = new URLSearchParams(location.search).get("id") || "";
    let P = null, CAN = false, FIELD = false, RAMS_DOCS = [];

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r => r.json());
        if (!me.ok || !(me.user.FullAccess === "Yes" || me.user.Projects === "Yes" || me.user.ProjectsAdmin === "Yes")) { alert("This page needs Projects access."); location.href = "/main.html"; return; }
        FIELD = String(me.user.StaffType || "").toLowerCase() === "field";
      } catch (e) { location.href = "/main.html"; return; }
      await loadProject();
    })();

    // Wrap a card body as a <details> that remembers its open/closed state per
    // project (localStorage). Default open state per key set via `defOpen`.
    function sectCard(key, title, bodyHtml, defOpen) {
      const storeKey = "mlProjHubOpen:" + PID + ":" + key;
      let open;
      try { const v = localStorage.getItem(storeKey); open = v == null ? !!defOpen : v === "1"; } catch { open = !!defOpen; }
      return `<details class="card" ${open ? "open" : ""} data-collapse="${esc(key)}">
        <summary><h2>${title}</h2></summary>
        <div class="card-body">${bodyHtml}</div>
      </details>`;
    }
    function wireCollapse() {
      document.querySelectorAll("details.card[data-collapse]").forEach(d => {
        d.addEventListener("toggle", () => {
          try { localStorage.setItem("mlProjHubOpen:" + PID + ":" + d.dataset.collapse, d.open ? "1" : "0"); } catch {}
        });
      });
    }

    async function loadProject() {
      let d;
      try { d = await authFetch("/project/get?id=" + encodeURIComponent(PID)).then(r => r.json()); }
      catch { g("wrap").innerHTML = "<p class='muted' style='padding:20px'>Couldn't load — try again.</p>"; return; }
      if (!d || !d.ok) { g("wrap").innerHTML = "<p class='muted' style='padding:20px'>" + esc((d && d.error) || "Project not found.") + "</p>"; return; }
      P = d.project; CAN = d.canManage;
      g("hTitle").textContent = P.name;
      // Status selector (admins)
      if (CAN) {
        const sel = g("statusSel"); sel.classList.remove("hide");
        sel.innerHTML = ["live", "complete", "archived"].map(s => `<option value="${s}" ${P.status === s ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("");
        sel.onchange = () => setStatus(sel.value);
        renderArchiveBtn();
      }
      render();
    }

    // The prominent Archive / Restore button — the obvious way to take a project
    // off the live list (which also stops engineers raising POs against it).
    function renderArchiveBtn() {
      const b = g("archiveBtn"); if (!b || !CAN) return;
      b.classList.remove("hide");
      const archived = (P.status || "live") === "archived";
      b.textContent = archived ? "♻ Restore" : "🗄 Archive";
      b.style.background = archived ? "#eef7f0" : "#fff";
      b.onclick = () => setStatus(archived ? "live" : "archived");
    }
    async function setStatus(status) {
      if (status === "archived") {
        const ok = window.MLUI ? await MLUI.confirm("Archive “" + (P.name || "this project") + "”? It drops off the live projects list and engineers can no longer raise POs against it. You can restore it any time.", { title: "Archive project", okLabel: "Archive", danger: true }) : confirm("Archive this project?");
        if (!ok) return;
      }
      try {
        const r = await authFetch("/project/update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, status }) }).then(r => r.json());
        if (r && r.project) P = r.project; else P.status = status;
        const sel = g("statusSel"); if (sel) sel.value = P.status || status;
        renderArchiveBtn();
        if (window.MLUI && MLUI.toast) MLUI.toast(status === "archived" ? "Project archived" : ("Project set to " + (P.status || status)));
        render();
      } catch (e) { alert("Couldn't update the project status: " + e.message); }
    }

    function render() {
      // Field engineers don't see the To-do or SiteLog settings sections —
      // those are admin/office concerns. Everything else is collapsible.
      g("wrap").innerHTML = summaryCard()
        + (FIELD ? "" : todoCard())
        + `<div id="costingCard"></div>`
        + jobsVisitsCard()
        + docsCard()
        + (FIELD ? "" : sitelogCard())
        + (CAN ? visibilityCard() : "")
        + (CAN ? requiredCard() : "");
      wire();
      wireCollapse();
      if (CAN) loadCosting();
      if (CAN) loadVisibility();
      loadJobsVisits();
      loadDocs();
      loadDocRefs();
    }

    function summaryCard() {
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <div class="kv"><b>Project number:</b> ${esc(P.number)}</div>
            <div class="kv"><b>Site:</b> own project-site ${esc(P.number)}${P.fromExisting ? " · from " + esc(P.fromExisting.name) : ""}</div>
            ${P.postcode ? `<div class="kv"><b>Location:</b> ${esc(P.postcode)}${P.lat != null ? " · " + P.lat + ", " + P.lon : ""}</div>` : ""}
            ${P.mileageRoundTrip != null ? `<div class="kv"><b>Mileage:</b> ${P.mileageRoundTrip} mi round trip from HQ</div>` : ""}
          </div>
          <span class="badge b-${esc(P.status || "live")}">${esc((P.status || "live").toUpperCase())}</span>
        </div>
      </div>`;
    }

    const BUILD = {
      programme: { open: "Open programme", build: "Build programme" },
      rams: { open: "Open", build: "Build risk assessment" },
      cpp: { open: "Open CPP", build: "Open CPP builder" },
      valuations: { open: "View valuations", build: "Set contract value" },
      projectDocs: { open: "Manage documents", build: "Add documents" },
    };
    function todoCard() {
      const items = P.todo || [];
      if (!items.length) return sectCard("todo", "✅ To-do", `<p class="muted">No documents required. ${CAN ? "Add some below." : ""}</p>`, false);
      const done = items.filter(i => i.done).length;
      const body = items.map(it => `<div class="todo">
          <span class="tick ${it.done ? "done" : ""}" ${CAN ? `data-tick="${it.key}"` : ""} title="${it.auto ? "Done automatically" : "Tap to mark done"}">${it.done ? "✓" : ""}</span>
          <span class="lbl">${esc(it.label)}${["programme","rams","cpp"].includes(it.key) ? `<small id="${it.key}RefLine"></small>` : ""}</span>
          <span class="act" data-actfor="${it.key}"></span>
        </div>`).join("");
      return sectCard("todo", `✅ To-do — ${done}/${items.length} done`, body, false);
    }

    function actionsFor(key) {
      const L = P.links || {};
      if (key === "programme") {
        const open = L.programmeId ? `<a class="btn small" href="/programme-edit.html?id=${encodeURIComponent(L.programmeId)}">${BUILD.programme.open}</a>` : "";
        return open + (CAN ? `${open ? " " : ""}<button class="btn small ghost" data-docpick="programme">📎 Add / link</button>` : "");
      }
      if (key === "rams") return CAN ? `<button class="btn small ghost" data-docpick="rams">📎 Add / link</button>` : "";
      if (key === "cpp") return CAN ? `<button class="btn small ghost" data-docpick="cpp">📎 Add / link</button>` : "";
      if (key === "valuations") { const jc = "/job-costing.html?project=" + encodeURIComponent(PID) + "&site=" + encodeURIComponent(P.name) + "&back=hub";
        return `<a class="btn small ghost" href="${jc}">${BUILD.valuations.open}</a>` + (CAN ? ` <button class="btn small" data-build="valuations">${P.contractValue ? "Update value" : BUILD.valuations.build}</button>` : ""); }
      if (key === "projectDocs") return `<a class="btn small ghost" href="#docsCard" onclick="var el=document.getElementById('docsCardEl');if(el){el.setAttribute('open','');el.scrollIntoView({behavior:'smooth'});}return false;">${CAN ? BUILD.projectDocs.build : "View documents"}</a>`;
      return "";
    }

    function docsCard() {
      const body = `${CAN ? `<div class="drop" id="dropZone">Drop a file here, or tap to choose. <br><span class="muted">Engineers with Projects access can view these (unless you hide them).</span></div>
          <div style="margin:8px 0;"><input type="text" id="docSection" placeholder="Section (e.g. Drawings) — optional" style="max-width:280px;display:inline-block;width:auto;"></div>` : ""}
        <div class="doclist" id="docList"><p class="muted">Loading…</p></div>
        <p class="msg" id="docMsg"></p>`;
      const html = sectCard("docs", "📁 Project Documents", body, false);
      // Keep the historic anchor id used by other buttons that scroll to it.
      return html.replace('<details class="card"', '<details class="card" id="docsCardEl"');
    }

    function sitelogCard() {
      const sl = P.sitelog || {};
      if (!CAN) {
        const body = `${sl.rules ? `<div class="kv"><b>Arrival message:</b><br>${esc(sl.rules).replace(/\n/g, "<br>")}</div>` : `<p class="muted">No arrival message set.</p>`}
          ${(sl.companies || []).length ? `<div class="kv"><b>Companies on site:</b> ${sl.companies.map(esc).join(", ")}</div>` : ""}`;
        return sectCard("sitelog", "📲 SiteLog", body, false);
      }
      const body = `<label class="muted" style="font-size:12px;font-weight:600;">Arrival message — everyone</label>
        <textarea id="slRules">${esc(sl.rules || "")}</textarea>
        <label class="muted" style="font-size:12px;font-weight:600;margin-top:8px;display:block;">Visitors-only extra</label>
        <textarea id="slVisitor">${esc(sl.visitorRules || "")}</textarea>
        <label class="muted" style="font-size:12px;font-weight:600;margin-top:8px;display:block;">Companies on site</label>
        <div id="coList" style="margin:4px 0;">${(sl.companies || []).map((c, i) => `<span class="pill">${esc(c)} <button data-corm="${i}" style="background:none;border:none;color:var(--brand);cursor:pointer;">✕</button></span>`).join("")}</div>
        <div style="display:flex;gap:8px;"><input type="text" id="coInput" placeholder="Add a company…" style="flex:1;"><button class="btn ghost small" id="coAdd" type="button">＋</button></div>
        <div style="margin-top:10px;"><button class="btn small" id="slSave">Save SiteLog settings</button> <span class="msg" id="slMsg" style="display:inline;"></span></div>`;
      return sectCard("sitelog", "📲 SiteLog", body, false);
    }

    function visibilityCard() {
      const list = Array.isArray(P.visibleTo) ? P.visibleTo : [];
      const mode = list.length ? "picked" : "all";
      const body = `<p class="muted" style="font-size:12.5px;margin:0 0 8px;">Admins (Full Access / Projects Admin) always see every project. Choose who else this shows up for.</p>
        <div class="editrow"><label style="display:flex;gap:8px;align-items:center;font-weight:600;margin:0;"><input type="radio" name="visMode" value="all" ${mode === "all" ? "checked" : ""}> Everyone with Projects access</label></div>
        <div class="editrow"><label style="display:flex;gap:8px;align-items:center;font-weight:600;margin:0;"><input type="radio" name="visMode" value="picked" ${mode === "picked" ? "checked" : ""}> Only the people I pick</label></div>
        <div id="visPickBox" class="${mode === "picked" ? "" : "hide"}" style="margin-top:8px;">
          <input type="search" id="visSearch" placeholder="Filter people…" style="margin-bottom:6px;">
          <div id="visPeople" style="max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 8px;"><p class="muted" style="margin:6px;">Loading people…</p></div>
        </div>
        <div style="margin-top:10px;"><button class="btn small" id="visSave">Save</button> <span class="msg" id="visMsg" style="display:inline;"></span></div>`;
      return sectCard("visibility", "👥 Who can see this project", body, false);
    }

    function requiredCard() {
      const r = P.required || {};
      const DT = [["programme","Programme of works"],["rams","Risk Assessment (RAMS)"],["cpp","Construction Phase Plan"],["valuations","Valuations"],["projectDocs","Project Documents"]];
      const body = `<p class="muted" style="font-size:12.5px;margin:0 0 8px;">Change your mind later — tick or untick what this project needs.</p>
        ${DT.map(([k, l]) => `<label class="editrow"><input type="checkbox" data-req="${k}" ${r[k] ? "checked" : ""}> ${esc(l)}</label>`).join("")}
        <div style="margin-top:8px;"><button class="btn small" id="reqSave">Save</button> <span class="msg" id="reqMsg" style="display:inline;"></span></div>`;
      return sectCard("required", "⚙ Required documents", body, false);
    }

    // ── Jobs & site visits (project spine) ────────────────────────────────────
    function jobsVisitsCard() {
      const body = `${CAN ? `<div id="jvNew"><p class="muted" style="font-size:12.5px;margin:0 0 8px;">Create a job for this project — sends it to the engineer(s) you pick; each runs their own timer.</p>
          <label style="font-size:13px;font-weight:600;display:block;margin-bottom:3px;">What's the job?</label>
          <textarea id="jvDesc" placeholder="What needs doing, access notes…" style="min-height:60px;"></textarea>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
            <div style="flex:1 1 200px;"><label style="font-size:13px;font-weight:600;">Start</label><input type="datetime-local" id="jvStart"></div>
            <div style="flex:0 0 140px;"><label style="font-size:13px;font-weight:600;">Duration (mins)</label><input type="number" id="jvDur" placeholder="60" min="15" step="15"></div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;font-weight:600;cursor:pointer;"><input type="checkbox" id="jvMulti" style="width:auto;"> 📆 Send as multiple days (drip-fed)</label>
          <div id="jvMultiPanel" class="hide" style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#f8fafc;">
            <p class="muted" style="font-size:12px;margin:0 0 8px;">Each day is hidden from the engineer until the reveal time the evening before — you see them all in the scheduler. A day auto-skips if they already have another job that day.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <div style="flex:1 1 120px;"><label style="font-size:12.5px;font-weight:600;">First day</label><input type="date" id="jvFirst"></div>
              <div style="flex:0 0 90px;"><label style="font-size:12.5px;font-weight:600;">How many days</label><input type="number" id="jvDays" value="5" min="1" max="60" step="1"></div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">

    function wireCreateJob() {

    // Compute the drip-feed days client-side (browser = London time), skipping
    // weekends unless included. Matches how the SLA scheduler builds times.
    function buildSeriesDays() {
      const n = Math.max(1, Math.min(60, Number(document.getElementById("jvDays").value) || 1));
      const firstStr = document.getElementById("jvFirst").value;
      const first = firstStr ? new Date(firstStr + "T00:00:00") : (() => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(0,0,0,0); return d; })();
      const [sh, sm] = (document.getElementById("jvDayStart").value || "08:00").split(":").map(Number);
      const [fh, fm] = (document.getElementById("jvDayEnd").value || "16:00").split(":").map(Number);
      const wk = document.getElementById("jvWeekends").checked;
      const out = []; const cur = new Date(first);
      let guard = 0;
      while (out.length < n && guard++ < 400) {
        const dow = cur.getDay();
        if (wk || (dow !== 0 && dow !== 6)) {
          const s = new Date(cur); s.setHours(sh, sm, 0, 0);
          const f = new Date(cur); f.setHours(fh, fm, 0, 0);
          let dur = Math.round((f - s) / 60000); if (dur <= 0) dur += 24 * 60;
          out.push({ scheduledAt: s.toISOString(), durationMinutes: dur });
        }
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }
    function renderDayPreview() {
      const el = document.getElementById("jvPreview"); if (!el) return;
      try {
        const days = buildSeriesDays();
        if (!days.length) { el.textContent = ""; return; }
        const f = iso => new Date(iso).toLocaleDateString("en-GB", { weekday:"short", day:"2-digit", month:"short" });
        el.textContent = days.length + " day" + (days.length===1?"":"s") + ": " + f(days[0].scheduledAt) + " → " + f(days[days.length-1].scheduledAt);
      } catch { el.textContent = ""; }
    }

      const scheduledAt = document.getElementById("jvStart").value ? new Date(document.getElementById("jvStart").value).toISOString() : null;
      const durationMinutes = document.getElementById("jvDur").value ? Number(document.getElementById("jvDur").value) : null;
      msg.textContent = "Creating…"; msg.className = "msg";
      try {
        const r = await authFetch("/project/create-job", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, description: desc, engineers, scheduledAt, durationMinutes }) }).then(r => r.json());

    async function createProjectSeries() {

        const data = { title: P.name, client: "projects", site: P.name, projectId: PID, contractors: [], tasks: [] };
        const r = await authFetch("/prog/save", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ title: P.name, client: "projects", site: P.name, data }) }).then(r => r.json());
        if (r.ok && r.id) { await authFetch("/project/link", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, kind: "programme", value: r.id }) }); location.href = "/programme-edit.html?id=" + encodeURIComponent(r.id); }
        return;
      }
      if (kind === "rams") { location.href = "/hs-docs.html?newRams=1&site=" + encodeURIComponent(P.name) + "&project=" + encodeURIComponent(PID); return; }
      if (kind === "cpp") {
        // Mark the CPP as started (links it), then open the builder pre-filled.
        await authFetch("/project/link", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, kind: "cpp", value: P.number }) });
        try {
          const c = await authFetch("/hs-plan-config").then(r => r.json());
          if (c && c.ok && c.token) location.href = "hs-plan/#worker=" + encodeURIComponent(c.worker) + "&token=" + encodeURIComponent(c.token) + "&projectName=" + encodeURIComponent(P.name) + "&projectNo=" + encodeURIComponent(P.number);
          else alert("The Construction Phase Plan tool isn't configured for your account.");
        } catch { alert("Couldn't open the Construction Phase Plan tool."); }
        return;
      }
      if (kind === "valuations") {
        const cur = P.contractValue || "";
        const v = prompt("Contract value for this project (£):", cur);
        if (v === null) return;
        const num = Number(String(v).replace(/[^0-9.]/g, ""));
        const r = await authFetch("/project/update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, contractValue: num || null, required: { valuations: true } }) }).then(r => r.json());
        if (r.ok) { P = r.project; render(); }
        return;
      }
    }

    // ── Required-document attach: build / link existing (portal) / upload file ──
    function fmtDay(s) { if (!s) return ""; const d = new Date(String(s).replace(" ", "T") + (/[zZ]|[+\-]\d\d:?\d\d$/.test(s) ? "" : "Z")); return isNaN(d) ? "" : d.toLocaleDateString("en-GB"); }

    // Per-required-document config. `build` reuses build(kind); `portal` (when set)
    // is how to list & link an existing portal record. Every type also supports
    // attaching a file (stored in links.docFiles[key]) which surfaces to engineers
    // in Site Documents.
    const DOCTYPES = {
      programme: {
        title: "📊 Programme of works", build: () => build("programme"), buildLabel: "Build in the portal",
        portal: {
          label: "…or link an existing programme:", single: true, linkKind: "programme",
          list: async () => (await authFetch("/prog/list").then(r => r.json()).catch(() => ({}))).programmes || [],
          linked: () => (P.links && P.links.programmeId) ? [P.links.programmeId] : [],
          name: x => x.title || x.site || x.id, sub: x => [x.site, x.client].filter(Boolean).join(" · "),
          match: (x, q) => (String(x.title || "") + " " + String(x.site || "") + " " + String(x.client || "")).toLowerCase().includes(q),
        },
      },
      rams: {
        title: "🦺 Risk Assessment (RAMS)", build: () => build("rams"), buildLabel: "Build in the portal",
        portal: {
          label: "…or link an existing RAMS from the portal:", single: false, linkKind: "rams", removeKind: "rams-remove",
          list: async () => (await authFetch("/hs/docs?type=rams").then(r => r.json()).catch(() => ({}))).docs || [],
          linked: () => (P.links && P.links.ramsIds) || [],
          name: x => x.ref || "RAMS", sub: x => [x.site, x.status, x.created_at ? fmtDay(x.created_at) : ""].filter(Boolean).join(" · "),
          match: (x, q) => (String(x.ref || "") + " " + String(x.site || "")).toLowerCase().includes(q),
        },
      },
      cpp: {
        title: "📄 Construction Phase Plan", build: () => build("cpp"), buildLabel: "Build in the planner",
        portal: null, // CPPs aren't stored in the portal — attach the file instead
      },
    };

    // Linked-doc pills on each to-do row (programme / rams / cpp).
    async function loadDocRefs() {
      const keys = ["programme", "rams", "cpp"].filter(k => g(k + "RefLine"));
      if (!keys.length) return;
      const L = P.links || {}, df = L.docFiles || {};
      let docs = [];
      try { docs = (await authFetch("/project/docs?id=" + encodeURIComponent(PID)).then(r => r.json())).files || []; } catch {}
      const docById = {}; docs.forEach(f => docById[f.id] = f);
      let ramsBy = {}, progBy = {};
      if ((L.ramsIds || []).length) { try { ((await authFetch("/hs/docs?type=rams").then(r => r.json())).docs || []).forEach(x => ramsBy[x.id] = x); } catch {} }
      if (L.programmeId) { try { ((await authFetch("/prog/list").then(r => r.json())).programmes || []).forEach(x => progBy[x.id] = x); } catch {} }
      const filePill = id => { const f = docById[id]; return f ? `<a class="pill" href="#" data-docopen="${esc(f.url)}" data-docname="${esc(f.title || "File")}" style="text-decoration:none;">📎 ${esc(f.title || "File")}</a>` : ""; };
      for (const key of keys) {
        const line = g(key + "RefLine"); const pills = [];
        if (key === "programme" && L.programmeId) pills.push(`<a class="pill" href="/programme-edit.html?id=${encodeURIComponent(L.programmeId)}" style="text-decoration:none;">📊 ${esc((progBy[L.programmeId] && (progBy[L.programmeId].title || progBy[L.programmeId].site)) || "Programme")}</a>`);
        if (key === "rams") (L.ramsIds || []).forEach(id => pills.push(`<a class="pill" href="/hs-docs.html?open=${encodeURIComponent(id)}" style="text-decoration:none;">🦺 ${esc((ramsBy[id] && ramsBy[id].ref) || "RAMS")}</a>`));
        (df[key] || []).forEach(id => { const p = filePill(id); if (p) pills.push(p); });
        line.innerHTML = pills.length ? " " + pills.join(" ") : "";
      }
      document.querySelectorAll("[data-docopen]").forEach(a => a.onclick = e => { e.preventDefault();
        if (window.MLDocViewer) MLDocViewer.open({ url: a.dataset.docopen, fetchUrl: a.dataset.docopen, name: a.dataset.docname, downloadUrl: a.dataset.docopen });
        else window.open(a.dataset.docopen, "_blank");
      });
    }

    // The generic picker.
    let DP = null; // { key, cfg, portalAll, portalSel:Set, projDocs, fileSel:Set }
    async function openDocPicker(key) {
      const cfg = DOCTYPES[key]; if (!cfg) return;
      DP = { key, cfg, portalAll: [], portalSel: new Set(cfg.portal ? cfg.portal.linked() : []), projDocs: [], fileSel: new Set((P.links && P.links.docFiles && P.links.docFiles[key]) || []) };
      g("docPickTitle").textContent = cfg.title;
      g("docPickMsg").textContent = ""; g("docPickMsg").className = "msg";
      g("docFileInput").value = "";
      const br = g("docBuildRow");
      if (cfg.build) { br.style.display = ""; g("docBuildBtn").textContent = "＋ " + (cfg.buildLabel || "Build in the portal"); } else br.style.display = "none";
      const pw = g("docPortalWrap");
      if (cfg.portal) { pw.style.display = ""; g("docPortalLbl").textContent = cfg.portal.label; g("docPortalSearch").value = ""; g("docPortalList").innerHTML = "<p class='muted'>Loading…</p>"; } else pw.style.display = "none";
      g("docFileList").innerHTML = "<p class='muted'>Loading documents…</p>";

      await refreshProjDocs();

    function closeDocPicker() { g("docPick").style.display = "none"; DP = null; }
    function renderPortalList() {
      if (!DP || !DP.cfg.portal) return;
      const cfg = DP.cfg.portal, q = (g("docPortalSearch").value || "").toLowerCase().trim();
      const el = g("docPortalList");
      if (!DP.portalAll.length) { el.innerHTML = "<p class='muted'>None found in the portal yet.</p>"; return; }
      const list = DP.portalAll.filter(x => !q || cfg.match(x, q));
      if (!list.length) { el.innerHTML = "<p class='muted'>No matches.</p>"; return; }
      const type = cfg.single ? "radio" : "checkbox";
      el.innerHTML = list.map(x => {
        const on = DP.portalSel.has(x.id);
        return `<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid #eef1f5;cursor:pointer;">
          <input type="${type}" name="docPortal" data-pid="${esc(x.id)}" ${on ? "checked" : ""} style="margin-top:3px;width:18px;height:18px;">
          <span><b>${esc(cfg.name(x))}</b>${cfg.sub(x) ? ` <span class="muted" style="font-size:12px;">· ${esc(cfg.sub(x))}</span>` : ""}</span>
        </label>`;
      }).join("");
      el.querySelectorAll("[data-pid]").forEach(inp => inp.onchange = () => {
        if (cfg.single) DP.portalSel = new Set(inp.checked ? [inp.dataset.pid] : []);
        else inp.checked ? DP.portalSel.add(inp.dataset.pid) : DP.portalSel.delete(inp.dataset.pid);
      });

    async function refreshProjDocs() {
      try { DP.projDocs = (await authFetch("/project/docs?id=" + encodeURIComponent(PID)).then(r => r.json())).files || []; } catch { DP.projDocs = []; }
      renderFileList();
    }
    function renderFileList() {
      if (!DP) return;
      const el = g("docFileList");
      if (!DP.projDocs.length) { el.innerHTML = "<p class='muted'>No files on this project yet — upload one above.</p>"; return; }
      el.innerHTML = "<p class='muted' style='margin:0 0 4px;'>…or tick an existing project file:</p>" + DP.projDocs.map(f => {
        const on = DP.fileSel.has(f.id);
        return `<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid #eef1f5;cursor:pointer;">
          <input type="checkbox" data-fid="${esc(f.id)}" ${on ? "checked" : ""} style="margin-top:3px;width:18px;height:18px;">
          <span>📎 <b>${esc(f.title || "Document")}</b>${f.section ? ` <span class="muted" style="font-size:12px;">· ${esc(f.section)}</span>` : ""}</span>
        </label>`;
      }).join("");
      el.querySelectorAll("[data-fid]").forEach(cb => cb.onchange = () => { cb.checked ? DP.fileSel.add(cb.dataset.fid) : DP.fileSel.delete(cb.dataset.fid); });
    }
    async function uploadDocFile() {
      if (!DP) return;
      const inp = g("docFileInput"), file = inp.files && inp.files[0];
      if (!file) { g("docPickMsg").textContent = "Choose a file first."; g("docPickMsg").className = "msg err"; return; }
      g("docPickMsg").textContent = "Uploading…"; g("docPickMsg").className = "msg"; g("docUpBtn").disabled = true;
      try {
        const fd = new FormData(); fd.append("file", file); fd.append("id", PID); fd.append("section", DP.cfg.title.replace(/^[^A-Za-z0-9]+/, "").trim()); fd.append("title", file.name);
        const r = await authFetch("/project/doc", { method: "POST", body: fd }).then(r => r.json());
        if (r.ok && r.id) {
          await authFetch("/project/link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: PID, kind: "doc-file", docKey: DP.key, value: r.id }) });
          P.links = P.links || {}; P.links.docFiles = P.links.docFiles || {}; P.links.docFiles[DP.key] = P.links.docFiles[DP.key] || [];
          if (!P.links.docFiles[DP.key].includes(r.id)) P.links.docFiles[DP.key].push(r.id);
          DP.fileSel.add(r.id); inp.value = "";
          g("docPickMsg").textContent = "Uploaded & attached ✓"; g("docPickMsg").className = "msg ok";
          await refreshProjDocs();
        } else { g("docPickMsg").textContent = r.error || "Upload failed."; g("docPickMsg").className = "msg err"; }
      } catch { g("docPickMsg").textContent = "Upload failed — try again."; g("docPickMsg").className = "msg err"; }
      g("docUpBtn").disabled = false;
    }
    async function saveDocPicker() {
      if (!DP) return;
      const key = DP.key, cfg = DP.cfg;
      g("docPickMsg").textContent = "Saving…"; g("docPickMsg").className = "msg"; g("docPickSave").disabled = true;
      const link = body => authFetch("/project/link", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ id: PID }, body)) });
      try {
        if (cfg.portal) {
          if (cfg.portal.single) {
            const chosen = [...DP.portalSel][0] || "", cur = (P.links && P.links.programmeId) || "";
            if (chosen !== cur) await link({ kind: cfg.portal.linkKind, value: chosen });
          } else {
            const before = new Set(cfg.portal.linked());
            for (const id of [...DP.portalSel].filter(x => !before.has(x))) await link({ kind: cfg.portal.linkKind, value: id });
            for (const id of [...before].filter(x => !DP.portalSel.has(x))) await link({ kind: cfg.portal.removeKind, value: id });
          }
        }
        const fbefore = new Set((P.links && P.links.docFiles && P.links.docFiles[key]) || []);
        for (const id of [...DP.fileSel].filter(x => !fbefore.has(x))) await link({ kind: "doc-file", docKey: key, value: id });
        for (const id of [...fbefore].filter(x => !DP.fileSel.has(x))) await link({ kind: "doc-file-remove", docKey: key, value: id });
        g("docPickSave").disabled = false; closeDocPicker(); await loadProject();
      } catch { g("docPickSave").disabled = false; g("docPickMsg").textContent = "Couldn't save — try again."; g("docPickMsg").className = "msg err"; }
    }
    g("docPickX").onclick = closeDocPicker;
    g("docPickCancel").onclick = closeDocPicker;
    g("docPickSave").onclick = saveDocPicker;
    g("docUpBtn").onclick = uploadDocFile;
    g("docBuildBtn").onclick = () => { if (DP && DP.cfg.build) DP.cfg.build(); };
    g("docPortalSearch").addEventListener("input", renderPortalList);
    g("docPick").addEventListener("click", e => { if (e.target === g("docPick")) closeDocPicker(); });

    // ── Documents ─────────────────────────────────────────────────────────────
    async function loadDocs() {
      let d;
      try { d = await authFetch("/project/docs?id=" + encodeURIComponent(PID)).then(r => r.json()); } catch { return; }
      const list = g("docList"); if (!list) return;
      const files = (d && d.files) || [];
      if (!files.length) { list.innerHTML = `<p class="muted">No documents yet.</p>`; return; }
      list.innerHTML = files.map(f => `<div>
        <span class="nm">📄 <a href="#" data-open="${esc(f.url)}" data-name="${esc(f.title)}" style="text-decoration:none;">${esc(f.title)}</a>${f.hidden ? ' <span class="muted">(hidden)</span>' : ""}<br><span class="muted" style="font-size:12px;">${esc(f.section || "")} · ${esc(f.uploadedBy || "")}</span></span>
        ${CAN ? `<button class="btn grey small" data-hide="${f.id}" data-h="${f.hidden ? 1 : 0}">${f.hidden ? "Show" : "Hide"}</button><button class="btn red small" data-del="${f.id}" style="background:#b00020;">✕</button>` : ""}
      </div>`).join("");
      list.querySelectorAll("[data-open]").forEach(a => a.onclick = e => { e.preventDefault();
        if (window.MLDocViewer) MLDocViewer.open({ url: a.dataset.open, fetchUrl: a.dataset.open, name: a.dataset.name, downloadUrl: a.dataset.open });
        else window.open(a.dataset.open, "_blank");
      });
      if (CAN) {
        list.querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => { await authFetch("/project/doc-update", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fileId: b.dataset.hide, hidden: b.dataset.h !== "1" }) }); loadDocs(); });
        list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("Delete this document?")) return; await authFetch("/project/doc-delete", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ fileId: b.dataset.del }) }); loadDocs(); loadProject(); });
      }
    }
    function wireDrop() {
      const dz = g("dropZone"); if (!dz) return;
      const pick = () => { const inp = document.createElement("input"); inp.type = "file"; inp.onchange = () => inp.files[0] && upload(inp.files[0]); inp.click(); };
      dz.onclick = pick;
      dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
      dz.ondragleave = () => dz.classList.remove("over");
      dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
    }
    async function upload(file) {
      const fd = new FormData(); fd.append("file", file); fd.append("id", PID);
      fd.append("title", file.name); fd.append("section", g("docSection") ? g("docSection").value.trim() || "Documents" : "Documents");
      g("docMsg").textContent = "Uploading…"; g("docMsg").className = "msg";
      try {
        const r = await authFetch("/project/doc", { method:"POST", body: fd }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || "Upload failed");
        g("docMsg").textContent = "Uploaded ✓"; g("docMsg").className = "msg ok";
        loadDocs(); loadProject();
      } catch (e) { g("docMsg").textContent = e.message; g("docMsg").className = "msg err"; }
    }

    // ── Job costing ───────────────────────────────────────────────────────────
    // Contract value vs total cost = projected profit/loss + margin. Admins can
    // also add manual labour shifts (hours × rate → auto-cost) and material
    // costs — both feed into the same totals via /costing/summary.
    async function loadCosting() {
      const card = g("costingCard"); if (!card) return;
      // Engineer dropdown for manual labour shifts needs the user list; if the
      // Jobs & site visits card hasn't loaded it yet, fetch it here.
      if (CAN && !ENGS) { try { const u = await authFetch("/users").then(r => r.json()); ENGS = (u.Users || u.users || []).filter(x => x.Username && String(x.Status || "Active") !== "Disabled"); } catch { ENGS = []; } }
      let d, costs = { costs: [] };
      try { d = await authFetch("/costing/summary?site=" + encodeURIComponent(P.name) + "&from=2000-01-01").then(r => r.json()); }
      catch { return; }
      if (!d || !d.ok) return;   // no costing permission — silently omit
      try { costs = await authFetch("/project/costs?id=" + encodeURIComponent(PID)).then(r => r.json()) || costs; } catch {}
      const s = (d.sites || []).find(x => x.project && x.project.id === PID) || (d.sites || []).find(x => x.key === P.costingKey) || (d.sites || []).find(x => (x.site || "").toLowerCase() === (P.name || "").toLowerCase());
      const fin = s && s.fin;
      const labour = s ? (s.laborCost || 0) : 0;
      const po = s ? (s.poTotal || 0) : 0;
      const manualLab = s ? (s.manualLabour || 0) : 0;
      const manualMat = s ? (s.manualMaterials || 0) : 0;
      const grand = s ? (s.grandTotal || 0) : 0;
      const contract = (fin && fin.value) || P.contractValue || 0;
      const pnl = contract ? Math.round((contract - grand) * 100) / 100 : null;
      const margin = contract ? Math.round(((contract - grand) / contract) * 1000) / 10 : null;
      const pos = pnl == null ? "" : (pnl >= 0 ? "var(--ok)" : "var(--bad)");
      const costingHref = "/job-costing.html?project=" + encodeURIComponent(PID) + "&site=" + encodeURIComponent(P.name) + "&back=hub";

      // P&L headline
      const pnlBlock = `<div class="money" style="margin-top:8px;">
        <div class="stat"><div class="n">${money(contract)}</div><div class="l">Contract value</div></div>
        <div class="stat"><div class="n">${money(grand)}</div><div class="l">Total cost</div></div>
        <div class="stat"><div class="n" style="color:${pos}">${pnl == null ? "—" : money(pnl)}</div><div class="l">Projected ${pnl != null && pnl < 0 ? "loss" : "profit"}</div></div>
        <div class="stat"><div class="n" style="color:${pos}">${margin == null ? "—" : margin + "%"}</div><div class="l">Margin</div></div>
      </div>`;
      const breakdown = `<div style="margin-top:10px;font-size:13.5px;">
        <div class="frow"><span>🛠 Captured labour <span class="muted" style="font-size:12px;">(status-tap timers + SiteLog)</span></span><b>${money(labour - manualLab)}</b></div>
        <div class="frow"><span>➕ Manual labour shifts</span><b>${money(manualLab)}</b></div>
        <div class="frow"><span>🧾 PO materials <span class="muted" style="font-size:12px;">(from the PO system)</span></span><b>${money(po - manualMat)}</b></div>
        <div class="frow"><span>➕ Manual materials</span><b>${money(manualMat)}</b></div>
      </div>`;
      // Valuations block (unchanged behaviour; existing proj_fin)
      let finHtml = "";
      if (fin) {
        finHtml = `<h2 style="margin-top:14px;">📈 Valuations</h2>
          <div class="money">
            <div class="stat"><div class="n">${money(fin.valued)}</div><div class="l">Valued to date</div></div>
            <div class="stat"><div class="n" style="color:${fin.position >= 0 ? "var(--ok)" : "var(--bad)"}">${money(fin.position)}</div><div class="l">Position (valued − cost)</div></div>
            <div class="stat"><div class="n">${money(fin.retentionHeld)}</div><div class="l">Retention held</div></div>
            <div class="stat"><div class="n">${money(fin.remainingValue)}</div><div class="l">Left to value</div></div>
          </div>
          ${fin.suggestedNext ? `<p class="muted" style="font-size:12.5px;margin-top:6px;">💡 Suggested next valuation: <b>${money(fin.suggestedNext)}</b></p>` : ""}
          <p style="margin-top:6px;"><a class="btn ghost small" href="${costingHref}">Manage valuations →</a></p>`;
      } else if (P.required && P.required.valuations) {
        finHtml = `<p class="muted" style="margin-top:10px;">No contract value set yet — use “Set contract value” in the to-do above to start tracking valuations.</p>`;
      }
      // Manual entry forms (admin only)
      const engOpts = (ENGS || []).filter(u => String(u.StaffType || "").toLowerCase() === "field").sort((a, b) => ((a.FirstName || a.Username) + "").localeCompare((b.FirstName || b.Username) + ""))
        .map(u => `<option value="${esc(u.Username)}">${esc(((u.FirstName || "") + " " + (u.LastName || "")).trim() || u.Username)}</option>`).join("");
      const manualForms = CAN ? `
        <div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;">
          <h3 style="margin:0 0 8px;font-size:14.5px;">➕ Log a labour shift <span class="muted" style="font-size:12px;font-weight:400;">(auto-costed from the engineer's rate)</span></h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;">
            <div style="flex:1 1 180px;"><label style="font-size:12px;font-weight:600;">Engineer</label><select id="labUser"><option value="">Select…</option>${engOpts}</select></div>
            <div style="flex:0 0 140px;"><label style="font-size:12px;font-weight:600;">Date</label><input type="date" id="labDate" value="${new Date().toISOString().slice(0,10)}"></div>
            <div style="flex:0 0 90px;"><label style="font-size:12px;font-weight:600;">Hours</label><input type="number" id="labHours" min="0" step="0.25" placeholder="8"></div>
            <div style="flex:0 0 120px;"><label style="font-size:12px;font-weight:600;">Rate £/hr <span class="muted" style="font-size:11px;">(opt)</span></label><input type="number" id="labRate" min="0" step="0.5" placeholder="auto"></div>
            <div style="flex:1 1 200px;"><label style="font-size:12px;font-weight:600;">Note (opt)</label><input type="text" id="labNote" placeholder="e.g. Second fix"></div>
            <button class="btn small" id="labAdd">Add shift</button>
          </div>
          <p class="msg" id="labMsg" style="margin-top:6px;"></p>

          <h3 style="margin:12px 0 8px;font-size:14.5px;">➕ Add a material cost</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;">
            <div style="flex:0 0 140px;"><label style="font-size:12px;font-weight:600;">Date</label><input type="date" id="matDate" value="${new Date().toISOString().slice(0,10)}"></div>
            <div style="flex:1 1 200px;"><label style="font-size:12px;font-weight:600;">Description</label><input type="text" id="matDesc" placeholder="e.g. Screws / plaster"></div>
            <div style="flex:1 1 160px;"><label style="font-size:12px;font-weight:600;">Supplier (opt)</label><input type="text" id="matSup" placeholder="e.g. Screwfix"></div>
            <div style="flex:0 0 120px;"><label style="font-size:12px;font-weight:600;">Amount £ ex-VAT</label><input type="number" id="matAmt" min="0" step="0.01" placeholder="123.45"></div>
            <button class="btn small" id="matAdd">Add material</button>
          </div>
          <p class="msg" id="matMsg" style="margin-top:6px;"></p>
        </div>` : "";
      // Recent manual entries
      const rows = (costs.costs || []);
      const rowsHtml = rows.length ? `<div style="margin-top:14px;">
        <h3 style="margin:0 0 6px;font-size:14.5px;">Manual entries</h3>
        ${rows.map(r => {
          const who = r.kind === "labour" ? `👷 ${esc(r.username)} · ${r.hours}h${r.rate ? " @ £" + r.rate : ""}` : `🧾 ${esc(r.supplier || "material")}`;
          return `<div class="frow"><span>${esc(r.date)} · ${who}${r.description ? " · <span class='muted' style='font-size:12.5px;'>" + esc(r.description) + "</span>" : ""}</span><span><b>${money(r.amount)}</b> ${CAN ? `<button class="btn small grey" data-costdel="${esc(r.id)}" style="padding:3px 8px;font-size:12px;">✕</button>` : ""}</span></div>`;
        }).join("")}
      </div>` : "";
      const poBtn = CAN ? `<button class="btn small ghost" id="poSyncBtn" title="Register this project's site in the PO system so a PO can pick it (add-only)">🔄 Sync to PO</button>` : "";
      const body = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${poBtn}<a class="btn small ghost" href="${costingHref}" title="Open this project in Job Costing">Open in Job Costing →</a></div>
        ${pnlBlock}
        ${breakdown}
        ${s && s.engineers && s.engineers.length ? `<div style="margin-top:10px;"><b style="font-size:13px;">People</b>${s.engineers.map(e => `<div class="frow"><span>${esc(e.name || e.user || "")}</span><span>${money(e.cost || 0)}</span></div>`).join("")}</div>` : ""}
        ${s && s.suppliers && s.suppliers.length ? `<div style="margin-top:10px;"><b style="font-size:13px;">Suppliers</b>${s.suppliers.map(su => `<div class="frow"><span>${esc(su.name || su.supplier || "")}</span><span>${money(su.total || su.cost || 0)}</span></div>`).join("")}</div>` : ""}
        ${!s ? `<p class="muted" style="margin-top:8px;">No costs recorded against this project yet.</p>` : ""}
        ${manualForms}
        ${rowsHtml}
        ${finHtml}`;
      card.innerHTML = sectCard("costing", "💷 Job costing &amp; P&amp;L", body, false);
      wireCollapse();
      if (CAN) wireCostForms();
    }
    function wireCostForms() {
      const labAdd = document.getElementById("labAdd"), matAdd = document.getElementById("matAdd");
      if (labAdd) labAdd.onclick = addLabour;
      if (matAdd) matAdd.onclick = addMaterial;
      const po = document.getElementById("poSyncBtn");
      if (po) po.onclick = async () => {
        po.disabled = true; const oldTxt = po.textContent; po.textContent = "Syncing…";
        try {
          const r = await authFetch("/project/push-po", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID }) }).then(r => r.json());
          if (r.ok) po.textContent = "✓ Synced";
          else po.textContent = r.poBound === false ? "✗ PO_DB not bound" : "✗ Sync failed";
        } catch { po.textContent = "✗ Sync failed"; }
        setTimeout(() => { po.textContent = oldTxt; po.disabled = false; }, 3200);
      };
      document.querySelectorAll("[data-costdel]").forEach(b => b.onclick = async () => {
        if (!(window.MLUI ? await MLUI.confirm("Delete this entry?", { danger: true }) : confirm("Delete this entry?"))) return;
        await authFetch("/project/cost-delete", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ id: PID, costId: b.dataset.costdel }) });
        loadCosting(); loadJobsVisits();
      });
    }
    async function addLabour() {
      const msg = document.getElementById("labMsg"); msg.className = "msg"; msg.textContent = "";
      const body = { id: PID, kind: "labour",
        username: document.getElementById("labUser").value,
        date: document.getElementById("labDate").value,
        hours: Number(document.getElementById("labHours").value),
        rate: document.getElementById("labRate").value ? Number(document.getElementById("labRate").value) : undefined,
        description: document.getElementById("labNote").value };
      if (!body.username) { msg.className = "msg err"; msg.textContent = "Pick an engineer."; return; }
      if (!(body.hours > 0)) { msg.className = "msg err"; msg.textContent = "Hours must be > 0."; return; }
      msg.textContent = "Saving…";
      try {
        const r = await authFetch("/project/cost", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || "Couldn't save");
        msg.className = "msg ok"; msg.textContent = "Added ✓ (£" + (r.amount || 0).toFixed(2) + ")";
        document.getElementById("labHours").value = ""; document.getElementById("labRate").value = ""; document.getElementById("labNote").value = "";
        loadCosting(); loadJobsVisits();
      } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    }
    async function addMaterial() {
      const msg = document.getElementById("matMsg"); msg.className = "msg"; msg.textContent = "";
      const body = { id: PID, kind: "material",
        date: document.getElementById("matDate").value,
        description: document.getElementById("matDesc").value,
        supplier: document.getElementById("matSup").value,
        amount: Number(document.getElementById("matAmt").value) };
      if (!body.description) { msg.className = "msg err"; msg.textContent = "Enter a description."; return; }
      if (!(body.amount > 0)) { msg.className = "msg err"; msg.textContent = "Amount must be > 0."; return; }
      msg.textContent = "Saving…";
      try {
        const r = await authFetch("/project/cost", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || "Couldn't save");
        msg.className = "msg ok"; msg.textContent = "Added ✓";
        document.getElementById("matDesc").value = ""; document.getElementById("matSup").value = ""; document.getElementById("matAmt").value = "";
        loadCosting(); loadJobsVisits();
      } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    }
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Coal Park Lane">
  <defs>
    <path id="cplTop" d="M 66 200 A 134 134 0 0 1 334 200" fill="none"/>
  </defs>

  <!-- badge -->
  <circle cx="200" cy="200" r="196" fill="#0a5c36"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#e8b02e" stroke-width="14"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#e8b02e" stroke-width="2" opacity="0.55"/>

  <!-- top arc wordmark -->
  <text font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700"
        font-size="33" letter-spacing="3" fill="#f6f2e6">
    <textPath href="#cplTop" startOffset="50%" text-anchor="middle">COAL PARK LANE</textPath>
  </text>

  <!-- football -->
  <g>
    <circle cx="200" cy="206" r="46" fill="#ffffff" stroke="#082b1a" stroke-width="2.5"/>
    <!-- seams -->
    <g stroke="#111111" stroke-width="2.4" stroke-linecap="round">
      <line x1="200" y1="191" x2="200" y2="160"/>
      <line x1="214.3" y1="201.4" x2="243.7" y2="191.8"/>
      <line x1="208.8" y1="218.1" x2="227.0" y2="243.2"/>
      <line x1="191.2" y1="218.1" x2="173.0" y2="243.2"/>
      <line x1="185.7" y1="201.4" x2="156.3" y2="191.8"/>
    </g>
    <!-- centre pentagon -->
    <polygon points="200,191 214.3,201.4 208.8,218.1 191.2,218.1 185.7,201.4" fill="#111111"/>
  </g>

  <!-- bottom label -->
  <text x="200" y="300" text-anchor="middle"
        font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700"
        font-size="20" letter-spacing="3" fill="#e8b02e">SWANWICK</text>
  <circle cx="150" cy="294" r="2.6" fill="#e8b02e"/>
  <circle cx="250" cy="294" r="2.6" fill="#e8b02e"/>
</svg>

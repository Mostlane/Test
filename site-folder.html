<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=23"></script>
  <meta charset="UTF-8">
  <title>Mostlane • Site Documents</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="auth.js"></script>
  <script src="/docviewer.js?v=6"></script>
  <style>
    :root{ --ml-blue:#003b82; --border:#d1d5db; --muted:#6b7280; --panel:rgba(255,255,255,0.95); }
    html{background:#e6e8eb;}
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;background:transparent;background-size:180%;}
    .shell{max-width:960px;margin:18px auto 40px;padding:0 12px;}
    .card{background:var(--panel);border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,0.12);border:1px solid rgba(15,23,42,0.05);overflow:hidden;}
    header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid #e5e7eb;background:linear-gradient(90deg,#fff,#f3f4f6);flex-wrap:wrap;}
    header.top h1{margin:0;font-size:19px;color:var(--ml-blue);}
    header.top .sub{font-size:12px;color:var(--muted);margin-top:2px;}
    .btn{border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;background:#f9fafb;color:#0f172a;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
    .btn.primary{background:var(--ml-blue);color:#fff;border-color:var(--ml-blue);}
    .btn.small{padding:5px 10px;font-size:12px;}
    .btn.danger{color:#b91c1c;border-color:#fca5a5;background:#fff;}
    .tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 12px 0;border-bottom:1px solid #e5e7eb;background:#f9fafb;-webkit-overflow-scrolling:touch;}
    .tab{padding:9px 13px;font-size:13px;border:0;background:transparent;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;}
    .tab.active{color:var(--ml-blue);border-bottom-color:var(--ml-blue);font-weight:600;}
    .tab .cnt{background:#e5e7eb;border-radius:8px;padding:0 6px;font-size:11px;}
    .tab.addtab{color:#0d7a3f;font-weight:600;}
    .content{padding:16px 18px 20px;min-height:200px;}
    .muted{color:var(--muted);}
    .empty{color:var(--muted);font-size:14px;padding:24px 4px;text-align:center;}

    /* previous jobs */
    .jobrow{border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden;}
    .jobrow .head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;flex-wrap:wrap;}
    .ref{font-family:monospace;background:#f3f4f6;padding:2px 6px;border-radius:6px;font-size:12px;}
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto;}
    .jobrow .desc{font-weight:600;flex:1;min-width:120px;}
    .jobrow .when{font-size:12px;color:var(--muted);}
    .jobrow .body{display:none;padding:0 13px 12px;font-size:13px;color:#334155;}
    .jobrow.open .body{display:block;}
    .jobrow .head .archtag{font-size:10px;font-weight:800;letter-spacing:.04em;color:#7c3aed;background:#f3e8ff;border-radius:6px;padding:2px 6px;}
    .jobmodal{position:fixed;inset:0;background:rgba(6,12,22,.55);display:none;align-items:flex-end;justify-content:center;z-index:10000;}
    .jobmodal.show{display:flex;}
    .jm-card{background:#fff;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);}
    @media(min-width:560px){.jobmodal{align-items:center;}.jm-card{border-radius:16px;}}
    .jm-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e5e7eb;}
    .jm-title{font-weight:700;font-size:16px;color:#0f2740;flex:1;min-width:0;}
    .jm-x{background:#f1f5f9;border:0;border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer;color:#334155;}
    .jm-body{overflow:auto;padding:14px 16px;}
    .jm-body .kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:14px;}
    .jm-body .kv b{flex:0 0 118px;color:#64748b;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;}
    .jm-body .kv span{flex:1;color:#16202e;word-break:break-word;white-space:pre-wrap;}
    .jm-ro{font-size:12px;color:#7c3aed;background:#f3e8ff;border-radius:8px;padding:6px 10px;margin-bottom:10px;display:inline-block;}
    .kv{display:flex;gap:8px;padding:3px 0;}
    .kv b{min-width:120px;color:#475569;font-weight:600;}
    .sheetimgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
    .sheetimgs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #d1d5db;cursor:pointer;}

    /* photos */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
    .gitem{position:relative;border-radius:10px;overflow:hidden;border:1px solid #d1d5db;background:#f3f4f6;aspect-ratio:1/1;}
    .gitem img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
    .gitem .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .gitem .gdel{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(185,28,28,.92);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4);}
    .gitem .gdel:hover{background:#b91c1c;}
    .gitem img.pending{visibility:hidden;}
    .gitem.pend::before{content:"📷";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:24px;pointer-events:none;}

    /* docs */
    .doclist{display:flex;flex-direction:column;gap:6px;}
    .docrow{display:flex;align-items:center;gap:10px;border:1px solid #e5e7eb;border-radius:10px;padding:9px 12px;background:#fff;}
    .docrow .ic{font-size:20px;}
    .docrow .nm{flex:1;font-size:14px;word-break:break-word;}
    .docrow .meta{font-size:11px;color:var(--muted);}
    .uploadbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}

    /* lightbox */
    .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;}
    .lb.show{display:flex;}
    .lb img{max-width:94vw;max-height:92vh;border-radius:8px;}
    .lb .x{position:absolute;top:calc(env(safe-area-inset-top, 0px) + 12px);right:calc(env(safe-area-inset-right, 0px) + 14px);color:#fff;font-size:30px;line-height:1;padding:6px 10px;cursor:pointer;background:none;border:0;z-index:2;}
    #msg{font-size:13px;margin-top:8px;}
  </style>
</head>
<body>
<div class="shell">
  <div class="card">
    <header class="top">
      <div>
        <h1 id="siteName">Site documents</h1>
        <div class="sub" id="siteSub"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="ml-back" id="backBtn" href="#" title="Back">‹ Back</a>
      </div>
    </header>
    <div id="tenantBox" style="display:none;margin:0 0 12px;padding:12px 14px;background:#f4faf3;border:1px solid #cfe6cb;border-radius:12px;"></div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="lb" id="lb"><button class="x" id="lbClose">✕</button><img id="lbImg" alt=""></div>

<div class="jobmodal" id="jobModal">
  <div class="jm-card">
    <div class="jm-head">
      <div class="jm-title" id="jmTitle">Job</div>
      <button class="jm-x" id="jmClose">✕</button>
    </div>
    <div class="jm-body" id="jmBody"></div>
  </div>
</div>

<script>
const API = (window.MOSTLANE_API || "https://mostlane-api.jamie-def.workers.dev");
const $ = id => document.getElementById(id);
function authFetch(path, opts = {}){
  const t = localStorage.getItem("mostlaneToken");
  opts.headers = Object.assign({}, opts.headers, t ? { "Authorization": "Bearer " + t } : {});
  return fetch(API + path, opts);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function qp(k){ return new URLSearchParams(location.search).get(k) || ""; }
function perms(){ try{ return JSON.parse(sessionStorage.getItem("mostlanePermissions")||localStorage.getItem("mostlanePermissions")||"{}"); }catch{ return {}; } }
function isAdmin(){ const p = perms(); return p.FullAccess==="Yes"||p.SLAAdmin==="Yes"; }   // manage/delete docs
function isFull(){ return perms().FullAccess==="Yes"; }                                       // add folder areas
const STATUS_COLOUR = {"Pending":"#9f1239","Scheduled":"#f59e0b","Travelling":"#3b82f6","In Progress":"#9333ea","On Hold":"#6b7280","Quote":"#dc2626","Order":"#0d9488","Complete":"#84cc16","Invoiced":"#22c55e","Closed Jobs":"#701a75"};

const siteCode = qp("site");
const siteNm = qp("name");
const admin = isAdmin();
const full = isFull();
let areas = [], activeTab = "Previous Jobs";
const cache = {};   // tab -> loaded data

function fmt(d){ if(!d) return ""; const x = new Date(d); return isNaN(x) ? "" : x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function fileIcon(name){ const e=(name.split(".").pop()||"").toLowerCase(); if(["pdf"].includes(e))return"📄"; if(["doc","docx"].includes(e))return"📝"; if(["xls","xlsx","csv"].includes(e))return"📊"; if(["png","jpg","jpeg","webp","gif","heic"].includes(e))return"🖼️"; return"📎"; }

function init(){
  $("siteName").textContent = siteNm ? ("📁 " + siteNm) : "📁 Site documents";
  $("siteSub").textContent = siteCode ? ("Site " + siteCode + " · everything on file for this site") : "";
  const back = qp("back");
  $("backBtn").href = back || "sla-main.html";
  $("lbClose").addEventListener("click", () => $("lb").classList.remove("show"));
  $("lb").addEventListener("click", e => { if(e.target === $("lb")) $("lb").classList.remove("show"); });
  $("jmClose").addEventListener("click", closeJobModal);
  $("jobModal").addEventListener("click", e => { if(e.target === $("jobModal")) closeJobModal(); });
  loadAreas().then(renderTabs).then(() => selectTab("Previous Jobs"));
  loadTenants();
}

// Tenant contacts for a site (Chapplins lettings). Fetches the tenant record;
// on any non-Chapplins site the endpoint 404s and the panel stays hidden.
async function loadTenants(){
  if(!siteCode) return;
  try{
    const r = await authFetch("/chapplins/site?number=" + encodeURIComponent(siteCode));
    if(!r.ok) return;
    const j = await r.json();
    const tens = (j && j.tenants) || [];
    if(!tens.length) return;
    const box = $("tenantBox");
    const one = t => {
      const contact = [
        t.phone ? `<a href="tel:${esc(String(t.phone).replace(/\s/g,''))}" style="color:var(--ml-blue);text-decoration:none;font-weight:600;">${esc(t.phone)}</a>` : "",
        t.email ? `<a href="mailto:${esc(String(t.email).split(';')[0])}" style="color:var(--ml-blue);text-decoration:none;">${esc(String(t.email).split(';')[0])}</a>` : "",
        t.homeTel ? `<span style="color:var(--muted)">${esc(t.homeTel)}</span>` : ""
      ].filter(Boolean).join(" · ");
      const tag = t.current
        ? `<span style="background:#2e7d32;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;">CURRENT TENANT</span>`
        : `<span style="background:#e7edf3;color:#5b6b7d;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;">previous</span>`;
      return `<div style="margin-top:6px;">${tag} <b>${esc(t.name || t.ref || "—")}</b>${t.ref?` <span style="color:var(--muted);font-size:12px;">[${esc(t.ref)}]</span>`:""}`+
             (contact?`<div style="font-size:13px;margin-top:2px;">${contact}</div>`:"")+`</div>`;
    };
    const cur = tens.filter(t=>t.current);
    const prev = tens.filter(t=>!t.current);
    box.innerHTML = `<div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#4a7a44;font-weight:700;">👤 Tenant</div>`
      + (cur.length?cur.map(one).join(""):`<div style="margin-top:6px;color:var(--muted)">No current tenant on record.</div>`)
      + (prev.length?`<details style="margin-top:6px;"><summary style="cursor:pointer;color:var(--muted);font-size:13px;">${prev.length} previous tenant${prev.length>1?"s":""}</summary>${prev.map(one).join("")}</details>`:"");
    box.style.display = "";
  }catch{ /* non-critical */ }
}

async function loadAreas(){
  try{ const d = await authFetch("/sla/site/docs?siteCode=" + encodeURIComponent(siteCode)).then(r=>r.json()); areas = d.areas || ["Compliance"]; cache["__docs"] = d; }
  catch(e){ areas = ["Compliance"]; }
}

function renderTabs(){
  const tabs = ["Previous Jobs", "Site Photos", ...areas];
  const host = $("tabs");
  host.innerHTML = "";
  tabs.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab" + (t === activeTab ? " active" : "");
    b.textContent = t;
    b.onclick = () => selectTab(t);
    host.appendChild(b);
  });
  if(full){
    const add = document.createElement("button");
    add.className = "tab addtab";
    add.textContent = "➕ Add area";
    add.onclick = addArea;
    host.appendChild(add);
  }
}

async function addArea(){
  const name = prompt("New document area name (e.g. Access info, Warranties, Drawings):");
  if(!name || !name.trim()) return;
  try{
    const r = await authFetch("/sla/site/area", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ area: name.trim() }) }).then(r=>r.json());
    if(r.areas){ areas = r.areas; renderTabs(); selectTab(name.trim()); }
    else alert(r.error || "Couldn't add the area.");
  }catch(e){ alert("Couldn't add the area."); }
}

function selectTab(t){
  activeTab = t;
  renderTabs();
  if(t === "Previous Jobs") return renderJobs();
  if(t === "Site Photos") return renderPhotos();
  if(t === "Compliance") return renderCompliance();
  return renderDocs(t);
}

/* ---- Previous Jobs ---- */
async function renderJobs(){
  const c = $("content"); c.innerHTML = `<div class="empty">Loading jobs…</div>`;
  let jobs = cache.jobs;
  if(!jobs){
    try{ jobs = (await authFetch(`/sla/site/jobs?siteCode=${encodeURIComponent(siteCode)}&siteName=${encodeURIComponent(siteNm)}`).then(r=>r.json())).jobs || []; cache.jobs = jobs; }
    catch(e){ c.innerHTML = `<div class="empty">Couldn't load jobs.</div>`; return; }
  }
  if(activeTab !== "Previous Jobs") return;
  if(!jobs.length){ c.innerHTML = `<div class="empty">No jobs recorded at this site yet.</div>`; return; }
  c.innerHTML = "";
  const na = jobs.filter(j => j.source === "archive").length;
  if(na){ const n=document.createElement("div"); n.className="empty"; n.style.cssText="text-align:left;padding:2px 2px 8px;color:#64748b;font-size:12px;"; n.textContent=`${jobs.length} jobs (${na} from the archive). Tap any to view.`; c.appendChild(n); }
  jobs.forEach(j => {
    const col = STATUS_COLOUR[j.status] || "#9ca3af";
    const row = document.createElement("div");
    row.className = "jobrow";
    row.innerHTML = `
      <div class="head">
        <span class="dot" style="background:${col}"></span>
        <span class="ref">${esc(j.ref)}</span>
        ${j.source === "archive" ? `<span class="archtag">🗄 ARCHIVE</span>` : ""}
        <span class="desc">${esc(j.description || "(no description)")}</span>
        <span class="when">${esc(fmt(j.date))} · ${esc(j.status)}</span>
      </div>`;
    row.querySelector(".head").addEventListener("click", () => openJobModal(j));
    c.appendChild(row);
  });
}

/* Read-only job viewer — live jobs and archived (imported) jobs alike. */
function prettyKey(k){ return String(k).replace(/[_-]+/g," ").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/^\w/, c => c.toUpperCase()); }
function jmRow(k, v){ return `<div class="kv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`; }
function openJobModal(j){
  $("jmTitle").textContent = (j.ref || "Job") + (j.description ? " — " + j.description : "");
  let h = `<div class="jm-ro">📖 Read-only${j.source === "archive" ? " · archived job" : ""}</div>`;
  if(j.source === "archive" && j.data && typeof j.data === "object"){
    h += jmRow("Reference", j.ref || "—");
    h += jmRow("Status", j.status || "—");
    if(j.date) h += jmRow("Date", fmt(j.date));
    const skip = new Set(["ref","status","id","site_code","search","tenant_id"]);
    for(const [k, v] of Object.entries(j.data)){
      if(v == null || v === "" || typeof v === "object") continue;
      if(skip.has(k)) continue;
      h += jmRow(prettyKey(k), String(v));
    }
  } else {
    h += jmRow("Reference", j.ref || "—");
    h += jmRow("Status", j.status + (j.priority ? " · " + j.priority : ""));
    if(j.raisedAt) h += jmRow("Raised", fmt(j.raisedAt));
    if(j.closedAt) h += jmRow("Completed", fmt(j.closedAt));
    if((j.engineers || []).length) h += jmRow("Engineer(s)", j.engineers.join(", "));
    if(j.description) h += jmRow("Description", j.description);
    if(j.lastNote) h += jmRow("Last note", j.lastNote);
    if(j.signedBy) h += jmRow("Signed by", j.signedBy);
    // Office/full-access users can still jump to the editable job.
    if(full && j.id) h += `<div style="margin-top:12px;"><a class="btn small" href="job-view.html?jobId=${encodeURIComponent(j.id)}&back=${encodeURIComponent(location.pathname + location.search)}">Open full job (edit) →</a></div>`;
  }
  $("jmBody").innerHTML = h;
  $("jobModal").classList.add("show");
}
function closeJobModal(){ $("jobModal").classList.remove("show"); }

/* ---- Site Photos ---- */
// Shrink an image File to a max dimension → JPEG Blob (for thumbnails + slimming
// uploads so the grid never decodes dozens of full-res photos at once).
function shrinkImage(file, maxDim, quality){
  return new Promise((resolve) => {
    if(!file || !/^image\//.test(file.type)){ resolve(null); return; }
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => resolve(b), "image/jpeg", quality || 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(u); resolve(null); };
    img.src = u;
  });
}

async function renderPhotos(){
  const c = $("content"); c.innerHTML = `<div class="empty">Loading photos…</div>`;
  let photos = cache.photos;
  if(!photos){
    try{ photos = (await authFetch(`/sla/site/photos?siteCode=${encodeURIComponent(siteCode)}&siteName=${encodeURIComponent(siteNm)}`).then(r=>r.json())).photos || []; cache.photos = photos; }
    catch(e){ c.innerHTML = `<div class="empty">Couldn't load photos.</div>`; return; }
  }
  if(activeTab !== "Site Photos") return;
  c.innerHTML = "";
  if(admin) c.appendChild(uploadBar("Site Photos", "image/*", true));
  const pending = photos.filter(p => p.hasThumb === false && p.key && (p.source === "upload" || p.source === "job")).length;
  if(admin && pending){
    const note = document.createElement("div"); note.className = "muted"; note.style.cssText = "font-size:12px;margin-bottom:8px;";
    note.id = "thumbNote"; note.textContent = `Optimising ${pending} photo${pending>1?"s":""} for fast loading…`;
    c.appendChild(note);
  }
  if(!photos.length){ const d=document.createElement("div"); d.className="empty"; d.textContent="No photos from jobs at this site yet."; c.appendChild(d); return; }
  const grid = document.createElement("div"); grid.className = "grid";
  // The grid only ever loads small THUMBNAILS (native lazy-load, so off-screen
  // ones don't load). A photo that doesn't have a thumbnail yet shows a light
  // placeholder — it is NEVER loaded full-res here (that only happens on tap /
  // in the lightbox) — and the background backfill fills it in once its thumb
  // exists. So even a site with hundreds of full-res photos stays light.
  photos.forEach(p => {
    const g = document.createElement("div"); g.className = "gitem"; if(p.key) g.dataset.key = p.key;
    const label = p.by ? esc(p.by) : (p.jobRef ? esc(p.jobRef) : "photo");
    const tip = [p.by ? "Uploaded by " + p.by : "", p.jobRef ? "Job " + p.jobRef : ""].filter(Boolean).join(" · ");
    const canDel = admin && p.source === "upload" && p.key;
    const has = p.hasThumb !== false;   // archive photos are already compressed → treat as ready
    if(!has) g.classList.add("pend");
    g.innerHTML = `<img loading="lazy" decoding="async" alt="" title="${esc(tip)}"${has ? ` src="${esc(p.thumb || p.url)}"` : ` class="pending"`}>`
      + (canDel ? `<button class="gdel" title="Delete this photo">✕</button>` : "")
      + `<span class="tag" title="${esc(tip)}">${label}</span>`;
    g.addEventListener("click", () => openLb(p.url));   // full-res only on tap
    if(canDel) g.querySelector(".gdel").addEventListener("click", (e) => { e.stopPropagation(); delSitePhoto(p.key); });
    // If a thumbnail ever fails, fall back to the full image once so nothing is blank.
    const img = g.querySelector("img");
    img.addEventListener("error", () => { if(img.getAttribute("src") && img.src.indexOf("/sla/site/doc") < 0){ img.src = p.url; } });
    grid.appendChild(g);
  });
  c.appendChild(grid);
  if(admin) backfillThumbs(photos);   // quietly create thumbs for older full-res photos
}

// Self-healing: for photos with no stored thumbnail, download the full image
// (a few at a time, OFF the grid), shrink it, store the thumb, then drop the
// thumb into its tile. The grid never holds full-res images, so this is smooth
// even for hundreds of photos.
let _backfilling = false;
async function backfillThumbs(photos){
  if(_backfilling) return;
  const todo = photos.filter(p => p.hasThumb === false && p.key && (p.source === "upload" || p.source === "job"));
  if(!todo.length) return;
  _backfilling = true;
  let idx = 0, done = 0;
  const total = todo.length;
  async function worker(){
    while(idx < todo.length){
      if(activeTab !== "Site Photos") return;
      const p = todo[idx++];
      try{
        const blob = await fetch(p.url).then(r => r.ok ? r.blob() : null);
        if(blob){
          const thumb = await shrinkImage(new File([blob], "p.jpg", { type: blob.type || "image/jpeg" }), 400, 0.7);
          if(thumb){
            const form = new FormData(); form.append("key", p.key); form.append("thumb", thumb, "thumb.jpg");
            const r = await authFetch("/sla/site/thumb", { method:"POST", body: form }).then(r=>r.json()).catch(()=>null);
            if(r && r.ok){
              p.hasThumb = true;
              const tileImg = document.querySelector('.gitem[data-key="' + (window.CSS && CSS.escape ? CSS.escape(p.key) : p.key) + '"] img');
              if(tileImg){ tileImg.classList.remove("pending"); tileImg.closest(".gitem").classList.remove("pend"); tileImg.src = p.thumb; }
            }
          }
        }
      }catch(e){ /* skip */ }
      done++;
      const note = $("thumbNote"); if(note){ const left = total - done; note.textContent = left > 0 ? `Optimising ${left} photo${left>1?"s":""} for fast loading…` : "All photos optimised ✓"; }
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);   // 4 at a time
  _backfilling = false;
}

async function delSitePhoto(key){
  if(!key || !confirm("Delete this photo? This can't be undone.")) return;
  try{
    const r = await authFetch("/sla/site/doc-delete", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ key }) }).then(r=>r.json());
    if(r.ok){ cache.photos = null; renderPhotos(); }
    else alert(r.error || "Couldn't delete the photo.");
  }catch(e){ alert("Couldn't delete the photo."); }
}

/* ---- Document areas ---- */
async function renderDocs(area){
  const c = $("content"); c.innerHTML = `<div class="empty">Loading…</div>`;
  let d = cache["__docs"];
  if(!d || !d.docs){
    try{ d = await authFetch("/sla/site/docs?siteCode=" + encodeURIComponent(siteCode)).then(r=>r.json()); cache["__docs"] = d; }
    catch(e){ c.innerHTML = `<div class="empty">Couldn't load documents.</div>`; return; }
  }
  if(activeTab !== area) return;
  const files = (d.docs && d.docs[area]) || [];
  c.innerHTML = "";
  if(admin) c.appendChild(uploadBar(area, "*/*", false));
  if(!files.length){ const e=document.createElement("div"); e.className="empty"; e.textContent = admin ? "Nothing here yet — drop in a document above." : "Nothing here yet."; c.appendChild(e); return; }
  const list = document.createElement("div"); list.className = "doclist";
  files.forEach(f => {
    const isImg = /\.(png|jpe?g|webp|gif)$/i.test(f.name || "");
    const row = document.createElement("div"); row.className = "docrow";
    // Project documents (injected for project sites) can't be deleted from here
    // — they belong to the project hub and must be managed there. Show a badge.
    const canDel = admin && !f.projectDoc && !f.complianceDoc;
    const src = f.projectDoc ? ' <span class="muted" style="font-size:11px;">· from project</span>'
              : f.complianceDoc ? ' <span class="muted" style="font-size:11px;">· from compliance chart</span>'
              : "";
    row.innerHTML = `
      <span class="ic">${fileIcon(f.name)}</span>
      <div class="nm">${esc(f.name)}${src}<div class="meta">${esc(fmt(f.at))}${f.by ? " · " + esc(f.by) : ""}</div></div>
      <button class="btn small" data-open>${isImg ? "View" : "Open"}</button>
      ${canDel ? `<button class="btn small danger" data-del="${esc(f.key)}">Delete</button>` : ""}`;
    row.querySelector("[data-open]").addEventListener("click", () => openDoc(f));
    if(canDel){ row.querySelector("[data-del]").addEventListener("click", () => delDoc(f.key)); }
    list.appendChild(row);
  });
  c.appendChild(list);
}

/* ---- Compliance (typed, versioned — the portal compliance store) ----
   Pulls this SITE's compliance docs across EVERY scheme (Southern Co-op,
   Fareham …) via /compliance/site-files, which resolves the site → its linked
   compliance store(s). So a Co-op site shows its Co-op certs and a Fareham site
   shows its Fareham certs, all from the one Site Documents page. */
const COMP_TYPES = { fiveYear:'5 Year', pat:'PAT', em:'Emergency Lighting', emMonthly:'EM Monthly', emYearly:'EM Yearly', pv:'PV', ev:'EV/Forecourt', forecourt:'EV/Forecourt', pump:'Pump', asbestos:'Asbestos Register', other:'Other' };
async function renderCompliance(){
  const c = $("content"); c.innerHTML = `<div class="empty">Loading compliance…</div>`;
  let sections = [];
  try{ sections = (await authFetch("/compliance/site-files?site=" + encodeURIComponent(siteCode)).then(r=>r.json())).sections || []; }
  catch(e){ c.innerHTML = `<div class="empty">Couldn't load compliance documents.</div>`; return; }
  if(activeTab !== "Compliance") return;
  c.innerHTML = "";
  // A site with no linked compliance store yet: still let Full Access file a first
  // doc (defaults to the Co-op scheme by this site's code).
  if(!sections.length){
    if(full) c.appendChild(compUploadBar({ scheme:'coop', code:siteCode, types:null }));
    const e=document.createElement("div"); e.className="empty"; e.textContent="No compliance documents on file for this site yet."; c.appendChild(e);
    return;
  }
  const multi = sections.length > 1;
  sections.forEach(sec => {
    if(multi){
      const sh = document.createElement("div");
      sh.style.cssText = "font-weight:800;margin:16px 4px 2px;color:#003468;border-bottom:2px solid #e2e8f0;padding-bottom:4px";
      sh.textContent = sec.schemeLabel || sec.scheme;
      c.appendChild(sh);
    }
    if(full) c.appendChild(compUploadBar(sec));
    const files = sec.files || {};
    const types = Object.keys(files);
    if(!types.length){
      const e=document.createElement("div"); e.className="empty"; e.style.margin="6px 4px"; e.textContent="No documents on file yet."; c.appendChild(e);
      return;
    }
    types.forEach(t => {
      const h = document.createElement("div"); h.style.cssText = "font-weight:700;margin:12px 4px 4px"; h.textContent = COMP_TYPES[t] || t;
      c.appendChild(h);
      const list = document.createElement("div"); list.className = "doclist";
      files[t].forEach(f => {
        const row = document.createElement("div"); row.className = "docrow";
        const badge = f.current ? `<span style="color:#0a7d34;font-weight:700">● current</span>` : `<span class="muted">previous</span>`;
        row.innerHTML = `
          <span class="ic">${fileIcon(f.filename || "")}</span>
          <div class="nm">${esc(f.label || f.filename || "document")}<div class="meta">${badge}${f.date ? " · " + esc(fmt(f.date)) : ""}</div></div>
          <a class="btn small" href="${f.url}" target="_blank" rel="noopener">Open</a>`;
        list.appendChild(row);
      });
      c.appendChild(list);
    });
  });
}
// Upload bar bound to ONE scheme+code (a section). types = [{key,label}] for that
// scheme's pickable headings; null falls back to the shared COMP_TYPES map.
function compUploadBar(sec){
  const scheme = sec.scheme || 'coop', code = sec.code || siteCode;
  const opts = (sec.types && sec.types.length) ? sec.types : Object.keys(COMP_TYPES).map(k=>({key:k,label:COMP_TYPES[k]}));
  const bar = document.createElement("div"); bar.className = "uploadbar";
  const sel = document.createElement("select"); sel.className = "btn small"; sel.style.cssText = "background:#fff;color:#111";
  opts.forEach(o => { const op=document.createElement("option"); op.value=o.key; op.textContent=o.label; sel.appendChild(op); });
  const label = document.createElement("label"); label.className = "btn primary small"; label.textContent = "⬆️ Add compliance doc";
  const input = document.createElement("input"); input.type = "file"; input.hidden = true; label.appendChild(input);
  const status = document.createElement("span"); status.className = "muted"; status.style.fontSize = "12px";
  input.addEventListener("change", async () => {
    const file = input.files && input.files[0]; if(!file) return;
    label.style.pointerEvents = "none"; label.textContent = "Uploading…";
    try{
      const form = new FormData();
      form.append("file", file, file.name); form.append("code", code); form.append("type", sel.value);
      form.append("bump", "1"); form.append("filename", file.name);
      const r = await authFetch("/compliance/file?scheme=" + encodeURIComponent(scheme), { method:"POST", body: form }).then(r=>r.json());
      status.textContent = r.ok ? "✓ added" : ("✗ " + (r.error || "failed"));
    }catch(e){ status.textContent = "✗ failed"; }
    label.style.pointerEvents = ""; label.textContent = "⬆️ Add compliance doc"; input.value = "";
    renderCompliance();
  });
  bar.appendChild(sel); bar.appendChild(label); bar.appendChild(status);
  return bar;
}

// ── Auto-recognise a compliance certificate dropped into a GENERAL Site
// Documents area, so it can be filed into the compliance store (chart + due
// dates) exactly like the Compliance tab upload — instead of sitting as a plain
// document the chart never sees. Detection is by filename keyword; the office
// confirms (and can correct) the type before it's filed, so a mis-named file
// never silently bumps a due date. ──────────────────────────────────────────
function canCompliance(){ const p = perms(); return p.FullAccess==="Yes" || p.Compliance==="Yes"; }
function detectComplianceType(name){
  const n = " " + String(name||"").toLowerCase().replace(/[_\-]+/g," ") + " ";
  if(/\basbestos\b/.test(n)) return "asbestos";
  if(/\beicr\b|fixed wire|periodic|condition report|\b5 ?year\b|\bfive ?year\b/.test(n)) return "fiveYear";
  if(/\bpat\b|portable appliance/.test(n)) return "pat";
  if(/emergency light|\bem\b|\bel\b/.test(n)) return "em";
  if(/photovoltaic|\bpv\b|\bsolar\b/.test(n)) return "pv";
  if(/forecourt|\bev\b|charge ?point|charging/.test(n)) return "ev";
  if(/\bpump\b/.test(n)) return "pump";
  return null;
}
async function loadCompSections(){
  if(cache.__compSections) return cache.__compSections;
  try{ const d = await authFetch("/compliance/site-files?site=" + encodeURIComponent(siteCode)).then(r=>r.json()); cache.__compSections = d.sections || []; }
  catch(e){ cache.__compSections = []; }
  return cache.__compSections;
}
// Confirm-and-correct modal. Resolves {scheme,code,type} to file as compliance,
// or null to keep it as an ordinary document.
function askCompliance(file, detected, sections){
  return new Promise(resolve => {
    const secs = (sections && sections.length) ? sections : [{ scheme:"coop", code:siteCode, schemeLabel:"Southern Co-op", types:null }];
    let cur = secs[0];
    const typesFor = s => (s.types && s.types.length) ? s.types : Object.keys(COMP_TYPES).map(k=>({ key:k, label:COMP_TYPES[k] }));
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(6,12,22,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;";
    const card = document.createElement("div");
    card.style.cssText = "background:#fff;border-radius:14px;max-width:440px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);";
    card.innerHTML =
      '<div style="font-weight:800;font-size:16px;color:#003468;margin-bottom:4px;">This looks like a compliance certificate</div>'
      + '<div style="font-size:13px;color:#475569;margin-bottom:12px;word-break:break-word;">' + esc(file.name) + '</div>'
      + (secs.length > 1
          ? '<label style="font-size:12px;font-weight:700;">Site / scheme</label><select id="cpScheme" class="btn small" style="width:100%;background:#fff;color:#111;margin:2px 0 10px;"></select>'
          : '<div style="font-size:12px;color:#64748b;margin-bottom:10px;">Scheme: <b>' + esc(cur.schemeLabel || cur.scheme || "Southern Co-op") + '</b></div>')
      + '<label style="font-size:12px;font-weight:700;">Document type</label>'
      + '<select id="cpType" class="btn small" style="width:100%;background:#fff;color:#111;margin:2px 0 14px;"></select>'
      + '<div style="font-size:12px;color:#64748b;margin-bottom:14px;">Filing it here adds it to the compliance chart for this site and moves the next-due date forward.</div>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">'
      + '<button id="cpDoc" class="btn small" style="background:#eef1f5;">Keep as a normal document</button>'
      + '<button id="cpGo" class="btn primary small">File under Compliance</button></div>';
    ov.appendChild(card); document.body.appendChild(ov);
    const schemeSel = card.querySelector("#cpScheme"), typeSel = card.querySelector("#cpType");
    function fillTypes(){
      const ts = typesFor(cur); typeSel.innerHTML = "";
      ts.forEach(t => { const o = document.createElement("option"); o.value = t.key; o.textContent = t.label; typeSel.appendChild(o); });
      if(detected && ts.some(t => t.key === detected)) typeSel.value = detected;
    }
    if(schemeSel){
      secs.forEach((s,i) => { const o = document.createElement("option"); o.value = String(i); o.textContent = (s.schemeLabel || s.scheme) + " · " + s.code; schemeSel.appendChild(o); });
      schemeSel.addEventListener("change", () => { cur = secs[+schemeSel.value]; fillTypes(); });
    }
    fillTypes();
    function done(v){ ov.remove(); resolve(v); }
    card.querySelector("#cpDoc").onclick = () => done(null);
    card.querySelector("#cpGo").onclick = () => done({ scheme: cur.scheme || "coop", code: cur.code || siteCode, type: typeSel.value });
    ov.addEventListener("click", e => { if(e.target === ov) done(null); });
  });
}

function uploadBar(area, accept, cameraHint){
  const bar = document.createElement("div"); bar.className = "uploadbar";
  const label = document.createElement("label"); label.className = "btn primary small"; label.textContent = "⬆️ Add " + (cameraHint ? "photo" : "document");
  const input = document.createElement("input"); input.type = "file"; input.accept = accept; input.multiple = true; input.hidden = true;
  label.appendChild(input);
  const status = document.createElement("span"); status.className = "muted"; status.style.fontSize = "12px";
  input.addEventListener("change", async () => {
    const files = [...input.files]; if(!files.length) return;
    label.style.pointerEvents = "none"; label.textContent = "Uploading…";
    let ok = 0, fail = 0, comp = 0;
    for(const file of files){
      // A compliance-looking cert dropped into a general document area is offered
      // for filing into the compliance store (so it reaches the chart + due dates)
      // instead of becoming an ordinary document the chart never sees.
      if(!cameraHint && canCompliance()){
        const dt = detectComplianceType(file.name);
        if(dt){
          const choice = await askCompliance(file, dt, await loadCompSections());
          if(choice){
            try{
              const cf = new FormData();
              cf.append("file", file, file.name); cf.append("code", choice.code);
              cf.append("type", choice.type); cf.append("bump", "1"); cf.append("filename", file.name);
              const cr = await authFetch("/compliance/file?scheme=" + encodeURIComponent(choice.scheme), { method:"POST", body: cf }).then(r=>r.json());
              if(cr.ok){ comp++; delete cache.__compSections; } else fail++;
            }catch(e){ fail++; }
            continue;   // filed as compliance — don't also store it as a plain doc
          }
          // choice === null → user chose "keep as a normal document"; fall through
        }
      }
      try{
        const form = new FormData();
        // Photos: upload a slimmed 1600px copy + a 400px thumbnail so the grid
        // stays light. Documents (and non-images) upload unchanged.
        if(cameraHint && /^image\//.test(file.type)){
          const main = await shrinkImage(file, 1600, 0.82);
          const thumb = await shrinkImage(file, 400, 0.7);
          const base = (file.name || "photo").replace(/\.[^.]+$/, "") || "photo";
          form.append("file", main || file, main ? (base + ".jpg") : (file.name || "photo"));
          if(thumb) form.append("thumb", thumb, "thumb.jpg");
        } else {
          form.append("file", file, file.name);
        }
        const r = await authFetch(`/sla/site/docs?siteCode=${encodeURIComponent(siteCode)}&area=${encodeURIComponent(area)}`, { method:"POST", body: form }).then(r=>r.json());
        if(r.ok) ok++; else fail++;
      }catch(e){ fail++; }
    }
    status.textContent = `✓ ${ok} added${comp ? `, ${comp} filed under Compliance` : ""}${fail ? `, ${fail} failed` : ""}`;
    if(comp && window.MLUI) MLUI.toast(`${comp} document${comp>1?"s":""} filed under Compliance — see the Compliance tab.`);
    label.style.pointerEvents = ""; label.textContent = "⬆️ Add " + (cameraHint ? "photo" : "document");
    input.value = "";
    // refresh the relevant cache + view
    if(area === "Site Photos"){ delete cache.photos; renderPhotos(); }
    else { delete cache["__docs"]; renderDocs(area); }
  });
  bar.appendChild(label); bar.appendChild(status);
  return bar;
}

async function delDoc(key){
  if(!confirm("Delete this document?")) return;
  try{
    const r = await authFetch("/sla/site/doc-delete", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ key }) }).then(r=>r.json());
    if(r.ok){ delete cache["__docs"]; renderDocs(activeTab); }
    else alert(r.error || "Couldn't delete.");
  }catch(e){ alert("Couldn't delete."); }
}

function openLb(url){ $("lbImg").src = url; $("lb").classList.add("show"); }

// Open a document in the shared viewer. Both PDFs and images use the signed,
// CORS-enabled worker route (so PDFs scroll/zoom on mobile and links expire).
function openDoc(f){
  const isImg = /\.(png|jpe?g|webp|gif)$/i.test(f.name || "");
  // f.url is the signed, access-controlled worker stream URL (from the
  // authenticated listing) — use it for viewing, PDF.js fetch and download so
  // the raw public-bucket link is never needed.
  window.MLDocViewer.open({
    url: f.url,
    fetchUrl: f.url,
    name: f.name,
    downloadUrl: f.url
  });
}

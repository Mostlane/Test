<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <script src="/portal-config.js?v=18"></script>
  <title>Mostlane • Fleet Insights</title>
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="auth.js"></script>
  <style>
  :root{ --bg:#f4f6f9; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b; --brand:#2563eb; --maint:#2563eb; --fuel:#f59e0b; --po:#6366f1; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header.page{background:#0f172a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header.page h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:180px;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;}
  .btn.small{padding:5px 10px;font-size:13px;}
  .btn.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px;}
  select,input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .rangebtns{display:flex;gap:6px;flex-wrap:wrap;}
  .spacer{flex:1;}
  .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .stat .v{font-size:24px;font-weight:800;margin-top:3px;}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px;}
  /* horizontal bars */
  .bars{display:flex;flex-direction:column;gap:9px;}
  .barrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;}
  .barrow .name{font-weight:800;letter-spacing:.05em;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .track{background:#eef2f7;border-radius:7px;height:22px;overflow:hidden;display:flex;}
  .seg{height:100%;}
  .track .seg + .seg{box-shadow:inset 1px 0 0 rgba(255,255,255,.65);}
  .seg.maint{background:var(--maint);} .seg.fuel{background:var(--fuel);} .seg.po{background:var(--po);}
  .barrow .amt{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .catbar{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;margin-bottom:8px;}
  .catbar .cn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .catbar .amt{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
  td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .reg{font-weight:800;letter-spacing:.05em;}
  .empty{color:var(--muted);font-size:14px;padding:14px 2px;text-align:center;}
  .tablewrap{overflow-x:auto;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;}
  </style>
</head>
<body>
<header class="page">
  <a class="ml-back" href="vehicles.html" title="Back">‹ Back</a>
  <h1>📊 Fleet Insights</h1>
</header>

<div class="wrap">
  <div class="panel">
    <div class="filters">
      <div class="rangebtns" id="rangeBtns">
        <button class="btn small" data-range="ytd">This year</button>
        <button class="btn small on" data-range="12m">Last 12 months</button>
        <button class="btn small" data-range="all">All time</button>
      </div>
      <span class="lbl">From</span><input type="date" id="fromD">
      <span class="lbl">to</span><input type="date" id="toD">
      <div class="spacer"></div>
      <span class="lbl">Vehicle</span>
      <select id="vehSel"><option value="">All vehicles</option></select>
    </div>
  </div>

  <div class="panel">
    <div class="stat-row" id="stats"></div>
  </div>

  <div class="panel" id="perVanPanel">
    <h2 id="perVanTitle">Spend per van</h2>
    <div class="bars" id="perVan"><div class="empty">Loading…</div></div>
    <div class="legend" id="perVanLegend"></div>
  </div>

  <div class="panel">
    <h2 id="catTitle">Where the money goes</h2>
    <div id="catBars"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel">
    <h2>Compare vans by category</h2>
    <div class="filters" style="margin-bottom:12px;">
      <span class="lbl">Category</span>
      <select id="catSel"></select>
      <span class="lbl">Show</span>
      <select id="catMetric"><option value="cost">£ spent</option><option value="count">How many</option></select>
    </div>
    <div class="bars" id="catCompare"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel">
    <h2>Breakdown</h2>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody><tr><td class="empty">Loading…</td></tr></tbody></table></div>
  </div>
</div>

<script>
const API = (window.MOSTLANE_API || "https://mostlane-api.jamie-def.workers.dev");
const $ = id => document.getElementById(id);
function authFetch(path, opts = {}){
  const t = localStorage.getItem("mostlaneToken");
  opts.headers = Object.assign({}, opts.headers, t ? { "Authorization": "Bearer " + t } : {});
  return fetch(API + path, opts);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const money = n => "£" + (Math.round((Number(n)||0)*100)/100).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "£" + Math.round(Number(n)||0).toLocaleString("en-GB");

let DATA = null;          // last /insights response
let catColour = {};       // cat name -> colour
// Distinct fallback colours when a category has no colour configured.
const CAT_PALETTE = ["#2563eb","#16a34a","#f59e0b","#db2777","#7c3aed","#0891b2","#dc2626","#ca8a04","#4f46e5","#059669","#e11d48","#0d9488","#c026d3","#65a30d"];
let focusReg = "";        // "" = all vehicles

function isoDaysAgo(days){ const d = new Date(Date.now() - days*86400000); return d.toISOString().slice(0,10); }
function setRange(which){
  const to = new Date().toISOString().slice(0,10);
  let from = "";
  if(which === "ytd") from = new Date().getFullYear() + "-01-01";
  else if(which === "12m") from = isoDaysAgo(365);
  else from = "";   // all time
  $("fromD").value = from; $("toD").value = which === "all" ? "" : to;
  [...$("rangeBtns").children].forEach(b => b.classList.toggle("on", b.dataset.range === which));
  load();
}

async function load(){
  const from = $("fromD").value, to = $("toD").value;
  const qs = [];
  if(from) qs.push("from=" + from);
  if(to) qs.push("to=" + to);
  try{
    const r = await authFetch("/fleet/insights" + (qs.length ? "?" + qs.join("&") : "")).then(r=>r.json());
    if(!r.ok) throw new Error(r.error || "Failed");
    DATA = r;
    // Colour every category distinctly: use its configured colour if one is set,
    // otherwise assign one from a palette — so the per-van bar's make-up is clear
    // even when no colours were chosen in the maintenance settings.
    catColour = {};
    orderedCats().forEach((name, i) => {
      const def = (r.categories||[]).find(c => c.name === name);
      catColour[name] = (def && def.colour) ? def.colour : CAT_PALETTE[i % CAT_PALETTE.length];
    });
    // vehicle dropdown
    const sel = $("vehSel"); const keep = sel.value;
    sel.innerHTML = '<option value="">All vehicles</option>' + r.vehicles.map(v => `<option value="${esc(v.reg)}">${esc(v.reg)}</option>`).join("");
    if([...sel.options].some(o=>o.value===keep)) sel.value = keep; else focusReg = "";
    // category dropdown (union of categories seen + defined)
    const catNames = new Set((r.categories||[]).map(c=>c.name));
    r.vehicles.forEach(v => Object.keys(v.byCat||{}).forEach(c => catNames.add(c)));
    const cs = $("catSel"); const keepC = cs.value;
    cs.innerHTML = [...catNames].map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    if([...cs.options].some(o=>o.value===keepC)) cs.value = keepC;
    else if([...cs.options].some(o=>o.value==="Tyres")) cs.value = "Tyres";
    render();
  }catch(e){
    $("perVan").innerHTML = '<div class="empty">Couldn\'t load insights.</div>';
  }
}

function vehByReg(reg){ return (DATA.vehicles||[]).find(v => v.reg === reg); }
// Stable category order (defined categories first, then any extras seen), so a
// category keeps the same colour + position across every van's bar.
function orderedCats(){
  const seen = new Set(), out = [];
  (DATA.categories||[]).forEach(c => { if(!seen.has(c.name)){ seen.add(c.name); out.push(c.name); } });
  (DATA.vehicles||[]).forEach(v => Object.keys(v.byCat||{}).forEach(c => { if(!seen.has(c)){ seen.add(c); out.push(c); } }));
  return out;
}

function render(){
  if(!DATA) return;
  const focus = focusReg ? vehByReg(focusReg) : null;
  // ---- summary tiles ----
  const src = focus ? { total:focus.total, maint:focus.maint, fuel:focus.fuel, po:focus.po||0 } : DATA.fleet;
  const nVeh = DATA.vehicles.length;
  const avg = nVeh ? DATA.fleet.total / nVeh : 0;
  const anyPo = (DATA.fleet.po||0) > 0;
  $("stats").innerHTML = `
    <div class="stat"><div class="l">${focus ? esc(focus.reg)+" — total" : "Total spend"}</div><div class="v">${money0(src.total)}</div><div class="s">maintenance + fuel${anyPo?" + POs":""}</div></div>
    <div class="stat"><div class="l">Maintenance</div><div class="v">${money0(src.maint)}</div><div class="s">${src.total?Math.round(src.maint/src.total*100):0}% of spend</div></div>
    <div class="stat"><div class="l">Fuel</div><div class="v">${money0(src.fuel)}</div><div class="s">${src.total?Math.round(src.fuel/src.total*100):0}% of spend</div></div>
    ${anyPo ? `<div class="stat"><div class="l">Purchase orders</div><div class="v">${money0(src.po||0)}</div><div class="s">${src.total?Math.round((src.po||0)/src.total*100):0}% of spend</div></div>` : ""}
    ${focus ? `<div class="stat"><div class="l">vs fleet average</div><div class="v">${money0(focus.total)}</div><div class="s">avg ${money0(avg)}/van</div></div>`
            : `<div class="stat"><div class="l">Vehicles</div><div class="v">${nVeh}</div><div class="s">avg ${money0(avg)}/van</div></div>`}`;

  renderPerVan();
  renderCatBars(focus);
  renderCatCompare();
  renderTable();
}

function renderPerVan(){
  const host = $("perVan");
  const list = (DATA.vehicles||[]).filter(v => v.total > 0);
  if(!list.length){ host.innerHTML = '<div class="empty">No spend recorded in this range.</div>'; $("perVanLegend").innerHTML = ""; return; }
  const max = Math.max(...list.map(v => v.total), 1);
  const cats = orderedCats();
  // Each bar is split into a coloured segment PER maintenance category + fuel.
  host.innerHTML = list.map(v => {
    let segs = "";
    for(const cat of cats){
      const o = v.byCat[cat]; if(!o || !o.cost) continue;
      segs += `<div class="seg" style="width:${o.cost/max*100}%;background:${catColour[cat]||'#64748b'}" title="${esc(cat)} ${money(o.cost)}${o.count?` (${o.count})`:""}"></div>`;
    }
    if(v.fuel > 0) segs += `<div class="seg" style="width:${v.fuel/max*100}%;background:var(--fuel)" title="Fuel ${money(v.fuel)}"></div>`;
    if((v.po||0) > 0) segs += `<div class="seg" style="width:${v.po/max*100}%;background:var(--po)" title="Purchase orders ${money(v.po)}"></div>`;
    return `<div class="barrow">
      <div class="name" data-reg="${esc(v.reg)}" title="Focus ${esc(v.reg)}">${esc(v.reg)}</div>
      <div class="track">${segs}</div>
      <div class="amt">${money0(v.total)}</div>
    </div>`;
  }).join("");
  host.querySelectorAll(".name[data-reg]").forEach(n => n.addEventListener("click", () => { $("vehSel").value = n.dataset.reg; focusReg = n.dataset.reg; render(); }));
  // Legend — only the categories actually present, in the same order/colours.
  const used = cats.filter(cat => list.some(v => (v.byCat[cat]||{}).cost));
  $("perVanLegend").innerHTML =
    used.map(cat => `<span><i style="background:${catColour[cat]||'#64748b'}"></i>${esc(cat)}</span>`).join("")
    + (list.some(v => v.fuel > 0) ? `<span><i style="background:var(--fuel)"></i>Fuel</span>` : "")
    + (list.some(v => (v.po||0) > 0) ? `<span><i style="background:var(--po)"></i>Purchase orders</span>` : "")
    + `<span class="muted">Tap a van to focus it.</span>`;
}

function renderCatBars(focus){
  $("catTitle").textContent = focus ? `${focus.reg} — where the money goes` : "Where the money goes (maintenance)";
  const host = $("catBars");
  const byCat = focus ? focus.byCat : DATA.fleet.byCat;
  const entries = Object.entries(byCat || {}).map(([c,o]) => ({ cat:c, cost:o.cost, count:o.count })).sort((a,b)=>b.cost-a.cost);
  // include fuel + POs as pseudo-categories so the full picture shows
  const fuelAmt = focus ? focus.fuel : DATA.fleet.fuel;
  if(fuelAmt > 0) entries.push({ cat:"Fuel", cost:fuelAmt, count:null, fuel:true });
  const poAmt = focus ? (focus.po||0) : (DATA.fleet.po||0);
  if(poAmt > 0) entries.push({ cat:"Purchase orders", cost:poAmt, count:null, po:true });
  if(!entries.length){ host.innerHTML = '<div class="empty">No maintenance recorded in this range.</div>'; return; }
  const max = Math.max(...entries.map(e=>e.cost), 1);
  host.innerHTML = entries.map(e => {
    const col = e.fuel ? "var(--fuel)" : e.po ? "var(--po)" : (catColour[e.cat] || "#64748b");
    return `<div class="catbar">
      <div class="cn">${esc(e.cat)}${e.count!=null?` <span class="muted">×${e.count}</span>`:""}</div>
      <div class="track"><div class="seg" style="width:${e.cost/max*100}%;background:${col}"></div></div>
      <div class="amt">${money0(e.cost)}</div>
    </div>`;
  }).join("");
}

function renderCatCompare(){
  const cat = $("catSel").value, metric = $("catMetric").value;
  const host = $("catCompare");
  const list = (DATA.vehicles||[]).map(v => ({ reg:v.reg, cost:(v.byCat[cat]||{}).cost||0, count:(v.byCat[cat]||{}).count||0 }))
    .filter(v => (metric==="count"?v.count:v.cost) > 0)
    .sort((a,b) => (metric==="count"?b.count-a.count:b.cost-a.cost));
  if(!list.length){ host.innerHTML = `<div class="empty">No “${esc(cat)}” recorded in this range.</div>`; return; }
  const col = catColour[cat] || "#64748b";
  const max = Math.max(...list.map(v => metric==="count"?v.count:v.cost), 1);
  host.innerHTML = list.map(v => {
    const val = metric==="count"?v.count:v.cost;
    const label = metric==="count" ? (val + "×") : money0(val);
    return `<div class="barrow">
      <div class="name">${esc(v.reg)}</div>
      <div class="track"><div class="seg" style="width:${val/max*100}%;background:${col}"></div></div>
      <div class="amt">${label}</div>
    </div>`;
  }).join("");
}

function renderTable(){
  const cats = Object.keys(DATA.fleet.byCat||{});
  const anyPo = (DATA.fleet.po||0) > 0;
  const poH = anyPo ? `<th class="num">POs</th>` : "";
  const head = `<tr><th>Vehicle</th><th class="num">Total</th><th class="num">Maint.</th><th class="num">Fuel</th>${poH}${cats.map(c=>`<th class="num">${esc(c)}</th>`).join("")}</tr>`;
  $("tbl").querySelector("thead").innerHTML = head;
  const rows = (DATA.vehicles||[]).map(v => `<tr>
    <td class="reg">${esc(v.reg)}</td>
    <td class="num"><b>${money0(v.total)}</b></td>
    <td class="num">${money0(v.maint)}</td>
    <td class="num">${money0(v.fuel)}</td>
    ${anyPo?`<td class="num">${(v.po||0)?money0(v.po):"—"}</td>`:""}
    ${cats.map(c=>{ const o=v.byCat[c]; return `<td class="num">${o?money0(o.cost)+(o.count?` <span class="muted">(${o.count})</span>`:""):"—"}</td>`; }).join("")}
  </tr>`).join("");
  const foot = `<tr style="font-weight:800;background:#f8fafc;">
    <td>Fleet total</td><td class="num">${money0(DATA.fleet.total)}</td><td class="num">${money0(DATA.fleet.maint)}</td><td class="num">${money0(DATA.fleet.fuel)}</td>
    ${anyPo?`<td class="num">${money0(DATA.fleet.po)}</td>`:""}
    ${cats.map(c=>{ const o=DATA.fleet.byCat[c]; return `<td class="num">${o?money0(o.cost)+(o.count?` (${o.count})`:""):"—"}</td>`; }).join("")}
  </tr>`;
  $("tbl").querySelector("tbody").innerHTML = rows + foot || `<tr><td class="empty">No data.</td></tr>`;
}

// ---- events ----
$("rangeBtns").addEventListener("click", e => { const b = e.target.closest("[data-range]"); if(b) setRange(b.dataset.range); });
$("fromD").addEventListener("change", () => { [...$("rangeBtns").children].forEach(b=>b.classList.remove("on")); load(); });
$("toD").addEventListener("change", () => { [...$("rangeBtns").children].forEach(b=>b.classList.remove("on")); load(); });
$("vehSel").addEventListener("change", () => { focusReg = $("vehSel").value; render(); });
$("catSel").addEventListener("change", renderCatCompare);
$("catMetric").addEventListener("change", renderCatCompare);

(async function(){
  // Full Access only.
  try{
    const me = await authFetch("/auth/me").then(r=>r.json());
    if(!me.ok || !me.user || me.user.FullAccess !== "Yes"){ alert("Fleet Insights needs Full access."); location.href = "vehicles.html"; return; }
  }catch(e){ location.href = "vehicles.html"; return; }
  setRange("12m");
})();
</script>
</body>
</html>

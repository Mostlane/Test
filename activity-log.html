<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=21"></script>
  <script src="auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Activity Log — Mostlane Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:#eef1f5; color:#16202e; }
    header.page { background:linear-gradient(180deg,#1A4F8F,#003468); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
    header.page h1 { font-size:18px; margin:0; flex:1; color:#fff; }
    .wrap { max-width:1000px; margin:16px auto 40px; padding:0 14px; }
    .muted { color:#667085; font-size:13px; }
    .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .bar select, .bar input { padding:9px 10px; border:1px solid #ccd5dd; border-radius:9px; font-size:14px; font-family:inherit; background:#fff; }
    .bar input { flex:1; min-width:140px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 2px 10px rgba(6,24,54,.06); overflow:hidden; }
    .row { display:flex; gap:12px; align-items:flex-start; padding:10px 14px; border-top:1px solid #f0f3f7; font-size:13.5px; }
    .row:first-child { border-top:none; }
    .row .when { flex:none; width:132px; color:#667085; font-size:12.5px; line-height:1.5; }
    .row .who { font-weight:700; color:#003366; }
    .kind { font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
    .kind.action { background:#e2edff; color:#1a4f8f; }
    .kind.view { background:#eef1f4; color:#667085; }
    .kind.fail { background:#fdeaea; color:#b00020; }
    .what { color:#16202e; margin-top:2px; }
    .msg { color:#16202e; text-decoration:none; }
    a.msg { color:#0b4fa0; }
    a.msg:hover { text-decoration:underline; }
    .msg.nolink { color:#16202e; }
    .onpage { color:#5b6b7c; font-weight:600; font-size:13px; }
    .det { color:#6b7889; font-size:13px; margin-top:2px; word-break:break-word; }
    /* Collapsed bursts */
    details.group { border-top:1px solid #f0f3f7; }
    details.group:first-child { border-top:none; }
    details.group > summary { list-style:none; cursor:pointer; display:flex; gap:12px; align-items:flex-start; padding:10px 14px; background:#f7f9fc; font-size:13.5px; }
    details.group > summary::-webkit-details-marker { display:none; }
    details.group[open] > summary { background:#eef3fb; border-bottom:1px solid #e2e8f0; }
    details.group .expand { color:#8895a6; font-size:12px; font-weight:600; }
    details.group[open] .expand { display:none; }
    details.group .gbody .row { padding-left:30px; background:#fff; }
    details.group .gbody .row:first-child { border-top:none; }
    @media (max-width:640px){ .row { flex-direction:column; gap:4px; } .row .when { width:auto; }
      details.group > summary { flex-direction:column; gap:4px; } details.group > summary .when { width:auto; } }
  </style>
</head>
<body>
  <header class="page">
    <h1>📜 Activity Log</h1>
    <a class="ml-back" data-role="up" href="users-admin.html">← Users Admin</a>
  </header>

  <div class="wrap">
    <p class="muted" style="margin:0 0 12px;">Everything done on the portal, with timestamps — every action is recorded automatically at the moment it happens,
      plus which pages people opened. Kept for 12 months.</p>
    <div class="bar">
      <select id="fUser"><option value="">Everyone</option></select>
      <select id="fType">
        <option value="">Actions + page views</option>
        <option value="action" selected>Actions only</option>
        <option value="view">Page views only</option>
      </select>
      <select id="fDays">
        <option value="1">Today</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last 12 months</option>
      </select>
      <input id="fSearch" placeholder="Filter… e.g. key, holiday, A1003">
      <span class="muted" id="countLbl"></span>
    </div>
    <div class="card" id="list"><div class="row muted">Loading…</div></div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    function authFetch(path, opts = {}) {
      opts.headers = Object.assign({ "Authorization": "Bearer " + localStorage.getItem("mostlaneToken") }, opts.headers || {});
      return fetch(API + path, opts);
    }

    let USERS = [], LOG = [];

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r => r.json());
        if (!me.ok || me.user.FullAccess !== "Yes") { alert("This page needs Full Access."); location.href = "main.html"; return; }
      } catch (e) { location.href = "main.html"; return; }
      try {
        const d = await authFetch("/users").then(r => r.json());
        USERS = (d.Users || []).filter(u => u.Username);
        g("fUser").innerHTML = '<option value="">Everyone</option>' + USERS.map(u =>
          `<option value="${esc(u.Username)}">${esc(((u.FirstName || "") + " " + (u.LastName || "")).trim() || u.Username)}</option>`).join("");
      } catch (e) {}
      load();
    })();

    const nameOf = uname => { const u = USERS.find(x => x.Username === uname); return u ? ((u.FirstName || "") + " " + (u.LastName || "")).trim() : (uname || ""); };

    // Friendly names for the common endpoints; anything unmapped shows its raw path.
    const FRIENDLY = [
      [/^POST \/ts\/my/,                  "⏱️ Saved their weekly timesheet"],
      [/^POST \/ts\/me/,                  "⏱️ Updated their timesheet details"],
      [/^POST \/ts\/invoice\/next/,       "🔢 Set their next invoice number"],
      [/^POST \/ts\/invoice\/delete/,     "🗑️ Deleted an engineer invoice"],
      [/^POST \/ts\/invoice/,             "🧾 Generated an invoice"],
      [/^POST \/ts\/miles\/autofill/,     "🗺️ Calculated site mileage"],
      [/^POST \/ts\/miles/,               "🗺️ Updated site mileage"],
      [/^POST \/ts\/admin\/save/,         "✏️ Edited an engineer's timesheet"],
      [/^POST \/ts\/admin\/config/,       "⚙️ Changed timesheet settings"],
      [/^POST \/holiday\/request/,        "🌴 Requested time off"],
      [/^POST \/holiday\/approve/,        "✅ Approved a holiday request"],
      [/^POST \/holiday\/reject/,         "❌ Rejected a holiday request"],
      [/^POST \/holiday\/cancel/,         "🔁 Cancelled a holiday"],
      [/^POST \/holiday\/delete-own/,     "🗑️ Removed an old holiday entry"],
      [/^POST \/holiday\/set-allowance/,  "⚖️ Changed a holiday allowance"],
      [/^POST \/holiday\/set-/,           "⚖️ Changed holiday settings"],
      [/^POST \/asset\/transfer-request/, "📤 Offered an item transfer"],
      [/^POST \/asset\/transfer-accept/,  "✍️ Accepted & signed for an item"],
      [/^POST \/asset\/transfer-reject/,  "🚫 Rejected an item transfer"],
      [/^POST \/asset\/transfer-cancel/,  "↩️ Cancelled an item transfer"],
      [/^POST \/asset\/add/,              "📦 Added an asset"],
      [/^POST \/asset\/update/,           "🛠️ Updated an asset"],
      [/^DELETE \/asset\/delete/,         "🗑️ Deleted an asset"],
      [/^POST \/upload-asset-image/,      "📷 Uploaded an asset photo"],
      [/^POST \/delete-asset-image/,      "🗑️ Removed an asset photo"],
      [/^POST \/transfer\b/,              "↔️ Recorded an asset transfer"],
      [/^POST \/key\/add/,                "➕ Added a key"],
      [/^POST \/key\/update/,             "🛠️ Updated a key"],
      [/^POST \/key\/sign-out/,           "🗝️ Signed a key out"],
      [/^POST \/key\/sign-in/,            "🔑 Signed a key back in"],
      [/^DELETE \/key\/delete/,           "🗑️ Deleted a key"],

      [/^POST \/users\/reorder/,          "↕️ Reordered the user list"],
      [/^POST \/users\b/,                 "👥 Saved a user"],
      [/^POST \/user\b/,                  "👥 Saved a user"],
      [/^DELETE \/user/,                  "🗑️ Deleted a user"],
      [/^POST \/auth\/change-password/,   "🔒 Changed their password"],
      [/^POST \/auth\/logout/,            "🚪 Logged out"],
      [/^POST \/auth\/impersonate/,       "👁 Viewed the portal as another user"],
      [/^POST \/theme\/background/,       "🖼️ Uploaded a menu background"],
      [/^POST \/theme/,                   "🎨 Changed their personalisation"],
      [/^POST \/office\/clock-in/,        "🕐 Clocked in (office)"],
      [/^POST \/office\/clock-out/,       "🕔 Clocked out (office)"],
      [/^POST \/office\/segment/,         "✏️ Edited a timesheet segment"],

      [/^POST \/sla\/jobs/,               "🚨 SLA job created/updated"],
      [/^POST \/sla\/shift/,              "🕐 SLA shift clock action"],
      [/^POST \/sla\/vehicle-check/,      "🚐 Submitted a vehicle check"],
      [/^POST \/sla/,                     "🚨 SLA action"],
      [/^POST \/update-site/,             "📍 Updated a site"],
      [/^POST \/add-site/,                "📍 Added a site"],
      [/^POST \/sites\/street-images/,    "🖼️ Refreshed site photos"],
      [/^POST \/import-sites/,            "📥 Imported sites"],
      [/^POST \/customers\/delete/,       "🗑️ Deleted a customer"],
      [/^POST \/customers/,               "🏢 Saved a customer"],
      [/^POST \/device\/register-device/, "📱 Registered a new device"],
      [/^POST \/device\/reset/,           "📱 Removed someone's device"],
      [/^POST \/device\/allowed/,         "📱 Changed a device allowance"],
      [/^POST \/settings/,                "⚙️ Changed portal settings"],
      [/^POST \/sitelog/,                 "🛰️ SiteLog admin action"],
      // Vehicles / Fleet
      [/^POST \/fleet\/vehicle-doc/,      "📎 Uploaded a vehicle document"],
      [/^POST \/fleet\/vehicle-photo-cover/, "🖼️ Set a vehicle's cover photo"],
      [/^POST \/fleet\/vehicle-photo-delete/, "🗑️ Removed a vehicle photo"],
      [/^POST \/fleet\/vehicle-photo/,    "📷 Uploaded a vehicle photo"],
      [/^POST \/fleet\/vehicle-delete/,   "🗑️ Deleted a vehicle"],
      [/^POST \/fleet\/vehicle\b/,        "🚐 Saved a vehicle"],
      [/^POST \/fleet\/vehicles-import/,  "⤵️ Imported vehicles from the old system"],
      [/^POST \/fleet\/finance/,          "💷 Updated a vehicle's financials"],
      [/^POST \/fleet\/maintenance-delete/, "🗑️ Deleted a maintenance record"],
      [/^POST \/fleet\/maintenance\b/,    "🔧 Added/updated a maintenance record"],
      [/^POST \/fleet\/maint-categories/, "🏷️ Changed maintenance categories"],
      [/^POST \/fleet\/fuel\/entry-delete/, "🗑️ Deleted a fuel entry"],
      [/^POST \/fleet\/fuel\/entry/,      "⛽ Logged a fuel fill-up"],
      [/^POST \/fleet\/assign/,           "👤 Assigned a driver to a van"],
      [/^POST \/fleet\/order/,            "↕️ Reordered the vehicle list"],
      [/^POST \/fleet\/vehicle-order/,    "↕️ Reordered the vehicle list"],
      [/^POST \/fleet\/pool-alloc/,       "🚚 Allocated a pool van"],
      [/^POST \/fleet\/paycfg/,           "⚙️ Changed van-pay settings"],
      [/^POST \/fleet\/timesheet/,        "🚐 Saved a van timesheet"],
      [/^POST \/fleet\/handover\/template/, "🤝 Edited the handover template"],
      [/^POST \/fleet\/handover\/request/, "🤝 Sent a van handover"],
      [/^POST \/fleet\/handover\/submit/, "✍️ Completed a van handover"],
      [/^POST \/fleet\/handover\/cancel/, "🚫 Cancelled a van handover"],
      [/^POST \/fleet\/report-delete/,    "🗑️ Deleted a fleet report"],
      [/^POST \/fleet\/report/,           "📊 Saved a fleet report"],
      [/^POST \/fleet\/drivers/,          "👤 Updated report driver names"],
      [/^POST \/fleet/,                   "🚐 Vehicles action"],
      // Weekly van checks
      [/^POST \/vancheck\/skip/,          "⏭️ Skipped a driver's van check"],
      [/^POST \/vancheck\/unskip/,        "↩️ Un-skipped a van check"],
      [/^POST \/vancheck\/remind-now/,    "🔔 Sent van-check reminders"],
      [/^POST \/vancheck\/settings/,      "⚙️ Changed van-check settings"],
      [/^POST \/vancheck\/submit/,        "🚐 Submitted a weekly van check"],
      [/^POST \/vancheck/,                "🚐 Van-check action"],
      // Office clock / timesheets
      [/^POST \/office\/confirm-finish/,  "✅ Finished an equipment confirmation round"],
      [/^POST \/office\/clock/,           "🕐 Office clock action"],
      [/^POST \/office/,                  "🕐 Office timesheet action"],
      // Equipment confirmations
      [/^POST \/asset\/confirm\/request/, "📋 Started an equipment confirmation round"],
      [/^POST \/asset\/confirm\/respond/, "✅ Responded to an equipment check"],
      [/^POST \/asset\/confirm/,          "📋 Equipment confirmation action"],
      // Job costing / sites register
      [/^POST \/costing\/fin\/valuation\/delete/, "🗑️ Deleted a project valuation"],
      [/^POST \/costing\/fin\/valuation/, "💷 Added a project valuation"],
      [/^POST \/costing\/fin/,            "💷 Updated project financials"],
      [/^POST \/costing\/eng-alias/,      "🔗 Linked an engineer name"],
      [/^POST \/costing\/prefs/,          "📌 Changed job-costing view"],
      [/^POST \/costing/,                 "📈 Job-costing action"],
      [/^POST \/sites\/register\/add/,    "📍 Added a site to the register"],
      [/^POST \/sites\/register\/update/, "📍 Updated a register site"],
      [/^POST \/sites\/register\/merge/,  "🔗 Merged a site"],
      [/^POST \/sites\/register/,         "📍 Site register action"],
      // Company memos
      [/^POST \/memos\/send/,             "📢 Sent a company memo"],
      [/^POST \/memos\/save/,             "📝 Saved a memo draft"],
      [/^POST \/memos\/ack/,              "✍️ Signed a company memo"],
      [/^POST \/memos\/delete/,           "🗑️ Deleted a memo"],
      // Messaging (bodies are never shown here)
      [/^POST \/messages\/thread-delete/, "🗑️ Removed a whole chat"],
      [/^POST \/messages\/delete/,        "🗑️ Removed a chat message"],
      [/^POST \/messages\/send/,          "💬 Sent a message"],
      // Timesheets (extra)
      [/^POST \/ts\//,                    "⏱️ Timesheet action"],
      // Notifications admin
      [/^POST \/notify\/suppress\/remove/,"🔔 Un-muted a notification"],
      [/^POST \/notify\/suppress/,        "🔕 Muted a notification"],
      // Push
      [/^POST \/push\/subscribe/,         "🔔 Turned on notifications (a device)"],
      [/^POST \/push\/unsubscribe/,       "🔕 Turned off notifications (a device)"],
      [/^POST \/push\/test/,              "🔔 Sent a test notification"],
      // H&S
      [/^POST \/hs-plan-config/,          "🦺 Opened the H&S planner"],
      [/^POST \/po-config/,               "🧾 Opened the PO system"],
      // Privacy
      [/^POST \/privacy\/erase/,          "🧹 Erased a user's personal data (GDPR)"],
      [/^POST \/privacy\/export/,         "📤 Exported a user's data (GDPR)"],
    ];
    // Friendly labels for the captured body fields, so "reg=AB12CDE · cost=200"
    // reads as "Vehicle AB12CDE · £200".
    const DKEY = {
      id: "#", reg: "Vehicle", description: "Note", note: "Note", title: "Title",
      date: "Date", amount: "£", cost: "£", price: "£", value: "£", priority: "Priority",
      status: "Status", type: "Type", category: "Category", cat: "Category", site: "Site",
      siteName: "Site", week: "Week", litres: "Litres", mileage: "Mileage", miles: "Miles",
      name: "Name", label: "Name", to: "To", toUser: "To", username: "User", Username: "User",
      u: "User", start: "From", end: "To", action: "", page: "", make: "Make", model: "Model",
      colour: "Colour", vin: "VIN", role: "Role", reason: "Reason", keyID: "Key",
      assetId: "Item", assetID: "Item",
    };
    function niceDetail(det) {
      if (!det) return "";
      if (det === "(file upload)") return "📎 with a file attached";
      // A handler-supplied "before → after" note is already human — show it as-is.
      if (det.indexOf("→") >= 0) return det;
      return det.split(" · ").map(part => {
        if (part.indexOf("→") >= 0) return part;        // change note fragment — leave alone
        const i = part.indexOf("=");
        if (i < 0) return part;
        const k = part.slice(0, i), v = part.slice(i + 1);
        if (!(k in DKEY)) return k + ": " + v;
        const lbl = DKEY[k];
        if (lbl === "") return v;                       // action/page — value only
        if (lbl === "£") return "£" + v;
        if (lbl === "#") return "#" + v;
        return lbl + " " + v;
      }).filter(Boolean).join(" · ");
    }
    // Parse the raw "k=v · k=v" detail into an object (for subject + link building).
    function parseDetail(det) {
      const o = {};
      if (!det || det.indexOf("→") >= 0) return o;      // notes aren't key=value
      det.split(" · ").forEach(p => { const i = p.indexOf("="); if (i > 0) o[p.slice(0, i)] = p.slice(i + 1); });
      return o;
    }
    // The main "thing" an action was about, to read like a sentence subject.
    function subjectOf(r) {
      if (r.method === "VIEW") return "";
      const d = parseDetail(r.detail);
      const v = d.siteName || d.site || d.name || d.label || d.title || d.reg || d.to || d.toUser
        || d.Username || d.username || d.u || d.description || d.reason || (d.id ? "#" + d.id : "");
      return v ? String(v).slice(0, 48) : "";
    }
    // Where a row links to — prefer the page it was fired from, else map the action
    // to the page where you'd go to see/act on it. Everything ends up clickable.
    const ACTION_PAGE = [
      [/\/(add|update)-site|\/sites\b|\/customers/, "sites.html"],
      [/\/sites\/register|\/costing/, "job-costing.html"],
      [/\/fleet\/|\/vancheck\//, "vehicles.html"],
      [/\/key\b|\/keys\b/, "keys.html"],
      [/\/holiday\//, "holiday-admin.html"],
      [/\/asset\b|\/asset\/|\/transfer\b|-asset-image/, "assets-admin.html"],
      [/\/sla\b|\/sla\//, "sla-main.html"],
      [/\/memos\//, "notification-centre.html"],
      [/\/ts\//, "timesheets-admin.html"],
      [/\/office\//, "office-timesheet.html"],
      [/\/(users|user)\b|\/device\//, "users-admin.html"],
      [/\/theme\b|\/theme\//, "personalise.html"],
      [/\/notify\//, "notification-centre.html"],
    ];
    function linkFor(r) {
      if (r.ref && PAGE_NAMES[r.ref]) return r.ref;     // the page they were on — the best target
      if (r.method === "VIEW") { const pg = r.path.slice(1); return PAGE_NAMES[pg] ? pg : ""; }
      const key = r.method + " " + r.path;
      for (const [re, page] of ACTION_PAGE) if (re.test(key)) return page;
      return r.ref || "";
    }
    const PAGE_NAMES = {
      "main.html": "the Menu", "holiday.html": "Holiday", "holiday-admin.html": "Holiday Admin",
      "my-assets.html": "Plant & Equipment", "assets-admin.html": "All Assets", "shared-assets.html": "Shared Assets",
      "keys.html": "the Key Register", "users-admin.html": "Users Admin", "device-admin.html": "Device Management",
      "personalise.html": "Personalise", "help.html": "Help", "notify-log.html": "the Notification Log",
      "activity-log.html": "the Activity Log", "sites.html": "Site Manager", "customers.html": "Customers",
      "vehicles.html": "Vehicles", "office-my-hours.html": "My Hours", "office-timesheet.html": "Office Timesheet",
      "my-day.html": "My Day", "sla-menu.html": "the SLA Menu", "sla-main.html": "the SLA Board",
      "sitelog.html": "SiteLog", "projects.html": "Projects", "forms.html": "Forms", "compliance.html": "Compliance",
      "vehicle-maintenance.html": "Vehicle Maintenance", "vehicle-checks.html": "Vehicle Checks",
      "van-check.html": "Weekly Van Check", "van-handover.html": "Van Handover", "van-checks.html": "Van Checks Admin",
      "fuel-cards.html": "Fuel Cards", "van-timesheet.html": "Van Timesheet", "fleet-report.html": "Fleet Report",
      "job-costing.html": "Job Costing", "sites-register.html": "Site Register", "sitelog-links.html": "People Links",
      "engineer-timesheet.html": "My Timesheet", "timesheets-admin.html": "Engineer Timesheets",
      "assets-admin.html": "All Assets", "my-assets.html": "Plant & Equipment", "job-view.html": "a Job",
      "sla-scheduler.html": "the SLA Scheduler", "job-archive.html": "the Job Archive", "sla-data-tools.html": "SLA Data Tools",
      "route.html": "the Field App", "engineer-jobs.html": "the Field App", "inbox.html": "Messages",
      "notification-centre.html": "Notification Centre", "my-documents.html": "My Documents", "stats.html": "Stats",
    };
    const pageName = file => PAGE_NAMES[file] || (file ? file.replace(/\.html$/, "") : "");
    function describe(r) {
      if (r.method === "VIEW") {
        const page = r.path.slice(1);
        return "Opened " + (PAGE_NAMES[page] || page);
      }
      const key = r.method + " " + r.path;
      for (const [re, label] of FRIENDLY) if (re.test(key)) return label;
      return r.method + " " + r.path;
    }

    async function load() {
      g("list").innerHTML = "<div class='row muted'>Loading…</div>";
      const q = "?days=" + g("fDays").value
        + (g("fUser").value ? "&user=" + encodeURIComponent(g("fUser").value) : "")
        + (g("fType").value ? "&type=" + g("fType").value : "");
      try {
        const d = await authFetch("/audit/log" + q).then(r => r.json());
        if (!d.ok) throw new Error(d.error || "Failed");
        LOG = d.log || [];
        render();
      } catch (e) { g("list").innerHTML = "<div class='row muted'>Couldn't load the log — is the latest portal API deployed?</div>"; }
    }

    const fmtWhen = at => at ? new Date(at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "";
    const fmtTime = at => at ? new Date(at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
    const kindHtml = r => r.method === "VIEW"
      ? '<span class="kind view">viewed</span>'
      : (r.status >= 400 ? '<span class="kind fail">failed (' + r.status + ")</span>" : '<span class="kind action">action</span>');

    // The inner content of one event row (the clickable message + its detail line).
    function rowInner(r) {
      const subject = subjectOf(r);
      const on = (r.method !== "VIEW" && r.ref && pageName(r.ref)) ? pageName(r.ref) : "";
      const msg = esc(describe(r)) + (subject ? ` — <b>${esc(subject)}</b>` : "") + (on ? ` <span class="onpage">on ${esc(on)}</span>` : "");
      const nd = r.method === "VIEW" ? "" : niceDetail(r.detail);
      const det = (nd && nd !== subject) ? nd : "";
      const href = linkFor(r);
      const what = href ? `<a class="msg" href="${esc(href)}">${msg}</a>` : `<span class="msg nolink">${msg}</span>`;
      return `<div class="what">${what}</div>${det ? `<div class="det">${esc(det)}</div>` : ""}`;
    }
    function rowHtml(r) {
      return `<div class="row">
        <div class="when">${esc(fmtWhen(r.at))}</div>
        <div style="flex:1;">
          <span class="who">${esc(nameOf(r.username) || r.username)}</span> ${kindHtml(r)}
          ${rowInner(r)}
        </div>
      </div>`;
    }

    // A run of the same person doing the same kind of thing back-to-back (e.g.
    // updating 200 sites) collapses into ONE expandable group — so a busy user
    // doesn't bury everyone else. Grouped by user + friendly action (views by user).
    const GROUP_MIN = 3;
    const verbKey = r => r.username + "|" + (r.method === "VIEW" ? "·view" : describe(r));

    function render() {
      const q = g("fSearch").value.trim().toLowerCase();
      const rows = LOG.filter(r => !q ||
        (describe(r) + " " + r.path + " " + (r.detail || "") + " " + niceDetail(r.detail) + " " + subjectOf(r) + " " + pageName(r.ref) + " " + r.username + " " + nameOf(r.username)).toLowerCase().includes(q));
      g("countLbl").textContent = rows.length ? rows.length + (rows.length === 1000 ? "+ events (newest 1000)" : " event" + (rows.length === 1 ? "" : "s")) : "";
      if (!rows.length) { g("list").innerHTML = "<div class='row muted'>Nothing recorded for these filters.</div>"; return; }

      const out = [];
      let i = 0;
      while (i < rows.length) {
        const key = verbKey(rows[i]);
        let j = i + 1;
        while (j < rows.length && verbKey(rows[j]) === key) j++;
        const run = rows.slice(i, j);
        if (run.length >= GROUP_MIN) {
          const r0 = run[0], who = nameOf(r0.username) || r0.username;
          const isView = r0.method === "VIEW";
          const verb = isView ? "Opened pages" : esc(describe(r0));
          // newest-first, so run[last] is the oldest — show the span oldest → newest.
          const span = fmtTime(run[run.length - 1].at) + "–" + fmtTime(run[0].at);
          const day = new Date(r0.at).toLocaleDateString("en-GB", { dateStyle: "medium" });
          out.push(
            `<details class="group">
              <summary>
                <div class="when">${esc(day)}<br>${esc(span)}</div>
                <div style="flex:1;">
                  <span class="who">${esc(who)}</span> ${kindHtml(r0)}
                  <div class="what"><span class="msg nolink">${verb} <b>× ${run.length}</b></span> <span class="expand">tap to expand ▾</span></div>
                </div>
              </summary>
              <div class="gbody">${run.map(rowHtml).join("")}</div>
            </details>`
          );
        } else {
          run.forEach(r => out.push(rowHtml(r)));
        }
        i = j;
      }
      g("list").innerHTML = out.join("");
    }

    g("fUser").addEventListener("change", load);
    g("fDays").addEventListener("change", load);
    g("fType").addEventListener("change", load);
    g("fSearch").addEventListener("input", render);
  </script>
</body>
</html>

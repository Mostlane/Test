<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Tasks — Mostlane</title>
  <script src="/portal-config.js?v=27"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <link rel="manifest" href="/manifest.json">
  <script src="auth.js"></script>
  <style>
    :root{ --navy:#003366; --line:#e3e8ee; --muted:#5b6b78; --bad:#dc2626; --warn:#d97706; --ok:#15803d; }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#eef2f6;color:#1f2a37;}
    header.page{background:linear-gradient(180deg,#1A4F8F,#003468);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;}
    header.page h1{font-size:19px;margin:0;flex:1;}
    .btn{border:none;border-radius:9px;padding:9px 14px;font:600 13.5px 'Segoe UI';cursor:pointer;text-decoration:none;display:inline-block;}
    .btn.small{padding:7px 11px;font-size:12.5px;}
    .btn.primary{background:#003b82;color:#fff;} .btn.grey{background:rgba(255,255,255,.16);color:#fff;} .btn.ghost{background:#eef2f6;color:#1f2a44;}
    .wrap{max-width:760px;margin:0 auto;padding:16px;}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,30,80,.06);}
    .task{display:flex;gap:12px;align-items:flex-start;}
    .task .body{flex:1;min-width:0;}
    .task h3{margin:0 0 3px;font-size:15.5px;color:var(--navy);}
    .task .meta{font-size:12.5px;color:var(--muted);margin:2px 0;}
    .task .detail{font-size:13.5px;color:#374151;margin:5px 0 0;white-space:pre-wrap;}
    .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;}
    .pill.due{background:#fef3c7;color:#92400e;} .pill.overdue{background:#fee2e2;color:#b91c1c;}
    .pill.done{background:#dcfce7;color:#166534;}
    .pill.age{background:#eef2f6;color:#334155;} .pill.age.warn{background:#fee2e2;color:#b91c1c;}
    .pill.cat{background:#e0edff;color:#1e40af;font-weight:700;}
    .card.warn7{border-left:5px solid var(--bad);}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .chip{background:#fff;border:1px solid #cbd5e1;color:#334155;border-radius:999px;padding:7px 14px;font:600 13px 'Segoe UI';cursor:pointer;}
    .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
    .chip .n{opacity:.7;font-weight:600;margin-left:4px;}
    .flagrow{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin:-2px 2px 12px;}
    .flagrow input{width:56px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;font:700 13.5px 'Segoe UI';text-align:center;color:#1f2a37;}
    .flagrow .saved{color:var(--ok);font-weight:600;font-size:12px;opacity:0;transition:opacity .2s;}
    .flagrow .saved.on{opacity:1;}
    .tickbtn{border:2px solid #cbd5e1;background:#fff;border-radius:10px;width:30px;height:30px;font-size:16px;cursor:pointer;flex:none;color:#16a34a;}
    .tickbtn.on{background:#16a34a;border-color:#16a34a;color:#fff;}
    .sec-h{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:16px 2px 8px;}
    .auto-note{font-size:12px;color:#0369a1;background:#e0f2fe;border-radius:8px;padding:5px 9px;margin-top:6px;display:inline-block;}
    .empty{text-align:center;color:var(--muted);padding:40px 10px;}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="main.html" title="Back">‹ Back</a>
    <h1>✅ My Tasks</h1>
    <a class="btn grey small" id="manageBtn" href="tasks-admin.html" style="display:none;">🗂 Manage tasks</a>
  </header>
  <div class="wrap">
    <div id="filters" class="filters"></div>
    <div id="flagrow" class="flagrow" style="display:none;">⚑ Flag &amp; warn when older than
      <input id="flagAge" type="number" min="1" max="90" inputmode="numeric"> days
      <span class="saved" id="flagSaved">Saved ✓</span></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>

  <script>
    const API = window.MOSTLANE_API || "https://mostlane-api.jamie-def.workers.dev";
    const tok = () => localStorage.getItem("mostlaneToken");
    function aFetch(p,o={}){ o.headers=Object.assign({Authorization:"Bearer "+tok()},o.headers||{}); if(o.body&&!o.headers["Content-Type"])o.headers["Content-Type"]="application/json"; return fetch(API+p,o); }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    const g = id => document.getElementById(id);

    // Show the admin "Manage tasks" button for Full-Access users (cached perms).
    try{ const p=JSON.parse(sessionStorage.getItem("mostlanePermissions")||localStorage.getItem("mostlanePermissions")||"{}"); if(p.FullAccess==="Yes") g("manageBtn").style.display=""; }catch(e){}

    const WD=["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const MO=["","January","February","March","April","May","June","July","August","September","October","November","December"];
    function fmtTime(hm){ return hm||"17:00"; }
    function schedule(t){
      const by=" by "+fmtTime(t.dueTime);
      switch(t.recurrence){
        case "weekly": return "Every "+(WD[t.dueDow]||"Friday")+by;
        case "monthly": return "Day "+(t.dueDom||1)+" each month"+by;
        case "quarterly": return "Day "+(t.dueDom||1)+" each quarter"+by;
        case "yearly": return (MO[t.dueMonth]||"January")+" "+(t.dueDom||1)+" each year"+by;
        case "once": return "By "+(t.dueDate?fmtDMY(t.dueDate):"—")+by;
        default: return "Every day"+by;
      }
    }
    function fmtDMY(s){ if(!s)return""; const d=new Date(s); if(isNaN(d))return""; return String(d.getDate()).padStart(2,"0")+" "+MO[d.getMonth()+1].slice(0,3)+" "+d.getFullYear(); }
    function dueLabel(iso){ try{ return new Date(iso).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }

    // Category for filtering: the explicit one, else derived (recurring vs one-off).
    function catOf(t){ if(t.category) return t.category; return (t.recurrence && t.recurrence!=="once") ? "Recurring" : "General"; }
    // Age in whole days from the task's "as of" date (an email's received date),
    // else its creation date. Drives oldest-first ordering + the >7-day warning.
    function ageBase(t){ return t.refDate || (t.createdAt? String(t.createdAt).slice(0,10) : ""); }
    function ageDays(t){ const b=ageBase(t); if(!b) return null; const d=new Date(b+"T12:00:00"); if(isNaN(d)) return null; return Math.floor((Date.now()-d.getTime())/86400000); }
    // Strip a leading "13d · " age prefix an external bot may have baked into the
    // title — the portal shows the age itself now, so it isn't doubled up.
    function cleanTitle(t){ const s=String(t.title||""); const c=s.replace(/^\s*\d+\s*d\s*[·\-–—]\s*/i,"").trim(); return c||s; }

    let ALL=[], FILTER="all", FLAG_AGE=7;
    // Flag/warn threshold (days) — per-user, saved to localStorage (instant) and
    // mirrored to /prefs so it follows the user across devices.
    function clampAge(n){ n=Math.round(Number(n)||7); return Math.max(1, Math.min(90, n)); }
    function initFlagAge(){
      try{ const l=localStorage.getItem("mlTaskFlagAge"); if(l!=null) FLAG_AGE=clampAge(l); }catch(e){}
      g("flagAge").value=FLAG_AGE;
      // Server value (if any) wins, then re-render.
      aFetch("/prefs").then(r=>r.json()).then(p=>{ const v=p&&p.ok&&p.prefs&&p.prefs.taskFlagAge; if(v!=null){ FLAG_AGE=clampAge(v); g("flagAge").value=FLAG_AGE; try{localStorage.setItem("mlTaskFlagAge",String(FLAG_AGE));}catch(e){} if(ALL.length) render(); } }).catch(()=>{});
      let t=null;
      g("flagAge").addEventListener("input", ()=>{
        FLAG_AGE=clampAge(g("flagAge").value);
        try{ localStorage.setItem("mlTaskFlagAge", String(FLAG_AGE)); }catch(e){}
        render();
        clearTimeout(t); t=setTimeout(()=>{
          aFetch("/prefs",{method:"POST",body:JSON.stringify({taskFlagAge:FLAG_AGE})}).then(()=>{ const s=g("flagSaved"); s.classList.add("on"); setTimeout(()=>s.classList.remove("on"),1200); }).catch(()=>{});
        }, 500);
      });
      g("flagAge").addEventListener("blur", ()=>{ g("flagAge").value=FLAG_AGE; });
    }
    async function load(){
      let d;
      try{ d=await aFetch("/tasks/mine").then(r=>r.json()); }catch(e){ g("list").innerHTML='<div class="empty">⚠️ Couldn\'t load your tasks.</div>'; g("filters").innerHTML=""; return; }
      if(!d.ok){ g("list").innerHTML='<div class="empty">'+esc(d.error||"Couldn't load.")+'</div>'; return; }
      ALL=d.tasks||[];
      render();
    }
    function render(){
      if(!ALL.length){ g("filters").innerHTML=""; g("flagrow").style.display="none"; g("list").innerHTML='<div class="empty">🎉 No tasks assigned to you right now.</div>'; return; }
      // The flag-age control only matters when there are age-based (email) tasks.
      g("flagrow").style.display = ALL.some(t=>t.refDate) ? "flex" : "none";
      // Filter chips: All + each category present (with a live count).
      const cats={}; ALL.forEach(t=>{ const c=catOf(t); cats[c]=(cats[c]||0)+1; });
      const names=Object.keys(cats).sort();
      if(!names.includes(FILTER) && FILTER!=="all") FILTER="all";
      let chips='<button class="chip'+(FILTER==="all"?" on":"")+'" data-f="all">All <span class="n">'+ALL.length+'</span></button>';
      chips+=names.map(c=>'<button class="chip'+(FILTER===c?" on":"")+'" data-f="'+esc(c)+'">'+esc(c)+' <span class="n">'+cats[c]+'</span></button>').join("");
      g("filters").innerHTML = names.length>1 || names[0]!=="General" ? chips : "";   // hide chips when there's only one plain group
      [].forEach.call(g("filters").querySelectorAll(".chip"), b=>b.onclick=()=>{ FILTER=b.dataset.f; render(); });

      const shown = FILTER==="all" ? ALL : ALL.filter(t=>catOf(t)===FILTER);
      // OLDEST FIRST: by the age base date ascending (no date → last).
      const byOldest=(a,b)=>{ const ka=ageBase(a)||"9999-12-31", kb=ageBase(b)||"9999-12-31"; return ka.localeCompare(kb); };
      const open=shown.filter(t=>!t.status.done).sort(byOldest);
      const done=shown.filter(t=>t.status.done).sort(byOldest);
      let html="";
      if(open.length){ html+='<div class="sec-h">To do ('+open.length+')</div>'+open.map(row).join(""); }
      if(done.length){ html+='<div class="sec-h">Done ('+done.length+')</div>'+done.map(row).join(""); }
      if(!open.length && !done.length) html='<div class="empty">No tasks in this filter.</div>';
      g("list").innerHTML=html;
    }
    function row(t){
      const s=t.status;
      const age=ageDays(t), over7=(age!=null && age>FLAG_AGE && !s.done);
      let pill;
      if(s.done) pill='<span class="pill done">✓ '+(s.auto?"Done automatically":"Done")+'</span>';
      else if(t.refDate){   // email-style task → show AGE (with a warning past 7 days)
        pill='<span class="pill age'+(over7?" warn":"")+'">'+(over7?"⚠ ":"")+(age===0?"today":age+" day"+(age===1?"":"s")+" ago")+'</span>';
      }
      else if(s.overdue) pill='<span class="pill overdue">Overdue — was due '+esc(dueLabel(s.dueAt))+'</span>';
      else pill='<span class="pill due">Due '+esc(dueLabel(s.dueAt))+'</span>';
      const catPill='<span class="pill cat">'+esc(catOf(t))+'</span> ';
      const canTick=!s.auto;   // auto-completed tasks aren't manually toggled
      const tick=canTick
        ? '<button class="tickbtn'+(s.done?" on":"")+'" title="'+(s.done?"Tick off":"Mark done")+'" onclick="toggle(\''+t.id+'\','+(s.done?"true":"false")+')">'+(s.done?"✓":"")+'</button>'
        : '<div class="tickbtn on" title="Completed automatically">✓</div>';
      // A task linked to a portal section opens straight there. The whole title
      // becomes the link, plus an explicit "Go to" button.
      const disp=esc(cleanTitle(t));
      const title=t.areaPage
        ? '<h3><a href="'+esc(t.areaPage)+'" style="color:var(--navy);text-decoration:none;">'+disp+' ↗</a></h3>'
        : '<h3>'+disp+'</h3>';
      const goBtn=t.areaPage
        ? '<a class="btn primary small" href="'+esc(t.areaPage)+'" style="margin-top:8px;">➜ Go to '+esc(t.areaLabel||"section")+'</a>'
        : "";
      // Email tasks show when it arrived; scheduled tasks show their recurrence.
      const meta=t.refDate ? ("Received "+fmtDMY(t.refDate)) : schedule(t);
      return '<div class="card'+(over7?" warn7":"")+'"><div class="task">'+tick+
        '<div class="body">'+title+
        '<div class="meta">'+esc(meta)+'</div>'+catPill+pill+
        (t.detail?'<div class="detail">'+esc(t.detail)+'</div>':"")+
        (t.autoMatch&&!s.done?'<div class="auto-note">⤿ Auto-ticks when you do this in the portal</div>':"")+
        (goBtn?'<div>'+goBtn+'</div>':"")+
        '</div></div></div>';
    }
    async function toggle(id, isDone){
      try{ await aFetch("/tasks/complete",{method:"POST",body:JSON.stringify({id,undo:isDone})}).then(r=>r.json()); }catch(e){}
      load();
    }
    window.toggle=toggle;
    (async function(){
      try{ const me=await aFetch("/auth/me").then(r=>r.json()); if(!me.ok){ location.href="/login.html"; return; } }catch(e){}
      initFlagAge();
      load();
    })();
  </script>
</body>
</html>

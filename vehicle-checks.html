<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <script src="/portal-config.js?v=22"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <title>Mostlane • Vehicle checks</title>
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="auth.js"></script>
  <style>
  :root{ --bg:#f4f6f9; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b; --brand:#2563eb; --ok:#0a7d33; --bad:#b00020; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header.page{background:#0f172a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header.page h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:180px;}
  header.page h1 small{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .wrap{max-width:820px;margin:0 auto;padding:16px;}
  .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;}
  header.page .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;}
  .btn.small{padding:6px 10px;font-size:13px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
  .panel h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .panel h2 .ct{font-size:12px;color:var(--muted);font-weight:600;}
  details.mon{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  details.mon>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;font-size:14px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;}
  details.mon>summary::-webkit-details-marker{display:none;}
  details.mon>summary .c{color:var(--muted);font-weight:600;font-size:12.5px;}
  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer;}
  .row:hover{background:#f4f8ff;}
  .row .d{font-weight:700;font-size:14px;white-space:nowrap;}
  .row .who{flex:1;min-width:0;font-size:13px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .go{color:#9fb2c8;font-size:20px;}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .pill.ok{background:#dcfce7;color:#166534;} .pill.bad{background:#fee2e2;color:#b91c1c;} .pill.info{background:#e0f2fe;color:#075985;} .pill.warn{background:#fef3c7;color:#92400e;}
  .empty{color:var(--muted);font-size:14px;padding:6px 2px;}
  .pill.alert{background:#fee2e2;color:#b91c1c;}
  .issfilter{margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .issfilter select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff;max-width:100%;}
  .tick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#475569;}
  .iss{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .iss .d{font-weight:700;white-space:nowrap;}
  .iss .who{color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iss .lab{flex:1;min-width:0;font-weight:600;}
  .iss.alerted{background:#fff7f7;}
  .qrow{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center;}
  .qrow .d{color:var(--muted);white-space:nowrap;} .qrow .who{flex:1;min-width:0;}

  /* detail modal */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:14px;}
  .modal{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:14px;padding:0;}
  .mhead{position:sticky;top:0;background:#0f172a;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .mhead h3{margin:0;font-size:16px;}
  .mbody{padding:14px 16px;}
  .drow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .drow .k{color:var(--muted);} .drow .v{font-weight:650;text-align:right;}
  .sect{margin-top:14px;} .sect h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .chk{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13.5px;}
  .chk .n{font-size:11.5px;color:var(--muted);}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px;}
  .pgrid img{width:100%;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#f1f5f9;}
  .sig{border:1px solid var(--line);border-radius:8px;background:#fff;max-width:280px;margin-top:6px;}
  .dmgitem{border:1px solid #f0d9a6;background:#fffdf6;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13.5px;}
  .dmgitem img{width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:6px;cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:4000;padding:20px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .status-line{font-size:12px;color:var(--muted);margin-top:8px;}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="vehicles.html" title="Back to vehicles">‹ Back</a>
    <h1 id="pageTitle">📋 Vehicle checks<small id="vehSub"></small></h1>
    <div class="head-actions">
      <a class="btn small" id="maintLink" href="#">🔧 Maintenance</a>
      <button class="btn small" onclick="load()">⟳ Refresh</button>
    </div>
  </header>

  <div class="wrap">
    <div class="panel">
      <h2>🤝 Van handovers <span class="ct" id="hoCount"></span></h2>
      <div id="hoList"><span class="empty">Loading…</span></div>
    </div>
    <div class="panel">
      <h2>🚐 Weekly van checks <span class="ct" id="vcCount"></span></h2>
      <div id="vcList"><span class="empty">Loading…</span></div>
    </div>

    <div class="panel">
      <h2>⚠️ Issues <span class="ct" id="issCount"></span></h2>
      <div class="issfilter"><label class="tick"><input type="checkbox" id="issAlertsOnly" onchange="renderIssues()"> Alerts only</label></div>
      <div id="issList"><span class="empty">Loading…</span></div>
    </div>

    <div class="panel">
      <h2>🔎 By question</h2>
      <div class="issfilter"><select id="qSel" onchange="renderByQuestion()"><option value="">Pick a question…</option></select></div>
      <div id="qList"><span class="empty">Pick a question to see every answer over time.</span></div>
    </div>

    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="backdrop" id="detailBackdrop"><div class="modal" id="detailModal"></div></div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt=""></div>

  <script>
  if (sessionStorage.getItem("mostlaneLoggedIn") !== "true") { window.location.href = "login.html"; }
  const API = window.MOSTLANE_API || "https://mostlane-api.jamie-def.workers.dev";
  function pTok(){ return localStorage.getItem("mostlaneToken") || ""; }
  function aFetch(p){ return fetch(API+p,{headers:{Authorization:"Bearer "+pTok()}}); }
  const $ = id => document.getElementById(id);
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const thumb = k => API+"/asset-thumb?key="+encodeURIComponent(k);
  const full  = k => API+"/asset-image?key="+encodeURIComponent(k);
  function fmtDMY(s){ if(!s)return ""; const d=new Date(s); if(isNaN(d))return esc(s); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getFullYear()).slice(2); }
  function monthLabel(s){ const d=new Date(s); if(isNaN(d))return "Undated"; return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }

  const REG = new URLSearchParams(location.search).get("reg") || "";
  const OPEN = new URLSearchParams(location.search).get("open") || "";
  let CHECKS=[], HANDOVERS=[], HO_TPL={checklist:[],equipment:[],photoSlots:[]}, VC={checklist:[],photoSlots:[]};

  $("maintLink").href = "vehicle-maintenance.html?reg="+encodeURIComponent(REG);

  async function load(){
    if(!REG){ $("statusLine").textContent="No vehicle specified."; return; }
    $("vehSub").textContent=REG;
    $("statusLine").textContent="Loading…";
    // Van-check labels (checklist/photo slots) so answers show human labels.
    try{ const s=await aFetch("/vancheck/settings").then(r=>r.json()); if(s.ok&&s.settings) VC=s.settings; }catch(e){}
    try{
      const [h,c]=await Promise.all([
        aFetch("/fleet/handovers?reg="+encodeURIComponent(REG)).then(r=>r.json()),
        aFetch("/fleet/vehicle-checks?reg="+encodeURIComponent(REG)).then(r=>r.json()),
      ]);
      HANDOVERS=(h&&h.handovers)||[]; HO_TPL=(h&&h.template)||HO_TPL;
      CHECKS=(c&&c.checks)||[];
      renderHandovers(); renderChecks(); renderIssues(); fillQuestionSelect(); renderByQuestion();
      $("statusLine").textContent="Loaded "+HANDOVERS.length+" handover(s), "+CHECKS.length+" van check(s).";
      if(OPEN && /^ho\d+$/.test(OPEN)){ const id=Number(OPEN.slice(2)); const ho=HANDOVERS.find(x=>x.id===id); if(ho) openHandover(ho); }
    }catch(e){ console.error(e); $("statusLine").textContent="Couldn't load."; $("hoList").innerHTML='<span class="empty">Couldn\'t load.</span>'; $("vcList").innerHTML=""; }
    aFetch("/fleet/vehicles").then(r=>r.json()).then(d=>{
      const n=r=>String(r||"").replace(/\s+/g,"").toUpperCase();
      const v=(d.vehicles||[]).find(x=>n(x.reg)===n(REG));
      if(v){ const mm=[v.make,v.model].filter(Boolean).join(" "); $("vehSub").textContent=REG+(mm?" · "+mm:""); }
    }).catch(()=>{});
  }

  // Group an array into collapsible month blocks (already newest-first).
  function groupByMonth(items, dateOf){
    const groups=[]; const idx={};
    items.forEach((it,i)=>{ const key=monthLabel(dateOf(it)); if(idx[key]==null){ idx[key]=groups.length; groups.push({key,items:[]}); } groups[idx[key]].items.push({it,i}); });
    return groups;
  }
  function monthsHtml(groups, rowFn){
    if(!groups.length) return '<span class="empty">Nothing recorded yet.</span>';
    return groups.map((gp,gi)=>`<details class="mon" ${gi===0?"open":""}>
      <summary><span>${esc(gp.key)}</span><span class="c">${gp.items.length}</span></summary>
      ${gp.items.map(x=>rowFn(x.it,x.i)).join("")}
    </details>`).join("");
  }

  function renderHandovers(){
    $("hoCount").textContent = HANDOVERS.length ? "("+HANDOVERS.length+")" : "";
    const done = HANDOVERS.filter(h=>h.status==="done");
    const pending = HANDOVERS.filter(h=>h.status==="pending");
    let head="";
    if(pending.length) head = pending.map(h=>`<div class="row" onclick="openHandover(${h.id},true)"><span class="d">${fmtDMY(h.requestedAt)}</span><span class="who">Awaiting ${esc(h.name)}</span><span class="pill warn">Pending</span><span class="go">›</span></div>`).join("");
    const groups=groupByMonth(done, h=>h.completedAt||h.requestedAt);
    const body=monthsHtml(groups, h=>{
      const safe = h.safeToDrive===false?'<span class="pill bad">Not safe</span>':'<span class="pill ok">Safe</span>';
      const dcount = h.defectCount?`<span class="pill warn">${h.defectCount} issue${h.defectCount===1?"":"s"}</span>`:"";
      const al = (h.alerts&&h.alerts.length)?`<span class="pill alert">⚠ ${h.alerts.length}</span>`:"";
      return `<div class="row" onclick="openHandover(${h.id})"><span class="d">${fmtDMY(h.completedAt||h.requestedAt)}</span><span class="who">${esc(h.name)}</span>${al}${dcount}${safe}<span class="go">›</span></div>`;
    });
    $("hoList").innerHTML = (head||"") + (done.length?body:(pending.length?"":'<span class="empty">No handovers recorded yet.</span>'));
  }

  function renderChecks(){
    $("vcCount").textContent = CHECKS.length ? "("+CHECKS.length+")" : "";
    const groups=groupByMonth(CHECKS, c=>c.checkedAt);
    $("vcList").innerHTML = monthsHtml(groups, (c,i)=>{
      const safe = c.safeToDrive===false?'<span class="pill bad">Not safe</span>':'<span class="pill ok">Safe</span>';
      const dcount = c.defectCount?`<span class="pill warn">${c.defectCount} issue${c.defectCount===1?"":"s"}</span>`:"";
      const al = (c.alerts&&c.alerts.length)?`<span class="pill alert">⚠ ${c.alerts.length}</span>`:"";
      const cust = c.custom?`<span class="pill" style="background:#e0e7ff;color:#3730a3;" title="${esc(c.custom.name||'')}">🧩 Custom</span>`:"";
      return `<div class="row" onclick="openCheck(${i})"><span class="d">${fmtDMY(c.checkedAt)}</span><span class="who">${esc(c.name)}</span>${cust}${al}${dcount}${safe}<span class="go">›</span></div>`;
    });
  }

  // ── Issues log + by-question filter (aggregated from checks + handovers) ──
  function answerWord(v){ return v==="defect"?"Defect":v==="missing"?"Missing":v==="present"?"Present":v==="ok"?"OK":esc(v); }
  // answerMeta (stored on the record) carries {label,tone,value} per answer so
  // custom answer options ("Not required in this vehicle" etc.) show their own
  // wording + colour. Fall back to the legacy fixed OK/Defect/Present/Missing.
  function metaOf(rec, id){ return rec && rec.answerMeta && rec.answerMeta[id]; }
  function answerText(rec, id, v){ const m=metaOf(rec,id); return (m&&m.label)?m.label:answerWord(v); }
  function answerToneOf(rec, id, v){ const m=metaOf(rec,id); if(m&&m.tone) return m.tone; return (v==="defect"||v==="missing")?"issue":"ok"; }
  function isIssueAns(rec, id, v){ return answerToneOf(rec,id,v)==="issue"; }
  function labelMapFrom(tpl){ const m={}; [...(tpl.checklist||[]),...(tpl.equipment||[])].forEach(it=>m[it.id]=it.label); return m; }
  // Every "issue" answer across both sources, newest first (tone-aware).
  function allIssues(){
    const lblC=labelMapFrom(VC), lblH=labelMapFrom(HO_TPL);
    const out=[];
    for(const c of CHECKS){
      const alertIds=new Set((c.alerts||[]).map(a=>a.id));
      const cLbl=c.custom?labelMapFrom(c.custom):lblC;
      for(const id of Object.keys(c.answers||{})){ const v=c.answers[id];
        if(isIssueAns(c,id,v)) out.push({date:c.checkedAt,who:c.name,label:(metaOf(c,id)&&metaOf(c,id).itemLabel)||cLbl[id]||id,answer:answerText(c,id,v),source:"Van check",alert:alertIds.has(id),note:(c.defectNotes||{})[id]||""}); }
    }
    for(const h of HANDOVERS){ if(h.status!=="done")continue;
      const alertIds=new Set((h.alerts||[]).map(a=>a.id));
      for(const id of Object.keys(h.answers||{})){ const v=h.answers[id];
        if(isIssueAns(h,id,v)) out.push({date:h.completedAt||h.requestedAt,who:h.name,label:lblH[id]||id,answer:answerText(h,id,v),source:"Handover",alert:alertIds.has(id),note:(h.defectNotes||{})[id]||""}); }
    }
    out.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    return out;
  }
  function renderIssues(){
    let iss=allIssues();
    if($("issAlertsOnly").checked) iss=iss.filter(x=>x.alert);
    $("issCount").textContent = iss.length?("("+iss.length+")"):"";
    if(!iss.length){ $("issList").innerHTML='<span class="empty">No issues recorded. 🎉</span>'; return; }
    $("issList").innerHTML=iss.map(x=>`<div class="iss ${x.alert?"alerted":""}">
      <span class="d">${fmtDMY(x.date)}</span>
      <span class="lab">${x.alert?"⚠ ":""}${esc(x.label)}<span class="pill bad" style="margin-left:6px">${esc(x.answer)}</span>${x.note?` <span class="who" style="font-weight:400">— ${esc(x.note)}</span>`:""}</span>
      <span class="who" style="flex:none">${esc(x.who)} · ${esc(x.source)}</span>
    </div>`).join("");
  }
  // Distinct questions (id → label) across both templates, for the filter.
  function allQuestions(){
    const m={}; [...(VC.checklist||[]),...(VC.equipment||[]),...(HO_TPL.checklist||[]),...(HO_TPL.equipment||[])].forEach(it=>{ if(it&&it.id&&!m[it.id]) m[it.id]=it.label; });
    return Object.keys(m).map(id=>({id,label:m[id]})).sort((a,b)=>a.label.localeCompare(b.label));
  }
  function fillQuestionSelect(){
    const qs=allQuestions();
    $("qSel").innerHTML='<option value="">Pick a question…</option>'+qs.map(q=>`<option value="${esc(q.id)}">${esc(q.label)}</option>`).join("");
  }
  function renderByQuestion(){
    const id=$("qSel").value;
    if(!id){ $("qList").innerHTML='<span class="empty">Pick a question to see every answer over time.</span>'; return; }
    const rows=[];
    for(const c of CHECKS){ if(c.answers&&c.answers[id]!==undefined) rows.push({date:c.checkedAt,who:c.name,text:answerText(c,id,c.answers[id]),issue:isIssueAns(c,id,c.answers[id]),source:"Van check"}); }
    for(const h of HANDOVERS){ if(h.status==="done"&&h.answers&&h.answers[id]!==undefined) rows.push({date:h.completedAt||h.requestedAt,who:h.name,text:answerText(h,id,h.answers[id]),issue:isIssueAns(h,id,h.answers[id]),source:"Handover"}); }
    rows.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    if(!rows.length){ $("qList").innerHTML='<span class="empty">No answers recorded for that item yet.</span>'; return; }
    $("qList").innerHTML=rows.map(r=>`<div class="qrow"><span class="who"><b>${esc(r.who)}</b></span><span class="d">${fmtDMY(r.date)}</span><span class="pill ${r.issue?"bad":"ok"}">${esc(r.text)}</span></div>`).join("");
  }

  // ── Detail views ──
  function labelFor(list, id){ const it=(list||[]).find(x=>x.id===id); return it?it.label:id; }
  function answerChip(v, rec, id){
    const m = (rec && id!==undefined) ? metaOf(rec,id) : null;
    if(m){ const cls = m.tone==="issue"?"bad":m.tone==="na"?"info":"ok"; return '<span class="pill '+cls+'">'+esc(m.label||v)+'</span>'; }
    if(v==="ok"||v==="present") return '<span class="pill ok">'+(v==="present"?"Present":"OK")+'</span>';
    if(v==="defect") return '<span class="pill bad">Defect</span>';
    if(v==="missing") return '<span class="pill bad">Missing</span>';
    return '<span class="pill info">'+esc(v)+'</span>';
  }
  function photoGrid(keys){
    keys=(keys||[]).filter(Boolean);
    if(!keys.length) return "";
    return '<div class="pgrid">'+keys.map(k=>`<img src="${esc(thumb(k))}" loading="lazy" onclick="enlarge('${esc(full(k))}')" alt="">`).join("")+'</div>';
  }
  function showDetail(html){ $("detailModal").innerHTML=html; $("detailBackdrop").style.display="flex"; }
  function closeDetail(){ $("detailBackdrop").style.display="none"; }
  function alertBanner(rec){
    const a=rec&&rec.alerts; if(!a||!a.length) return "";
    return `<div style="background:#fee2e2;color:#b91c1c;padding:10px 14px;font-size:13.5px;font-weight:600;">⚠ Alert: ${a.map(x=>esc(x.label)+" — "+esc(answerWord(x.answer))).join("; ")}</div>`;
  }

  function openCheck(i){
    const c=CHECKS[i]; if(!c)return;
    // A custom check carries its OWN item labels; otherwise use the weekly template.
    const vcLabels = c.custom ? [...(c.custom.checklist||[]),...(c.custom.equipment||[])] : [...(VC.checklist||[]),...(VC.equipment||[])];
    const checks=Object.keys(c.answers||{}).map(id=>`<div class="chk"><span>${esc(labelFor(vcLabels,id))}</span><span>${answerChip(c.answers[id],c,id)}${c.defectNotes&&c.defectNotes[id]?` <span class="n">${esc(c.defectNotes[id])}</span>`:""}</span></div>`).join("");
    const title = c.custom ? `🧩 Custom check · ${esc(c.custom.name||"")} · ${fmtDMY(c.checkedAt)}` : `Van check · ${fmtDMY(c.checkedAt)}`;
    showDetail(`
      <div class="mhead"><h3>${title}</h3><button class="btn small" onclick="closeDetail()">✕ Close</button></div>
      ${alertBanner(c)}
      <div class="mbody">
        <div class="drow"><span class="k">Driver</span><span class="v">${esc(c.name)}</span></div>
        <div class="drow"><span class="k">Mileage</span><span class="v">${c.mileage?esc(c.mileage):"—"}</span></div>
        <div class="drow"><span class="k">Safe to drive</span><span class="v">${c.safeToDrive===false?"No":"Yes"}</span></div>
        ${c.note?`<div class="drow"><span class="k">Notes</span><span class="v">${esc(c.note)}</span></div>`:""}
        ${checks?`<div class="sect"><h4>Checklist</h4>${checks}</div>`:""}
        <div class="sect"><h4>Photos</h4>${photoGrid(c.photos)||'<span class="empty">No photos.</span>'}</div>
      </div>`);
  }

  function openHandover(idOrObj, pending){
    const h = (typeof idOrObj==="object") ? idOrObj : HANDOVERS.find(x=>x.id===idOrObj);
    if(!h)return;
    if(h.status==="pending"){
      showDetail(`<div class="mhead"><h3>Handover · pending</h3><button class="btn small" onclick="closeDetail()">✕ Close</button></div>
        <div class="mbody"><p>Requested ${fmtDMY(h.requestedAt)} for <b>${esc(h.name)}</b>${h.requestedByName?" by "+esc(h.requestedByName):""}.</p>
        <p class="empty">Not completed yet — it's still with the driver.</p></div>`);
      return;
    }
    // Iterate the record's OWN answers (labelled by the current template, falling
    // back to the raw id) so a later template edit never hides old answers.
    const lbl={}; (HO_TPL.checklist||[]).forEach(it=>lbl[it.id]=it.label); (HO_TPL.equipment||[]).forEach(it=>lbl[it.id]=it.label);
    const chkRows=[], eqRows=[];
    for(const id of Object.keys(h.answers||{})){
      const v=h.answers[id];
      const note=(h.defectNotes&&h.defectNotes[id])?` <span class="n">${esc(h.defectNotes[id])}</span>`:"";
      const row=`<div class="chk"><span>${esc(lbl[id]||id)}</span><span>${answerChip(v)}${note}</span></div>`;
      (v==="present"||v==="missing"?eqRows:chkRows).push(row);
    }
    const chk=chkRows.join(""), eq=eqRows.join("");
    const damage=(h.damage||[]).map(d=>`<div class="dmgitem">${esc(d.note||"(no description)")}${d.photo?`<br><img src="${esc(thumb(d.photo))}" onclick="enlarge('${esc(full(d.photo))}')" alt="">`:""}</div>`).join("");
    const slotKeys=Object.values(h.slotPhotos||{});
    showDetail(`
      <div class="mhead"><h3>Handover · ${fmtDMY(h.completedAt||h.requestedAt)}</h3><button class="btn small" onclick="closeDetail()">✕ Close</button></div>
      ${alertBanner(h)}
      <div class="mbody">
        <div class="drow"><span class="k">Driver</span><span class="v">${esc(h.name)}</span></div>
        ${h.requestedByName?`<div class="drow"><span class="k">Sent by</span><span class="v">${esc(h.requestedByName)}</span></div>`:""}
        <div class="drow"><span class="k">Mileage</span><span class="v">${h.mileage?esc(h.mileage):"—"}</span></div>
        <div class="drow"><span class="k">Safe to drive</span><span class="v">${h.safeToDrive===false?"No":"Yes"}</span></div>
        ${h.conditionExterior?`<div class="sect"><h4>Exterior condition</h4><div style="font-size:13.5px">${esc(h.conditionExterior)}</div></div>`:""}
        ${h.conditionInterior?`<div class="sect"><h4>Interior condition</h4><div style="font-size:13.5px">${esc(h.conditionInterior)}</div></div>`:""}
        ${chk?`<div class="sect"><h4>Vehicle checks</h4>${chk}</div>`:""}
        ${eq?`<div class="sect"><h4>Equipment on board</h4>${eq}</div>`:""}
        ${damage?`<div class="sect"><h4>Damage logged</h4>${damage}</div>`:""}
        <div class="sect"><h4>Photos</h4>${photoGrid([...slotKeys, ...(h.photos||[])])||'<span class="empty">No photos.</span>'}</div>
        ${h.note?`<div class="sect"><h4>Notes</h4><div style="font-size:13.5px">${esc(h.note)}</div></div>`:""}
        ${h.signature?`<div class="sect"><h4>Signature</h4><img class="sig" src="${esc(full(h.signature))}" alt="signature"></div>`:""}
      </div>`);
  }

  function enlarge(src){ $("lightboxImg").src=src; $("lightbox").style.display="flex"; }
  function closeLightbox(){ $("lightbox").style.display="none"; $("lightboxImg").src=""; }
  $("detailBackdrop").addEventListener("click",e=>{ if(e.target===$("detailBackdrop")) closeDetail(); });

  Object.assign(window,{load,openCheck,openHandover,closeDetail,enlarge,closeLightbox,renderIssues,renderByQuestion});
  window.addEventListener("DOMContentLoaded",load);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FBC Jobs</title>
  <script src="/portal-config.js?v=39"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <style>
    :root { --brand:#003468; --ok:#0a7d33; --bad:#b00020; --amber:#b7791f; --line:#e2e8f0; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f4;color:#1f2937;}
    header.page{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;}
    header.page h1{font-size:18px;margin:0;flex:1;}
    .wrap{max-width:900px;margin:14px auto 90px;padding:0 12px;}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(6,24,54,.06);padding:14px;margin-bottom:12px;}
    .muted{color:#6b7a90;font-size:13px;}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .chip{background:#fff;border:1px solid #ccd5dd;color:#334;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
    .chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
    .chip .c{opacity:.7;font-weight:700;margin-left:5px;}
    .sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
    .tile{flex:1;min-width:110px;background:#f7f9fb;border:1px solid #eef2f6;border-radius:12px;padding:10px 12px;text-align:center;}
    .tile .n{font-size:26px;font-weight:800;line-height:1;color:var(--brand);}
    .tile .l{font-size:12px;color:#6b7a90;margin-top:4px;}
    .tile.warn .n{color:var(--amber);} .tile.warn{background:#fffaf0;border-color:#f6e0b5;}
    .tile.bad .n{color:var(--bad);} .tile.bad{background:#fdf2f2;border-color:#f5c6c6;}
    .tile.ok .n{color:var(--ok);} .tile.ok{background:#f0faf3;border-color:#c9ebd4;}
    .sechd{font-size:13px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.03em;margin:18px 4px 8px;}
    .sechd.q{color:var(--amber);}
    .job{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden;}
    .job.q{border-color:#f0cf8f;box-shadow:0 0 0 2px #fdf3df inset;}
    .jhd{display:flex;align-items:center;gap:11px;padding:12px;cursor:pointer;}
    .jhd .em{font-size:20px;width:26px;text-align:center;flex:none;}
    .jhd .m{flex:1;min-width:0;}
    .jhd .m .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .jhd .m .s{font-size:12.5px;color:#6b7a90;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;flex:none;}
    .b-open{background:#eef1f4;color:#5a6b80;}
    .b-toinv{background:#fff3cd;color:#7a5b00;}
    .b-inv{background:#d8f0e0;color:#0e7a3b;}
    .b-nr{background:#eef1f4;color:#8a97a8;}
    .qpill{background:#fdecc8;color:#7a5b00;border:1px solid #f0cf8f;}
    .body{border-top:1px solid #eef2f6;padding:12px;display:none;background:#fafbfc;}
    .job.open .body{display:block;}
    .desc{font-size:13px;color:#374151;white-space:pre-wrap;margin:0 0 10px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:560px){.grid{grid-template-columns:1fr;}}
    .fld label{display:block;font-size:11.5px;font-weight:700;color:#6b7a90;margin-bottom:3px;text-transform:uppercase;letter-spacing:.02em;}
    .fld input,.fld select{width:100%;padding:8px 9px;border:1px solid #ccd5dd;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#1f2438;}
    .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
    .lnk{display:inline-block;text-decoration:none;background:#eef2f7;color:var(--brand);border:1px solid #d7dee6;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;}
    .saved{font-size:12px;color:var(--ok);font-weight:700;opacity:0;transition:opacity .2s;}
    .saved.on{opacity:1;}
    .conv{margin-top:12px;border-top:1px dashed #dbe2ea;padding-top:10px;}
    .conv h4{margin:0 0 8px;font-size:12.5px;color:var(--brand);}
    .msg{border:1px solid #eef2f6;border-radius:10px;padding:8px 10px;margin-bottom:7px;background:#fff;}
    .msg .h{font-size:11.5px;color:#6b7a90;margin-bottom:3px;}
    .msg .b{font-size:13px;white-space:pre-wrap;color:#243040;}
    .msg.note{background:#f4f8ff;border-color:#d8e6ff;}
    .msg.out{background:#f0faf3;border-color:#cdeed8;}
    .addnote{display:flex;gap:8px;margin-top:8px;}
    .addnote textarea{flex:1;min-height:38px;padding:8px;border:1px solid #ccd5dd;border-radius:9px;font-family:inherit;font-size:13px;resize:vertical;}
    .btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
    .empty{padding:14px 4px;color:#8a97a8;font-size:13px;}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="/main.html" style="text-decoration:none;">‹ Back</a>
    <h1>🏛️ FBC Jobs</h1>
  </header>

  <div class="wrap">
    <div class="card">
      <p class="muted" id="greet" style="margin:0 0 10px;">Fareham Borough Council jobs — quotes, costs, and what to invoice each month.</p>
      <div class="sumrow" id="summary"></div>
    </div>

    <div class="filters" id="filters">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="quote">⭐ Quote required</button>
      <button class="chip" data-f="active">Active</button>
      <button class="chip" data-f="toinvoice">To invoice</button>
      <button class="chip" data-f="invoiced">Invoiced</button>
    </div>

    <div id="list"><div class="card"><p class="muted" style="padding:6px 4px;">Loading…</p></div></div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    const authFetch = (p, o={}) => { o.headers = Object.assign({ "Authorization":"Bearer "+localStorage.getItem("mostlaneToken") }, o.headers||{}); return fetch((p.startsWith("http")?p:API+p), o); };
    const money = v => (v == null || v === "") ? "" : ("£" + Number(v).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}));
    const fmtDay = t => { try { const d=new Date(t); return isNaN(d)?"":d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"}); } catch { return ""; } };
    const fmtDT = t => { try { const d=new Date(t); return isNaN(d)?"":d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); } catch { return ""; } };
    const monthLbl = m => { if(!/^\d{4}-\d{2}$/.test(m||"")) return m||""; const d=new Date(m+"-01T00:00:00"); return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}); };
    let FILTER = "all", ROWS = [];

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r=>r.json());
        if (!me.ok || !(me.user.FullAccess==="Yes"||me.user.SLAAdmin==="Yes"||me.user.Compliance==="Yes")) { alert("This page needs SLA Admin, Compliance or Full Access."); location.href="/main.html"; return; }
      } catch { location.href="/main.html"; return; }
      [].forEach.call(g("filters").querySelectorAll(".chip"), b => b.onclick = () => {
        FILTER = b.dataset.f;
        [].forEach.call(g("filters").querySelectorAll(".chip"), x => x.classList.toggle("on", x.dataset.f === FILTER));
        render();
      });
      load();
    })();

    const isQuote = r => r.quoteRequired && r.quoteStatus !== "approved" && r.quoteStatus !== "declined";
    function invBadge(r) {
      if (r.invoiceState === "invoiced")     return '<span class="badge b-inv">Invoiced'+(r.invoiceMonth?" · "+esc(monthLbl(r.invoiceMonth)):"")+'</span>';
      if (r.invoiceState === "not_required") return '<span class="badge b-nr">No invoice</span>';
      if (r.invoiceState === "to_invoice")   return '<span class="badge b-toinv">To invoice</span>';
      return '<span class="badge b-open">'+esc(r.status||"Open")+'</span>';
    }

    async function load() {
      let d = null;
      try { d = await authFetch("/fbc/list").then(r=>r.json()); } catch {}
      if (!d || !d.ok) { g("list").innerHTML = '<div class="card"><p class="muted" style="color:#b00020;padding:6px 4px;">Couldn\'t load FBC jobs.</p></div>'; return; }
      ROWS = d.rows || [];
      const q = ROWS.filter(isQuote).length;
      const toInv = ROWS.filter(r => r.invoiceState === "to_invoice").length;
      const inv = ROWS.filter(r => r.invoiceState === "invoiced").length;
      const active = ROWS.filter(r => r.invoiceState === "open").length;
      g("summary").innerHTML =
        tile(ROWS.length, "jobs", "") +
        tile(q, "need a quote", q?"warn":"") +
        tile(active, "active", "") +
        tile(toInv, "to invoice", toInv?"warn":"") +
        tile(inv, "invoiced", inv?"ok":"");
      g("greet").textContent = toInv
        ? (toInv + " job" + (toInv===1?"":"s") + " done and waiting to be invoiced" + (q?(", "+q+" still need a quote"):"") + ".")
        : (q ? (q + " job" + (q===1?"":"s") + " need a quote.") : "FBC jobs — quotes, costs, and what to invoice each month.");
      // refresh filter counts
      const cnt = { all:ROWS.length, quote:q, active, toinvoice:toInv, invoiced:inv };
      [].forEach.call(g("filters").querySelectorAll(".chip"), b => {
        const n = cnt[b.dataset.f]; b.innerHTML = b.textContent.replace(/\s*\d+$/,"").trim() + (n!=null?' <span class="c">'+n+'</span>':"");
      });
      render();
    }

    function pass(r) {
      if (FILTER === "quote") return isQuote(r);
      if (FILTER === "active") return r.invoiceState === "open";
      if (FILTER === "toinvoice") return r.invoiceState === "to_invoice";
      if (FILTER === "invoiced") return r.invoiceState === "invoiced";
      return true;
    }

    function render() {
      let rows = ROWS.filter(pass);
      if (!rows.length) { g("list").innerHTML = '<div class="card"><p class="empty">Nothing here.</p></div>'; return; }
      let h = "";
      // Quote-required always breaks out into its own section (unless already filtered to one thing)
      if (FILTER === "all") {
        const quote = rows.filter(isQuote);
        const rest = rows.filter(r => !isQuote(r));
        if (quote.length) { h += '<div class="sechd q">⭐ Quote required ('+quote.length+')</div>'; quote.forEach(r => h += jobCard(r)); }
        // group the rest: to-invoice by month, then active, then invoiced
        const toInv = rest.filter(r => r.invoiceState === "to_invoice");
        const active = rest.filter(r => r.invoiceState === "open");
        const invoiced = rest.filter(r => r.invoiceState === "invoiced");
        const nr = rest.filter(r => r.invoiceState === "not_required");
        if (toInv.length) { h += '<div class="sechd">🧾 To invoice ('+toInv.length+')</div>'; toInv.forEach(r => h += jobCard(r)); }
        if (active.length) { h += '<div class="sechd">🔧 Active ('+active.length+')</div>'; active.forEach(r => h += jobCard(r)); }
        if (invoiced.length) {
          h += '<div class="sechd">✅ Invoiced ('+invoiced.length+')</div>';
          // group invoiced by month
          const byM = {}; invoiced.forEach(r => { const m=r.invoiceMonth||"—"; (byM[m]=byM[m]||[]).push(r); });
          Object.keys(byM).sort().reverse().forEach(m => {
            h += '<div class="muted" style="margin:6px 4px 4px;font-weight:700;">'+esc(m==="—"?"Month not set":monthLbl(m))+' — '+money(byM[m].reduce((s,r)=>s+(Number(r.cost)||0),0))+'</div>';
            byM[m].forEach(r => h += jobCard(r));
          });
        }
        if (nr.length) { h += '<div class="sechd">🚫 No invoice needed ('+nr.length+')</div>'; nr.forEach(r => h += jobCard(r)); }
      } else {
        rows.forEach(r => h += jobCard(r));
      }
      g("list").innerHTML = h;
      [].forEach.call(g("list").querySelectorAll(".jhd"), el => el.onclick = () => {
        const j = el.closest(".job"); const was = j.classList.contains("open");
        j.classList.toggle("open");
        if (!was && !j.dataset.loaded) loadConv(j.dataset.job, j);
      });
      wireEdits();
    }

    function jobCard(r) {
      const q = isQuote(r);
      const em = q ? "⭐" : "🏛️";
      const sub = [r.siteCode, r.priority, r.reportedBy && ("by "+r.reportedBy), r.cost!=null?money(r.cost):"", r.messageCount?("💬 "+r.messageCount):""].filter(Boolean).join(" · ");
      return '<div class="job'+(q?" q":"")+'" data-job="'+esc(r.jobId)+'">'
        + '<div class="jhd"><div class="em">'+em+'</div>'
        + '<div class="m"><div class="t">'+esc(r.siteName||r.siteCode||r.reference||"FBC job")+'</div>'
        + '<div class="s">'+esc(sub || fmtDay(r.raisedAt))+'</div></div>'
        + invBadge(r) + '</div>'
        + '<div class="body">'
        + (r.description ? '<p class="desc">'+esc(r.description)+'</p>' : '')
        + (r.w3w ? '<p class="muted" style="margin:0 0 10px;">📍 '+esc(r.w3w)+'</p>' : '')
        + '<div class="grid">'
        +   fld(r,"cost","Cost (£)",'<input type="number" step="0.01" inputmode="decimal" data-k="cost" value="'+(r.cost!=null?esc(r.cost):"")+'">')
        +   fld(r,"po","PO number",'<input type="text" data-k="poNumber" value="'+esc(r.poNumber)+'">')
        +   fld(r,"qs","Quote",'<select data-k="quoteStatus">'+opt(["","needed","sent","approved","declined"],["— none —","Needed","Sent","Approved","Declined"],r.quoteStatus)+'</select>')
        +   fld(r,"qa","Quote amount (£)",'<input type="number" step="0.01" inputmode="decimal" data-k="quoteAmount" value="'+(r.quoteAmount!=null?esc(r.quoteAmount):"")+'">')
        +   fld(r,"is","Invoice status",'<select data-k="invoiceStatus">'+opt(["","to_invoice","invoiced","not_required"],["— open —","To invoice","Invoiced","No invoice needed"],r.invoiceStatus)+'</select>')
        +   fld(r,"im","Invoice month",'<input type="month" data-k="invoiceMonth" value="'+esc(r.invoiceMonth)+'">')
        +   fld(r,"ir","Invoice ref",'<input type="text" data-k="invoiceRef" value="'+esc(r.invoiceRef)+'">')
        + '</div>'
        + '<div class="row2"><span class="saved" data-saved>Saved ✓</span>'
        +   (r.onBoard ? '<a class="lnk" href="job-view.html?jobId='+encodeURIComponent(r.jobId)+'">Open job card →</a>' : '')
        + '</div>'
        + '<div class="conv" data-conv><h4>Conversation</h4><p class="muted" data-msgs>Loading…</p>'
        +   '<div class="addnote"><textarea data-note placeholder="Add a note…"></textarea><button class="btn" data-addnote>Add</button></div>'
        + '</div>'
        + '</div></div>';
    }
    const fld = (r,id,label,ctrl) => '<div class="fld"><label>'+esc(label)+'</label>'+ctrl+'</div>';
    const opt = (vals,labs,cur) => vals.map((v,i)=>'<option value="'+esc(v)+'"'+(v===(cur||"")?" selected":"")+'>'+esc(labs[i])+'</option>').join("");

    function wireEdits() {
      [].forEach.call(g("list").querySelectorAll(".job"), j => {
        const jobId = j.dataset.job;
        const saved = j.querySelector("[data-saved]");
        let t = null;
        const flush = async () => {
          const body = { jobId };
          [].forEach.call(j.querySelectorAll("[data-k]"), el => {
            let v = el.value;
            if ((el.dataset.k === "cost" || el.dataset.k === "quoteAmount")) v = v === "" ? null : Number(v);
            body[el.dataset.k] = v;
          });
          try {
            await authFetch("/fbc/meta", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
            saved.classList.add("on"); setTimeout(()=>saved.classList.remove("on"), 1400);
            // update ROWS in place so section grouping reflects the change on next render (without collapse)
            const row = ROWS.find(x => x.jobId === jobId);
            if (row) { Object.assign(row, { cost: body.cost, poNumber: body.poNumber, quoteStatus: body.quoteStatus, quoteAmount: body.quoteAmount, invoiceStatus: body.invoiceStatus, invoiceMonth: body.invoiceMonth, invoiceRef: body.invoiceRef });
              row.invoiceState = body.invoiceStatus === "invoiced" ? "invoiced" : (body.invoiceStatus === "not_required" ? "not_required" : row.invoiceState);
            }
          } catch {}
        };
        [].forEach.call(j.querySelectorAll("[data-k]"), el => {
          const go = () => { clearTimeout(t); t = setTimeout(flush, 500); };
          el.addEventListener("change", flush);
          if (el.tagName === "INPUT" && el.type !== "month") el.addEventListener("input", go);
        });
        const addBtn = j.querySelector("[data-addnote]"), ta = j.querySelector("[data-note]");
        if (addBtn) addBtn.onclick = async () => {
          const body = (ta.value||"").trim(); if (!body) return;
          addBtn.disabled = true;
          try { await authFetch("/fbc/message", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ jobId, body }) }); ta.value=""; j.dataset.loaded=""; await loadConv(jobId, j); } catch {}
          addBtn.disabled = false;
        };
      });
    }

    async function loadConv(jobId, j) {
      const box = j.querySelector("[data-msgs]");
      try {
        const d = await authFetch("/fbc/job?id=" + encodeURIComponent(jobId)).then(r=>r.json());
        j.dataset.loaded = "1";
        const msgs = (d && d.messages) || [];
        if (!msgs.length) { box.innerHTML = '<span class="muted">No emails or notes logged yet.</span>'; return; }
        box.outerHTML = '<div data-msgs>' + msgs.map(m => {
          const cls = m.direction === "note" ? "note" : (m.direction === "out" ? "out" : "");
          const who = m.direction === "note" ? ("Note — " + esc(m.from_addr||"")) : (m.direction === "out" ? ("Sent — " + esc(m.from_addr||"")) : esc(m.from_addr||""));
          return '<div class="msg '+cls+'"><div class="h">'+who+' · '+fmtDT(m.at)+(m.subject?" · "+esc(m.subject):"")+'</div><div class="b">'+esc(m.body||"")+'</div></div>';
        }).join("") + '</div>';
      } catch { box.innerHTML = '<span class="muted" style="color:#b00020">Couldn\'t load the conversation.</span>'; }
    }

    function tile(n, label, tone) { return '<div class="tile '+(tone||"")+'"><div class="n">'+n+'</div><div class="l">'+esc(label)+'</div></div>'; }
  </script>
</body>
</html>

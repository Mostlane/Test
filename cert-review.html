<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Certificate Review</title>
  <script src="/portal-config.js?v=19"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <script src="cert-form.js?v=8"></script>
  <style>
    :root { --brand:#003468; --ok:#0a7d33; --bad:#b00020; --line:#e2e8f0; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f4;color:#1f2937;}
    header.page{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;}
    header.page h1{font-size:18px;margin:0;flex:1;}
    .wrap{max-width:920px;margin:14px auto 90px;padding:0 12px;}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(6,24,54,.06);padding:14px;margin-bottom:12px;}
    .btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
    .btn.green{background:var(--ok);} .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);} .btn.sm{padding:6px 10px;font-size:13px;} .btn.red{background:var(--bad);}
    .muted{color:#6b7a90;font-size:13px;}
    .item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid #eef2f6;cursor:pointer;}
    .item:first-child{border-top:none;}
    .item .em{font-size:20px;width:26px;text-align:center;}
    .item .m{flex:1;min-width:0;}
    .item .m .t{font-weight:600;font-size:14.5px;}
    .item .m .s{font-size:12.5px;color:#6b7a90;}
    .badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;}
    .badge.review{background:#fff3cd;color:#7a5b00;} .badge.draft{background:#e8eef5;color:#3a536e;}
    .finbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:8px;}
    .finbar label{display:block;font-size:12px;font-weight:600;color:#4a5568;margin-bottom:3px;}
    .finbar input{padding:9px;border:1px solid #ccd5dd;border-radius:9px;font-size:14px;}
    .msg{font-size:13px;margin-top:8px;} .msg.ok{color:var(--ok);} .msg.err{color:var(--bad);}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="/sla-main.html" style="text-decoration:none;">‹ Back</a>
    <h1>📄 Certificate review</h1>
    <button class="btn ghost sm" id="notifyBtn" style="background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);">🔔 Notify list</button>
  </header>
  <div class="wrap" id="wrap"><p class="muted" style="padding:20px;">Loading…</p></div>

  <!-- Who gets pushed when an engineer submits a cert for review -->
  <div id="notifyModal" style="display:none;position:fixed;inset:0;z-index:5000;background:rgba(8,20,40,.5);padding:16px;overflow:auto;">
    <div style="max-width:520px;margin:40px auto;background:#fff;border-radius:16px;padding:18px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <h2 style="margin:0;font-size:17px;flex:1;">🔔 Who's notified for review</h2>
        <button class="btn ghost sm" id="nmClose">Close</button>
      </div>
      <p class="muted" style="margin:0 0 10px;">Choose who gets the push when an engineer submits an EM/PAT certificate for review. <b>Leave everyone unticked</b> to notify all Full Access, SLA Admin &amp; Compliance users (the default).</p>
      <input type="text" id="nmSearch" placeholder="Search people…" style="width:100%;padding:9px 11px;border:1px solid #ccd5dd;border-radius:9px;font-size:14px;margin-bottom:8px;">
      <div id="nmList" style="max-height:44vh;overflow:auto;border:1px solid #eef2f6;border-radius:10px;padding:4px;"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px;">
        <button class="btn green" id="nmSave">Save</button>
        <span class="msg" id="nmMsg"></span>
      </div>
    </div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    const authFetch = (p, o={}) => { o.headers = Object.assign({ "Authorization":"Bearer "+localStorage.getItem("mostlaneToken") }, o.headers||{}); return fetch((p.startsWith("http")?p:API+p), o); };
    const fmt = t => { try { return new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); } catch { return t||""; } };

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r=>r.json());
        if (!me.ok || !(me.user.FullAccess==="Yes"||me.user.SLAAdmin==="Yes"||me.user.Compliance==="Yes")) { alert("This page needs SLA Admin, Compliance or Full Access."); location.href="/main.html"; return; }
      } catch { location.href="/main.html"; return; }
      loadList();
    })();

    async function loadList() {
      g("wrap").innerHTML = '<p class="muted" style="padding:20px;">Loading certificates…</p>';
      let certs = [];
      try { const d = await authFetch("/certs/review").then(r=>r.json()); certs = (d && d.certs) || []; }
      catch { g("wrap").innerHTML = '<p class="msg err" style="padding:20px;">Couldn\'t load the review queue.</p>'; return; }
      if (!certs.length) { g("wrap").innerHTML = '<div class="card"><p class="muted">Nothing waiting for review. Certificates engineers complete on EM/PAT jobs land here.</p></div>'; return; }
      let h = '<div class="card"><div class="muted" style="margin-bottom:6px">'+certs.length+' certificate'+(certs.length===1?"":"s")+' — tap to review, edit and issue.</div>';
      certs.forEach(c => {
        const em = c.type==="pat" ? "🔌" : "💡";
        const site = (c.installation && c.installation.name) || c.siteCode || "—";
        h += '<div class="item" data-id="'+esc(c.id)+'"><div class="em">'+em+'</div><div class="m">'
          + '<div class="t">'+esc(site)+' <span class="muted">· '+(c.type==="pat"?"PAT":"EM")+'</span></div>'
          + '<div class="s">'+esc(c.engineer||"")+' · '+fmt(c.submittedAt||c.updatedAt)+' · '+(c.rows?c.rows.length:0)+' item'+((c.rows&&c.rows.length===1)?"":"s")+'</div></div>'
          + '<span class="badge '+(c.status==="review"?"review":"draft")+'">'+(c.status==="review"?"Ready":"Draft")+'</span></div>';
      });
      h += '</div>';
      g("wrap").innerHTML = h;
      [].forEach.call(document.querySelectorAll(".item"), el => el.onclick = () => openCert(el.dataset.id));
    }

    async function openCert(id) {
      let cert = null;
      try { const d = await authFetch("/certs/one?id="+encodeURIComponent(id)).then(r=>r.json()); cert = d && d.record; } catch {}
      if (!cert) { alert("Couldn't open that certificate."); return; }
      let suggestion = cert.certNumber || "";
      try { const n = await authFetch("/certs/number?code="+encodeURIComponent(cert.siteCode||"")+"&type="+cert.type).then(r=>r.json()); if (n && n.number && !suggestion) suggestion = n.number; } catch {}
      const today = new Date().toISOString().slice(0,10);
      g("wrap").innerHTML =
        '<div style="margin-bottom:10px"><button class="btn ghost sm" id="backList">‹ All certificates</button></div>'
        + '<div class="card"><div id="certHost"></div></div>'
        + '<div class="card"><h2 style="margin:0 0 8px;font-size:16px">Issue this certificate</h2>'
        + '<div class="finbar">'
        + '<div><label>Certificate number</label><input type="text" id="finNum" value="'+esc(suggestion)+'" style="width:150px"></div>'
        + '<div><label>Certificate date</label><input type="text" id="finDate" value="'+esc(cert.contractor && cert.contractor.date ? cert.contractor.date : today)+'" placeholder="yyyy-mm-dd" style="width:150px"></div>'
        + '<button class="btn green" id="finBtn">🏁 Finalise &amp; file to compliance</button>'
        + '<button class="btn ghost sm" id="upBtn">⬆ Upload replacement PDF</button>'
        + '<button class="btn red sm" id="delBtn">🗑 Delete</button>'
        + '<input type="file" id="upFile" accept="application/pdf" style="display:none">'
        + '</div><div class="msg" id="finMsg"></div>'
        + '<div class="muted" style="margin-top:8px">Finalising draws the Mostlane PDF, files it under this store on the compliance chart and rolls the next-due date.</div></div>';
      g("backList").onclick = loadList;
      window.MLCert.mount(g("certHost"), { certId: id, type: cert.type, mode: "office", api: API, token: localStorage.getItem("mostlaneToken") });

      g("finBtn").onclick = async function(){
        const num = g("finNum").value.trim(); if (!num) { setMsg("Enter a certificate number.", true); return; }
        this.disabled = true; setMsg("Finalising…");
        try {
          const d = await authFetch("/certs/finalise", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id, certNumber:num, docDate:g("finDate").value.trim() }) }).then(r=>r.json());
          if (d && d.ok) { setMsg("Issued as "+d.number+" and filed to compliance ✓"); setTimeout(loadList, 1100); }
          else { setMsg((d && d.error) || "Couldn't finalise.", true); this.disabled = false; }
        } catch { setMsg("Couldn't finalise.", true); this.disabled = false; }
      };
      g("upBtn").onclick = () => g("upFile").click();
      g("upFile").onchange = async function(){
        const f = this.files[0]; if (!f) return;
        setMsg("Uploading…");
        const fd = new FormData(); fd.append("id", id); fd.append("file", f); fd.append("certNumber", g("finNum").value.trim()); fd.append("docDate", g("finDate").value.trim());
        try {
          const d = await authFetch("/certs/upload", { method:"POST", body: fd }).then(r=>r.json());
          if (d && d.ok) { setMsg("Uploaded as "+d.number+" and filed ✓"); setTimeout(loadList, 1100); }
          else setMsg((d && d.error) || "Upload failed.", true);
        } catch { setMsg("Upload failed.", true); }
      };
      g("delBtn").onclick = async function(){
        const ok = window.MLUI ? await MLUI.confirm("Delete this draft certificate? This can't be undone.", {danger:true, okLabel:"Delete"}) : confirm("Delete this draft certificate?");
        if (!ok) return;
        try { const d = await authFetch("/certs/delete", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id }) }).then(r=>r.json()); if (d && d.ok) loadList(); else setMsg((d&&d.error)||"Couldn't delete.", true); } catch { setMsg("Couldn't delete.", true); }
      };
    }
    function setMsg(t, err){ const m = g("finMsg"); if (m) { m.textContent = t; m.className = "msg" + (err?" err":" ok"); } }

    // ── Review-notification recipient picker ───────────────────────────────────
    let NM_USERS = [], NM_SEL = new Set();
    const uName = u => ((u.FirstName || "") + " " + (u.LastName || "")).trim() || u.Username;
    g("notifyBtn").onclick = openNotify;
    g("nmClose").onclick = () => g("notifyModal").style.display = "none";
    g("notifyModal").onclick = e => { if (e.target === g("notifyModal")) g("notifyModal").style.display = "none"; };
    g("nmSearch").oninput = renderNmList;

    async function openNotify() {
      g("notifyModal").style.display = "block";
      g("nmMsg").textContent = "";
      if (!NM_USERS.length) {
        try { const d = await authFetch("/users").then(r=>r.json()); NM_USERS = (d.Users || d.users || []).filter(u => u.Username); }
        catch { g("nmList").innerHTML = '<p class="muted" style="padding:10px">Couldn\'t load people.</p>'; }
        // office staff first, then A–Z, so reviewers are easy to find
        NM_USERS.sort((a,b) => uName(a).localeCompare(uName(b)));
      }
      try { const c = await authFetch("/certs/config").then(r=>r.json()); NM_SEL = new Set(((c.config && c.config.reviewers) || []).map(x => String(x).toLowerCase())); }
      catch { NM_SEL = new Set(); }
      renderNmList();
    }
    function renderNmList() {
      const q = (g("nmSearch").value || "").toLowerCase().trim();
      const rows = NM_USERS.filter(u => !q || uName(u).toLowerCase().includes(q) || String(u.Username).toLowerCase().includes(q));
      const n = NM_SEL.size;
      let h = '<div style="padding:6px 8px;font-size:12.5px;color:'+(n?"#0a7d33":"#6b7a90")+';font-weight:600;">'
        + (n ? (n + " selected — only these people are notified") : "Nobody selected — everyone with permission is notified") + '</div>';
      rows.forEach(u => {
        const un = String(u.Username), on = NM_SEL.has(un.toLowerCase());
        h += '<label style="display:flex;align-items:center;gap:10px;padding:8px 8px;border-top:1px solid #f1f4f8;cursor:pointer;">'
          + '<input type="checkbox" data-u="'+esc(un)+'" '+(on?"checked":"")+' style="width:18px;height:18px;">'
          + '<span style="flex:1;min-width:0;"><span style="font-weight:600;font-size:14px;">'+esc(uName(u))+'</span>'
          + (u.StaffType ? ' <span class="muted" style="font-size:12px;">· '+esc(u.StaffType)+'</span>' : '')+'</span></label>';
      });
      g("nmList").innerHTML = h || '<p class="muted" style="padding:10px">No matches.</p>';
      [].forEach.call(g("nmList").querySelectorAll("input[type=checkbox]"), cb => cb.onchange = () => {
        const u = cb.getAttribute("data-u").toLowerCase();
        if (cb.checked) NM_SEL.add(u); else NM_SEL.delete(u);
        // refresh only the count line (keep scroll/search)
        const head = g("nmList").firstChild; if (head) { const k = NM_SEL.size;
          head.textContent = k ? (k + " selected — only these people are notified") : "Nobody selected — everyone with permission is notified";
          head.style.color = k ? "#0a7d33" : "#6b7a90"; }
      });
    }
    g("nmSave").onclick = async function() {
      // Send canonical usernames (match the picked rows' real Username casing).
      const reviewers = NM_USERS.filter(u => NM_SEL.has(String(u.Username).toLowerCase())).map(u => u.Username);
      this.disabled = true; g("nmMsg").textContent = "Saving…"; g("nmMsg").className = "msg";
      try {
        const d = await authFetch("/certs/config", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ reviewers }) }).then(r=>r.json());
        if (d && d.ok) { g("nmMsg").textContent = reviewers.length ? "Saved — "+reviewers.length+" notified" : "Saved — everyone with permission"; g("nmMsg").className = "msg ok"; setTimeout(()=>{ g("notifyModal").style.display="none"; }, 900); }
        else { g("nmMsg").textContent = (d && d.error) || "Couldn't save."; g("nmMsg").className = "msg err"; }
      } catch { g("nmMsg").textContent = "Couldn't save."; g("nmMsg").className = "msg err"; }
      this.disabled = false;
    };
  </script>
</body>
</html>

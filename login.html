<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=46"></script>
  <script src="/ml-perms.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mostlane Portal Login</title>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #e6e8eb  no-repeat center center fixed;
      background-size: 180%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height:100vh;
      margin: 0;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.6);
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 320px;
      text-align: center;
    }
    .login-box img { height: 60px; margin-bottom: 20px; }
    .login-box input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .login-box button {
      background-color: #0066cc;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .login-box a { display: block; margin-top: 15px; font-size: 14px; color: #0066cc; text-decoration: none; }
    .login-box p#error { color: red; font-size: 14px; margin-top: 10px; }
  </style>
  <!-- PWA CORE -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#003366">
<script src="/pwa.js?v=2" defer></script>
  <!-- PWA APPLE SUPPORT -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>

  <div class="login-box">
    <img src="mostlane-logo.jpg" alt="Mostlane Logo" />

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <div style="position:relative;">
        <input type="password" id="password" placeholder="Password" required style="padding-right:44px;" />
        <button type="button" id="pwEye" aria-label="Show password"
          style="position:absolute; width:auto; margin:0; right:2px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:18px; cursor:pointer; padding:4px 10px; opacity:.65; line-height:1;">👁</button>
      </div>
      <button type="submit">Sign in</button>
      <p id="error"></p>
    </form>

    <!-- Two-step sign-in: the emailed code (shown only when the server asks) -->
    <form id="codeForm" style="display:none" autocomplete="off">
      <p id="codeMsg" style="margin:0 0 10px;color:#0f2438;line-height:1.4"></p>
      <input type="text" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="text-align:center;font-size:22px;letter-spacing:6px" />
      <button type="submit" id="codeBtn">Verify</button>
      <p id="codeErr" style="color:#c0392b"></p>
      <a href="#" id="codeBack">‹ Back to sign in</a>
    </form>

    <a href="forgot-password.html">Forgot password?</a>
    <a href="onboard.html">Sign up</a>
    <a href="install.html">📲 Add Mostlane to your phone</a>
  </div>

  <!-- Device Auth -->
  <script src="device-auth.js"></script>

  <script>

    // Two-step sign-in: show the code box, POST /auth/login-verify, resolve with
    // the same reply a normal login gives (or null if they go back).
    function askForLoginCode(first, api) {
      return new Promise(function (resolve) {
        var lf = document.getElementById("loginForm"), cf = document.getElementById("codeForm");
        var inp = document.getElementById("loginCode"), err = document.getElementById("codeErr"), btn = document.getElementById("codeBtn");
        var challenge = first.challenge;
        document.getElementById("codeMsg").textContent = "We've emailed a sign-in code to " + (first.sentTo || "your email") + ". Enter it below — it lasts 10 minutes.";
        err.textContent = ""; inp.value = "";
        lf.style.display = "none"; cf.style.display = "";
        setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
        function done(v) { cf.onsubmit = null; document.getElementById("codeBack").onclick = null; cf.style.display = "none"; lf.style.display = ""; resolve(v); }
        document.getElementById("codeBack").onclick = function (e) { e.preventDefault(); done(null); };
        cf.onsubmit = async function (e) {
          e.preventDefault();
          var code = (inp.value || "").replace(/\D/g, "");
          if (code.length !== 6) { err.textContent = "Enter the 6-digit code."; return; }
          btn.disabled = true; err.textContent = "";
          try {
            var r = await fetch(api + "/auth/login-verify", { method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ challenge: challenge, code: code,
                deviceId: (function(){ try { return (typeof getOrCreateDeviceId === "function") ? getOrCreateDeviceId() : (localStorage.getItem("deviceID") || ""); } catch (e) { return ""; } })() }) });
            var j = {}; try { j = await r.json(); } catch (e2) {}
            if (r.ok && j.ok) { cf.style.display = "none"; resolve(j); return; }
            if (r.status === 410) { done(null); document.getElementById("error").textContent = j.error || "That code has expired — sign in again."; return; }
            err.textContent = j.error || ("Couldn't check the code (HTTP " + r.status + ")");
          } catch (e3) { err.textContent = "No connection — try again."; }
          finally { btn.disabled = false; }
        };
      });
    }

    // ⭐ New helper — safe, fallback-compatible
    // After login, go to the forced password-change screen if required,
    // otherwise the main menu.
    // A safe relative "*.html" page (blocks open-redirects to other origins).
    function safeLanding(lp) {
      return (lp && typeof lp === "string" && /^[a-z0-9._-]+\.html(\?|#|$)/i.test(lp)) ? lp : null;
    }
    // Where a CLIENT login lands. A "compliance" client (compliance chart only,
    // no jobs) goes straight to its org's compliance page; every other client
    // goes to the walled jobs portal. Extend the org→page map as more clients
    // get a compliance-only login.
    function mlClientLanding(role, org) {
      role = String(role || "").toLowerCase(); org = String(org || "").toLowerCase();
      if (role === "compliance") return ({ fbc: "fareham.html" })[org] || "compliance.html";
      return "client-home.html";
    }
    // Send the user to their chosen landing page (per-user, from /prefs),
    // falling back to the guided My Day (Story) or the main menu. A forced
    // password change always wins.
    function goNext() {
      if (window.__mostlaneMustChange) { window.location.href = "change-password.html?forced=1"; return; }
      // A CLIENT login goes straight to the walled client portal — never the staff
      // menu, never a saved landing-page pref (which could point at a staff page).
      try {
        var st = (sessionStorage.getItem("mostlaneStaffType") || localStorage.getItem("mostlaneStaffType") || "").toLowerCase();
        if (st === "client") {
          var cr = sessionStorage.getItem("mostlaneClientRole") || localStorage.getItem("mostlaneClientRole") || "";
          var co = sessionStorage.getItem("mostlaneClientOrg") || localStorage.getItem("mostlaneClientOrg") || "";
          window.location.href = mlClientLanding(cr, co); return;
        }
      } catch (e) {}
      // Field users (SLA/jobs, not admin) land in the engineer app; office &
      // admins get the main menu. Reads the permissions just cached at login.
      var fallback = (window.mlIsFieldUser && window.mlIsFieldUser()) ? "route.html" : "main.html";
      var token = localStorage.getItem("mostlaneToken");
      if (!token) { window.location.href = fallback; return; }
      fetch(window.MOSTLANE_API + "/prefs", { headers: { "Authorization": "Bearer " + token } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var lp = d && d.ok && d.prefs && safeLanding(d.prefs.landingPage);
          window.location.href = lp || fallback;
        })
        .catch(function () { window.location.href = fallback; });
    }

    function runDeviceCheckAndContinue(username) {
      // Master-password sign-ins bypass the device lock (break-glass access).
      if (window.__mostlaneMasterLogin) { goNext(); return; }
      // External CLIENT logins bypass the device lock (they aren't staff devices,
      // and the device-registration flow would fight the client wall).
      try {
        var st = (sessionStorage.getItem("mostlaneStaffType") || localStorage.getItem("mostlaneStaffType") || "").toLowerCase();
        if (st === "client") { goNext(); return; }
      } catch (e) {}
      try {
        if (window.DeviceAuth && typeof DeviceAuth.checkOnLogin === "function") {
          DeviceAuth.checkOnLogin(username, function () { goNext(); });
        } else {
          console.warn("DeviceAuth missing — continuing login without device check");
          goNext();
        }
      } catch (e) {
        console.error("DeviceAuth error:", e);
        goNext();
      }
    }

    // Already logged in? (PWA relaunches and old bookmarks land here.)
    // IMPORTANT: verify the token with the SERVER before skipping the form.
    // Trusting the phone's stored flags alone caused a login↔menu redirect
    // loop when the server session had actually expired. If the server says
    // the session is dead, the stale flags are cleared so nothing bounces.
    (async function () {
      try {
        // Circuit-breaker: if we auto-skipped in the last 20 seconds and got
        // sent back here, DON'T skip again — show the form. Makes a fast
        // login↔menu loop physically impossible, whatever the cause.
        var lastSkip = Number(sessionStorage.getItem("mlAutoSkipAt") || 0);
        if (Date.now() - lastSkip < 20000) return;

        var token = localStorage.getItem("mostlaneToken");
        if (!token || localStorage.getItem("mostlaneLoggedIn") !== "true") return;
        var r = await fetch(window.MOSTLANE_API + "/auth/me", { headers: { "Authorization": "Bearer " + token } });
        var d = await r.json().catch(function () { return {}; });
        if (r.ok && d.ok) {
          try { sessionStorage.setItem("mlAutoSkipAt", String(Date.now())); } catch (e2) {}
          // A client login always resumes into its walled portal (compliance
          // chart for a compliance-only client, else the jobs portal).
          if (d.user && d.user.StaffType === "client") { location.replace(mlClientLanding(d.user.ClientRole, d.user.ClientOrg)); return; }
          var fb = (window.mlIsFieldUser && window.mlIsFieldUser(d.user)) ? "route.html" : "main.html";
          var lp = null;
          try { var pr = await (await fetch(window.MOSTLANE_API + "/prefs", { headers: { "Authorization": "Bearer " + token } })).json(); lp = pr && pr.ok && pr.prefs && safeLanding(pr.prefs.landingPage); } catch (e3) {}
          location.replace(lp || fb);
        } else {
          ["mostlaneLoggedIn", "mostlaneExpiry", "mostlaneBypassUntil", "mostlaneToken"].forEach(function (k) { localStorage.removeItem(k); });
          sessionStorage.removeItem("mostlaneLoggedIn");
          sessionStorage.removeItem("mostlaneMasterLogin");
        }
      } catch (e) { /* offline — just show the form */ }
    })();

    // Password eye: click to show (stays visible until clicked again).
    document.getElementById('pwEye').addEventListener('click', function () {
      const inp = document.getElementById('password');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      this.textContent = show ? '🙈' : '👁';
      this.style.opacity = show ? '1' : '.65';
    });

    // Your original login logic — unchanged
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const errorBox = document.getElementById('error');
      errorBox.textContent = "";

      try {
// Post straight to the live API. Login must not depend on portal-config's
// legacy-host bridge rewriting login.jamie-def.workers.dev — if that bridge
// isn't installed (or the old host is gone), the request fails with a bare
// "Load failed". Hitting MOSTLANE_API directly is the same host the rest of
// the portal (and the PWA) already reach.
const LOGIN_API = (window.MOSTLANE_API || "https://mostlane-api.jamie-def.workers.dev").replace(/\/$/, "");
const res = await fetch(
  LOGIN_API + "/auth/login",
  {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: usernameInput,
      password: passwordInput,
      // Binds the new session to this browser (see worker requireSession).
      deviceId: (function(){ try { return (typeof getOrCreateDeviceId === "function") ? getOrCreateDeviceId() : (localStorage.getItem("deviceID") || ""); } catch (e) { return ""; } })()
    })
  }
);

let result;
try {
  result = await res.json();
} catch {
  errorBox.textContent = `Login failed (HTTP ${res.status})`;
  return;
}

// Two-step sign-in: the password was right, now the emailed code.
if (res.ok && result && result.needCode) {
  result = await askForLoginCode(result, LOGIN_API);
  if (!result) return;   // went back to the sign-in form
}

if (!res.ok) {
  errorBox.textContent = result.error || `Login failed (HTTP ${res.status})`;
  return;
}

if (!result.ok) {
  errorBox.textContent = result.error || "Invalid login credentials.";
  return;
}
// Be tolerant of both response shapes: the consolidated worker nests the
// account under `result.user`; older/rolled-back workers returned the fields
// flat on the response itself. Fall back to `result` so a shape change can't
// blank out the login.
const user = result.user || result;
if (!user || !user.Username) {
  errorBox.textContent = "Signed in, but your account details didn't come back. Please try again or contact the office.";
  return;
}

        // ✅ Store the server session token (consolidated worker). Old login
        // worker doesn't return one, so this is a no-op until cutover.
        if (result.token) { try { localStorage.setItem('mostlaneToken', result.token); } catch (e) {} }

        // A fresh login is a brand-new session — never inherit a stale "View As"
        // bypass stash from a previous user/session (it would skip the device lock).
        try { localStorage.removeItem("mostlaneViewAsReal"); } catch (e) {}

        // Flag whether the user must change their password (admin reset / new user).
        window.__mostlaneMustChange = !!(result.mustChangePassword || user.MustChangePassword);
        // Master-password login → bypass the device lock for this session.
        window.__mostlaneMasterLogin = !!result.master;
        // Story Mode engineers are routed to the guided My Day screen.
        window.__mostlaneStory = user.StoryMode === "Yes";
        if (result.master) sessionStorage.setItem("mostlaneMasterLogin", "1");
        else sessionStorage.removeItem("mostlaneMasterLogin");

        // Stored session — 90 days, matching the server session token, so a
        // logged-in device stays logged in.
        const EXPIRY = Date.now() + (90 * 24 * 60 * 60 * 1000);

        function set(key, value) {
          sessionStorage.setItem(key, value);
          localStorage.setItem(key, value);
        }

        set('mostlaneLoggedIn', 'true');
        set('mostlaneUser', user.Username);
        set('mostlaneUsername', user.Username);
        set('mostlaneFolder', user.SharePointPath || '');
        set('mostlaneVehicle', user.VehicleAssigned || '');
        set('mostlaneEmployment', user.EmploymentType || '');
        set('mostlaneStaffType', (user.StaffType || 'field'));
        // Per-scheme compliance access (none|view|download|edit) for the four
        // compliance pages — each page reads this to decide view/download/edit.
        set('mostlaneComplianceAccess', JSON.stringify(user.ComplianceAccess || {}));
        // Client routing + the client wall both read these.
        set('mostlaneClientOrg', user.ClientOrg || '');
        set('mostlaneClientRole', user.ClientRole || '');
        localStorage.setItem('mostlaneExpiry', EXPIRY);

       // Cache the COMPLETE set of permission flags so the sidebar and menu
       // gate correctly (previously several keys were missing here).
       const PERM_KEYS = ["FullAccess","Users","DeviceAdmin","CheckInOut","Vehicles",
         "Holiday","HolidayAdmin","EngineersHoursMenu","HoursDashboard","PurchaseOrders",
         "Sites","AddSite","Assets","MyDocuments","Weekly","Forms","Compliance","Projects",
         "ProjectsAdmin","TimesheetAdmin","LabourPlanning","SLA","SLAAdmin","StoryMode","HSPlan",
         "SiteLog","SiteLogAdmin","OfficeClock","OfficeTimesheet","EngTimesheet","ThemeColour","ThemeBackground","Programmes",
         "YardGate","YardGateAnywhere","EicrCheck","Chapplins","CableCalc","WhereEveryone","StaffRecords","CPD",
         "StaffType","ClientOrg","ClientRole","VehicleAssigned","FirstName","LastName"];
       const perms = {};
       PERM_KEYS.forEach(function (k) { perms[k] = user[k]; });


        sessionStorage.setItem('mostlanePermissions', JSON.stringify(perms));
        localStorage.setItem('mostlanePermissions', JSON.stringify(perms));

        set('username', user.Username);
        set('user', user.Username);
        set('firstName', user.FirstName || '');
        set('lastName', user.LastName || '');
        set('role', user.EmploymentType || '');
        set('roleType', user.EmploymentType || '');
        set('assignedUser', user.Username);

        // ✅ 90-DAY LOGIN BYPASS (PWA SAFE, NO OTHER SIDE EFFECTS)
localStorage.setItem(
  "mostlaneBypassUntil",
  String(Date.now() + 90 * 24 * 60 * 60 * 1000)
);
        // ⭐ THE ONLY CHANGE: run device check here instead of redirecting
        runDeviceCheckAndContinue(user.Username);

      } catch (err) {
        console.error(err);
        // "Load failed" / "Failed to fetch" mean the request never reached the
        // server (offline / weak signal); anything else is unexpected. Keep the
        // detail in the console for support, show a plain line to the user.
        var msg = (err && err.message) || String(err);
        errorBox.textContent = /load failed|failed to fetch|networkerror/i.test(msg)
          ? "Couldn't reach the server. Check your connection and try again."
          : "Something went wrong signing in. Please try again.";
      }
    });
  </script>

</body>
</html>

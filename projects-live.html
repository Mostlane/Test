<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live Projects</title>
  <script src="/portal-config.js?v=20"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <style>
    :root { --brand:#003366; --ok:#0a7d33; --bad:#b00020; --line:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#eef1f4; color:#1f2937; }
    header.page { background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    header.page h1 { font-size:18px; margin:0; flex:1 1 auto; }
    .wrap { max-width:960px; margin:14px auto 70px; padding:0 12px; }
    .btn { background:var(--brand); color:#fff; border:none; border-radius:9px; padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; }
    .btn.grey { background:#5b6b7b; } .btn.small { padding:6px 10px; font-size:13px; }
    .muted { color:#6b7a90; } .hide { display:none !important; }
    .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
    .tabs button { background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 14px; font:600 13.5px inherit; cursor:pointer; color:#5b6b7b; }
    .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
    .pcard { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 10px rgba(6,24,54,.06); padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
    .pcard:hover { border-color:#b9c9e0; }
    .pcard h3 { margin:0; font-size:16px; }
    .pnum { font-size:12.5px; color:#8a97a6; font-weight:600; }
    .badge { display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
    .b-live { background:#e6f6ec; color:var(--ok); } .b-complete { background:#e0e7ff; color:#3730a3; } .b-archived { background:#f1f5f9; color:#64748b; }
    .prog { height:8px; background:#eef1f4; border-radius:999px; overflow:hidden; margin-top:2px; }
    .prog > span { display:block; height:100%; background:var(--ok); }
    .meta { font-size:12.5px; color:#6b7a90; }
    .empty { text-align:center; color:#8a97a6; padding:40px 10px; }
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" data-role="home" href="/main.html" style="text-decoration:none;">‹ Back</a>
    <h1>🏗️ Live Projects</h1>
    <a class="btn" id="newBtn" href="/project-new.html">➕ New project</a>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <button data-status="live" class="on">Live</button>
      <button data-status="complete">Complete</button>
      <button data-status="archived">Archived</button>
      <button data-status="">All</button>
    </div>
    <div class="grid" id="grid"><p class="muted" style="padding:20px;">Loading…</p></div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    function authFetch(path, opts = {}) {
      opts.headers = Object.assign({ "Authorization": "Bearer " + localStorage.getItem("mostlaneToken") }, opts.headers || {});
      return fetch(API + path, opts);
    }
    let STATUS = "live", CAN_MANAGE = false, ALL = [];

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r => r.json());
        if (!me.ok || !(me.user.FullAccess === "Yes" || me.user.Projects === "Yes" || me.user.ProjectsAdmin === "Yes")) {
          alert("This page needs Projects access."); location.href = "/main.html"; return;
        }
        CAN_MANAGE = me.user.FullAccess === "Yes" || me.user.ProjectsAdmin === "Yes";
        g("newBtn").classList.toggle("hide", !CAN_MANAGE);
      } catch (e) { location.href = "/main.html"; return; }
      load();
    })();

    g("tabs").addEventListener("click", e => {
      const b = e.target.closest("[data-status]"); if (!b) return;
      STATUS = b.dataset.status;
      document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
      render();
    });

    async function load() {
      try {
        const d = await authFetch("/projects/list").then(r => r.json());
        ALL = d.ok ? d.projects : [];
      } catch { ALL = []; }
      render();
    }
    function pct(p) { const t = p.todo || []; if (!t.length) return null; return Math.round(100 * t.filter(x => x.done).length / t.length); }
    function render() {
      const items = STATUS ? ALL.filter(p => (p.status || "live") === STATUS) : ALL;
      if (!items.length) { g("grid").innerHTML = `<div class="empty">No ${STATUS || ""} projects yet.${CAN_MANAGE ? ' <br><a class="btn" style="margin-top:12px" href="/project-new.html">➕ Create one</a>' : ""}</div>`; return; }
      g("grid").innerHTML = items.map(p => {
        const p2 = pct(p);
        const done = (p.todo || []).filter(x => x.done).length, tot = (p.todo || []).length;
        return `<div class="pcard" onclick="location.href='/project-hub.html?id=${encodeURIComponent(p.id)}'">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div><h3>${esc(p.name)}</h3><div class="pnum">${esc(p.number)}</div></div>
            <span class="badge b-${esc(p.status || "live")}">${esc((p.status || "live").toUpperCase())}</span>
          </div>
          ${p.postcode ? `<div class="meta">📍 ${esc(p.postcode)}${p.mileageRoundTrip != null ? " · " + p.mileageRoundTrip + " mi" : ""}</div>` : ""}
          ${tot ? `<div class="meta">✅ ${done}/${tot} to-do done</div><div class="prog"><span style="width:${p2}%"></span></div>` : `<div class="meta">No documents required</div>`}
        </div>`;
      }).join("");
    }
  </script>
</body>
</html>

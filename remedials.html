<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Remedials</title>
  <script src="/portal-config.js?v=49"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <style>
    :root { --brand:#003468; --ok:#0a7d33; --bad:#b00020; --warn:#b45309; --line:#e2e8f0; }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f4;color:#1f2937;}
    header.page{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;}
    header.page h1{font-size:18px;margin:0;flex:1;}
    header.page button.refresh{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;}
    .wrap{max-width:1180px;margin:14px auto 90px;padding:0 12px;}
    .infobox{background:#eef4fb;border:1px solid #cfe0f2;color:#274b73;border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px;}
    .sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
    .stat{flex:1 1 130px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(6,24,54,.06);padding:12px 14px;cursor:pointer;text-align:left;}
    .stat .n{font-size:26px;font-weight:800;color:var(--brand);line-height:1;}
    .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b7a90;font-weight:700;margin-top:4px;}
    .stat.amber .n{color:var(--warn);} .stat.blue .n{color:#1d4ed8;} .stat.green .n{color:var(--ok);} .stat.teal .n{color:#0f766e;}
    .stat.on{outline:2px solid var(--brand);outline-offset:1px;}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
    .toolbar input{padding:8px 11px;border:1px solid #ccd5dd;border-radius:9px;font-size:14px;font-family:inherit;min-width:200px;flex:1;}
    .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
    .chip{border:1px solid #ccd5dd;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#334;cursor:pointer;}
    .chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
    .chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px;}
    .chip.on .n{background:rgba(255,255,255,.25);}
    .tblwrap{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(6,24,54,.06);overflow-x:auto;}
    table{border-collapse:collapse;width:100%;font-size:13px;}
    thead th{background:var(--brand);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0;z-index:2;}
    thead th:first-child{z-index:3;border-right:1px solid rgba(255,255,255,.22);}
    tbody td{padding:8px 10px;border-bottom:1px solid #e3e9f0;vertical-align:middle;}
    tbody tr.zeb > td{background:#f3f7fb;}
    td.store{position:sticky;left:0;background:#fff;z-index:1;min-width:170px;border-right:1px solid var(--line);}
    tbody tr.zeb > td.store{background:#f3f7fb;}
    tbody tr:hover > td{background:#eaf2fb;} tbody tr:hover > td.store{background:#eaf2fb;}
    .code{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;}
    .site{font-weight:600;} .sub{font-size:11.5px;color:#6b7a90;margin-top:1px;}
    .need{max-width:320px;} .need .lead{cursor:pointer;} .need .lead:hover{text-decoration:underline;}
    .codepill{display:inline-block;padding:0 6px;border-radius:999px;font-size:10.5px;font-weight:800;color:#fff;margin-right:3px;vertical-align:middle;}
    .cC1{background:#b91c1c;} .cC2{background:#ea580c;} .cC3{background:#0891b2;} .cFI{background:#7c3aed;} .cNA{background:#64748b;}
    .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;border:1px solid transparent;}
    .tl-amber{background:#fef3c7;color:#92400e;border-color:#fcd34d;}
    .tl-blue{background:#dbeafe;color:#1e40af;border-color:#93c5fd;}
    .tl-green{background:#dcfce7;color:#166534;border-color:#86efac;}
    .tl-teal{background:#ccfbf1;color:#0f766e;border-color:#5eead4;}
    .tl-grey{background:#eef2f6;color:#5a6b80;border-color:#d7dee6;}
    .rem{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap;}
    .rem-warn{font-size:11.5px;font-weight:700;color:var(--warn);white-space:nowrap;}
    .val{font-variant-numeric:tabular-nums;white-space:nowrap;}
    .offreg{display:inline-block;background:#fff7ed;color:#9a3412;border:1px solid #fdba74;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;}
    .acts{display:flex;gap:6px;flex-wrap:wrap;white-space:nowrap;}
    .act{border:1px solid #ccd5dd;background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;font-weight:600;color:#334;cursor:pointer;text-decoration:none;display:inline-block;}
    .act.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
    .act:disabled{opacity:.5;cursor:default;}
    tr.detail > td{background:#f8fafc;padding:10px 14px;font-size:12.5px;color:#334;}
    tr.detail ul{margin:4px 0 4px 2px;padding-left:16px;} tr.detail li{margin:2px 0;}
    .empty{padding:40px 16px;text-align:center;color:#6b7a90;}
    .loading{padding:40px 16px;text-align:center;color:#6b7a90;}
    /* Clickable status pill (opens the quote popup) */
    button.pill.pillbtn{font:inherit;font-weight:800;cursor:pointer;}
    button.pill.pillbtn:hover{filter:brightness(.97);}
    /* Quote / copy popup */
    .qov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100000;padding:16px;}
    .qov.show{display:flex;}
    .qcard{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;}
    .qhead{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
    .qhead b{flex:1;color:var(--brand);font-size:16px;}
    .qx{background:none;border:0;font-size:20px;cursor:pointer;color:#64748b;line-height:1;}
    .c3row{display:flex;align-items:center;gap:8px;padding:4px 16px 10px;font-size:13.5px;color:#334;cursor:pointer;}
    .c3row input{width:18px;height:18px;}
    .qta{margin:0 16px;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.5;color:#0f2438;resize:vertical;min-height:160px;flex:1;}
    .qfoot{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:12px 16px;}
    .qfoot .sub{margin-right:auto;color:#16a34a;font-weight:700;}
    @media(max-width:760px){ .need{max-width:180px;} }
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" href="/main.html" title="Back">‹ Back</a>
    <h1>🔧 Remedials</h1>
    <button class="refresh" id="refreshBtn" title="Reload">↻ Refresh</button>
  </header>

  <div class="wrap">
    <div class="infobox">Every site that needs <b>electrical (EICR) remedial works</b>, in one list. Statuses: <b>To price</b> → <b>Priced</b> (quoted, awaiting the order) → <b>Ordered</b> (you have the REM order — create the works job) → <b>In works</b> → <b>Done</b>.</div>

    <div class="sumrow" id="sumrow"></div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search site, store number or REM number…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>

    <div class="tblwrap">
      <table>
        <thead><tr>
          <th>Site</th><th>What's needed</th><th>Status</th><th>Value</th><th>REM order no.</th><th>Action</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="6" class="loading">Loading remedials…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Quote / copy popup: the remedial observations for one site, C1/C2/FI by
       default, C3 behind a tick, with a Copy text button. -->
  <div class="qov" id="qov">
    <div class="qcard">
      <div class="qhead"><b id="qtitle"></b><button class="qx" id="qx" title="Close">✕</button></div>
      <label class="c3row"><input type="checkbox" id="qc3"> Include C3 recommendations <span class="sub" id="qc3n"></span></label>
      <textarea class="qta" id="qta" readonly spellcheck="false"></textarea>
      <div class="qfoot"><span class="sub" id="qsv"></span><button class="act primary" id="qcopy">📋 Copy text</button></div>
    </div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    const authFetch = (p, o={}) => { o.headers = Object.assign({ "Authorization":"Bearer "+localStorage.getItem("mostlaneToken") }, o.headers||{}); return fetch((p.startsWith("http")?p:API+p), o); };
    const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fmtD = s => { s=String(s||"").trim(); const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(!m) return ""; const d=+m[3],o=(d%10===1&&d!==11)?"st":(d%10===2&&d!==12)?"nd":(d%10===3&&d!==13)?"rd":"th"; return d+o+" "+(MON3[+m[2]-1]||"")+" "+m[1].slice(2); };
    const gbp = n => (n==null||n==="")?"":("£"+(Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}));

    // Status buckets (his words). Order defines the sort/priority.
    const STATUS = {
      to_price: { label:"To price",  cls:"tl-amber", statcls:"amber" },
      priced:   { label:"Priced",    cls:"tl-blue",  statcls:"blue" },
      ordered:  { label:"Ordered",   cls:"tl-green", statcls:"green" },
      in_works: { label:"In works",  cls:"tl-teal",  statcls:"teal" },
      done:     { label:"Done",      cls:"tl-grey",  statcls:"grey" },
    };
    const STATUS_ORDER = ["to_price","priced","ordered","in_works","done"];

    let ROWS = [];
    let FILTER = "live";                 // live = everything not done
    const EXPANDED = new Set();

    // Effective status from the register stage + whether an order is attached.
    function effStatus(r){
      const st = String(r.stage||"").toLowerCase();
      if (st === "done" || st === "invoiced") return "done";
      if (r.worksJobId || st === "in_works") return "in_works";
      if (r.order || st === "ordered") return "ordered";
      if (st === "quoted" || st === "priced") return "priced";
      return "to_price";               // to_review / tested / blank
    }

    function codePills(lines){
      const codes = [];
      (lines||[]).forEach(l => { const c = String(l.code||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if (c && ["C1","C2","C3","FI"].includes(c) && !codes.includes(c)) codes.push(c); });
      return codes.map(c => '<span class="codepill c'+c+'">'+c+'</span>').join("");
    }
    function needCell(r){
      const lines = r.lines || [];
      if (!lines.length){
        const d = String(r.detail||"").trim();
        return d ? '<span class="sub">'+esc(d.slice(0,120))+(d.length>120?"…":"")+'</span>' : '<span class="sub">—</span>';
      }
      const first = String(lines[0].action || lines[0].description || "").trim();
      const extra = lines.length>1 ? ' <span class="sub">+'+(lines.length-1)+' more</span>' : '';
      const ph = r.photoCount ? ' <span class="sub">📷'+r.photoCount+'</span>' : '';
      return '<div class="need">'+codePills(lines)+'<span class="lead" data-exp="'+esc(r.key)+'">'+esc(first.slice(0,90))+(first.length>90?"…":"")+'</span>'+extra+ph+'</div>';
    }

    function rowHtml(r, i){
      const s = effStatus(r);
      const sc = STATUS[s];
      // To price / Priced rows with real observations: the status pill opens the
      // quote popup (copy the remedials — C1/C2/FI by default, C3 behind a tick).
      const quotable = (s==="to_price"||s==="priced") && hasQuote(r);
      const pill = quotable
        ? '<button class="pill '+sc.cls+' pillbtn" data-quote="'+esc(r.key)+'" title="Open the remedials to copy">'+esc(sc.label)+' 📋</button>'
        : '<span class="pill '+sc.cls+'">'+esc(sc.label)+'</span>';
      const val = (r.order && r.order.value!=null && r.order.value!=="") ? r.order.value : (r.budgetCost || "");
      // REM number cell
      let rem = '';
      if (r.order && r.order.number) rem = '<span class="rem">'+esc(r.order.number)+'</span>';
      else if (s==="ordered") rem = '<span class="rem-warn">⚠ no REM recorded</span>';
      else rem = '<span class="sub">—</span>';
      // Actions
      const acts = [];
      if (r.worksJobId) acts.push('<a class="act primary" href="/job-view.html?jobId='+encodeURIComponent(r.worksJobId)+'">Open works job →</a>');
      else if (s==="ordered") acts.push('<button class="act primary" data-mk="'+esc(r.key)+'">Create works job</button>');
      if (r.jobId) acts.push('<a class="act" href="/job-view.html?jobId='+encodeURIComponent(r.jobId)+'">Test job</a>');
      if (r.storeCode) acts.push('<a class="act" href="/site-folder.html?site='+encodeURIComponent(r.storeCode)+'">Site</a>');
      const off = r.offRegister ? '<span class="offreg" title="This order has no matching remedial on the register — check it">⚠ not on register</span>' : '';
      return '<tr class="'+(i%2?'zeb':'')+'" data-key="'+esc(r.key)+'">'
        + '<td class="store"><span class="code">'+esc(r.storeCode||"—")+'</span>'+off+'<div class="site">'+esc(r.siteName||"")+'</div></td>'
        + '<td>'+needCell(r)+'</td>'
        + '<td>'+pill+'</td>'
        + '<td class="val">'+esc(gbp(val))+'</td>'
        + '<td>'+rem+'</td>'
        + '<td><div class="acts">'+(acts.join("")||'<span class="sub">—</span>')+'</div></td></tr>';
    }

    function detailHtml(r){
      const lines = r.lines || [];
      let body = lines.length
        ? '<ul>'+lines.map(l => '<li>'+(l.code?'<b>['+esc(l.code)+']</b> ':'')+esc(String(l.action||l.description||"").trim())+'</li>').join("")+'</ul>'
        : (r.detail ? '<div>'+esc(r.detail)+'</div>' : '<div class="sub">No detail recorded.</div>');
      const bits = [];
      if (r.quoteDate) bits.push("Quoted/raised "+fmtD(r.quoteDate));
      if (r.order && r.order.number) bits.push("Order "+esc(r.order.number));
      if (r.source) bits.push("Source: "+esc(r.source));
      return '<tr class="detail"><td colspan="6"><b>Remedial works at '+esc(r.storeCode||"")+' '+esc(r.siteName||"")+'</b>'+body+(bits.length?'<div class="sub">'+bits.join(" · ")+'</div>':'')+'</td></tr>';
    }

    function counts(){
      const c = { to_price:0, priced:0, ordered:0, in_works:0, done:0 };
      ROWS.forEach(r => { c[effStatus(r)]++; });
      return c;
    }
    function matchesFilter(r){
      const s = effStatus(r);
      if (FILTER === "all") return true;
      if (FILTER === "live") return s !== "done";
      return s === FILTER;
    }

    function render(){
      const c = counts();
      // stat cards
      g("sumrow").innerHTML = STATUS_ORDER.filter(k=>k!=="done").map(k =>
        '<button class="stat '+STATUS[k].statcls+(FILTER===k?' on':'')+'" data-f="'+k+'"><div class="n">'+c[k]+'</div><div class="l">'+STATUS[k].label+'</div></button>'
      ).join("");
      // chips
      const chip = (f,label,n) => '<button class="chip'+(FILTER===f?' on':'')+'" data-f="'+f+'">'+label+(n!=null?'<span class="n">'+n+'</span>':'')+'</button>';
      const live = c.to_price+c.priced+c.ordered+c.in_works;
      g("chips").innerHTML = [
        chip("live","Live",live), chip("to_price","To price",c.to_price), chip("priced","Priced",c.priced),
        chip("ordered","Ordered",c.ordered), chip("in_works","In works",c.in_works), chip("done","Done",c.done), chip("all","All",ROWS.length)
      ].join("");

      const q = g("search").value.trim().toLowerCase();
      let rows = ROWS.filter(matchesFilter);
      if (q) rows = rows.filter(r => (r.storeCode+" "+r.siteName+" "+((r.order&&r.order.number)||"")).toLowerCase().includes(q));
      rows.sort((a,b) => STATUS_ORDER.indexOf(effStatus(a))-STATUS_ORDER.indexOf(effStatus(b)) || String(a.storeCode).localeCompare(String(b.storeCode)));

      const tb = g("tbody");
      if (!rows.length){ tb.innerHTML = '<tr><td colspan="6" class="empty">Nothing here.</td></tr>'; return; }
      let html = "";
      rows.forEach((r,i) => { html += rowHtml(r,i); if (EXPANDED.has(r.key)) html += detailHtml(r); });
      tb.innerHTML = html;
    }

    function fyrCode(v){ v=String(v==null?"":v).replace(/\D/g,""); return v?v.replace(/^0+/,"")||"0":""; }

    async function load(){
      g("tbody").innerHTML = '<tr><td colspan="6" class="loading">Loading remedials…</td></tr>';
      // 1) the register (spine) — already carries the matched REM order per row
      let board = [];
      try { const j = await authFetch("/certs/five-year/board").then(r=>r.json()); board = (j&&j.rows)||[]; }
      catch(e){ g("tbody").innerHTML = '<tr><td colspan="6" class="empty">Couldn\'t load the remedials list.</td></tr>'; return; }

      const rows = board.map(r => ({
        key: "reg:"+r.id, id: r.id, storeCode: r.storeCode, siteName: r.siteName,
        lines: r.lines||[], stage: r.stage, worksJobId: r.worksJobId||"", jobId: r.jobId||"",
        order: r.order||null, budgetCost: r.budgetCost, quoteDate: r.quoteDate, source: r.source,
        photoCount: r.photoCount||0, offRegister:false,
      }));
      const haveStores = new Set(rows.map(r => fyrCode(r.storeCode)));

      // 2) off-register orders — REM/R orders whose store isn't on the register,
      //    so an order you have is never invisible. (Best-effort; needs money access.)
      try {
        const oj = await authFetch("/certs/orders").then(r=>r.json());
        const orders = (oj&&oj.orders)||[];
        orders.forEach(o => {
          const isRemedial = ["elec","fiveyear"].includes(o.matchedKind) || /^(R|REM)\d/i.test(String(o.orderNumber||""));
          if (!isRemedial) return;
          if (o.status === "dismissed") return;
          const code = fyrCode(o.storeCode);
          if (!code || haveStores.has(code)) return;      // already shown via the register
          const worksJobId = (o.job && o.job.id && !o.canCreateWorks) ? o.job.id : "";
          rows.push({
            key: "ord:"+o.id, id: o.id, storeCode: o.storeCode, siteName: o.siteName||"",
            lines: [], stage: "ordered", worksJobId, jobId: (o.matchedKind==="elec"&&o.matchedJobId)?o.matchedJobId:"",
            order: { number: o.orderNumber, value: o.orderValue, id: o.id, status: o.status },
            detail: o.description || o.detail || "", offRegister:true,
          });
          haveStores.add(code);
        });
      } catch(e){ /* money-gated or unavailable — register list still works */ }

      ROWS = rows;
      render();
    }

    // Create the works job from an ordered row (reuses the proven endpoints).
    async function createWorks(r, btn){
      if (btn){ btn.disabled = true; btn.textContent = "Creating…"; }
      try {
        let res;
        if (r.order && r.order.id)          // via the client order (elec / fiveyear / em)
          res = await authFetch("/certs/orders/create-works", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: r.order.id }) }).then(x=>x.json());
        else                                 // register row with no client order attached
          res = await authFetch("/certs/five-year/create-works", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ id: r.id }) }).then(x=>x.json());
        if (res && res.ok && (res.jobId || res.worksJobId)){
          const jid = res.jobId || res.worksJobId;
          if (window.MLUI && MLUI.toast) MLUI.toast("Works job created — opening to allocate");
          location.href = "/job-view.html?jobId=" + encodeURIComponent(jid);
          return;
        }
        alert((res && (res.error||res.note)) || "Couldn't create the works job.");
        if (btn){ btn.disabled = false; btn.textContent = "Create works job"; }
      } catch(e){
        alert("Couldn't create the works job."); if (btn){ btn.disabled = false; btn.textContent = "Create works job"; }
      }
    }

    // ── Quote / copy popup ──
    // A remedial line's plain description (strip any leading "[C3] " the register bakes in).
    function remDesc(l){ return String((l && (l.action || l.description)) || "").replace(/^\s*\[[^\]]*\]\s*/, "").trim(); }
    // Has anything worth quoting? (a coded observation, or a real description — not a
    // generic "As per quotation" placeholder from the Concerto import.)
    function hasQuote(r){ return (r.lines||[]).some(l => { const d=remDesc(l); return (l.code && String(l.code).trim()) || (d && !/^as per\b/i.test(d)); }); }
    function c3count(r){ return (r.lines||[]).filter(l => String(l.code||"").toUpperCase()==="C3" && remDesc(l)).length; }
    function quoteLines(r, withC3){ return (r.lines||[]).filter(l => remDesc(l) && (withC3 || String(l.code||"").toUpperCase()!=="C3")); }
    // One line per observation: "C2 — description" (uncoded → just the description).
    function buildQuoteText(r, withC3){
      return quoteLines(r, withC3).map(l => { const c=String(l.code||"").toUpperCase().replace(/\s/g,""); const d=remDesc(l); return c ? c+" — "+d : d; }).filter(Boolean).join("\n");
    }
    let QKEY = null;
    function renderQuote(){ const r=ROWS.find(x=>x.key===QKEY); if(!r) return; const t=buildQuoteText(r, g("qc3").checked); g("qta").value = t || "(no observations recorded)"; }
    function openQuote(key){
      const r=ROWS.find(x=>x.key===key); if(!r) return; QKEY=key;
      g("qtitle").textContent = (r.storeCode?r.storeCode+" ":"") + (r.siteName||"");
      const n=c3count(r); g("qc3").checked=false; g("qc3n").textContent = n ? ("("+n+" available)") : "(none)";
      g("qsv").textContent=""; renderQuote(); g("qov").classList.add("show");
    }
    function closeQuote(){ g("qov").classList.remove("show"); QKEY=null; }
    function fallbackCopy(cb){ try{ const ta=g("qta"); ta.focus(); ta.select(); document.execCommand("copy"); cb&&cb(); }catch{ (window.MLUI&&MLUI.toast?MLUI.toast:alert)("Couldn't copy automatically — select the text and copy manually."); } }
    function copyQuoteText(){
      const txt=g("qta").value; if(!txt || txt==="(no observations recorded)") return;
      const done=()=>{ g("qsv").textContent="Copied ✓"; setTimeout(()=>{ g("qsv").textContent=""; },1800); };
      try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(done)); else fallbackCopy(done); }
      catch{ fallbackCopy(done); }
    }

    // ── wiring ──
    g("search").addEventListener("input", render);
    g("qc3").addEventListener("change", renderQuote);
    g("qcopy").onclick = copyQuoteText;
    g("qx").onclick = closeQuote;
    g("qov").addEventListener("click", e => { if(e.target===g("qov")) closeQuote(); });
    g("refreshBtn").onclick = load;
    g("sumrow").addEventListener("click", e => { const b=e.target.closest("[data-f]"); if(b){ FILTER=b.getAttribute("data-f"); render(); } });
    g("chips").addEventListener("click", e => { const b=e.target.closest("[data-f]"); if(b){ FILTER=b.getAttribute("data-f"); render(); } });
    g("tbody").addEventListener("click", e => {
      const qb = e.target.closest("[data-quote]");
      if (qb){ openQuote(qb.getAttribute("data-quote")); return; }
      const exp = e.target.closest("[data-exp]");
      if (exp){ const k=exp.getAttribute("data-exp"); if(EXPANDED.has(k)) EXPANDED.delete(k); else EXPANDED.add(k); render(); return; }
      const mk = e.target.closest("[data-mk]");
      if (mk){ const r = ROWS.find(x=>x.key===mk.getAttribute("data-mk")); if(r) createWorks(r, mk); return; }
    });

    (async () => {
      try {
        const me = await authFetch("/auth/me").then(r=>r.json());
        if (!me.ok || !(me.user.FullAccess==="Yes"||me.user.SLAAdmin==="Yes"||me.user.Compliance==="Yes")) { alert("This page needs SLA Admin, Compliance or Full Access."); location.href="/main.html"; return; }
      } catch { location.href="/main.html"; return; }
      load();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Company Memo — Mostlane</title>
  <script src="/portal-config.js?v=26"></script>
  <script src="auth.js"></script>
  <style>
    :root { --brand:#003366; --ok:#0a7d33; --bad:#b00020; --line:#e2e8f0; --ink:#16202e; --muted:#5b6b7b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:#eef1f4; color:var(--ink); }
    header.page { background:var(--brand); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; }
    header.page h1 { font-size:17px; margin:0; flex:1; }
    .wrap { max-width:680px; margin:14px auto 60px; padding:0 12px; }
    .memo { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 12px rgba(6,24,54,.07); padding:22px 22px 24px; }
    .memo .mt { font-size:30px; font-weight:800; letter-spacing:.04em; border-bottom:3px solid #404040; padding-bottom:8px; margin:0 0 16px; }
    .memo .hd { display:grid; grid-template-columns:64px 1fr; gap:2px 8px; margin-bottom:6px; }
    .memo .hd .k { font-weight:800; }
    .memo .hd .v { white-space:pre-wrap; }
    .memo hr { border:none; border-top:1px solid var(--line); margin:16px 0; }
    .memo .body { white-space:pre-wrap; line-height:1.5; font-size:15.5px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 12px rgba(6,24,54,.07); padding:16px; margin-top:14px; }
    .card h2 { margin:0 0 4px; font-size:16px; }
    .sub { color:var(--muted); font-size:13px; margin:0 0 10px; }
    label.ck { display:flex; gap:10px; align-items:flex-start; font-size:15px; margin:6px 0 12px; cursor:pointer; }
    label.ck input { width:20px; height:20px; margin-top:1px; flex:none; }
    .sigwrap { border:1px solid #ccd5dd; border-radius:10px; overflow:hidden; background:#fff; }
    #sigPad { width:100%; height:180px; display:block; touch-action:none; }
    .sigbar { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
    .btn { background:var(--brand); color:#fff; border:none; border-radius:10px; padding:13px 18px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn.grey { background:#5b6b7b; } .btn.small { padding:8px 12px; font-size:13px; }
    .btn.big { width:100%; margin-top:14px; }
    .msg { font-size:14px; margin:10px 0 0; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
    .donebox { text-align:center; padding:34px 16px; }
    .donebox .big { font-size:52px; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <header class="page">
    <h1>📢 Company Memo</h1>
  </header>
  <div class="wrap" id="wrap">
    <div class="memo" id="memoCard"><p class="muted">Loading…</p></div>
  </div>

  <script>
    const API = window.MOSTLANE_API;
    const g = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    function authFetch(path, opts = {}) {
      opts.headers = Object.assign({ "Authorization": "Bearer " + localStorage.getItem("mostlaneToken") }, opts.headers || {});
      return fetch(API + path, opts);
    }
    const qId = parseInt(new URLSearchParams(location.search).get("id"), 10) || 0;
    let sigData = "", sctx = null, drawing = false;

    function homeHref() {
      // Field users go back to their menu (main.html); everyone else too — main is the safe home.
      return "main.html";
    }

    async function load() {
      if (!qId) { g("memoCard").innerHTML = '<p class="muted">No memo specified.</p>'; return; }
      try {
        const d = await authFetch("/memos/one?id=" + qId).then(r => r.json());
        if (!d.ok) throw new Error(d.error || "Not found");
        if (d.signed) { showDone(true); return; }
        render(d.memo);
      } catch (e) { g("memoCard").innerHTML = '<p class="muted">Couldn\'t load this memo. It may have been withdrawn.</p><p style="text-align:center"><a class="btn" style="text-decoration:none;display:inline-block" href="' + homeHref() + '">Back to menu</a></p>'; }
    }

    function render(m) {
      const rows = [["To:", m.to], ["From:", m.from], m.cc ? ["Cc:", m.cc] : null, ["Date:", m.date], ["Re:", m.re]].filter(Boolean);
      g("memoCard").innerHTML =
        '<div class="mt">MEMO</div>' +
        '<div class="hd">' + rows.map(r => '<div class="k">' + esc(r[0]) + '</div><div class="v">' + esc(r[1] || "") + '</div>').join("") + '</div>' +
        '<hr>' +
        '<div class="body">' + esc(m.body || "") + '</div>';
      // Sign card
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<h2>Acknowledge & sign</h2>' +
        '<p class="sub">You must confirm you have read and understood this memo. A signed copy is saved to your <b>My Documents › Memos</b>.</p>' +
        '<label class="ck"><input type="checkbox" id="ackck"><span>I confirm I have read and understood the content of this memo.</span></label>' +
        '<div class="sigwrap"><canvas id="sigPad"></canvas></div>' +
        '<div class="sigbar"><span class="muted" style="font-size:12px;">Sign above with your finger or mouse</span><button class="btn grey small" type="button" id="sigClear">Clear</button></div>' +
        '<button class="btn big" id="signBtn" disabled>Sign & acknowledge</button>' +
        '<p class="msg" id="msg"></p>';
      g("wrap").appendChild(card);
      initSig();
      g("ackck").addEventListener("change", refresh);
      g("sigClear").onclick = () => { const c = g("sigPad"); sctx.fillStyle = "#fff"; sctx.fillRect(0, 0, c.width, c.height); sigData = ""; refresh(); };
      g("signBtn").addEventListener("click", submit);
    }

    function refresh() {
      const ok = g("ackck").checked && !!sigData;
      g("signBtn").disabled = !ok;
    }

    function initSig() {
      const c = g("sigPad");
      const w = c.clientWidth || 320, h = 180;
      c.width = w; c.height = h;
      sctx = c.getContext("2d");
      sctx.fillStyle = "#fff"; sctx.fillRect(0, 0, w, h);
      sctx.strokeStyle = "#0f172a"; sctx.lineWidth = 2.2; sctx.lineJoin = "round"; sctx.lineCap = "round";
      const pos = e => { const r = c.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
      const down = e => { drawing = true; const p = pos(e); sctx.beginPath(); sctx.moveTo(p.x, p.y); e.preventDefault(); };
      const move = e => { if (!drawing) return; const p = pos(e); sctx.lineTo(p.x, p.y); sctx.stroke(); e.preventDefault(); };
      // JPEG (white background) so the server can embed the drawn signature into
      // the acknowledgement PDF (the PDF engine embeds baseline JPEGs).
      const up = () => { if (!drawing) return; drawing = false; sigData = c.toDataURL("image/jpeg", 0.92); refresh(); };
      c.onpointerdown = down; c.onpointermove = move; c.onpointerup = up; c.onpointerleave = up;
    }

    async function submit() {
      const btn = g("signBtn"), msg = g("msg");
      if (!g("ackck").checked || !sigData) return;
      btn.disabled = true; btn.textContent = "Saving…"; msg.className = "msg"; msg.textContent = "";
      try {
        const r = await authFetch("/memos/ack", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: qId, signature: sigData }) }).then(r => r.json());
        if (!r.ok) throw new Error(r.error || "Failed");
        showDone(false);
      } catch (e) {
        msg.className = "msg err"; msg.textContent = "Couldn't save your signature — please try again.";
        btn.disabled = false; btn.textContent = "Sign & acknowledge";
      }
    }

    function showDone(already) {
      g("wrap").innerHTML =
        '<div class="card donebox"><div class="big">✅</div>' +
        '<h2 style="margin:8px 0 4px;">' + (already ? "Already signed" : "Thank you — signed") + '</h2>' +
        '<p class="sub">A signed copy has been saved to your <b>My Documents › Memos</b>.</p>' +
        '<a class="btn" style="text-decoration:none;display:inline-block;margin-top:8px;" href="' + homeHref() + '">Back to menu</a></div>';
    }

    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Van Scores — Mostlane</title>
  <script src="/portal-config.js?v=14"></script>
  <script src="auth.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef1f4;color:#1f2937}
    header.page{background:#003366;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
    header.page h1{font-size:18px;margin:0;flex:1}
    .wrap{max-width:640px;margin:14px auto 60px;padding:0 12px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 2px 10px rgba(6,24,54,.06);padding:16px;margin-bottom:12px}
    .muted{color:#6b7a90}
    .hero{display:flex;align-items:center;gap:16px}
    .hero .big{font-size:44px;font-weight:800;line-height:1}
    .hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6b7a90}
    .yr{background:#003468;color:#fff;font-weight:800;padding:7px 12px;border-radius:8px;margin:16px 0 6px;font-size:14px}
    .row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-top:1px solid #eef}
    .row:first-child{border-top:none}
    .row .rng{flex:1;min-width:0}
    .row .rng b{font-size:14.5px}
    .row .reg{color:#6b7a90;font-size:12px}
    .chip{font-weight:800;font-size:18px;min-width:44px;text-align:center;border-radius:9px;padding:6px 4px;color:#fff}
    .empty{color:#6b7a90;text-align:center;padding:26px 10px}
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" data-role="home" href="/main.html" title="Back" style="text-decoration:none;color:#fff">‹ Back</a>
    <h1>🚐 My Van Scores</h1>
  </header>
  <div class="wrap">
    <div id="hero" class="card" style="display:none"></div>
    <div id="list" class="card"><div class="empty">Loading your scores…</div></div>
    <p class="muted" style="font-size:12px;text-align:center">Your weekly driving scores, sent by the office. Higher is better (out of 100).</p>
  </div>
  <script>
    const API=(window.MOSTLANE_API||"https://mostlane-api.jamie-def.workers.dev");
    const tok=()=>localStorage.getItem("mostlaneToken")||"";
    function authFetch(p,o={}){ o.headers=Object.assign({Authorization:"Bearer "+tok()},o.headers||{}); return fetch(API+p,o); }
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const colour=s=>s>=85?"#0a8a35":s>=70?"#b45309":"#d11f2a";
    const band=s=>s>=85?"Great":s>=70?"OK":"Needs care";
    function fmtRange(a,b){
      const f=iso=>{ const d=new Date(iso+"T12:00:00Z"); return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };
      if(!b||b===a) return f(a);
      return f(a)+" – "+f(b);
    }
    const yearOf=iso=>{ const d=new Date((iso||"")+"T12:00:00Z"); return isNaN(d)?"":String(d.getUTCFullYear()); };

    async function markSeen(latest){
      if(!latest) return;
      try{ localStorage.setItem("mlVanScoreSeen",latest); }catch(e){}
      try{ await authFetch("/prefs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vanScoreSeen:latest})}); }catch(e){}
    }

    (async function(){
      let scores=[];
      try{ const d=await authFetch("/fleet/scores/mine").then(r=>r.json()); if(d&&d.ok) scores=d.scores||[]; }
      catch(e){}
      const list=document.getElementById("list");
      if(!scores.length){ list.innerHTML='<div class="empty">No scores have been sent to you yet.<br>They\'ll appear here when the office sends your driving scores.</div>'; return; }
      // Newest already first (server sorts week_start DESC). Hero = latest.
      const latest=scores[0];
      const hero=document.getElementById("hero");
      hero.style.display="";
      hero.innerHTML=`<div class="hero">
        <div class="big" style="color:${colour(latest.score)}">${latest.score}</div>
        <div><div class="lbl">Latest score · ${esc(band(latest.score))}</div>
          <div style="font-weight:600">${esc(fmtRange(latest.weekStart,latest.weekEnd))}</div>
          ${latest.reg?`<div class="muted" style="font-size:12px">${esc(latest.reg)}</div>`:""}</div></div>`;
      // Group by year.
      const groups={}; for(const s of scores){ (groups[yearOf(s.weekStart)||"—"]=groups[yearOf(s.weekStart)||"—"]||[]).push(s); }
      const years=Object.keys(groups).sort().reverse();
      list.innerHTML=years.map(y=>{
        const rows=groups[y].map(s=>`<div class="row">
          <div class="rng"><b>${esc(fmtRange(s.weekStart,s.weekEnd))}</b>${s.reg?`<div class="reg">${esc(s.reg)}</div>`:""}</div>
          <div class="chip" style="background:${colour(s.score)}">${s.score}</div></div>`).join("");
        return `<div class="yr">${esc(y)}</div>${rows}`;
      }).join("");
      markSeen(latest.sentAt||"");
    })();
  </script>
</body>
</html>

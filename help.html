<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=23"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Help — Mostlane Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:#eef1f5; color:#16202e; }
    header.page { background:linear-gradient(180deg,#1A4F8F,#003468); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
    header.page h1 { font-size:18px; margin:0; flex:1; color:#fff; }
    .wrap { max-width:860px; margin:16px auto 60px; padding:0 14px; }
    .muted { color:#667085; font-size:13px; }
    input.search { width:100%; padding:12px 14px; border:1px solid #ccd5dd; border-radius:11px; font-size:15px; font-family:inherit; margin-bottom:16px; }

    .grp { margin:22px 0 8px; }
    .grp h2 { font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:#667085; margin:0 0 8px 4px; }
    .art { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 2px 10px rgba(6,24,54,.06); margin-bottom:10px; overflow:hidden; }
    .art > button.head { display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; padding:14px 16px; font-family:inherit; font-size:15px; font-weight:600; color:#003366; cursor:pointer; text-align:left; }
    .art > button.head .ico { font-size:22px; flex:none; }
    .art > button.head .chev { margin-left:auto; color:#9fb2c8; font-size:20px; transition:transform .15s; flex:none; }
    .art.open > button.head .chev { transform:rotate(90deg); }
    .art .body { display:none; padding:0 18px 16px; }
    .art.open .body { display:block; }
    .art .body p.intro { margin:0 0 10px; font-size:14px; color:#3a4a5c; }
    .art .body ol { margin:0; padding-left:22px; }
    .art .body li { margin:0 0 12px; font-size:14px; line-height:1.6; }
    .art .body li b { color:#003366; }
    .art .body img.shot { display:block; max-width:250px; width:100%; border:1px solid #d7dee6; border-radius:12px; margin:8px 0 2px; cursor:zoom-in; box-shadow:0 2px 8px rgba(6,24,54,.10); }
    .art .body img.shot.wide { max-width:100%; }
    .tip { background:#f0f6ff; border:1px solid #cfe0f5; border-radius:9px; padding:9px 12px; font-size:13px; margin:10px 0 0; }

    /* Getting-started walkthrough */
    .gs { background:linear-gradient(180deg,#f4f9ff,#eaf3ff); border:1px solid #cfe0f5; border-radius:16px; padding:16px 16px 6px; margin-bottom:18px; box-shadow:0 3px 14px rgba(6,24,54,.07); }
    .gs.alldone { background:linear-gradient(180deg,#f1fbf5,#e7f7ee); border-color:#bfe6cd; }
    .gs h2 { margin:0 0 2px; font-size:17px; color:#003366; }
    .gs .sub { margin:0 0 12px; font-size:13px; color:#3a4a5c; line-height:1.5; }
    .gs .prog { height:8px; background:#dbe7f5; border-radius:6px; overflow:hidden; margin:0 0 6px; }
    .gs .prog > i { display:block; height:100%; background:#1A4F8F; border-radius:6px; transition:width .25s; }
    .gs ol { list-style:none; margin:0; padding:0; }
    .gs li { display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-top:1px solid #dce8f6; }
    .gs li:first-child { border-top:none; }
    .gs .tick { flex:none; width:26px; height:26px; border-radius:50%; border:2px solid #9fb9d8; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#1A4F8F; margin-top:1px; padding:0; }
    .gs li.done .tick { background:#1A4F8F; border-color:#1A4F8F; color:#fff; }
    .gs .txt { flex:1; }
    .gs .txt .t { font-size:14.5px; font-weight:600; color:#16202e; }
    .gs li.done .txt .t { text-decoration:line-through; color:#8091a3; }
    .gs .txt .d { font-size:13px; color:#4a5a6c; margin-top:2px; line-height:1.55; }
    .gs .txt .d b { color:#003366; }
    .gs .go { display:inline-block; margin-top:7px; font-size:13px; font-weight:600; color:#1A4F8F; background:none; border:none; padding:0; cursor:pointer; text-decoration:none; font-family:inherit; }
    .gs .go:hover { text-decoration:underline; }
    .gs .foot { display:flex; justify-content:space-between; align-items:center; padding:8px 0 4px; }
    .gs .foot .hide { font-size:13px; color:#667085; background:none; border:none; cursor:pointer; font-family:inherit; }
    .gs .foot .hide:hover { color:#334155; text-decoration:underline; }
    .gsmini { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:11px 14px; margin-bottom:16px; display:flex; align-items:center; gap:8px; font-size:14px; color:#003366; cursor:pointer; box-shadow:0 2px 8px rgba(6,24,54,.05); }
    .gsmini:hover { border-color:#cfe0f5; }
    .gsmini b { font-weight:700; }

    .lightbox { display:none; position:fixed; inset:0; z-index:999; background:rgba(0,0,0,.9); justify-content:center; align-items:center; cursor:zoom-out; }
    .lightbox img { max-width:94%; max-height:92%; border-radius:10px; }
    #noneMsg { background:#fff; border:1px dashed #ccd5dd; border-radius:12px; padding:16px; color:#667085; font-size:14px; display:none; }
  </style>
</head>
<body>
  <header class="page">
    <h1>❓ Help &amp; guides</h1>
    <a class="ml-back" data-role="home" href="main.html">← Menu</a>
  </header>

  <div class="wrap">
    <p class="muted" style="margin:0 0 12px;">Step-by-step guides for your portal. You only see guides for the areas you can use — if a section you need is missing, ask the office to check your permissions.</p>
    <div id="gsWrap"></div>
    <input class="search" id="search" placeholder="Search the guides… e.g. transfer, holiday, password">
    <div id="list"><p class="muted">Loading your guides…</p></div>
    <div id="noneMsg">No guides match your search.</div>
  </div>

  <div class="lightbox" id="lightbox"><img id="lightImg" alt=""></div>

  <script>
    const g = id => document.getElementById(id);

    // Every guide, tagged with the permission(s) that make it relevant.
    // perms:"always" = everyone. Otherwise shown if the user has ANY listed
    // permission (Full access sees everything). Step format: [text, image?].
    const GROUPS = [
      { title: "Getting started", arts: [
        { icon: "🔑", title: "Log in", perms: "always", intro: "One login lasts 90 days per device.", steps: [
          ["Open the portal and type your <b>name</b> and <b>password</b>. Old-style names (like <i>jamie.line</i>), capital letters or your email address all work.", "login.png"],
          ["Tap the <b>👁 eye</b> to see what you've typed — tap it again to hide it."],
          ["Tap <b>Login</b>. On a new phone or computer you'll be asked to give the device a name — that registers it to you."],
          ["That's it for 90 days on that device. If you're asked to log in much sooner, tell the office."],
        ]},
        { icon: "📧", title: "Reset a forgotten password", perms: "always", steps: [
          ["On the login screen tap <b>Forgot password?</b> and enter your name or email.", "forgot.png"],
          ["Check your email (and junk folder) for the reset link — it's valid for 1 hour."],
          ["The link opens the <b>Set a new password</b> page. Type your new password twice — the rules are shown, and the 👁 eye lets you check your typing.", "resetpw.png"],
          ["Tap <b>Save password</b>, then log in with it. When your phone offers to save the new password, say yes — that keeps autofill current."],
        ]},
        { icon: "🧭", title: "Find your way around", perms: "always", steps: [
          ["On your <b>phone</b>, the menu is a grid of buttons. You only see buttons for the areas you're allowed to use.", "menu.png"],
          ["On a <b>desktop</b>, the same areas appear in the blue sidebar on the left. Tap <b>Minimise</b> at the bottom to shrink it to icons.", "sidebar.png"],
          ["Every page has a <b>← Menu</b> button (top right) to get back to the start."],
        ]},
        { icon: "🔒", title: "Change your password", perms: "always", steps: [
          ["If the office gives you a temporary password, the portal makes you choose your own the next time you log in — just follow the screen."],
          ["To change it yourself any time: log out, tap <b>Forgot password?</b>, and follow the emailed link (see “Reset a forgotten password” above)."],
          ["New passwords need <b>at least 8 characters, with a letter and a number</b> — anything less is refused."],
        ]},
        { icon: "🎨", title: "Personalise your portal", perms: ["ThemeColour", "ThemeBackground"], intro: "Your choices follow you onto any device and only change what YOU see.", steps: [
          ["Open <b>🎨 Personalise</b> from the menu (or the sidebar on desktop).", "personalise.png"],
          ["Tap a <b>colour theme</b> circle — headers, menus and buttons recolour everywhere, instantly. It saves automatically."],
          ["Pick a <b>menu background</b>: the embossed Mostlane picture, a plain colour, or tap <b>📷 Upload photo</b> to use your own picture."],
          ["What you're allowed to change is set by the office — if a section is missing here, that's why."],
        ]},
      ]},

      { title: "Notifications", arts: [
        { icon: "🔴", title: "What the red bubbles mean", perms: "always", steps: [
          ["A red number on a menu button (or sidebar item) means something in that area is waiting for you — transfers to accept, holiday decisions to see, or requests to approve.", "badges.png"],
          ["The bubble clears itself once you've dealt with the item — on <b>any</b> of your devices."],
        ]},
        { icon: "🚦", title: "The “Needs your attention” screen", perms: "always", steps: [
          ["If anything is outstanding when you open the menu on your phone, this screen appears in front of it.", "gate.png"],
          ["<b>Tap an item</b> to go straight to where it's dealt with. Once everything is cleared, the screen stops appearing."],
        ]},
        { icon: "💤", title: "Put a notification off (Remind me later)", perms: "always", steps: [
          ["Can't deal with it right now? Tap <b>💤 Remind me later</b> at the bottom of the attention screen — it goes away for <b>4 hours</b>."],
          ["You can do that <b>twice per notification</b> (across all your devices). After that the button disappears and the item has to be dealt with."],
          ["Something genuinely new (another transfer, another request) always alerts fresh."],
        ]},
        { icon: "🖥️", title: "Notifications on desktop", perms: "always", steps: [
          ["On a desktop the same list appears as a panel in the top-right corner instead of blocking the screen.", "gatedesk.png"],
          ["Click an item to open it, or the <b>✕</b> to dismiss the panel — it stays away until something new arrives."],
        ]},
      ]},

      { title: "Plant & Equipment", arts: [
        { icon: "⚙️", title: "See your items and keys", perms: ["Assets"], steps: [
          ["Open <b>Plant &amp; Equipment</b> from the menu. Everything currently signed to you is listed with photos, serial numbers and how long you've held each item.", "myassets.png"],
          ["Any <b>keys</b> the office has signed out to you show in a strip at the top — hand them back to the office when you're done."],
        ]},
        { icon: "📤", title: "Send an item to someone", perms: ["Assets"], steps: [
          ["On your item, tap <b>Transfer</b> and choose who's taking it.", "transfer.png"],
          ["Tap <b>📷 Take photo</b> and photograph the item's condition as you hand it over (up to 6 photos). They're stamped onto the transfer note — no arguments later about scratches or missing accessories."],
          ["Tap <b>Send transfer</b>. The item stays <b>your responsibility</b> until the other person accepts and signs."],
          ["While it's waiting you'll see <i>“⏳ Waiting for … to accept”</i> on the item — tap <b>Cancel</b> there if you change your mind.", "outgoing.png"],
        ]},
        { icon: "✍️", title: "Accept &amp; sign for an item", perms: ["Assets"], steps: [
          ["When someone sends you an item it appears at the top of your Plant &amp; Equipment page (and in your notifications). <b>Look at their condition photos first</b> — tap to enlarge.", "myassets.png"],
          ["Tap <b>Accept &amp; sign</b>. Add your own condition photos if you want your own record of how it arrived.", "sign.png"],
          ["Sign the box with your finger and tap <b>Sign &amp; accept</b>. From that moment the item — and responsibility for it — is yours, and the previous holder is released."],
          ["A formal <b>transfer note</b> is created with both sets of photos and your signature, stored permanently.", "note.png"],
        ]},
        { icon: "🚫", title: "Reject a transfer", perms: ["Assets"], steps: [
          ["Sent something you didn't agree to take, or the condition isn't right? On the waiting transfer, tap <b>Reject</b> instead of accepting."],
          ["The item stays with the sender (it never becomes your responsibility) and the rejection is recorded in the item's history."],
        ]},
        { icon: "🕓", title: "Check an item's history", perms: ["Assets"], steps: [
          ["On any of your items tap <b>History</b> to see every hand-over it's ever had — who, to whom, and when.", "history.png"],
          ["Transfers you were part of show a <b>View note</b> button that opens the signed paperwork."],
        ]},
        { icon: "📄", title: "Find your transfer documents", perms: ["Assets"], steps: [
          ["Tap <b>📄 My documents</b> at the top of your Plant &amp; Equipment page.", "mydocs.png"],
          ["<b>Items I currently hold</b> — the acceptance note for each item you're responsible for right now."],
          ["<b>Responsibility ended</b> — your proof for every item you've handed over. These are kept forever."],
          ["Tap <b>View</b> on any of them to open the signed note; use <b>Print / save PDF</b> to keep a copy."],
        ]},
        { icon: "🌐", title: "Use the shared pool", perms: ["Assets"], steps: [
          ["Tap <b>Shared assets</b> on your Plant &amp; Equipment page to see pool equipment anyone can use.", "shared.png"],
          ["Tap <b>History</b> on an item to see where it's been and who used it last."],
        ]},
      ]},

      { title: "Plant & Equipment — admin", arts: [
        { icon: "📦", title: "Add a new asset", perms: ["AssetAdmin"], steps: [
          ["Open <b>All assets</b> (from the Plant &amp; Equipment page), then tap <b>+ Add asset</b>."],
          ["Give it an <b>ID</b>, <b>name</b> and <b>category</b>, its value, and who it's assigned to (or the Shared pool).", "addasset.png"],
          ["Tap <b>Save</b>, then re-open the asset to add photos — the 📷 button uses your phone camera."],
        ]},
        { icon: "🛠️", title: "Edit, photograph or delete an asset", perms: ["AssetAdmin"], steps: [
          ["On <b>All assets</b>, use the search box to find the item, then tap <b>Edit</b>.", "assetsadmin.png"],
          ["Change any detail and <b>Save</b>. In the images row: tap a photo to view it, the <b>×</b> to remove it, or <b>📷 Upload image</b> to add one."],
          ["<b>Delete</b> removes the asset from the register (its transfer history is kept). You'll be asked to confirm — this can't be undone."],
        ]},
        { icon: "⬇️", title: "Export the asset report", perms: ["AssetAdmin"], steps: [
          ["On <b>All assets</b>, tap <b>⬇ Export report</b>."],
          ["You get an Excel file with a tab per person: every item they hold, its value, photos and the full transfer history — ready for audits or insurance."],
          ["The <b>Value per person</b> table on screen shows the same totals at a glance; people holding over £5,000 are highlighted."],
        ]},
        { icon: "📷", title: "Check an item's condition photos", perms: ["AssetAdmin"], steps: [
          ["On <b>All assets</b>, tap the <b>📷 button</b> on any item.", "condphotos.png"],
          ["Every condition photo from every transfer is listed — <b>who took it, when</b>, and whether they were <b>handing over or receiving</b>. Tap a photo to see it full-size."],
          ["Photos from a transfer still awaiting acceptance are marked <b>Transfer pending</b>."],
        ]},
        { icon: "🗝️", title: "Sign a key out and back in", perms: ["AssetAdmin"], steps: [
          ["Open <b>🔑 Keys</b> from the All assets toolbar. Green = in the office, red = out with someone.", "keys.png"],
          ["<b>Signing out:</b> tap <b>Sign out</b> on the key, pick the person, add a note like “PPM visit, back Friday”.", "keyout.png"],
          ["The key now shows against their name here <b>and on their own portal page</b>, so they can't say they didn't know they had it."],
          ["<b>Signing in:</b> when it comes back, tap <b>↩ Sign in</b> — one tap, done."],
        ]},
        { icon: "➕", title: "Add a key & check its history", perms: ["AssetAdmin"], steps: [
          ["On the Key Register, tap <b>+ Add key</b>. Give it a label people will recognise, its type (site / van / other) and the site name or van reg.", "keyadd.png"],
          ["Tap <b>History</b> on any key to see every movement — who took it, who booked it out, when it came back. History is kept forever, even if the key is later deleted.", "keyhist.png"],
        ]},
      ]},

      { title: "Holiday", arts: [
        { icon: "🌴", title: "Book time off", perms: ["Holiday"], steps: [
          ["Open <b>Holiday</b>. The ring shows your days left; below are your bookings for the year.", "holiday.png"],
          ["Tap <b>+ Book time off</b>. Pick your first and last day (weekends aren't counted) and add the reminder note.", "book.png"],
          ["Tap <b>Request</b>. It shows as <b>Pending</b> until the office decides — you'll get a red notification when it's approved or rejected."],
        ]},
        { icon: "🔁", title: "Cancel a booking", perms: ["Holiday"], steps: [
          ["On the Holiday page, tap <b>Cancel</b> on the booking — pending or approved."],

        ]},
        { icon: "✅", title: "Approve or reject requests", perms: ["HolidayAdmin"], steps: [
          ["Open <b>Holiday Admin</b>. The <b>Approvals</b> tab lists every request waiting for a decision.", "holadmin.png"],
          ["Tap <b>Approve</b> or <b>Reject</b> — the person is notified automatically either way."],
          ["When staff cancel their own approved leave, it shows here too (that's part of the red bubble on Holiday Admin)."],
        ]},
        { icon: "📊", title: "The wall chart & marking days worked", perms: ["HolidayAdmin"], steps: [
          ["The <b>Wall chart</b> tab shows the whole team's month — green approved, amber pending, blue bank holidays, purple shutdown.", "wallchart.png"],
          ["Use it to spot clashes before approving. Tap a <b>green block</b> to cancel that day of an approved holiday."],
          ["Tap a <b>blue or purple block</b> to mark that the person actually worked that bank holiday / shutdown day — it credits the day back to them."],
        ]},
        { icon: "⚖️", title: "Allowances, bank holidays & shutdown", perms: ["HolidayAdmin"], steps: [

          ["<b>Accrual mode</b> (tick-box) makes allowances build up 1/12th per month — bookings beyond what's accrued show a warning."],

      { title: "Office & admin", arts: [

          ["Open <b>📊 Stats</b> (Full-access only) for a live overview of the whole portal."],
          ["The <b>Storage</b> meter shows how much of Cloudflare's free 10 GB you're using, broken down by type (job photos, site documents, asset photos…). You'll normally be a tiny fraction of it."],
          ["Job stats: totals by status and priority, how many raised this month, and your <b>SLA met %</b> across completed jobs."],
          ["Team & activity: active users, recent logins, busiest engineers, most active users, and how many actions/page-views have happened lately."],
          ["The <b>Database</b> card is the geeky bit — live row counts for every table. Tap <b>↻ Refresh</b> any time for fresh figures."],
        ]},
        { icon: "👥", title: "Add a new user", perms: ["Users"], steps: [
          ["Open <b>Users</b> and tap <b>+ Add user</b>.", "userlist.png"],
          ["Fill in their name and details on the <b>Details</b> tab. If you enter an <b>email</b>, they're automatically sent a welcome link to set their own password — no password hand-over needed."],
          ["Drag the <b>⠿</b> handle in the list to set the order people appear in dropdowns across the whole portal (office staff first, then field)."],

        { icon: "🎚️", title: "Set someone's permissions", perms: ["Users"], steps: [

          ["<b>Full access</b> is the master switch that opens everything (use sparingly)."],
          ["The <b>Personalisation</b> group controls whether they can change their colour theme and/or menu background."],

        { icon: "🔑", title: "Set or reset someone's password", perms: ["Users"], steps: [

          ["Leave <b>“They must change it at next login”</b> ticked for a temporary password — untick it only when the password should stick (e.g. setting your own)."],
          ["The <b>Reset password</b> button instead generates a temporary password for you to relay — and <b>logs them out of every device immediately</b>. Use that when a phone is lost or someone leaves."],
        ]},
        { icon: "🔔", title: "Check the notification log", perms: ["Users"], steps: [
          ["Users page → <b>🔔 Notification log</b>. Every time the attention screen appears on someone's phone it's recorded with a timestamp.", "notifylog.png"],
          ["Filter by person and period. <b>✅ Shown</b> proves it appeared; <b>💤 Put off</b> shows reminders used (x of 2); <b>↗ Opened</b> shows they tapped into it."],
          ["If someone says “mine never showed that” — look here first."],
        ]},
        { icon: "📱", title: "Move someone to a new phone", perms: ["DeviceAdmin"], steps: [
          ["Accounts are locked to registered devices — a password alone isn't enough from a strange phone."],
          ["Open <b>Device Management</b> and select the person.", "deviceadmin.png"],
          ["Remove their old device. At their next login on the new phone they'll be prompted to register it — done."],
        ]},
        { icon: "🕐", title: "Clock in/out & My Hours", perms: ["OfficeClock"], steps: [
          ["With <b>Office clock</b> enabled on your account and switched on for your office computer (Users → Devices tab), the clock in/out bar appears at the top of the main menu — tap it when you arrive and when you leave. Break for lunch and clock back in; the day adds the pieces up."],
          ["<b>My Hours</b> (sidebar or menu) shows your week: each day's clock times and total, plus the week total at the top. Use <b>← Prev / Next →</b> to look at other weeks.", "myhours.png"],
        ]},
        { icon: "⏱️", title: "Fill in your weekly timesheet", perms: ["EngTimesheet"], steps: [
          ["Open <b>My Timesheet</b> from the menu. Each day has a <b>Start</b> and <b>Finish</b> time and a box for the <b>job number(s)</b> you were on."],
          ["Any deductions the office has set for you (30&nbsp;minutes travel each way, or a lunch break on longer days) are shown greyed on each day and taken off automatically — the green figure is your <b>paid</b> time."],
          ["If you claim <b>mileage</b>: just pick the site in the <b>job box</b> — the mileage claim is <b>added automatically</b> with the office’s preset miles for that site. Miles can’t be typed in; if a site shows <i>no preset</i>, ask the office to set its mileage. Tap ✕ on a claim to withdraw it. For anywhere unknown, tap <b>🧮</b> for an estimate, or type the miles. If your account has the 10-mile radius rule, the first and last 10 miles of each day are deducted automatically."],
          ["Everything <b>saves automatically as you type</b> — the bar at the bottom shows “Saved ✓”. Come back and change things any time until the week is invoiced."],
          ["Better still: use your <b>job statuses</b> and the timesheet fills itself. Setting a job to <b>Travelling</b> or <b>In Progress</b> starts your clock on it; <b>Complete</b> (or any other status) stops it. Your day’s start, finish, jobs and mileage all appear automatically — shown with a green “⏱ From your jobs” tag — and you can still adjust the times."],
        ]},
        { icon: "🧾", title: "Invoice your week (self-employed)", perms: ["EngTimesheet"], steps: [
          ["Self-employed engineers see an <b>Invoice this week</b> card under the timesheet. Fill in <b>your name &amp; address</b> box once (it prints as the “From” on every invoice and saves as you type), and set <b>your starting invoice number</b> — every invoice after that counts up automatically."],
          ["Check the totals, then tap <b>Generate invoice PDF</b>. Your rate (and mileage, if you claim it) are worked in, the PDF is numbered and saved in the portal, and the office can see it straight away."],
          ["The week <b>locks</b> once invoiced. If something's wrong, ask the office to delete the invoice — that unlocks the week and the number is reused."],
          ["All your past invoices are listed under the card — tap <b>Open</b> to view or re-download any of them."],
        ]},
        { icon: "🧾", title: "Engineer timesheets & invoices (admin)", perms: ["TimesheetAdmin"], steps: [
          ["<b>Engineer Timesheets</b> shows everyone's week — paid hours per day (after their deductions), miles, and each self-employed engineer's invoice for the week. <b>✎</b> edits a person's days."],
          ["<b>⚙️ Settings</b> is where you set <b>who gets the 30-minute travel deduction</b> (each way), <b>who has lunch deducted</b>, who gets <b>fuel</b> (the mileage switch), their rate (per hour or per day), pence per mile, home postcode and next invoice number. It also holds the company details printed on invoices."],
          ["<b>🗺️ Site mileage</b> holds the round-trip miles paid for each site (from base). <b>⚡ Work out missing</b> estimates every portal site's figure in one go; type over any value to correct it, and add one-off sites at the top. Engineers' mileage boxes fill from this list automatically."],
          ["<b>🧾 Invoices</b> lists every generated invoice — open the PDF or delete a wrong one (that unlocks the engineer's week and frees the number)."],
        ]},
        { icon: "💼", title: "The office timesheet (admin)", perms: ["OfficeTimesheet"], steps: [
          ["<b>Office Timesheet</b> shows the whole team's week in one table — a row per person, a column per day, with totals.", "officesheet.png"],
          ["A <b>running</b> tag means they're still clocked in — that open session isn't counted until they clock out (or you close it)."],
          ["<b>✏️ Edit</b> a person to correct clock times — the original automatic times are kept and shown struck through, so edits are always visible. Voided segments count as zero."],
          ["<b>Download CSV</b> exports the week for payroll; <b>Print</b> makes a paper copy."],
        ]},
      ]},

      { title: "Jobs & sites", arts: [
        { icon: "🚨", title: "The SLA job board (office)", perms: ["SLAAdmin"], steps: [
          ["Tap <b>SLA</b> — the job board opens straight away. This is the <b>SLA Admin</b> area (dashboard, scheduler, add/edit jobs); give a user the <b>SLA Admin</b> permission for it. Engineers with just <b>SLA</b> land on <b>My Jobs</b> and can only see their own work."],
          ["The <b>status chips</b> across the top (Pending, Scheduled, In Progress…) show live counts — tap one to filter. Use the search box for a ref, site or description."],
          ["<b>👤 Send</b> on a job: tick <b>every engineer attending</b>, roll the smooth <b>start</b> and <b>finish</b> time wheels (finish auto-sets to an hour after start), and send. The job flips to <b>Scheduled</b> automatically and appears on each engineer's list."],
          ["Jobs with nobody on them show <b>Not Allocated</b> in red. Tick several rows and use <b>Mark selected as…</b> for bulk status changes."],
          ["Top buttons: <b>🗓️ Scheduler</b> (drag-and-drop day plan), <b>🗺️ Map</b> (all open jobs as pins — tap a pin for the job summary), <b>＋ Add Job</b>, <b>⚙️ Settings</b>."],
        ]},
        { icon: "🗓️", title: "The SLA scheduler & map", perms: ["SLAAdmin"], steps: [
          ["The scheduler shows every engineer's day. <b>Drag a job</b> anywhere — the drop time updates for <b>everyone assigned to that job</b>. A double border means several engineers share it."],
          ["Jobs with no time or no engineer sit in the <b>Needs scheduling</b> tray — drag one onto an engineer's row to book it in."],
          ["A job's width is its booked duration (finish time). Tap a job to edit details, duration or the engineer list."],
          ["<b>🗺️ Map view</b> shows Pending / Scheduled / In Progress / On Hold jobs as coloured pins. Tap a pin for the summary and an <b>Open job</b> link."],
        ]},
        { icon: "🧭", title: "Auto-order an engineer's day (route optimiser)", perms: ["SLAAdmin"], steps: [
          ["First, book that engineer's jobs onto the day (any order), and set each job's <b>Expected duration</b> when you raise or edit it — that's the time on site the day prediction uses."],
          ["Save the engineer's <b>Home postcode</b> once, in <b>Users Admin</b> (optionally drop a precise <b>📍 pin</b>). This is the start and end of the round trip."],
          ["On the scheduler, tap an engineer's <b>name</b> to open their day, then <b>🧭 Optimise route</b>. Pick the day's start time and a lunch break."],
          ["Type any <b>anomalies</b> in plain English — e.g. \"the Tesco Fareham job must be done at 14:00\" or \"do Southampton last\". The AI honours these while keeping the driving as short as it can."],
          ["You get a preview: the best visiting order with arrival times, plus <b>driving time, time on site, total miles and the predicted day length</b>. Nothing changes yet."],

          ["Happy with it? Tap <b>✓ Apply to schedule</b> and the jobs are re-timed on the board. If a job has no location it's listed and left where it is."],
        ]},
        { icon: "💡", title: "Fill loose jobs into the best engineer's day", perms: ["SLAAdmin"], steps: [
          ["On the scheduler, tap <b>💡 Fill-ins</b> (top right). Tick which engineers to consider (anyone with a home postcode set)."],
          ["It scans that day and lists loose jobs — unscheduled ones, and jobs sitting with an engineer you didn't tick — showing the <b>best-fit engineer</b> and the extra time it'd add to their run."],
          ["On each suggestion: <b>✓ Accept</b> to give it to that engineer, <b>✕ Reject</b> to dismiss it, or <b>👁</b> to view the job card. Viewing opens over the list and comes straight back — it never re-runs the scan or loses your place."],
          ["After accepting, open that engineer's day and <b>🧭 Optimise route</b> to slot it in at the right time. Jobs already booked onto a ticked engineer's day are left alone."],

        { icon: "🏢", title: "Batch nearby jobs when you allocate one", perms: ["SLAAdmin"], steps: [
          ["When you <b>assign an operative</b> to a job in the edit dialog and save, a <b>Whilst you're here…</b> pop-up appears if there's anything worth batching."],
          ["It lists other <b>open</b> jobs <b>at the same site</b>, plus any within a <b>radius you set</b> (default 5 miles) of that site — each showing how far away it is and who currently holds it."],
          ["Tick the ones to send to the same operative and press <b>Assign</b>. Change the <b>miles</b> box to widen or tighten the radius (it remembers your choice). If nothing is same-site or in range, no pop-up shows."],
        ]},
        { icon: "📁", title: "Site documents", perms: ["SLA", "SLAAdmin"], steps: [
          ["On a job, tap <b>📁 Site documents</b> (in the Site box) to see everything on file for that building. Office staff can also reach it from <b>Manage Sites → a site → Site documents</b>."],
          ["<b>Previous Jobs</b> — every job ever done at this site. Tap one to see a quick job sheet (engineer, dates, last note, who signed) and <b>Open full job</b> for the detail."],
          ["<b>Site Photos</b> — every photo from every job at this site, in one gallery. Tap to enlarge; you can also add a photo straight here."],
          ["<b>Compliance</b> (and any other areas) — drop in documents like EICR / gas / fire certificates. Tap <b>⬆️ Add document</b> to upload; admins can delete."],
          ["Admins can add their own areas with <b>➕ Add area</b> (e.g. Access info, Warranties, Drawings) — they appear on every site."],
        ]},
        { icon: "📋", title: "Working a job (engineers)", perms: ["SLA"], steps: [
          ["<b>My Jobs</b> lists your jobs by day. <b>🗺️ Today's map</b> shows today's jobs as pins; <b>🧭 Directions</b> opens Google Maps from wherever you are."],
          ["Before you can set a job <b>In Progress</b> you must complete the <b>risk assessment</b> on the job — every time, no exceptions."],
          ["Putting a job <b>On Hold</b> or to <b>Quote</b>? You must fill in the required details (why, what's needed / materials). Until you do, you <b>can't start another job</b> — the portal will take you back to finish it."],
          ["<b>Raise PO for this job</b> opens your PO system with the site and job number already filled in — you only add the supplier and description."],
          ["Finish with a note, photos and the customer's signature."],
        ]},
        { icon: "📍", title: "Site Manager", perms: ["Sites", "AddSite"], steps: [
          ["<b>Manage Sites</b> lists every site. Use the <b>Active / Inactive</b> chips, the type dropdown, or search by name, number, postcode or phone.", "sites.png"],
          ["<b>Add Site</b> creates one — fill in the address, postcode and customer. A photo of the site is fetched automatically if you don't upload one."],
          ["<b>Edit</b> changes a site's details; <b>View</b> opens its full record; the <b>Active</b> tick takes dead sites out of everyday lists without deleting their history."],
          ["Saved sites are pushed to <b>SiteLog automatically</b> as check-in locations — no separate setup. <b>Recalculate All</b> refreshes the distance/round-trip figures shown on each site."],
        ]},
        { icon: "🏢", title: "Customers", perms: ["Sites", "AddSite"], steps: [
          ["<b>Customers</b> groups your sites by client and holds their contact and invoicing details.", "customers.png"],
          ["<b>+ Add customer</b>: name, contact, phone, invoice email and billing address — these feed quoting and invoicing."],
          ["The <b>Sites</b> count shows how many sites each customer owns; tap through to see them."],
          ["<b>Set site images from Google Street View</b> fills in photos for any sites that don't have one (it never overwrites photos you've uploaded by hand)."],
        ]},
        { icon: "🚐", title: "Vehicles", perms: ["Vehicles"], steps: [
          ["<b>Vehicles</b> shows the whole fleet — a card per van with its photo, current driver, mileage, <b>Current MPG</b> and live MOT, tax and service dates.", "vehicles.png"],
          ["Green date badges are fine; amber/red mean due soon or overdue. A <b>Service due</b> or <b>Handover pending</b> flag shows what needs attention. Search by reg, driver or model, and drag the ⠿ handle to reorder."],
          ["Each card has buttons: <b>👤 Driver</b> (set who drives it), <b>📷 Photos</b>, <b>📋 Checks</b> (van-check &amp; handover history), <b>🔧 Maintenance</b> (work &amp; costs) and <b>Edit</b>. Tap the card itself for the full record."],
          ["<b>＋ Add vehicle</b> adds a van. In <b>Edit</b> you can add extra <b>spec fields</b> (air con, payload, dimensions…) and, for full-access, the <b>💷 Financials</b>. The other guides in “Vehicles &amp; fleet” cover each area in detail."],
        ]},
        { icon: "🛰️", title: "Check in to a site (SiteLog)", perms: ["SiteLog"], steps: [
          ["Open <b>SiteLog</b> from the menu and tap <b>Scan in / out of site</b> when you arrive or leave.", "sitelog.png"],
          ["The first time, your phone links itself to your name automatically — no separate login."],
          ["The office can see who's on which site — used for fire roll-call and lone-working checks, so scan every time."],
        ]},
        { icon: "📁", title: "Projects", perms: ["Projects", "ProjectsAdmin"], steps: [
          ["<b>Projects</b> holds the drawings, documents and files for each job you're working on.", "projects.png"],
          ["Tap a project to open its file list, then tap a file to view or download it on site."],
          ["<b>Projects Admin</b> (separate permission) is where the office creates projects and uploads or replaces the files."],
        ]},
        { icon: "🧾", title: "Raise a purchase order", perms: ["PurchaseOrders"], steps: [
          ["Tap <b>PO System</b> on the menu — it opens on your personal link, so your orders are already under your name."],
          ["Raise the PO <b>before</b> you buy; the office sees it immediately."],
          ["Use the <b>🏠 button</b> inside the PO system to come back to the portal."],
        ]},
        { icon: "🦺", title: "H&S plans", perms: ["HSPlan"], steps: [
          ["Tap <b>H&amp;S Plans</b> on the menu — it signs you straight into the planner.", "hsplan.png"],
          ["Work down the numbered sections (project details, hazards, controls…) — the finished document builds itself as you type, and your answers save automatically."],
          ["<b>Save to cloud</b> stores the plan so the office can see it; <b>Save / Print PDF</b> makes the copy for site. <b>← Library</b> lists your saved plans."],
        ]},
        { icon: "📝", title: "Forms", perms: ["Forms"], steps: [
          ["<b>Forms</b> is the launcher for the paperwork forms — van checks, van handover, tools and compliance.", "forms.png"],
          ["Pick the form, fill it in and submit — the office receives it automatically."],
        ]},
        { icon: "✔️", title: "Compliance", perms: ["Compliance"], steps: [
          ["<b>Compliance</b> holds the client-specific compliance paperwork, grouped by client.", "compliance.png"],
          ["Pick the client, then follow the form for the work you're doing. Use <b>Other</b> for anything that doesn't fit a listed client."],
        ]},
        { icon: "⚡", title: "My Day (guided mode)", perms: ["StoryMode"], steps: [
          ["Your whole day runs from <b>My Day</b> — three tabs across the top: <b>1 · Start</b>, <b>2 · Jobs</b>, <b>3 · Finish</b>.", "myday.png"],
          ["<b>Start:</b> on Wednesdays complete the weekly vehicle check (tick each item, note any defects), enter your van's mileage, and tap <b>▶ Start my day</b> — your start time and location are recorded."],
          ["<b>Jobs:</b> you get one job at a time — travel to site, complete the <b>risk assessment</b>, do the work, then close it with a note, photo and signature (or quote / order / hold if it can't be finished)."],
          ["<b>Finish:</b> end your day from the third tab to log your finish time and see your day's summary."],
          ["The floating <b>⚡ button</b> on any other page always brings you back to My Day."],
        ]},
      ]},

      { title: "Vehicles &amp; fleet", arts: [
        { icon: "🚐", title: "Do your weekly van check", perms: "always", steps: [
          ["When your check is due you'll get a <b>🚐 reminder</b> (a red alert / notification). Tap it, or open <b>Van Check</b>, to start."],
          ["Enter your van's <b>mileage</b>, then tap <b>OK</b> or <b>Defect</b> for every walkaround item — add a short note for anything you mark as a defect."],
          ["If your office has added an <b>Equipment on board</b> list, tap <b>Present</b> or <b>Missing</b> for each item (spare wheel, jack, tyre tools…).", "vancheck.png"],
          ["Take each required <b>photo</b> with the camera (the ones marked with a <b>*</b>). Add extra photos of any defects if you need to."],
          ["Tap whether the van is <b>safe to drive</b>, add any note, then <b>Submit</b>. Your answers save as you go, so a dropped signal or a closed app won't lose anything — just reopen and carry on."],
        ]},
        { icon: "🤝", title: "Complete a van handover", perms: "always", steps: [

          ["Work through the full check: the <b>vehicle checks</b> (OK / Defect), the <b>equipment on board</b> (Present / Missing), and the <b>condition report</b> for inside and out.", "vanhandover.png"],
          ["Log any existing <b>damage</b> with a note and a photo — this protects you if it's queried later. Take the required photos and enter the mileage."],
          ["Tap whether it's <b>safe to drive</b>, then <b>sign</b> at the bottom to confirm you accept the van in this condition, and <b>Submit</b>. The office is notified automatically."],
        ]},
        { icon: "🔧", title: "A vehicle's maintenance &amp; costs", perms: ["Vehicles"], steps: [
          ["From a vehicle card tap <b>🔧 Maintenance</b> to open that van's work history and spend."],
          ["<b>＋ Add maintenance</b> records a job: the <b>date</b>, a short <b>description</b>, and an optional <b>document</b> (invoice, receipt or photo)."],
          ["Split the cost by <b>category</b> — e.g. one invoice as <b>Brakes £200</b> and <b>Tyres £250</b>. The same document then shows under both, and each category's totals add up correctly.", "vehmaint.png"],
          ["The page shows a <b>spend-by-category chart</b>, tap-to-filter chips and a dated timeline. Tap <b>🏷 Categories</b> to add your own categories and colours."],
        ]},
        { icon: "📋", title: "Van check &amp; handover history, and issues", perms: ["Vehicles"], steps: [
          ["From a vehicle card tap <b>📋 Checks</b> to see every completed <b>van check</b> and <b>handover</b>, grouped into month dropdowns. Tap one to open its photos and answers."],
          ["The <b>⚠️ Issues</b> panel lists every defect, missing item and alert across all its checks — newest first. Tick <b>Alerts only</b> to see just the ones that triggered an alert.", "vehchecks.png"],
          ["<b>🔎 By question</b> lets you pick any item (e.g. “Spare wheel”) and see every answer over time — who, when, and what they answered."],
          ["A <b>⚠</b> symbol on a check or handover means an alert was triggered — see “Set up checks, handovers &amp; alerts”."],

        { icon: "⛽", title: "Fuel cards &amp; MPG", perms: ["Vehicles"], steps: [
          ["Open <b>⛽ Fuel Cards</b> from the top of the Vehicles page. Pick a card (each is linked to a driver by the <b>Fuel card number</b> in Users Admin) and log each fill-up: <b>date, litres and cost</b>."],
          ["<b>Current MPG</b> is worked out automatically from the litres bought and the mileage from van checks, and appears on each vehicle card once there's enough data (a couple of mileage readings and a fill-up)."],
          ["The stats fold by <b>Weekly / Monthly / 3-Monthly / Yearly</b> — every average uses your <b>real data span only</b>, and anything stretched beyond it is clearly marked <b>projected</b>.", "fuelcards.png"],
          ["Fuel spend and MPG are open to anyone with Vehicles access; the <b>running-cost</b> figures are full-access only."],
        ]},
        { icon: "💷", title: "What a vehicle costs to run", perms: ["__fullOnly"], steps: [
          ["In <b>Edit</b> on a vehicle open the <b>💷 Financials</b> section: insurance and road tax per year, whether it's <b>owned or financed</b>, and (if financed) the monthly cost, agreement end, allowed miles and excess pence-per-mile."],
          ["Open the vehicle card to see <b>Cost to run / year</b> — insurance + tax + finance + projected fuel + the last 12 months' maintenance + any projected excess-mileage charge.", "vehcost.png"],
          ["Figures worked out from a trend (fuel, excess mileage) are badged <b>projected</b>. The Fuel Cards page shows the same running cost per vehicle in a table."],
        ]},
        { icon: "🛠️", title: "Set up checks, handovers &amp; alerts", perms: ["__fullOnly"], steps: [
          ["Open <b>Van Checks</b> and tap <b>⚙ Settings</b> (the weekly check) or <b>🤝 Handover template</b>. Each has editable <b>checklist</b>, <b>equipment</b> and <b>photo</b> lists — add, rename or remove items."],
          ["Tick <b>Alert if</b> on any item and pick the answer that should flag it (e.g. <b>Spare wheel → Missing</b>, or a check → <b>Defect</b>).", "vanalerts.png"],
          ["Under <b>Notify these people…</b> choose who gets a push notification when an alert answer is given, then <b>Save</b> — it applies to every check from then on."],
          ["When a driver gives an alert answer, the chosen people are notified and the check carries a <b>⚠</b> symbol; it also appears in that vehicle's <b>Issues</b> log."],
          ["Use <b>🔔 Remind now</b> to chase anyone who still owes this week's van check."],
          ["<b>Control who does a check.</b> In the <b>Weekly check</b> column, switch a driver <b>Off</b> to take them out of the cycle — no reminders and no home-screen prompt (they can still do one if they want). Switch them <b>On ✓</b> to put them back."],
          ["<b>Pause everyone.</b> The banner above the table lets you <b>⏸ Pause all reminders</b> (a temporary bypass — nobody is nudged) and <b>▶ Resume</b> when you're ready. While paused, even drivers switched On won't be reminded."],
        ]},
      ]},
      { title: "Job programmes", arts: [
        { icon: "📊", title: "Build & issue a programme of works", perms: ["Programmes"], intro: "Works like your Excel programme — but the client only ever sees issued revisions, and your draft stays private.", steps: [
          ["Open <b>📊 Programmes</b> from the menu and tap <b>＋ New programme</b>. Give it a title, client and site, and set up your <b>contractors</b> — each gets a colour, and every bar on the chart is coloured by who's doing the work. Everything autosaves as you type."],
          ["Press <b>＋ Add a task</b> for each line of works: pick the contractor, type the <b>start date</b> and <b>days</b> — the <b>end date works itself out, skipping weekends AND bank holidays</b> (the portal uses the company bank-holiday list from Holiday admin — those days show amber, marked BH). Tick <b>Wknd</b> if that task works through weekends and bank holidays. The day-by-day chart draws as you go, with a Start · End · days-on-programme summary at the top."],
          ["With two or more contractors, <b>filter chips</b> above the chart show one contractor's tasks at a time — like the tabs in your old spreadsheet."],
          ["Everything for reshaping the programme lives under the <b>🛠 Tools</b> button: <b>Auto-order rows</b>, <b>Shift dates</b>, <b>Ask AI to edit</b>, and <b>Undo last change</b>."],
          ["<b>Need more room for long task names?</b> Drag the little handle on the right edge of the <b>Works</b> column header to widen it. The width you set is remembered and carries through to both the <b>PDF</b> and <b>Excel</b> exports."],
          ["<b>Moving dates around?</b> Tools › <b>🗓 Shift dates</b>. You can slide the <b>whole programme</b> to a new start date (or by so many days), or pick <b>one task, give it a new date, and everything after it moves with it</b> — keeping the run in order. Changed your mind? Tools › <b>↩ Undo</b> puts it back."],
          ["<b>Ask the AI to change it in plain English.</b> Tools › <b>✨ Ask AI to edit</b>, then type what you want — e.g. \"compress everything into two weeks\", \"push all tasks back a week\", \"make the M&E take 5 days\" — and it rewrites the whole programme for you. It only touches your <b>draft</b>; Tools › Undo reverts it if you don't like the result. (Uses the same AI as Draft-from-a-document.)"],
          ["When it's ready, press <b>📤 Issue</b>. That freezes it as <b>Rev A</b> (then B, C…). Issued revisions can never be changed — keep editing your draft and Issue again for the next revision."],
          ["Need a copy outside the portal? <b>⬇ PDF</b> downloads a crisp print-ready chart, and <b>⬇ Excel</b> downloads a read-only workbook (values and colour blocks only — no formulas or macros) with a <b>tab per contractor</b>. The client gets the same two buttons on their share link. Remember: an exported file is a snapshot — the live link stays the protected master."],
        ]},
        { icon: "🔗", title: "Share a programme with a client", perms: ["Programmes"], intro: "A live link — no file leaves the portal, and you can switch it off any time.", steps: [
          ["In the programme press <b>🔗 Share</b>. Say who the link is for, and (recommended) set an <b>access code</b> — tell the client the code separately."],
          ["<b>Sending to a subcontractor?</b> Under \"What do they see?\" pick their contractor — the link then shows <b>only their tasks</b>, filtered on the server, so they never see the rest of the programme."],
          ["<b>Create link</b> copies it ready to email or message. The client opens it in their browser and sees the latest issued revision, watermarked, with no way to download your working file."],
          ["The share list shows how many times each link was opened. <b>Revoke</b> kills a link instantly — for leavers, lapsed quotes or anyone you no longer want looking."],
          ["If the client presses <b>✎ Suggest changes</b>, they edit their <i>own copy</i> and send it back. It lands in the programme's <b>💬 Client suggestions</b> with a list of exactly what they changed — review it, <b>↪ Load into my draft</b> if you agree, then Issue the next official revision."],
        ]},
        { icon: "🤖", title: "Draft a programme from a document (AI)", perms: ["Programmes"], intro: "Turn a spec or scope of works into a starter task list in seconds — then refine it your way.", steps: [
          ["On the <b>📊 Programmes</b> page press <b>🤖 Draft from a document</b>. Choose a file — a <b>PDF</b>, a <b>spreadsheet (.xlsx)</b> or a <b>text/CSV</b> file — or just <b>paste the scope</b> into the box. The file is read <b>on your device</b>; only the text is sent, never the file itself."],
          ["<b>Scanned or picture PDFs work too</b> (a photo, a scan, or a document \"printed to PDF\" as images — anything with no real text in it). The portal spots that there's no text to read and sends the PDF to the AI to read directly instead — the status line tells you when it's doing this. (Up to about 6 MB; for anything bigger, paste the text.)"],
          ["Use the <b>Notes for the AI</b> box to steer it — the more you say, the better the draft. Tell it <b>who's doing which trade</b> (e.g. \"M&E is subcontracted to ABC Services, roofing with XYZ Roofing, everything else Mostlane\") and any timing or sequencing rules (\"live store — noisy works evenings only\", \"allow a week's lead-in\"). Your notes take priority over anything the document implies."],
          ["Add anything helpful (title, client, site, and a <b>start date</b>), then press <b>✨ Draft it</b>. It reads the scope and builds a sensible <b>ordered task list with contractors</b>, staggering the dates so trades follow on — this can take up to a minute. You don't even need a document — you can just describe the works in the notes box and let it draft from that."],
          ["It opens straight into the builder as a <b>new draft</b>. Nothing is issued or shared — it's a starting point. Tidy the tasks, fix any dates, then use <b>Auto-order</b> to re-stagger, and <b>Issue</b> when you're happy."],
          ["First time only: if it says AI drafting isn't switched on, the <b>ANTHROPIC_API_KEY</b> needs adding to the mostlane-api worker in Cloudflare (a one-off) — the message tells you exactly what to do."],
        ]},
      ]},
    ];

    // ══════════════════════════════════════════════════════════════════
    //  "Getting started" walkthrough — a short, ordered, role-aware path
    //  pinned to the top for new users. Ticks + hidden-state are per-device
    //  (localStorage); no backend. Each step opens its guide or the real page.
    // ══════════════════════════════════════════════════════════════════
    const WALK = [
      // Everyone
      { id:"login", icon:"🔑", title:"You're signed in", role:"any", perms:"always",
        text:"Your login lasts <b>90 days</b> on this device — you won't be typing your password every day.", guide:"Log in" },
      { id:"around", icon:"🧭", title:"Find your way around", role:"any", perms:"always",
        text:"The <b>menu</b> is home. On a phone you tap the tiles; on a computer you use the list down the left — everything opens from there.", guide:"Find your way around" },
      { id:"password", icon:"🔒", title:"Set your own password", role:"any", perms:"always",
        text:"Swap the temporary password the office gave you for one only you know.", guide:"Change your password" },
      { id:"notify", icon:"🔴", title:"Know when something needs you", role:"any", perms:"always",
        text:"A <b>red bubble</b> means something's waiting. The <b>🔔 bell</b> keeps the full list so nothing gets lost.", guide:"What the red bubbles mean" },
      { id:"refresh", icon:"🔄", title:"If a page looks out of date", role:"any", perms:"always",
        text:"Pull the page <b>down</b> to refresh on a phone, or tap the <b>🔄</b> button on a computer — it fetches the very latest version.", guide:"Find your way around" },
      { id:"personalise", icon:"🎨", title:"Make it yours (optional)", role:"any", perms:["ThemeColour","ThemeBackground"],
        text:"Pick your colour and background — it only changes what <b>you</b> see, and it follows you onto any device.", guide:"Personalise your portal" },
      // Field engineers
      { id:"day", icon:"▶️", title:"Start your working day", role:"field", perms:["SLA","SLAAdmin"],
        text:"Open <b>SLA</b> and tap <b>▶ Start my day</b>. A timer runs while you're on; tap <b>■ End my day</b> when you finish.", page:"route.html?stay=1" },
      { id:"jobs", icon:"🧰", title:"Work through your jobs", role:"field", perms:["SLA","SLAAdmin"],
        text:"Open a job and move it <b>Travelling → In Progress → Complete</b>. Add your photos, a note and the customer's signature to finish it.", page:"engineer-jobs.html" },
      { id:"vancheck", icon:"🚐", title:"Do your weekly van check", role:"field", perms:"always",
        text:"When you're reminded, open <b>Van Check</b>, walk round the van and answer each item — it only takes a minute.", page:"van-check.html" },
      { id:"po", icon:"🧾", title:"Raise a PO for materials", role:"field", perms:["PurchaseOrders"],
        text:"Do it from the <b>job card</b> (\"Raise PO for this job\") so it ties to the right job for costing.", page:"po.html" },
      { id:"ftimesheet", icon:"⏱️", title:"Fill your timesheet", role:"field", perms:["EngTimesheet"],
        text:"Your hours and jobs fill in from your day automatically — check them over, and it <b>saves as you go</b>.", page:"engineer-timesheet.html" },
      // Office / admin
      { id:"board", icon:"📋", title:"Get to know the job board", role:"office", perms:["SLA","SLAAdmin"],
        text:"The <b>SLA board</b> is every job. <b>Click a job's status</b> to change it, or <b>✏️ Edit</b> to set engineers, dates and site.", page:"sla-main.html?reset=1" },
      { id:"scheduler", icon:"🗓️", title:"Plan the diary", role:"office", perms:["SLA","SLAAdmin"],
        text:"The <b>Scheduler</b> drags jobs onto each engineer's day and can even auto-build an efficient route for them.", page:"sla-scheduler.html" },
      { id:"hub", icon:"🏠", title:"Your home dashboard", role:"office", perms:"always",
        text:"On a computer, your home page shows an <b>at-a-glance dashboard</b> of what needs attention across the areas you look after.", page:"main.html" },
      { id:"holidays", icon:"✅", title:"Approve time off", role:"office", perms:["HolidayAdmin"],
        text:"Requests land in <b>Holiday admin</b> — approve or reject, and see the wall chart of who's off.", guide:"Approve or reject requests" },
      { id:"users", icon:"👥", title:"Add people &amp; set access", role:"office", perms:["Users","FullAccess"],
        text:"In <b>Users Admin</b> you add staff and tick exactly what each person can see and do.", page:"users-admin.html" },
    ];

    function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
    function gsArr(){ try { const v = JSON.parse(localStorage.getItem("mlGsDone") || "[]"); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
    let GS_DONE = gsArr();
    let GS_HIDDEN = localStorage.getItem("mlGsHidden") === "1";
    function gsSave(){ try { localStorage.setItem("mlGsDone", JSON.stringify(GS_DONE)); } catch(e){} }

    function walkOK(s, perms){
      const office = perms.StaffType === "office" || String(perms.FullAccess) === "Yes";
      const role = s.role || "any";
      if (role === "field" && office) return false;
      if (role === "office" && !office) return false;
      if (!s.perms || s.perms === "always") return true;
      if (String(perms.FullAccess) === "Yes") return true;
      return s.perms.some(k => String(perms[k]) === "Yes");
    }

    function renderGS(perms){
      const wrap = g("gsWrap"); if (!wrap) return;
      const steps = WALK.filter(s => walkOK(s, perms));
      if (!steps.length) { wrap.innerHTML = ""; return; }
      GS_DONE = GS_DONE.filter(id => steps.some(s => s.id === id)); // prune stale
      const doneN = steps.filter(s => GS_DONE.includes(s.id)).length;
      const pct = Math.round(doneN / steps.length * 100);
      if (GS_HIDDEN) {
        wrap.innerHTML = `<div class="gsmini" id="gsShow">👋 <b>Getting started</b> — ${doneN} of ${steps.length} done · tap to reopen</div>`;
        return;
      }
      const allDone = doneN === steps.length;
      wrap.innerHTML = `<div class="gs${allDone ? " alldone" : ""}">
        <h2>👋 Getting started</h2>
        <p class="sub">${allDone
          ? "You've been through the basics — nice one. You can hide this now; it's always here if you need it."
          : "New to the portal? Work down this short list and tick each off as you go. You only see steps for the areas you use."}</p>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <ol>${steps.map(s => {
          const done = GS_DONE.includes(s.id);
          const go = s.guide ? `<button class="go" data-guide="${esc(s.guide)}">Show me how →</button>`
                   : s.page  ? `<a class="go" href="${s.page}">Open it →</a>` : "";
          return `<li class="${done ? "done" : ""}" data-step="${s.id}">
            <button class="tick" title="Mark done">${done ? "✓" : ""}</button>
            <div class="txt"><div class="t">${s.icon} ${s.title}</div><div class="d">${s.text}</div>${go}</div>
          </li>`;
        }).join("")}</ol>
        <div class="foot"><button class="hide" id="gsHide">${allDone ? "✓ Hide getting started" : "Hide this"}</button><span class="muted">${doneN}/${steps.length}</span></div>
      </div>`;
    }

    function openGuide(title){
      g("search").value = ""; render(PERMS);
      requestAnimationFrame(() => {
        const h = [...document.querySelectorAll(".art > .head")].find(x => x.textContent.includes(title));
        if (h) { const art = h.parentElement; art.classList.add("open"); art.scrollIntoView({ behavior:"smooth", block:"center" }); }
      });
    }

    // ── Permission gate: FullAccess sees all; otherwise any-of. ──
    function allowed(a, perms) {
      if (a.perms === "always") return true;
      if (String(perms.FullAccess) === "Yes") return true;
      return a.perms.some(k => String(perms[k]) === "Yes");
    }

    function render(perms) {
      const q = g("search").value.trim().toLowerCase();
      let html = "", shown = 0;
      GROUPS.forEach(grp => {
        const arts = grp.arts.filter(a => allowed(a, perms)).filter(a => {
          if (!q) return true;
          const text = (a.title + " " + (a.intro || "") + " " + a.steps.map(s => s[0]).join(" ")).toLowerCase();
          return text.includes(q);
        });
        if (!arts.length) return;
        html += `<div class="grp"><h2>${grp.title}</h2>` + arts.map(a => {
          shown++;
          const steps = a.steps.map(s =>
            `<li>${s[0]}${s[1] ? `<img class="shot${s[2] ? " wide" : ""}" src="help-img/${s[1]}" alt="" loading="lazy">` : ""}</li>`).join("");
          return `<div class="art" data-art>
            <button class="head"><span class="ico">${a.icon}</span>${a.title}<span class="chev">›</span></button>
            <div class="body">${a.intro ? `<p class="intro">${a.intro}</p>` : ""}<ol>${steps}</ol></div>
          </div>`;
        }).join("") + "</div>";
      });
      g("list").innerHTML = html;
      g("noneMsg").style.display = shown ? "none" : "block";
      if (q && shown) document.querySelectorAll(".art").forEach(el => el.classList.add("open"));
    }

    // Instant paint from cached permissions, then refresh from the server.
    let PERMS = {};
    try { PERMS = JSON.parse(sessionStorage.getItem("mostlanePermissions") || localStorage.getItem("mostlanePermissions") || "{}"); } catch (e) {}
    render(PERMS); renderGS(PERMS);
    (async () => {
      try {
        const r = await fetch(window.MOSTLANE_API + "/auth/me", { headers: { "Authorization": "Bearer " + localStorage.getItem("mostlaneToken") } });
        const d = await r.json();
        if (d && d.ok && d.user && JSON.stringify(d.user) !== JSON.stringify(PERMS)) { PERMS = d.user; render(PERMS); renderGS(PERMS); }
      } catch (e) {}
    })();

    g("search").addEventListener("input", () => render(PERMS));
    document.addEventListener("click", e => {
      // Getting-started interactions
      const tick = e.target.closest(".gs .tick");
      if (tick) {
        const id = tick.closest("[data-step]").dataset.step;
        if (GS_DONE.includes(id)) GS_DONE = GS_DONE.filter(x => x !== id); else GS_DONE.push(id);
        gsSave(); renderGS(PERMS); return;
      }
      const goG = e.target.closest(".gs .go[data-guide]");
      if (goG) { openGuide(goG.dataset.guide); return; }
      if (e.target.closest("#gsHide")) { GS_HIDDEN = true; try { localStorage.setItem("mlGsHidden","1"); } catch(_){} renderGS(PERMS); return; }
      if (e.target.closest("#gsShow")) { GS_HIDDEN = false; try { localStorage.removeItem("mlGsHidden"); } catch(_){} renderGS(PERMS); return; }
      const head = e.target.closest(".art > .head");
      if (head) { head.parentElement.classList.toggle("open"); return; }
      const img = e.target.closest("img.shot");
      if (img) { g("lightImg").src = img.src; g("lightbox").style.display = "flex"; }
    });
    g("lightbox").addEventListener("click", () => { g("lightbox").style.display = "none"; g("lightImg").src = ""; });
    window.addEventListener("keydown", e => { if (e.key === "Escape") { g("lightbox").style.display = "none"; } });
  </script>
</body>
</html>

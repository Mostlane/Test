<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/portal-config.js?v=26"></script>
  <link rel="stylesheet" href="/portal.css?v=1">
  <script src="auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Compliance — Mostlane Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:#eef1f4; color:#16202e; }
    header.page { background:linear-gradient(180deg,#1A4F8F,#003468); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; }
    header.page h1 { font-size:18px; margin:0; flex:1; color:#fff; }
    .wrap { max-width:560px; margin:20px auto; padding:0 16px; }
    .card { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #e2e8f0; border-radius:14px;
      box-shadow:0 2px 10px rgba(6,24,54,.06); padding:16px 18px; margin-bottom:12px; text-decoration:none; color:#16202e; font-weight:600; font-size:16px; }
    .card:active, .card:hover { background:#f4f8ff; }
    .card .ic { font-size:22px; width:30px; text-align:center; flex:none; }
    .card .cimg { height:34px; width:auto; max-width:46px; object-fit:contain; flex:none; border-radius:4px; }
    .card .ch { margin-left:auto; color:#9fb2c8; font-size:20px; }
    .card.soon { opacity:.6; cursor:default; }
    .card.soon .ch { font-size:12px; font-weight:700; color:#8a97a6; }
  </style>
</head>
<body>
  <header class="page">
    <a class="ml-back" data-role="home" href="main.html" title="Back to Menu" style="text-decoration:none;">‹ Back</a>
    <h1>✔️ Compliance</h1>
  </header>
  <div class="wrap">
    <a class="card" data-scheme="coop" href="eicr-portal.html"><img class="cimg" src="southern-coop-logo.png" alt="Southern Co-op"> The Southern Co-op<span class="ch">›</span></a>
    <a class="card" data-scheme="fareham" href="fareham.html"><img class="cimg" src="fareham-crest.jpg" alt="Fareham Borough Council"> Fareham Borough Council<span class="ch">›</span></a>
    <a class="card" data-scheme="projects" href="compliance-projects.html"><span class="ic">📁</span> Projects<span class="ch">›</span></a>
    <a class="card" data-scheme="chapplins" href="chapplins-compliance.html"><span class="ic">🏠</span> Chapplins<span class="ch">›</span></a>
    <p id="noneMsg" class="muted" style="display:none;text-align:center;color:#64748b;margin-top:10px;">You don't have access to any compliance charts yet. Ask an administrator.</p>
  </div>

  <script>
  // Show only the compliance charts this user can access (view level or higher).
  (function(){
    function perms(){ try{ return JSON.parse(sessionStorage.getItem("mostlanePermissions")||localStorage.getItem("mostlanePermissions")||"{}"); }catch(e){ return {}; } }
    function isField(){ var p=perms(); if(p.FullAccess==="Yes") return false;
      var stx=String(p.StaffType||localStorage.getItem("mostlaneStaffType")||sessionStorage.getItem("mostlaneStaffType")||"").toLowerCase();
      return stx==="field" || (stx!=="office" && (p.SLA==="Yes"||p.StoryMode==="Yes")); }
    function level(scheme){ var p=perms(); if(p.FullAccess==="Yes") return "edit";
      try{ var raw=sessionStorage.getItem("mostlaneComplianceAccess")||localStorage.getItem("mostlaneComplianceAccess");
        if(raw){ var m=JSON.parse(raw)||{}; if(m && m[scheme]!=null) return m[scheme]||"none"; } }catch(e){}
      if(p.Compliance==="Yes") return isField()?"view":"edit"; return "none"; }
    var shown=0;
    document.querySelectorAll(".card[data-scheme]").forEach(function(a){
      if(level(a.dataset.scheme)==="none") a.style.display="none"; else shown++;
    });
    if(!shown){ var n=document.getElementById("noneMsg"); if(n) n.style.display=""; }
  })();
  </script>
</body>
</html>
